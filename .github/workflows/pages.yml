name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Le code de l'application est converti une fois ici, au lieu de l'être
      # dans le navigateur à chaque ouverture (voir outils/compiler_publication.js).
      # Si la conversion échoue, index.html reste tel quel : la page est
      # publiée comme avant.
      - name: Convertir le code de l'application
        run: |
          npm install --prefix "$RUNNER_TEMP/babel" --no-audit --no-fund @babel/standalone@7.29.9 \
            && BABEL_STANDALONE="$RUNNER_TEMP/babel/node_modules/@babel/standalone" node outils/compiler_publication.js \
            || echo "::warning::Conversion impossible : la page est publiée sans conversion, comme avant."
      # CP Designer (dossier designer/, TypeScript) : compilé ici, puis la page
      # compilée remplace ses sources dans la publication. Si la compilation
      # échoue, la préversion affiche « non disponible » et le CRM est publié
      # normalement (ADR-0001).
      - name: Compiler CP Designer
        run: |
          if (cd designer && npm ci --no-audit --no-fund && npm run build); then
            (cd designer && rm -rf src tests index.html && cp -r build/. . && rm -rf build)
          else
            echo "::warning::CP Designer non compilé : la préversion n'est pas publiée, le CRM l'est."
          fi
          rm -rf designer/node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
