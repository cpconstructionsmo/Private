  .tab{flex:0 0 auto;padding:11px 12px;font-size:12px;letter-spacing:.05em;background:none;border:none;border-bottom:2px solid transparent;color:#6E7B84;white-space:nowrap}
  .tab.on{color:#2C4A5E;font-weight:700;border-bottom-color:#C5563A}

  nav.bot button{flex:1;padding:12px 2px;font-size:11px;letter-spacing:.04em;background:none;border:none;border-top:2px solid transparent;color:#6E7B84}
  nav.bot button.on{color:#2C4A5E;font-weight:700;border-top-color:#C5563A}

  #root{padding-bottom:74px}

  if(gps)return 'https://www.google.com/maps/search/?api=1&query='+gps[1].replace(',','.')+','+gps[2].replace(',','.');
  if(/^https?:\/\//i.test(s))return s;
  if(/^(www\.)?(google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(s))return 'https://'+s.replace(/^www\./,'');
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);
};

   sans taux propre, le marché suit celui du chantier. 0 est une valeur valide, pas une absence. */

  const map=new Map();
  for(const m of ms){

    const cur=map.get(t)||{taux:t,ht:0,n:0};
    cur.ht+=(m.montantHT||0); cur.n++;

};

function consumeDriveTokenFromUrl(){
  if(location.hash.indexOf('access_token=')===-1)return;
  const params=new URLSearchParams(location.hash.slice(1));
  const token=params.get('access_token');
  const expiresIn=+(params.get('expires_in')||3600);
  if(token){
    sessionStorage.setItem('driveToken',token);
    sessionStorage.setItem('driveTokenExpiry',String(Date.now()+(expiresIn-60)*1000));
  }
  history.replaceState(null,'',location.pathname+location.search);
}

async function driveFolder(token){
  if(driveFolderId)return driveFolderId;
  const q=encodeURIComponent("name='CP Constructions' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(j.files&&j.files.length){driveFolderId=j.files[0].id;return driveFolderId}
  const c=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name:'CP Constructions',mimeType:'application/vnd.google-apps.folder'}),
  });
  driveFolderId=(await c.json()).id;
  return driveFolderId;
}

async function driveFindOrCreateSubfolder(token,parentId,name){
  const safeName=name.replace(/'/g,"\\'");
  const q=encodeURIComponent(`name='${safeName}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parentId}' in parents`);
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(j.files&&j.files.length)return j.files[0].id;
  const c=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]}),
  });
  return(await c.json()).id;
}

function compress(file,max=900,q=.6){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*r); cv.height=Math.round(im.height*r);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

async function pdfText(file){
  if(typeof pdfjsLib==='undefined')throw new Error('Lecteur PDF non chargé — vérifiez votre connexion.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let txt='';
  for(let i=1;i<=Math.min(doc.numPages,8);i++){
    const page=await doc.getPage(i);
    const c=await page.getTextContent();
    txt+=' '+c.items.map(x=>x.str).join(' ');
  }
  return txt.replace(/\s+/g,' ').trim();
}

function parseDateFr(s){
  const m=s.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
  if(!m)return '';
  let[,j,mo,a]=m;
  if(a.length===2)a='20'+a;
  const d=new Date(+a,+mo-1,+j);
  if(isNaN(d)||+mo>12||+j>31)return '';
  return a+'-'+String(+mo).padStart(2,'0')+'-'+String(+j).padStart(2,'0');
}

/* accents et apostrophes typographiques tres variables d'un assureur a l'autre : on normalise avant de chercher */
const deaccent=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019]/g,"'").replace(/[\u00a0\u202f]/g,' ');
/* un n° de police s'arrete au premier mot de prose : on ne garde que les jetons contenant un chiffre
   (ou un bloc de 1 a 3 majuscules type « U 001 »), en ecartant les formes juridiques et petits mots */
const STOP_REF=['SA','SAS','SASU','SARL','EI','EURL','SCI','SCOP','ET','AU','DU','DE','LA','LE','EN','ES','NE','CE','SES','SON','PAR','SUR','EST','NON','RCS','TVA','SIRET','SIREN','APE','NAF','RUE','AV','BD','ZA','ZI','BP','CS'];
function cleanRef(s){
  const keep=[];
  for(const raw of String(s).trim().split(/\s+/)){
    /* une reference qui continue en chiffres ne le fait que par groupes de 3
       (« 145 071 551 », « AS 950 007 ») : tout autre nombre qui suit appartient
       deja au texte voisin — sur une attestation en colonnes, le numero de rue. */
    if(keep.length&&/^\d+$/.test(raw)&&raw.length!==3)break;
    const t=raw.replace(/^[:\-]+/,'').replace(/[.,;:)\]]+$/,'');
    if(!t)break;
    const hasDigit=/\d/.test(t);
    const shortAlpha=/^[A-Z]{1,3}$/.test(t)&&STOP_REF.indexOf(t)<0;
    if(!hasDigit&&!shortAlpha)break;
    if(hasDigit&&STOP_REF.indexOf(t.replace(/[^A-Z]/g,''))>=0&&t.replace(/[^A-Z]/g,''))break;
    keep.push(t);
    if(keep.join(' ').length>28)break;
  }
  return keep.join(' ').replace(/[.,;:]+$/,'');
}

/* lecture des surfaces sur un plan : ne marche que si le PDF a une couche texte
   (plan export DAO). Un plan scanné ne donne rien — on le dit à l'utilisateur. */
function analysePlan(txt){
  const t=deaccent(txt).replace(/\s+/g,' ');
  const NB='([0-9]{1,5}(?:[.,][0-9]{1,2})?)\\s*(?:m2|m²|M2)';
  const cherche=motifs=>{
    for(const m of motifs){
      const r=t.match(new RegExp(m,'i'));
      if(r){
        const v=parseFloat(r[1].replace(',','.'));
        if(v>0&&v<100000)return v;
      }
    }
    return '';
  };
  return {
    surfacePlancher:cherche([
      "surface\\s*(?:de\\s*)?plancher[^0-9]{0,40}?"+NB,
      "\\bS\\.?\\s?D\\.?\\s?P\\.?\\b[^0-9]{0,20}?"+NB,
      "surface\\s*(?:de\\s*)?plancher[^0-9]{0,40}?([0-9]{1,5}(?:[.,][0-9]{1,2})?)",
    ]),
    surfaceHabitable:cherche([
      "surface\\s*habitable[^0-9]{0,40}?"+NB,
      "\\bS\\.?\\s?H\\.?\\s?A\\.?\\s?B\\.?\\b[^0-9]{0,20}?"+NB,
      "habitable[^0-9]{0,30}?"+NB,
      "surface\\s*habitable[^0-9]{0,40}?([0-9]{1,5}(?:[.,][0-9]{1,2})?)",
    ]),
  };
}

function analyseAttestation(txt){
  const t=deaccent(txt);
  const T=t.toUpperCase();
  const out={assureur:'',numPolice:'',decennaleFin:'',siret:'',activites:'',dateIncertaine:false,champsTrouves:[]};

  let tot=-1;
  for(const a of ASSUREURS){
    const mot=deaccent(a).toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const m=T.match(new RegExp('(^|[^A-Z0-9])'+mot+'([^A-Z0-9]|$)'));
    if(m&&(tot<0||m.index<tot)){tot=m.index;out.assureur=a.charAt(0)+a.slice(1).toLowerCase()}
  }
  if(out.assureur)out.champsTrouves.push('assureur');

  const polMotifs=[
    /(?:n[\u00b0\u00bao]\s*(?:de\s*)?(?:police|contrat|societaire)|police\s*(?:d'assurance\s*)?n[\u00b0\u00bao]|contrat\s*n[\u00b0\u00bao])\s*[:\-]?\s*(.{4,40})/i,
    /(?:police|contrat)\s*[:\-]\s*(.{4,40})/i,
    /(?:police|contrat)[^.:;]{0,25}?([0-9]{6,20})/i,
    /de\s+nature\s+d(?:e|\u00e9)cennale\s*n[\u00b0\u00bao]\s*(.{4,40})/i,
    /\bcontrat\b[^]{0,90}?\bnum(?:e|\u00e9)ro\s*[:\-]\s*(.{4,40})/i,
    /\bcontrat\b[^.;:]{0,20}?n[\u00b0\u00bao]\s*(.{4,40})/i,
  ];
  for(const re of polMotifs){
    const m=t.match(re);
    if(m){
      const ref=cleanRef(m[1]);
      if(ref&&/\d/.test(ref)){out.numPolice=ref;out.champsTrouves.push('numPolice');break}
    }
  }

  const D='(\\d{1,2}[\\/\\.\\-]\\d{1,2}[\\/\\.\\-]\\d{2,4})';
  const echMotifs=[
    new RegExp("jusqu'au\\s*(?:le\\s*)?"+D,'i'),
    new RegExp("(?:echeance|expiration|fin\\s+de\\s+(?:validite|garantie|periode|contrat))[^.]{0,40}?"+D,'i'),
    new RegExp("du\\s+\\d{1,2}[\\/\\.\\-]\\d{1,2}[\\/\\.\\-]\\d{2,4}\\s+au\\s+"+D,'i'),
    new RegExp("(?:valable|valide|validite|garantie|couverture)[^.]{0,60}?\\bau\\s+"+D,'i'),
  ];
  for(const re of echMotifs){
    const m=t.match(re);
    if(m){const d=parseDateFr(m[1]);if(d){out.decennaleFin=d;out.champsTrouves.push('decennaleFin');break}}
  }
  if(!out.decennaleFin){
    // repli : la date la plus lointaine du document, si elle est dans le futur
    const toutes=(t.match(/\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4}/g)||[]).map(parseDateFr).filter(Boolean).sort();
    const derniere=toutes[toutes.length-1];
    if(derniere&&derniere>today()){out.decennaleFin=derniere;out.dateIncertaine=true;out.champsTrouves.push('decennaleFin')}
  }

  /* SIRET (14 chiffres) sinon SIREN (9) : l'identifiant est ce qui distingue
     deux entreprises de meme nom, il vaut mieux l'avoir au dossier. */
  /* l'en-tete porte souvent le SIREN de l'agence d'assurance, jamais celui de
     l'entreprise : un numero precede de pres par « ORIAS » est celui de
     l'intermediaire, on passe au suivant. */
  const identifiant=(mot,long)=>{
    const re=new RegExp('\\b'+mot+'\\b[^0-9]{0,14}((?:\\d[ .]?){'+long+'})(?!\\d)','gi');
    let m;
    while((m=re.exec(t))!==null){
      if(/ORIAS/i.test(t.slice(Math.max(0,m.index-60),m.index)))continue;
      return m[1].replace(/\D/g,'');
    }
    return '';
  };
  const c=identifiant('SIRET',14)||identifiant('SIREN',9);
  if(c.length===14)out.siret=c.replace(/(\d{3})(\d{3})(\d{3})(\d{5})/,'$1 $2 $3 $4');
  else if(c.length===9)out.siret=c.replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3');
  if(out.siret)out.champsTrouves.push('siret');

  /* activites garanties : le point qui compte vraiment en MOE — une decennale
     valide ne sert a rien si le lot signe n'est pas dans la liste couverte.
     Le texte du PDF arrive sur une seule ligne, on s'arrete donc aux formules
     qui suivent systematiquement la liste. */
  const RENVOI=/rappel|ci-apr|ci-dessus|ci-dessous|nomenclature|d(?:e|\u00e9)finition|annexe\s*\d|^\s*voir\b|(?:pr(?:e|\u00e9)cis|d(?:e|\u00e9)fini|list)(?:e|\u00e9)e?s?\s+(?:en|dans)\s+(?:l')?annexe|voir\s+(?:l')?annexe/i;
  /* la meme formule peut apparaitre plusieurs fois, la premiere n'etant souvent
     qu'un renvoi vers le paragraphe qui porte vraiment la liste : on essaie
     chaque occurrence et on garde la premiere qui donne autre chose qu'un renvoi. */
  const listeActivites=marqueur=>{
    const re=new RegExp(marqueur.source,'gi');
    let m;
    while((m=re.exec(t))!==null){
      const debut=m.index+m[0].length;
      if(re.lastIndex<=m.index)re.lastIndex=m.index+1;
      let a=t.slice(debut,debut+400)
        .split(/Pour plus d.{0,2}informations|Sont exclus|aux travaux ayant fait|Attention\s*:|La pr(?:e|\u00e9)sente attestation|Ce contrat garantit|R(?:e|\u00e9)f\s*\.?\s*:/i)[0]
        .replace(/\s+/g,' ');
      a=a.replace(/^[-\u2022\u25aa\s]+/,'').replace(/\s*[-\u2022\u25aa]\s+/g,' ; ').replace(/[-\u2022\u25aa;\s.,]+$/,'').trim();
      // un chapeau du genre « selon les definitions de l'annexe 970544 » precede
      // parfois le premier vrai item : on l'ecarte sans toucher au reste.
      const items=a.split(' ; ');
      while(items.length>1&&RENVOI.test(items[0]))items.shift();
      a=items.join(' ; ');
      if(a.length>220)a=a.slice(0,220).replace(/\s+\S*$/,'')+'\u2026';
      // une liste d'activites est faite d'items courts ; un long bloc sans
      // separateur est la definition d'une seule activite, pas la liste : dans
      // le doute on ne remplit rien plutot que de laisser croire a une garantie
      // plus etroite qu'elle ne l'est.
      const liste=a.indexOf(' ; ')>=0||a.length<=120;
      if(a.length>=3&&liste&&!RENVOI.test(a))return a;
    }
    return '';
  };
  out.activites=listeActivites(/activit(?:e|\u00e9)s?\s+(?:professionnelles?\s+)?(?:ou\s+missions\s+)?(?:suivantes?|garanties?)\s*[:\-]?\s*/)
             || listeActivites(/activit(?:e|\u00e9)s?\s+souscrites\s*[:\-]?\s*/);
  if(out.activites)out.champsTrouves.push('activites');
  return out;
}

/* ---------- signature manuscrite ---------- */
/* empreinte du contexte signé : si le libellé du document, le chantier, le signataire
   ou l'horodatage sont modifiés après coup, l'empreinte ne correspond plus. */
async function empreinteSignature(parts){
  const txt=parts.join('|');
  if(!(window.crypto&&crypto.subtle))return '';
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16).toUpperCase();
}
const dateHeure=iso=>{
  if(!iso)return '—';
  const d=new Date(iso);
  return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
};

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));

function App({session}){
  const [data,setData]=useState(load);
  const [view,setView]=useState('chantiers');
  const [open,setOpen]=useState(null);
  const [err,setErr]=useState(null);
  /* attente : lecture en cours — ok : contenu du serveur reçu — erreur : lecture impossible.
     Tant que le serveur n'a pas répondu, on n'écrit rien : sinon un appareil au cache vide
     (historique effacé, nouveau téléphone) écraserait tout le contenu enregistré. */
  const [chargement,setChargement]=useState('attente');

  const lire=()=>{
    setChargement('attente');
    return sb.from('app_data').select('data').eq('id','main').single()
      .then(({data:row,error})=>{
        if(error&&error.code!=='PGRST116'){setChargement('erreur');return}
        if(row&&row.data)setData({...EMPTY,...row.data});
        setChargement('ok');
      })
      .catch(()=>setChargement('erreur'));
  };

  useEffect(()=>{
    let alive=true;
    sb.from('app_data').select('data').eq('id','main').single()
      .then(({data:row,error})=>{
        if(!alive)return;
        if(error&&error.code!=='PGRST116'){setChargement('erreur');return}
        if(row&&row.data)setData({...EMPTY,...row.data});
        setChargement('ok');
      })
      .catch(()=>{if(alive)setChargement('erreur')});
    const channel=sb.channel('app_data_changes')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_data',filter:'id=eq.main'},payload=>{
        if(payload.new&&payload.new.data)setData({...EMPTY,...payload.new.data});
      })
      .subscribe();
    return ()=>{alive=false;sb.removeChannel(channel)};
  },[]);

  const save=async next=>{
    if(chargement!=='ok'){
      setErr("Vos données ne sont pas encore chargées depuis le serveur — modification annulée pour ne pas écraser le contenu enregistré. Rechargez la page une fois la connexion revenue.");
      return;
    }
    setData(next);
    try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){/* cache local best-effort */}
    const{error}=await sb.from('app_data').upsert({id:'main',data:next,updated_at:new Date().toISOString()});
    setErr(error?"Synchronisation impossible — vérifiez votre connexion. Vos modifications restent enregistrées sur cet appareil.":null);
  };
  const ch=open?data.chantiers.find(c=>c.id===open):null;
  return <div>
    <header style={{background:NAVY,padding:'10px 16px',paddingTop:'calc(10px + env(safe-area-inset-top))'}}>
      <img src="assets/logo.png" alt="CP Constructions — Maîtrise d'œuvre" style={{height:38,display:'block'}}/>
    </header>
    {chargement==='attente'&&<div className="xs" style={{background:'#EFECE6',color:MUTED,padding:'8px 16px'}}>Chargement de vos données…</div>}
    {chargement==='erreur'&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:'8px 16px',lineHeight:1.5}}>
      <b>Mode consultation.</b> Vos données n'ont pas pu être chargées depuis le serveur : ce que vous voyez vient de ce téléphone et peut être incomplet.
      Toute modification est bloquée tant que la connexion n'est pas rétablie, pour ne rien écraser.
      <button className="btn s" style={{marginLeft:8}} onClick={lire}>Réessayer</button>
    </div>}
    {err&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:'8px 16px'}}>{err}</div>}
    <main style={{padding:16}}>
      {ch?<Fiche data={data} ch={ch} save={save} back={()=>setOpen(null)}/>
      :view==='chantiers'?<Chantiers data={data} save={save} open={setOpen}/>
      :view==='artisans'?<Artisans data={data} save={save}/>
      :view==='cmd'?<CommandesGlob data={data} open={setOpen}/>
      :view==='bilan'?<Bilan data={data} open={setOpen}/>
      :<Donnees data={data} save={save} session={session}/>}
    </main>
    <nav className={'bot'+(ch?' masquee':'')}>
      {[['chantiers','CHANTIERS'],['artisans','ARTISANS'],['cmd','COMMANDES'],['bilan','FINANCES'],['donnees','DONNÉES']].map(([id,l])=>
        <button key={id} className={view===id&&!ch?'on':''} onClick={()=>{setView(id);setOpen(null)}}>{l}</button>)}
    </nav>
  </div>;
}

function SignaturePad({titre,onAnnuler,onSigner}){
  const cv=useRef(null), trace=useRef(false), vide=useRef(true);
  const [nom,setNom]=useState('');
  const [qualite,setQualite]=useState('Client');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    const c=cv.current; if(!c)return;
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
    const x=c.getContext('2d');
    x.scale(dpr,dpr);
    x.fillStyle='#fff'; x.fillRect(0,0,r.width,r.height);
    x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle=INK;
  },[]);

  const pos=e=>{
    const r=cv.current.getBoundingClientRect();
    const p=e.touches&&e.touches[0]?e.touches[0]:e;
    return{x:p.clientX-r.left,y:p.clientY-r.top};
  };
  const down=e=>{e.preventDefault();trace.current=true;const{x,y}=pos(e);const c=cv.current.getContext('2d');c.beginPath();c.moveTo(x,y)};
  const move=e=>{if(!trace.current)return;e.preventDefault();const{x,y}=pos(e);const c=cv.current.getContext('2d');c.lineTo(x,y);c.stroke();vide.current=false};
  const up=()=>{trace.current=false};
  const effacer=()=>{
    const c=cv.current, r=c.getBoundingClientRect(), x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,r.width,r.height);
    vide.current=true; setErr('');
  };
  const valider=async()=>{
    if(!nom.trim()){setErr('Indiquez le nom du signataire.');return}
    if(vide.current){setErr('La signature est vide — signez dans le cadre.');return}
    setBusy(true);
    try{await onSigner({nom:nom.trim(),qualite,image:cv.current.toDataURL('image/jpeg',0.8)})}
    catch(e){setErr("Enregistrement impossible : "+((e&&e.message)||e));setBusy(false);return}
    setBusy(false);
  };

  return <div className="modal" style={{justifyContent:'center'}}>
    <div style={{background:'#fff',padding:16,maxWidth:520,width:'100%',margin:'auto',maxHeight:'100%',overflowY:'auto'}}>
      <div className="b" style={{color:NAVY}}>Signature</div>
      <div className="xs mut" style={{marginTop:3,marginBottom:12,lineHeight:1.4}}>{titre}</div>
      <div className="g2">
        <Fld label="NOM DU SIGNATAIRE"><input className="in" value={nom} onChange={e=>setNom(e.target.value)} placeholder="Mr et Mme Barbé"/></Fld>
        <Fld label="QUALITÉ"><select className="in" value={qualite} onChange={e=>setQualite(e.target.value)}>
          {QUALITES.map(q=><option key={q} value={q}>{q}</option>)}</select></Fld>
      </div>
      <span className="lbl">SIGNEZ DANS LE CADRE</span>
      <canvas ref={cv} style={{width:'100%',height:170,border:'1px dashed '+RULE,background:'#fff',touchAction:'none',display:'block'}}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}/>
      {err&&<div className="xs" style={{color:TERRA,marginTop:8}}>{err}</div>}
      <div className="xs mut" style={{marginTop:10,lineHeight:1.5}}>
        Signature manuscrite horodatée, conservée avec le document. Elle vaut commencement de preuve, mais ce n’est pas une
        signature électronique qualifiée : pour un engagement contractuel important, faites contresigner un exemplaire papier
        ou passez par un prestataire certifié.
      </div>
      <div className="row" style={{gap:8,marginTop:12}}>
        <button className="btn" onClick={valider} disabled={busy}>{busy?'Enregistrement…':'Valider la signature'}</button>
        <button className="btn gh" onClick={effacer} disabled={busy}>Effacer</button>
        <button className="btn gh" onClick={onAnnuler} disabled={busy}>Annuler</button>
      </div>
    </div>
  </div>;
}

/* import d'un fichier vers un sous-dossier Drive du chantier, avec lien de consultation */
function ImportFichier({ch,dossier,lien,onLien,label,accept}){
  const [busy,setBusy]=useState(false);
  const go=async file=>{
    setBusy(true);
    try{
      const token=await getDriveToken();
      const folderId=await driveSousDossier(token,ch.id,ch.nom,dossier);
      onLien((await uploadToDrive(file,folderId)).webViewLink);
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton en bas de page).":"Import impossible — "+((e&&(e.error||e.message))||e));
    }
    setBusy(false);
  };
  return <div className="row" style={{gap:14,alignItems:'center',flexWrap:'wrap'}}>
    <label className="btn gh s" style={{whiteSpace:'nowrap'}}>{busy?'Envoi…':(lien?'Remplacer':label||'Importer')}
      <input type="file" accept={accept||'application/pdf,image/*'} style={{display:'none'}} disabled={busy}
        onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)go(f)}}/></label>
    {lien&&<a href={lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir</a>}
    {lien&&<button className="xs" style={{color:MUTED,background:'none',border:'none',padding:0}} onClick={()=>onLien('')}>Retirer</button>}
  </div>;
}

/* ouvre le dossier Drive du chantier (le crée s'il n'existe pas encore) */
function BoutonDossierDrive({ch,sous}){
  const [busy,setBusy]=useState(false);
  const ouvrir=async()=>{
    setBusy(true);
    try{
      const token=await getDriveToken();
      const id=sous?await driveSousDossier(token,ch.id,ch.nom,sous):await driveChantierFolder(token,ch.id,ch.nom);
      window.open(lienDossierDrive(id),'_blank');
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Ouverture du dossier impossible.");
    }
    setBusy(false);
  };
  return <button className="xs" style={{color:TERRA,background:'none',border:'none',padding:0}} onClick={ouvrir} disabled={busy}>
    {busy?'Ouverture…':'Dossier Drive'+(sous?' › '+sous:'')}</button>;
}

      <Fld label="NOM DU CHANTIER"><input className="in" value={edit.nom} onChange={e=>setEdit({...edit,nom:e.target.value})}/></Fld>
      <div className="g2">
        <Fld label="CLIENT"><input className="in" value={edit.client} onChange={e=>setEdit({...edit,client:e.target.value})}/></Fld>
        <Fld label="TÉL. CLIENT"><input className="in" type="tel" value={edit.telClient||''} onChange={e=>setEdit({...edit,telClient:e.target.value})}/></Fld>
      </div>
      <Fld label="ADRESSE"><input className="in" value={edit.adresse} onChange={e=>setEdit({...edit,adresse:e.target.value})}/></Fld>
      <Fld label="LOCALISATION DU CHANTIER">
        <input className="in" placeholder="Lien Google Maps, ou 48.5123, -0.6234" value={edit.lienMaps||''} onChange={e=>setEdit({...edit,lienMaps:e.target.value})}/>
        <div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
          Trois façons de faire, au choix : coller un <b>lien Google Maps</b> (appui long sur le point exact → Partager → Copier le lien),
          saisir des <b>coordonnées GPS</b> séparées par une virgule, ou taper un <b>nom de lieu</b>.
          {edit.lienMaps&&<span> — <a href={normaliseMaps(edit.lienMaps)} target="_blank" rel="noreferrer" style={{color:TERRA}}>tester ce lien</a></span>}
        </div>
      </Fld>
      <div className="g2">
        <Fld label="SURFACE DE PLANCHER (m²)"><input className="in" type="number" step="0.01" value={edit.surfacePlancher||''} onChange={e=>setEdit({...edit,surfacePlancher:e.target.value})}/></Fld>
        <Fld label="SURFACE HABITABLE (m²)"><input className="in" type="number" step="0.01" value={edit.surfaceHabitable||''} onChange={e=>setEdit({...edit,surfaceHabitable:e.target.value})}/></Fld>
      </div>
      <Fld label="LIRE LES SURFACES SUR UN PLAN (PDF)">
        <label className="btn gh s" style={{whiteSpace:'nowrap'}}>{lecturePlan==='lecture'?'Lecture du plan…':'Importer un plan'}
          <input type="file" accept="application/pdf" style={{display:'none'}} disabled={lecturePlan==='lecture'}
            onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)lirePlan(f)}}/></label>
        {lecturePlan==='ok'&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>Surfaces lues sur le plan et reportées ci-dessus. À vérifier avant d'enregistrer.</div>}
        {lecturePlan==='partiel'&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>Une seule surface a pu être lue. Complétez l'autre à la main.</div>}
        {lecturePlan==='rien'&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>Aucune surface trouvée dans ce plan (cartouche absent, ou plan scanné sans texte). Saisissez les valeurs à la main.</div>}
        {lecturePlan==='erreur'&&<div className="xs" style={{marginTop:6,color:TERRA,lineHeight:1.5}}>Lecture du PDF impossible.</div>}
      </Fld>
      <Fld label="DOSSIER DRIVE DU CHANTIER"><input className="in" value={edit.lienDrive||''} onChange={e=>setEdit({...edit,lienDrive:e.target.value})}/></Fld>
      <div className="g2">
        <Fld label="BUDGET TRAVAUX HT (€)"><input className="in" type="number" value={edit.budget} onChange={e=>setEdit({...edit,budget:e.target.value})}/></Fld>
        <Fld label="TVA (%)"><input className="in" type="number" step="0.1" placeholder="20" value={edit.tva===undefined?'':edit.tva} onChange={e=>setEdit({...edit,tva:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="HONORAIRES MOE (%)"><input className="in" type="number" step="0.1" value={edit.honorairesPct} onChange={e=>setEdit({...edit,honorairesPct:e.target.value})}/></Fld>
        <Fld label="MONTANT HONORAIRES HT (€)">
          <input className="in" type="number" placeholder={'Auto : '+eur(edit.budget*(edit.honorairesPct||0)/100)} value={edit.honorairesMontant||''} onChange={e=>setEdit({...edit,honorairesMontant:e.target.value})}/>
        </Fld>
      </div>
      <div className="g2">
        <Fld label="OUVERTURE DE CHANTIER"><input className="in" type="date" value={edit.dateOuverture||''} onChange={e=>setEdit({...edit,dateOuverture:e.target.value})}/></Fld>
        <Fld label="DÉLAI PRÉVU (JOURS)"><input className="in" type="number" placeholder={String(DELAI_DEFAUT)} value={edit.delaiPrevu===undefined?'':edit.delaiPrevu} onChange={e=>setEdit({...edit,delaiPrevu:e.target.value})}/></Fld>
      </div>
      <Fld label="PHASE"><select className="in" value={edit.statut} onChange={e=>setEdit({...edit,statut:e.target.value})}>
        {Object.entries(PHASE).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></Fld>
      <Acts onSave={saveEdit} onCancel={()=>setEdit(null)}/>
    </div>:<div className="card" style={{borderLeft:'3px solid '+TERRA}}>
      <div className="sp">
        <div className="b" style={{color:NAVY}}>{ch.nom}</div>
        <button className="btn gh s" onClick={()=>setEdit(ch)}>Modifier</button>
      </div>
      <div className="xs mut" style={{marginTop:3}}>{ch.client} — {ch.adresse}</div>
      <div className="g2 xs" style={{marginTop:10}}>
        <div><div className="mut">Travaux TTC</div>
          <div className="b" style={{fontSize:17,color:NAVY}}>{eur(ms.length?travauxTTC(ms,ch):ttc(ch.budget,ch))}</div>
          <div className="mut">{eur(ms.length?eng:ch.budget)} HT · {ms.length
            ?(ventilationTva(ms,ch).length>1?'TVA par lot':'TVA '+ventilationTva(ms,ch)[0].taux+' %')
            :'TVA '+tvaRate(ch)+' %'}</div></div>
        <div><div className="mut">Honoraires TTC</div>
          <div className="b" style={{fontSize:17,color:NAVY}}>{eur(ttc(hono,ch))}</div>
          <div className="mut">{eur(hono)} HT</div></div>
      </div>
      <div className="g2 xs stats3" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <div><div className="mut">Avancement facturé</div>
          <div className="b" style={{fontSize:17,color:NAVY}}>{(eng||ch.budget)?Math.round(fac/(eng||ch.budget)*100):0} %</div>
          <div className="mut">facturé {eur(fac)} / {eur(eng||ch.budget)}</div></div>
        <div><div className="mut">Reste à facturer — artisans</div>
          <div className="b" style={{color:eng-fac>0?INK:GREEN}}>{eng-fac>0?eur(eng-fac)+' HT':'soldé'}</div>
          <div className="mut">engagé {eur(eng)}</div></div>
        <div><div className="mut">Reste à facturer — honoraires</div>
          <div className="b" style={{color:hono-honoFac>0?TERRA:GREEN}}>{hono-honoFac>0?eur(hono-honoFac)+' HT':'soldé'}</div>
          <div className="mut">{eur(ttc(hono-honoFac,ch))} TTC</div></div>
      </div>
      {eng>ch.budget&&ch.budget>0&&<div className="xs b" style={{color:TERRA,marginTop:8}}>Dépassement de {eur(eng-ch.budget)} sur le budget annoncé au client.</div>}
      <div className="xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        {jOuv===null
          ?<span className="mut">Délai de chantier : renseignez la date d'ouverture de chantier via « Modifier ».</span>
          :<div>
            <div className="sp">
              <span>Ouvert le <b>{fd(ch.dateOuverture)}</b> — <b>J+{jOuv}</b></span>
              <span style={{color:jOuv>dPrev?TERRA:MUTED}}>{jOuv>dPrev?'dépassement de '+(jOuv-dPrev)+' j':(dPrev-jOuv)+' j restants'}</span>
            </div>
            <div className="bar"><div style={{height:4,width:Math.min(100,Math.round(jOuv/dPrev*100))+'%',background:jOuv>dPrev?TERRA:NAVY}}/></div>
            <div className="mut" style={{marginTop:4}}>Délai prévu : {dPrev} j (≈ {Math.round(dPrev/30.4)} mois)</div>
          </div>}
      </div>
      {(ch.surfacePlancher||ch.surfaceHabitable)&&<div className="g2 xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <div><div className="mut">Surface de plancher</div><div className="b">{ch.surfacePlancher?ch.surfacePlancher+' m²':'—'}</div></div>
        <div><div className="mut">Surface habitable</div><div className="b">{ch.surfaceHabitable?ch.surfaceHabitable+' m²':'—'}</div></div>
      </div>}
      {!maps&&<div className="xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <span className="lbl">LOCALISATION</span>
        <div className="row" style={{gap:8}}>
          <input className="in" style={{flex:1,padding:'6px 8px',fontSize:13}} placeholder="Lien Google Maps, ou 48.5123, -0.6234"
            value={locSaisie} onChange={e=>setLocSaisie(e.target.value)}/>
          <button className="btn s" onClick={()=>{if(locSaisie.trim()){up({lienMaps:locSaisie.trim()});setLocSaisie('')}}}>Enregistrer</button>
        </div>
        <div className="mut" style={{marginTop:5,lineHeight:1.5}}>Collez un lien Maps, des coordonnées GPS ou un nom de lieu — puis « Enregistrer » pour activer le bouton Itinéraire.</div>
      </div>}
      <div className="row xs" style={{gap:14,marginTop:10,flexWrap:'wrap'}}>
        {ch.telClient&&<a href={'tel:'+ch.telClient} style={{color:TERRA}}>Appeler le client</a>}
        {ch.telClient&&<a href={'https://wa.me/'+wa(ch.telClient)} style={{color:TERRA}}>WhatsApp</a>}
        {maps
          ?<a href={maps} target="_blank" rel="noreferrer" style={{color:TERRA}}>Itinéraire</a>
          :mapsSearch&&<a href={mapsSearch} target="_blank" rel="noreferrer" className="mut">Chercher l'adresse</a>}
        {maps&&<button className="xs" style={{color:MUTED,background:'none',border:'none',padding:0}} onClick={()=>{if(confirm('Retirer la localisation enregistrée ?'))up({lienMaps:''})}}>Changer</button>}
        <BoutonDossierDrive ch={ch}/>
        {ch.lienDrive&&<a href={ch.lienDrive} target="_blank" rel="noreferrer" style={{color:TERRA}}>Dossier partagé</a>}
      </div>
    </div>}
    <div className="tabs">
      {[['marches','MARCHÉS'],['hono','HONORAIRES'],['visite','VISITE TECH.'],['map','MAP'],['ctrl','CONTRÔLE'],['photos','PHOTOS'],['cmd','MATÉRIAUX'],['planning','PLANNING'],['docs','PIÈCES']].map(([id,l])=>
        <button key={id} className={'tab'+(tab===id?' on':'')} onClick={()=>setTab(id)}>{l}</button>)}
    </div>
    {tab==='marches'&&<Marches data={data} ch={ch} save={save} eng={eng} fac={fac}/>}
    {tab==='hono'&&<Honoraires data={data} ch={ch} save={save}/>}
    {tab==='visite'&&<VisiteTechnique ch={ch} up={up}/>}
    {tab==='map'&&<MAP data={data} ch={ch} up={up}/>}
    {tab==='ctrl'&&<Controles data={data} ch={ch} save={save}/>}
    {tab==='photos'&&<Photos data={data} ch={ch} save={save}/>}
    {tab==='cmd'&&<Commandes data={data} ch={ch} save={save}/>}
    {tab==='planning'&&<Planning data={data} ch={ch} up={up}/>}
    {tab==='docs'&&<Docs data={data} ch={ch} up={up} save={save}/>}
  </div>;
}

/* ---------------- MARCHÉS ---------------- */
const facturesTotal=list=>(list||[]).reduce((s,x)=>s+(+x.montant||0),0);

function Marches({data,ch,save,eng,fac}){
  const [f,setF]=useState(null);
  const [showImport,setShowImport]=useState(false);
  const ms=data.marches.filter(m=>m.chantierId===ch.id);
  const openRow=m=>setF(m.factures?m:{...m,factures:m.facture?[{id:uid(),montant:m.facture,date:m.dateSignature||today(),lien:''}]:[]});
  const ok=()=>{
    if(!f.lot)return;
    const factures=f.factures||[];
    const r={...f,montantHT:+f.montantHT||0,tva:f.tva===''||f.tva===undefined||f.tva===null?'':+f.tva,factures,facture:facturesTotal(factures)};
    save({...data,marches:f.id?data.marches.map(m=>m.id===f.id?r:m):[...data.marches,{...r,id:uid(),chantierId:ch.id}]});
    setF(null);
  };
  const addFacture=()=>setF({...f,factures:[...(f.factures||[]),{id:uid(),montant:'',date:today(),lien:''}]});
  const updFacture=(fid,patch)=>setF({...f,factures:(f.factures||[]).map(x=>x.id===fid?{...x,...patch}:x)});
  const delFacture=fid=>setF({...f,factures:(f.factures||[]).filter(x=>x.id!==fid)});
  const importFacture=async(fid,file)=>{
    try{
      const token=await getDriveToken();
      const folderId=await driveFacturesFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      updFacture(fid,{lien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import de la facture impossible.");
    }
  };
  const importContrat=async file=>{
    try{
      const token=await getDriveToken();
      const folderId=await driveMarchesFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      setF({...f,contratLien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import du contrat impossible.");
    }
  };
  const nom=id=>{const a=data.artisans.find(x=>x.id===id);return a?a.nom:'Non attribué'};
  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{ms.length} lot{ms.length>1?'s':''} — facturé {eur(fac)} / {eur(eng)}</span>
      <div className="row" style={{gap:8}}>
        <button className="btn gh s" onClick={()=>setShowImport(!showImport)}>Import rapide</button>
        <button className="btn acc s" onClick={()=>setF({lot:'',artisanId:'',montantHT:'',statut:'consulter',dateSignature:'',notes:'',factures:[],contratLien:''})}>+ Lot</button>
      </div>
    </div>
    {showImport&&<ImportMarches data={data} ch={ch} save={save} close={()=>setShowImport(false)}/>}
    {f&&<div className="card">
      <Fld label="CORPS D'ÉTAT"><input className="in" list="corps-list" value={f.lot} onChange={e=>setF({...f,lot:e.target.value})} placeholder="Ex. Maçonnerie — Gros œuvre"/>
        <datalist id="corps-list">{CORPS.map(c=><option key={c} value={c}/>)}</datalist></Fld>
      <Fld label="ARTISAN"><select className="in" value={f.artisanId} onChange={e=>setF({...f,artisanId:e.target.value})}><option value="">— non attribué —</option>{data.artisans.map(a=><option key={a.id} value={a.id}>{a.nom} ({a.corps})</option>)}</select></Fld>
      <div className="g2">
        <Fld label="MONTANT MARCHÉ HT (€)"><input className="in" type="number" value={f.montantHT} onChange={e=>setF({...f,montantHT:e.target.value})}/></Fld>
        <Fld label="TVA DE CE LOT (%)">
          <input className="in" type="number" step="0.1" placeholder={'Chantier : '+tvaRate(ch)+' %'} value={f.tva===undefined||f.tva===null?'':f.tva} onChange={e=>setF({...f,tva:e.target.value})}/>
        </Fld>
      </div>
      <div className="xs mut" style={{marginTop:-6,marginBottom:12,lineHeight:1.5}}>
        Laissez vide pour appliquer le taux du chantier ({tvaRate(ch)} %). Saisissez <b>0</b> pour un artisan en franchise de TVA ou en autoliquidation.
        {f.montantHT>0&&<span> — soit <b>{eur(marcheTTC({montantHT:+f.montantHT,tva:f.tva},ch))}</b> TTC.</span>}
      </div>
      <Fld label="STATUT"><select className="in" value={f.statut} onChange={e=>setF({...f,statut:e.target.value})}>{STATUTS.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Fld>
      <Fld label="DATE DE SIGNATURE"><input className="in" type="date" value={f.dateSignature} onChange={e=>setF({...f,dateSignature:e.target.value})}/></Fld>
      <Fld label="CONTRAT DE MARCHÉ (PDF)">
        {f.contratLien
          ?<div className="row" style={{gap:14,alignItems:'center'}}>
            <a href={f.contratLien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir le contrat</a>
            <label className="xs" style={{color:NAVY}}>Remplacer<input type="file" accept="application/pdf" style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importContrat(file)}}/></label>
          </div>
          :<label className="xs" style={{color:NAVY}}>Importer le PDF du contrat<input type="file" accept="application/pdf" style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importContrat(file)}}/></label>}
      </Fld>
      <Fld label="NOTES"><textarea className="in" rows="2" value={f.notes} onChange={e=>setF({...f,notes:e.target.value})}/></Fld>
      <Fld label={"FACTURES — total "+eur(facturesTotal(f.factures))}>
        {(f.factures||[]).map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center'}}>
          <input className="in" type="number" placeholder="Montant €" value={x.montant} onChange={e=>updFacture(x.id,{montant:e.target.value})} style={{flex:'1 1 90px'}}/>
          <input className="in" type="date" value={x.date} onChange={e=>updFacture(x.id,{date:e.target.value})} style={{flex:'1 1 120px'}}/>
          {x.lien
            ?<a href={x.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA,whiteSpace:'nowrap'}}>Voir</a>
            :<label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>Importer<input type="file" accept="application/pdf,image/*" style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importFacture(x.id,file)}}/></label>}
          <button className="btn dg s" onClick={()=>delFacture(x.id)}>✕</button>
        </div>)}
        <button className="btn gh s" onClick={addFacture}>+ Facture</button>
      </Fld>
      <DriveStatus/>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={f.id?()=>{save({...data,marches:data.marches.filter(m=>m.id!==f.id)});setF(null)}:null}/>
    </div>}
    {!ms.length&&!f&&<Empty>Aucun lot. Ajoutez les corps d'état à consulter, ou utilisez « Import rapide ».</Empty>}
    {!!ms.length&&<div style={{overflowX:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
        <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
          <th style={{padding:'6px 4px'}}>Corps d'état</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Marché HT</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Facturé</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Reste à facturer</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Factures</th>
        </tr></thead>
        <tbody>
          {ms.map(m=>{
            const total=m.factures?facturesTotal(m.factures):(m.facture||0);
            const reste=(m.montantHT||0)-total;
            return <tr key={m.id} onClick={()=>openRow(m)} style={{borderBottom:'1px solid '+RULE,cursor:'pointer'}}>
              <td style={{padding:'8px 4px'}}>
                <div className="b">{m.lot}</div>
                <div className="mut" style={{marginTop:2}}>{nom(m.artisanId)}
                  {marcheTva(m,ch)!==tvaRate(ch)&&<span style={{color:TERRA}}> · TVA {marcheTva(m,ch)} %</span>}</div>
              </td>
              <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}}>{eur(m.montantHT)}</td>
              <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap',color:total>m.montantHT?TERRA:total>=m.montantHT&&m.montantHT>0?GREEN:INK}}>{eur(total)}</td>
              <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap',color:reste<0?TERRA:INK}}>{reste<=0?'soldé':eur(reste)}</td>
              <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}}>{(m.factures||[]).length||'—'}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>}
    {!!ms.length&&<RecapBudget ch={ch} ms={ms}/>}
  </div>;
}

/* récapitulatif budgétaire : travaux et honoraires, hors puis avec honoraires */
function RecapBudget({ch,ms}){
  const honoHT=honoAmount(ch), txHono=tvaRate(ch);
  const travHT=travauxHTot(ms), travTTC=travauxTTC(ms,ch), travTVA=travTTC-travHT;
  const vent=ventilationTva(ms,ch);
  const honoTVA=honoHT*txHono/100, honoTTC=honoHT+honoTVA;
  const totHT=travHT+honoHT, totTVA=travTVA+honoTVA, totTTC=travTTC+honoTTC;
  const cell={padding:'7px 4px',textAlign:'right',whiteSpace:'nowrap'};
  return <div className="card" style={{marginTop:14,borderLeft:'3px solid '+NAVY}}>
    <div className="h2" style={{marginBottom:10}}>RÉCAPITULATIF BUDGÉTAIRE</div>
    <div style={{overflowX:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:330}}>
        <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
          <th style={{padding:'6px 4px'}}>Poste</th>
          <th style={{...cell,padding:'6px 4px'}}>HT</th>
          <th style={{...cell,padding:'6px 4px'}}>TVA</th>
          <th style={{...cell,padding:'6px 4px'}}>TTC</th>
        </tr></thead>
        <tbody>
          <tr style={{borderBottom:vent.length>1?'none':'1px solid '+RULE}}>
            <td style={{padding:'7px 4px'}}>Travaux <span className="mut">({ms.length} lot{ms.length>1?'s':''})</span></td>
            <td style={cell}>{eur(travHT)}</td>
            <td style={cell} className="mut">{eur(travTVA)}</td>
            <td style={cell}>{eur(travTTC)}</td>
          </tr>
          {vent.length>1&&vent.map((v,i)=>
            <tr key={v.taux} style={{borderBottom:i===vent.length-1?'1px solid '+RULE:'none'}}>
              <td style={{padding:'3px 4px 3px 14px'}} className="mut">dont TVA {v.taux} % <span style={{fontSize:11}}>({v.n} lot{v.n>1?'s':''})</span></td>
              <td style={cell} className="mut">{eur(v.ht)}</td>
              <td style={cell} className="mut">{eur(v.tva)}</td>
              <td style={cell} className="mut">{eur(v.ttc)}</td>
            </tr>)}
          <tr style={{borderBottom:'1px solid '+RULE}}>

function ImportMarches({data,ch,save,close}){
  const[txt,setTxt]=useState('');
  const[msg,setMsg]=useState('');
  const go=()=>{
    const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
    let artisans=[...data.artisans], marches=[...data.marches], n=0;
    for(const line of lines){
      const parts=line.split('|').map(p=>p.trim());
      if(parts.length<3)continue;
      const[lot,artisanNom,montantStr,dateStr,tvaStr]=parts;
      let art=artisanNom?artisans.find(a=>a.nom.toLowerCase()===artisanNom.toLowerCase()):null;
      if(artisanNom&&!art){
        art={id:uid(),nom:artisanNom,corps:lot,tel:'',email:'',adresse:'',siret:'',activites:'',assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''};
        artisans=[...artisans,art];
      }
      let dateSignature='';
      if(dateStr){
        const[j,mo,a]=dateStr.split('/');
        if(j&&mo&&a)dateSignature=a+'-'+mo.padStart(2,'0')+'-'+j.padStart(2,'0');
      }
      const tva=(tvaStr!==undefined&&tvaStr!=='')?+String(tvaStr).replace(',','.').replace('%','').trim():'';
      marches=[...marches,{id:uid(),chantierId:ch.id,lot,artisanId:art?art.id:'',montantHT:+String(montantStr).replace(',','.')||0,tva:isNaN(tva)?'':tva,facture:0,factures:[],statut:'signe',dateSignature,notes:''}];
      n++;
    }
    save({...data,artisans,marches});
    setMsg(n+' marché(s) importé(s).');
    setTxt('');
  };
  return <div className="card">
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Un marché par ligne, séparé par des <code>|</code> :<br/><code>Corps d'état | Artisan | Montant HT | JJ/MM/AAAA | TVA %</code><br/>Les deux derniers champs sont facultatifs ; sans TVA, le lot suit le taux du chantier ({tvaRate(ch)} %).</p>
    <textarea className="in" rows="6" value={txt} onChange={e=>setTxt(e.target.value)} placeholder={"Terrassement | SARL AMÉDÉE | 1664,36 | 25/05/2026\nBandes placo | EI SADDETIN KARA | 3033,87 | 25/05/2026 | 0"}/>
    <div className="row" style={{gap:8,marginTop:10}}>
      <button className="btn" onClick={go}>Importer</button>
      <button className="btn gh" onClick={close}>Fermer</button>
    </div>
    {msg&&<div className="xs" style={{marginTop:8,color:TERRA}}>{msg}</div>}
  </div>;
}

/* ---------------- PHOTOS ---------------- */
function Photos({data,ch,save}){
  const list=data.photos.filter(p=>p.chantierId===ch.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const [busy,setBusy]=useState(false);
  const [driveIssue,setDriveIssue]=useState(false);
  const [zoom,setZoom]=useState(null);
  const [edit,setEdit]=useState(null);
  const [driveDetail,setDriveDetail]=useState('');

  const add=async e=>{
    const files=[...e.target.files]; e.target.value='';
    if(!files.length)return;
    setBusy(true);
    setDriveIssue(false);
    const nouveaux=[];
    let driveFailed=false, lastDetail='';
    for(const file of files){
      try{
        const d=await compress(file);
        const id=uid();
        await Photo.put(id,d);
        let lien='';
        try{
          const token=await getDriveToken();
          const folderId=await driveChantierFolder(token,ch.id,ch.nom);
          lien=(await uploadToDrive(file,folderId)).webViewLink;
        }catch(x){driveFailed=true;lastDetail=x&&x.error==='auth_required'?'auth_required':((x&&(x.error||x.message))||String(x))}
        nouveaux.push({id,chantierId:ch.id,date:today(),legende:'',lot:'',lien});
      }catch(x){/* photo ignorée */}
    }
    if(nouveaux.length)save({...data,photos:[...data.photos,...nouveaux]});
    setDriveIssue(driveFailed);
    setDriveDetail(lastDetail);
    setBusy(false);
  };
  const del=async id=>{await Photo.del(id).catch(()=>{});save({...data,photos:data.photos.filter(p=>p.id!==id)})};
  const upd=p=>save({...data,photos:data.photos.map(x=>x.id===p.id?p:x)});

  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{list.length} photo{list.length>1?'s':''}</span>
      <label className="btn acc s">{busy?'Traitement…':'+ Photos'}
        <input type="file" accept="image/*" multiple onChange={add} style={{display:'none'}}/></label>
    </div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Une version réduite s'affiche dans l'app ; l'original en pleine qualité est envoyé automatiquement sur votre Google Drive (dossier « CP Constructions › {ch.nom} »).</p>
    {driveIssue&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {driveDetail==='auth_required'
        ?"Photo(s) enregistrée(s) dans l'app, mais Google Drive n'est pas connecté (bouton ci-dessus)."
        :"Photo(s) enregistrée(s) dans l'app, mais l'envoi de l'original vers Google Drive a échoué — détail technique : "+(driveDetail||'inconnu')+"."}
    </div>}
    {!list.length&&<Empty>Aucune photo. Prenez le chantier en photo à chaque visite.</Empty>}
    <div className="grid-ph">
      {list.map(p=><Vignette key={p.id} p={p} onZoom={()=>setZoom(p)} onEdit={()=>setEdit(p)}/>)}
    </div>
    {edit&&<div className="card" style={{marginTop:12}}>
      <Fld label="DATE"><input className="in" type="date" value={edit.date} onChange={e=>setEdit({...edit,date:e.target.value})}/></Fld>
      <Fld label="LÉGENDE"><input className="in" placeholder="Coulage dalle — angle nord" value={edit.legende} onChange={e=>setEdit({...edit,legende:e.target.value})}/></Fld>
      <Fld label="LOT CONCERNÉ"><select className="in" value={edit.lot} onChange={e=>setEdit({...edit,lot:e.target.value})}><option value="">— aucun —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      <Fld label="LIEN VERS L'ORIGINAL">
        <input className="in" placeholder="Lien Drive…" value={edit.lien} onChange={e=>setEdit({...edit,lien:e.target.value})}/>
        {edit.lien&&<a href={edit.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA,display:'inline-block',marginTop:6}}>Ouvrir sur Drive</a>}
      </Fld>
      <Acts onSave={()=>{upd(edit);setEdit(null)}} onCancel={()=>setEdit(null)} onDel={()=>{del(edit.id);setEdit(null)}}/>
    </div>}
    {zoom&&<Plein p={zoom} close={()=>setZoom(null)}/>}
  </div>;
}

function Vignette({p,onZoom,onEdit}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{let a=true;Photo.get(p.id).then(v=>{if(a)setSrc(v)}).catch(()=>{});return()=>{a=false}},[p.id]);
  return <div style={{border:'1px solid '+RULE,background:'#fff'}}>
    <div onClick={onZoom}>{src?<img className="ph" src={src} alt=""/>:<div className="ph"/>}</div>
    <div onClick={onEdit} style={{padding:'6px 7px'}}>
      <div className="xs mut">{fd(p.date)}</div>
      <div className="xs" style={{lineHeight:1.3}}>{p.legende||<span className="mut">Ajouter une légende</span>}</div>
      {p.lot&&<div className="xs" style={{color:NAVY,marginTop:2}}>{p.lot}</div>}
    </div>
  </div>;
}

function Plein({p,close}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{Photo.get(p.id).then(setSrc).catch(()=>{})},[p.id]);
  return <div className="modal" onClick={close}>
    <button className="xs" style={{color:'#fff',background:'none',border:'none',alignSelf:'flex-end',padding:8}}>Fermer</button>
    {src&&<img src={src} style={{maxWidth:'100%',maxHeight:'75vh',objectFit:'contain',margin:'auto'}} alt=""/>}
    <div className="xs" style={{color:'#D8D3CB',textAlign:'center',paddingTop:12}}>{fd(p.date)} — {p.legende||'sans légende'}</div>
  </div>;
}

function Docs({data,ch,up,save}){
  const d=ch.docs||{};
  const [busy,setBusy]=useState(null);
  const [signe,setSigne]=useState(null);
  const tog=id=>{const c=d[id]||{};up({docs:{...d,[id]:{...c,fait:!c.fait,date:!c.fait?today():''}}})};
  const lien=(id,v)=>up({docs:{...d,[id]:{...(d[id]||{}),lien:v}}});
  const importPdf=async(id,file)=>{
    setBusy(id);
    try{
      const token=await getDriveToken();
      const folderId=await driveSousDossier(token,ch.id,ch.nom,'Pièces');
      const{webViewLink}=await uploadToDrive(file,folderId);
      const c=d[id]||{};
      up({docs:{...d,[id]:{...c,lien:webViewLink,fait:true,date:c.fait?c.date:today()}}});
    }catch(e){
      if(e&&e.error==='auth_required')alert("Connectez d'abord Google Drive (bouton ci-dessus), puis réessayez l'import.");
      else alert("Import Google Drive impossible — détail technique : "+((e&&(e.error||e.message))||String(e)));
    }
    setBusy(null);
  };
  const enregistrerSignature=async(doc,{nom,qualite,image})=>{
    const sid=uid(), date=new Date().toISOString();
    await Photo.put(sid,image);
    const empreinte=await empreinteSignature([ch.nom,doc.l,nom,qualite,date]);
    try{
      const blob=await (await fetch(image)).blob();
      const fichier=new File([blob],'signature-'+doc.id+'-'+date.slice(0,10)+'.jpg',{type:'image/jpeg'});
      const token=await getDriveToken();
      const folderId=await driveSignaturesFolder(token,ch.id,ch.nom);
      await uploadToDrive(fichier,folderId);
    }catch(e){/* la signature reste enregistrée dans l'app même sans Drive */}
    const c=d[doc.id]||{};
    up({docs:{...d,[doc.id]:{...c,signatures:[...(c.signatures||[]),{id:sid,nom,qualite,date,empreinte}]}}});
    setSigne(null);
  };
  const retirerSignature=async(docId,sid)=>{
    if(!confirm('Retirer définitivement cette signature ?'))return;
    await Photo.del(sid).catch(()=>{});
    const c=d[docId]||{};
    up({docs:{...d,[docId]:{...c,signatures:(c.signatures||[]).filter(s=>s.id!==sid)}}});
  };
  const n=DOCS.filter(x=>d[x.id]&&d[x.id].fait).length;
  return <div>
    <DriveStatus/>
    <div className="sp xs" style={{marginTop:0,marginBottom:10}}>
      <span className="mut">{n} pièce{n>1?'s':''} sur {DOCS.length} — rangées dans Drive › {ch.nom} › Pièces</span>
      <BoutonDossierDrive ch={ch} sous="Pièces"/>
    </div>
    {DOCS.map(x=>{const r=d[x.id]||{}, sgs=r.signatures||[];return <div key={x.id} className="card" style={{padding:10}}>
      <div className="row" style={{gap:10,alignItems:'flex-start'}}>
        <button className="chk" onClick={()=>tog(x.id)} style={{background:r.fait?GREEN:'#fff',borderColor:r.fait?GREEN:RULE}}>{r.fait?'✓':''}</button>
        <div style={{flex:1}}>
          <div className="sm">{x.l}</div>
          {r.fait&&<div className="xs mut">Reçu le {fd(r.date)}</div>}
          <input className="in" style={{border:'none',borderBottom:'1px solid '+RULE,padding:'4px 0',marginTop:4,fontSize:13}} placeholder="Lien Drive…" value={r.lien||''} onChange={e=>lien(x.id,e.target.value)}/>
          <div className="row" style={{gap:14,marginTop:6,alignItems:'center',flexWrap:'wrap'}}>
            {r.lien&&<a href={r.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir</a>}
            <label className="xs" style={{color:NAVY}}>{busy===x.id?'Import…':'Importer un PDF'}
              <input type="file" accept="application/pdf" style={{display:'none'}} disabled={busy===x.id} onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importPdf(x.id,f)}}/>
            </label>
            <button className="xs" style={{color:NAVY,background:'none',border:'none',padding:0}} onClick={()=>setSigne(x)}>Faire signer</button>
          </div>
          {sgs.map(s=><div key={s.id} className="row" style={{gap:10,marginTop:8,paddingTop:8,borderTop:'1px solid '+RULE,alignItems:'center'}}>
            <VignetteSign id={s.id}/>
            <div style={{flex:1}}>
              <div className="xs b">{s.nom} <span className="mut">— {s.qualite}</span></div>
              <div className="xs mut">Signé le {dateHeure(s.date)}</div>
              {s.empreinte&&<div className="xs mut" style={{fontSize:10}}>Empreinte {s.empreinte}</div>}
            </div>
            <button className="btn dg s" onClick={()=>retirerSignature(x.id,s.id)}>✕</button>
          </div>)}
        </div>
      </div></div>})}
    {signe&&<SignaturePad titre={signe.l+' — '+ch.nom} onAnnuler={()=>setSigne(null)} onSigner={v=>enregistrerSignature(signe,v)}/>}
  </div>;
}

const MAP_POINTS=['Implantation et altimétrie','Dimensions et cotes intérieures','Ouvertures : dimensions et sens','Hauteurs sous plafond','Position des cloisons','Cuisine : arrivées et évacuations','Salle de bains / WC','Électricité : points et tableau','Chauffage : émetteurs et PAC','VMC : bouches et caisson','Sols et revêtements','Menuiseries : teintes et poignées','Escalier','Terrasse et extérieurs','Vide sanitaire / sous-sol'];

function MAP({data,ch,up}){
  const m=ch.map||{};
  const pts=m.points||[];
  const set=p=>up({map:{...m,...p}});
  const setPt=(label,patch)=>{
    const cur=pts.find(x=>x.label===label)||{label};
    set({points:[...pts.filter(x=>x.label!==label),{...cur,...patch}]});

  const nOk=pts.filter(p=>p.valide).length;
  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{nOk}/{MAP_POINTS.length} points arrêtés</span>

      </div>
      <Fld label="PARTICIPANTS"><input className="in" value={m.participants||''} onChange={e=>set({participants:e.target.value})} placeholder="Client, MOE, entreprises présentes"/></Fld>
      <Fld label="PLAN DE MISE AU POINT TECHNIQUE">
        <ImportFichier ch={ch} dossier="MAP" lien={m.lienPlan} onLien={v=>set({lienPlan:v})} label="Importer le plan"/>
      </Fld>
      <Fld label="DOSSIER MAP (PDF)">
        <ImportFichier ch={ch} dossier="MAP" lien={m.lienDossier} onLien={v=>set({lienDossier:v})} label="Importer le PDF de MAP"/>
      </Fld>
      <Fld label="OBSERVATIONS GÉNÉRALES"><textarea className="in" rows="3" value={m.notes||''} onChange={e=>set({notes:e.target.value})}/></Fld>
    </div>
    <div className="sp" style={{margin:'16px 0 10px'}}><span className="h2">POINTS ARRÊTÉS</span></div>
    {MAP_POINTS.map(label=>{
      const r=pts.find(x=>x.label===label)||{};
      return <div key={label} className="card" style={{padding:10,borderLeft:'3px solid '+(r.valide?GREEN:RULE)}}>
        <div className="row" style={{gap:10,alignItems:'flex-start'}}>
          <button className="chk" onClick={()=>setPt(label,{valide:!r.valide})} style={{background:r.valide?GREEN:'#fff',borderColor:r.valide?GREEN:RULE}}>{r.valide?'✓':''}</button>
          <div style={{flex:1}}>
            <div className="sm">{label}</div>
            <input className="in" style={{border:'none',borderBottom:'1px solid '+RULE,padding:'4px 0',marginTop:4,fontSize:13}}
              placeholder="Décision, cote arrêtée, réserve…" value={r.decision||''} onChange={e=>setPt(label,{decision:e.target.value})}/>
          </div>
        </div>
      </div>;
    })}
    <DriveStatus/>
  </div>;
}

/* ---------------- HONORAIRES ---------------- */
function Honoraires({data,ch,save}){
  const hf=ch.honoFactures||[];
  const [busy,setBusy]=useState(null);
  const [busyRetro,setBusyRetro]=useState(null);
  const total=honoAmount(ch), facture=sumMontants(hf), reste=total-facture;
  const ms=data.marches.filter(m=>m.chantierId===ch.id);
  const cmds=data.commandes.filter(c=>c.chantierId===ch.id);
  const groupes=[
    {titre:'Marchés de travaux',type:'marche',lignes:ms.map(m=>({src:m,label:m.lot,sous:''}))},
    {titre:'Matériaux commandés',type:'commande',lignes:cmds.map(c=>({src:c,label:c.designation,sous:c.fournisseur||''}))},
  ].filter(g=>g.lignes.length);
  const toutes=[...ms,...cmds];
  const retroDu=toutes.reduce((s,x)=>s+retroMontant(x),0);
  const retroFac=toutes.reduce((s,x)=>s+(+x.retroFacture||0),0);
  const upHono=list=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,honoFactures:list}:x)});
  const add=()=>upHono([...hf,{id:uid(),montant:'',date:today(),libelle:'',lien:''}]);
  const upd=(id,patch)=>upHono(hf.map(x=>x.id===id?{...x,...patch}:x));
  const del=id=>upHono(hf.filter(x=>x.id!==id));
  const updRetro=(type,id,patch)=>save(type==='marche'
    ?{...data,marches:data.marches.map(m=>m.id===id?{...m,...patch}:m)}
    :{...data,commandes:data.commandes.map(c=>c.id===id?{...c,...patch}:c)});
  const importFacture=async(id,file)=>{
    setBusy(id);
    try{
      const token=await getDriveToken();
      const folderId=await driveHonoFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      upd(id,{lien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import de la facture impossible.");
    }
    setBusy(null);
  };
  const importRetro=async(type,id,file)=>{
    setBusyRetro(id);
    try{
      const token=await getDriveToken();
      const folderId=await driveRetroFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      updRetro(type,id,{retroLien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton en bas de page).":"Import de la facture impossible.");
    }
    setBusyRetro(null);
  };
  return <div>
    <div className="g2">
      <Stat l="Honoraires TTC" v={eur(ttc(total,ch))} c={NAVY}/>
      <Stat l="Déjà facturé TTC" v={eur(ttc(facture,ch))}/>
      <Stat l={"Reste à facturer TTC"} v={eur(ttc(reste,ch))} c={reste>0?TERRA:GREEN}/>
      <Stat l="Reste à facturer HT" v={reste>0?eur(reste):'soldé'} c={reste>0?INK:GREEN}/>
    </div>
    <div className="card" style={{marginTop:8}}>
      <div className="xs mut" style={{lineHeight:1.6}}>
        Base HT : <b>{eur(total)}</b>{ch.honorairesMontant!==undefined&&ch.honorairesMontant!==null&&ch.honorairesMontant!==''?' (montant saisi)':' ('+(ch.honorairesPct||0)+' % de '+eur(ch.budget)+')'} · TVA {tvaRate(ch)} %<br/>
        Le montant des honoraires se modifie via « Modifier » sur la fiche du chantier.
      </div>
    </div>
    {retroDu>0&&<div className="card" style={{marginTop:8,borderLeft:'3px solid '+NAVY}}>
      <div className="xs mut">Recette totale du chantier — honoraires + rétrocessions</div>
      <div className="b" style={{fontSize:20,marginTop:2,color:NAVY}}>{eur(total+retroDu)} HT</div>
      <div className="xs mut" style={{marginTop:6}}>Encaissé : <b>{eur(facture+retroFac)}</b> · Reste à facturer : <b style={{color:(total+retroDu-facture-retroFac)>0?TERRA:GREEN}}>{eur(total+retroDu-facture-retroFac)}</b></div>
    </div>}
    {reste<0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginTop:8}}>
      Vous avez facturé {eur(-reste)} HT de plus que le montant d'honoraires prévu.</div>}
    <div className="sp" style={{margin:'14px 0 12px'}}>
      <span className="h2">MES FACTURES ({hf.length})</span>
      <button className="btn acc s" onClick={add}>+ Facture</button>
    </div>
    {!hf.length&&<Empty>Aucune facture d'honoraires. Ajoutez-les au fur et à mesure de vos appels de fonds.</Empty>}
    {hf.map(x=><div key={x.id} className="card" style={{padding:10}}>
      <div className="g2">
        <Fld label="MONTANT HT (€)"><input className="in" type="number" value={x.montant} onChange={e=>upd(x.id,{montant:e.target.value})}/></Fld>
        <Fld label="DATE"><input className="in" type="date" value={x.date||''} onChange={e=>upd(x.id,{date:e.target.value})}/></Fld>
      </div>
      <Fld label="LIBELLÉ"><input className="in" placeholder="Acompte, phase PC, situation n°…" value={x.libelle||''} onChange={e=>upd(x.id,{libelle:e.target.value})}/></Fld>
      <div className="sp">
        <span className="xs mut">{eur(ttc(x.montant,ch))} TTC</span>
        <div className="row" style={{gap:14,alignItems:'center'}}>
          {x.lien
            ?<a href={x.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Voir la facture</a>
            :<label className="xs" style={{color:NAVY}}>{busy===x.id?'Import…':'Joindre la facture'}
              <input type="file" accept="application/pdf,image/*" style={{display:'none'}} disabled={busy===x.id}
                onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importFacture(x.id,file)}}/></label>}
          <button className="btn dg s" onClick={()=>del(x.id)}>Supprimer</button>
        </div>
      </div>
    </div>)}

    <div className="sp" style={{margin:'20px 0 12px'}}>
      <span className="h2">RÉTROCESSIONS</span>
      <span className="xs mut">{eur(retroFac)} / {eur(retroDu)} HT</span>
    </div>
    {!groupes.length
      ?<Empty>Aucun marché ni matériau sur ce chantier. Les rétrocessions se calculent à partir des marchés de travaux et des commandes de matériaux.</Empty>
      :<div>
        <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Saisissez le taux ligne par ligne (0 % s'il n'y a pas de rétrocession). Le montant dû se calcule sur le montant HT du marché ou de la commande.</p>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:430}}>
            <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
              <th style={{padding:'6px 4px'}}>Désignation</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:62}}>Rétro %</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:82}}>Montant dû</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:92}}>Facturé</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:74}}>Facture</th>
            </tr></thead>
            <tbody>
              {groupes.map(g=>[
                <tr key={g.type+'-t'} style={{background:'#F3F1EC'}}>
                  <td colSpan="5" className="xs b" style={{padding:'5px 4px',color:NAVY,letterSpacing:'.04em'}}>{g.titre}</td>
                </tr>,
                ...g.lignes.map(({src,label,sous})=>{
                  const du=retroMontant(src), fac=+src.retroFacture||0;
                  return <tr key={g.type+src.id} style={{borderBottom:'1px solid '+RULE}}>
                    <td style={{padding:'6px 4px'}}>
                      <div className={du>0?'b':''}>{label}</div>
                      <div className="mut">{eur(retroBase(src))} HT{sous?' · '+sous:''}</div>
                    </td>
                    <td style={{padding:'6px 4px'}}>
                      <input className="in" type="number" step="0.5" placeholder="0" style={{padding:'5px 4px',fontSize:13,textAlign:'right'}}
                        value={src.retroPct===undefined||src.retroPct===null?'':src.retroPct}
                        onChange={e=>updRetro(g.type,src.id,{retroPct:e.target.value===''?'':+e.target.value})}/>
                    </td>
                    <td style={{padding:'6px 4px',textAlign:'right',whiteSpace:'nowrap'}} className={du>0?'b':'mut'}>{du>0?eur(du):'—'}</td>
                    <td style={{padding:'6px 4px'}}>
                      <input className="in" type="number" placeholder="—" style={{padding:'5px 4px',fontSize:13,textAlign:'right'}}
                        value={src.retroFacture===undefined||src.retroFacture===null?'':src.retroFacture}
                        onChange={e=>updRetro(g.type,src.id,{retroFacture:e.target.value===''?'':+e.target.value})}/>
                      {du>0&&fac>0&&fac<du&&<div className="mut" style={{textAlign:'right',marginTop:2}}>reste {eur(du-fac)}</div>}
                    </td>
                    <td style={{padding:'6px 4px',textAlign:'right',whiteSpace:'nowrap'}}>
                      {src.retroLien
                        ?<a href={src.retroLien} target="_blank" rel="noreferrer" style={{color:TERRA}}>Voir</a>
                        :<label style={{color:NAVY}}>{busyRetro===src.id?'Envoi…':'Joindre'}
                          <input type="file" accept="application/pdf,image/*" style={{display:'none'}} disabled={busyRetro===src.id}
                            onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importRetro(g.type,src.id,file)}}/></label>}
                    </td>
                  </tr>;
                })
              ])}
              <tr style={{borderTop:'2px solid '+RULE}}>
                <td style={{padding:'8px 4px'}} className="b">TOTAL</td>
                <td/>
                <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}} className="b">{eur(retroDu)}</td>
                <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}} className="b">{eur(retroFac)}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
        {retroDu-retroFac>0&&<div className="xs" style={{marginTop:10,color:TERRA}}>Reste à facturer en rétrocessions : <b>{eur(retroDu-retroFac)} HT</b></div>}
      </div>}
    <DriveStatus/>
  </div>;
}

  </div>;
