  </div>;
}

/* ---------------- LECTURE DES FACTURES ---------------- */
function LireFactures({data,ch,save,close}){
  const [rows,setRows]=useState([]);
  const [busy,setBusy]=useState('');
  const [envoi,setEnvoi]=useState('');
  const ms=data.marches.filter(m=>m.chantierId===ch.id);
  const cs=data.commandes.filter(c=>c.chantierId===ch.id);
  const nomArtisan=id=>{const a=data.artisans.find(x=>x.id===id);return a?a.nom:''};
  /* une facture se range aussi bien sur un marché de travaux que sur un achat de
     matériaux : le fournisseur de menuiseries facture comme l'artisan. */
  const cibles=[
    ...ms.map(m=>({cle:'m:'+m.id,type:'marche',id:m.id,titre:m.lot,sous:nomArtisan(m.artisanId),
      montantHT:+m.montantHT||0,factures:m.factures||[],groupe:'Marchés de travaux'})),
    ...cs.map(c=>({cle:'c:'+c.id,type:'commande',id:c.id,titre:c.designation||'Achat de matériaux',sous:c.fournisseur||'',
      montantHT:+c.montant||0,factures:c.factures||[],groupe:'Achats de matériaux'})),
    ...(honoAmount(ch)?[{cle:'h:'+ch.id,type:'honoraires',id:ch.id,titre:'Honoraires de maîtrise d’œuvre',sous:'CP Constructions',
      montantHT:honoAmount(ch),factures:ch.honoFactures||[],groupe:'Honoraires'}]:[]),
  ];
  const cible=cle=>cibles.find(x=>x.cle===cle);
  /* on rattache par le nom de l'entreprise ou du fournisseur qui émet,
     à défaut par l'intitulé cité dessus. Sinon on laisse choisir. */
  const trouveMarche=txt=>{
    const T=cleNom(txt);
    for(const c of cibles){const k=cleNom(c.sous);if(k.length>=4&&T.indexOf(k)>=0)return c.cle}
    for(const c of cibles){const k=cleNom(c.titre);if(k.length>=5&&T.indexOf(k)>=0)return c.cle}
    return '';
  };
  const lire=async files=>{
    setBusy('Lecture de '+files.length+' facture'+(files.length>1?'s':'')+'…');
    const out=[];
    for(const file of files){
      const {txt,motif}=await lireDocument(file);
      if(!txt){out.push({id:uid(),file,nomFichier:file.name,scan:true,motif,retenu:false,alertes:[]});continue}
      const a=analyseFacture(txt);
      const ht=a.montantHT!==null?a.montantHT
        :(a.montantTTC!==null&&a.tva!==null?a.montantTTC/(1+a.tva/100):null);
      out.push({id:uid(),file,nomFichier:file.name,scan:false,retenu:ht!==null,
        marcheId:trouveMarche(txt),montant:ht===null?'':Math.round(ht*100)/100,
        date:a.date||'',numero:a.numero||'',tva:a.tva,alertes:a.alertes.slice()});
    }
    setRows(r=>[...r,...out]);
    setBusy('');
  };
  const upd=(id,patch)=>setRows(rs=>rs.map(r=>r.id===id?{...r,...patch}:r));
  const scans=rows.filter(r=>r.scan);
  const retenus=rows.filter(r=>r.retenu&&!r.scan&&r.marcheId);
  const sansLot=rows.filter(r=>r.retenu&&!r.scan&&!r.marcheId);
  const doublon=r=>{
    const t=cible(r.marcheId);
    return !!t&&t.factures.some(f=>Math.abs((+f.montant||0)-(+r.montant||0))<0.01&&f.date===r.date);
  };
  /* ce qu'il resterait dû après cette facture — un dépassement se voit tout de suite */
  const resteApres=r=>{
    const t=cible(r.marcheId);
    if(!t)return null;
    const dejaFacture=facturesTotal(t.factures);
    const memeLigne=retenus.filter(x=>x.marcheId===r.marcheId).reduce((s,x)=>s+(+x.montant||0),0);
    return t.montantHT-dejaFacture-memeLigne;
  };
  const ajouter=async()=>{
    const marches=data.marches.map(m=>({...m,factures:[...(m.factures||[])]}));
    const commandes=data.commandes.map(c=>({...c,factures:[...(c.factures||[])]}));
    const honoFactures=[...(ch.honoFactures||[])];
    const envois=[];
    for(const r of retenus){
      const t=cible(r.marcheId);
      if(!t)continue;
      const fid=uid();
      const ligne={id:fid,montant:+r.montant||0,date:r.date||today(),lien:'',numero:r.numero||''};
      if(t.type==='honoraires'){honoFactures.push({...ligne,libelle:'',tva:r.tva===null||r.tva===undefined?'':r.tva})}
      else{
        const dest=t.type==='marche'?marches.find(x=>x.id===t.id):commandes.find(x=>x.id===t.id);
        if(!dest)continue;
        dest.factures.push(ligne);
        dest.facture=facturesTotal(dest.factures);
      }
      envois.push({type:t.type,ligneId:t.id,fid,file:r.file});
    }
    let etat={...data,marches,commandes,
      chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,honoFactures}:x)};
    save(etat);
    try{
      setEnvoi('Envoi des factures sur le Drive…');
      const token=await getDriveToken();
      const dossierFact=await driveFacturesFolder(token,ch.id,ch.nom);
      let dossierHono=null;
      const liens=[];
      for(const e of envois){
        if(!e.file)continue;
        /* une facture d'honoraires est la nôtre : elle va dans Honoraires, pas dans Factures */
        let dest=dossierFact;
        if(e.type==='honoraires'){
          if(!dossierHono)dossierHono=await driveHonoFolder(token,ch.id,ch.nom);
          dest=dossierHono;
        }
        try{const{webViewLink}=await uploadToDrive(e.file,dest);liens.push({...e,lien:webViewLink})}catch(x){}
      }
      if(liens.length){
        const poser=(liste,type)=>liste.map(x=>{
          const pour=liens.filter(l=>l.type===type&&l.ligneId===x.id);
          if(!pour.length)return x;
          return {...x,factures:(x.factures||[]).map(f=>{
            const l=pour.find(y=>y.fid===f.id);
            return l?{...f,lien:l.lien}:f;
          })};
        });
        const pourHono=liens.filter(l=>l.type==='honoraires');
        etat={...etat,marches:poser(etat.marches,'marche'),commandes:poser(etat.commandes,'commande'),
          chantiers:etat.chantiers.map(x=>x.id!==ch.id||!pourHono.length?x:{...x,
            honoFactures:(x.honoFactures||[]).map(f=>{
              const l=pourHono.find(y=>y.fid===f.id);
              return l?{...f,lien:l.lien}:f;
            })})};
        save(etat);
      }
    }catch(e){/* Drive non connecté : les factures restent enregistrées */}
    setEnvoi('');
    close();
  };
  return <div className="card" style={{borderLeft:'3px solid '+TERRA}}>
    <div className="h2" style={{marginBottom:8}}>LIRE DES FACTURES</div>
    {!cibles.length
      ?<div className="xs mut" style={{lineHeight:1.6}}>Créez d'abord les lots ou les commandes de matériaux — une facture se range sur l'un ou l'autre. Utilisez « Lire des contrats », « + Lot », ou l'onglet MATÉRIAUX.</div>
      :<div>
        <div className="xs mut" style={{lineHeight:1.6,marginBottom:10}}>
          Choisissez les factures en PDF : le montant, la date, le numéro et le taux de TVA sont lus,
          et chaque facture est rattachée d'après l'entreprise ou le fournisseur qui l'émet — marché de travaux
          comme achat de matériaux. PDF ou Word (.docx).
          <b> Rien n'est enregistré avant votre validation.</b>
        </div>
        <label className="btn gh s" style={{display:'inline-block',whiteSpace:'nowrap'}}>{busy||'Choisir des factures (PDF ou Word)'}
          <input type="file" accept={DOC_ACCEPT} multiple style={{display:'none'}} disabled={!!busy}
            onChange={e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)lire(fs)}}/></label>
      </div>}
    {!!scans.length&&<div className="xs" style={{marginTop:10,background:'#FBF3DF',color:'#6A4E06',borderLeft:'3px solid '+AMBER,padding:8,lineHeight:1.5}}>
      {scans.length} facture{scans.length>1?'s':''} n'ont rien donné :
      {scans.map(s=><div key={s.id} style={{marginTop:3}}>· <b>{s.nomFichier}</b> — {s.motif}</div>)}
      <div style={{marginTop:4}}>Saisissez-les à la main sur le lot concerné.</div>
    </div>}
    {!!sansLot.length&&<div className="xs" style={{marginTop:10,color:AMBER,lineHeight:1.5}}>
      {sansLot.length} facture{sansLot.length>1?'s':''} sans destination reconnue : choisissez la ligne ci-dessous, sinon elle{sansLot.length>1?'s ne seront':' ne sera'} pas enregistrée{sansLot.length>1?'s':''}.
    </div>}
    {rows.filter(r=>!r.scan).map(r=>{
      const reste=resteApres(r);
      return <div key={r.id} className="card" style={{marginTop:10,borderLeft:'3px solid '+(r.alertes.length||!r.marcheId?AMBER:GREEN)}}>
        <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
          <span className="xs mut" style={{wordBreak:'break-all'}}>{r.nomFichier}</span>
          <label className="xs" style={{whiteSpace:'nowrap'}}>
            <input type="checkbox" checked={r.retenu} onChange={e=>upd(r.id,{retenu:e.target.checked})}/> retenir
          </label>
        </div>
        <Fld label="LOT OU ACHAT CONCERNÉ">
          <select className="in" value={r.marcheId} onChange={e=>upd(r.id,{marcheId:e.target.value})}>
            <option value="">— à choisir —</option>
            {['Marchés de travaux','Achats de matériaux','Honoraires'].map(g=>{
              const dedans=cibles.filter(c=>c.groupe===g);
              return dedans.length?<optgroup key={g} label={g}>
                {dedans.map(c=><option key={c.cle} value={c.cle}>{c.titre}{c.sous?' — '+c.sous:''}</option>)}
              </optgroup>:null;
            })}
          </select>
        </Fld>
        <div className="g3">
          <Fld label="MONTANT HT (€)"><input className="in" type="number" step="0.01" value={r.montant} onChange={e=>upd(r.id,{montant:e.target.value})}/></Fld>
          <Fld label="DATE"><input className="in" type="date" value={r.date} onChange={e=>upd(r.id,{date:e.target.value})}/></Fld>
          <Fld label="N° DE FACTURE"><input className="in" value={r.numero} onChange={e=>upd(r.id,{numero:e.target.value})}/></Fld>
        </div>
        {r.tva!==null&&r.tva!==undefined&&<div className="xs mut" style={{marginTop:-4}}>TVA {r.tva} % sur la facture.</div>}
        {r.alertes.map((a,i)=><div key={i} className="xs" style={{color:AMBER,marginTop:6,lineHeight:1.5}}>{a}</div>)}
        {doublon(r)&&<div className="xs" style={{color:TERRA,marginTop:6,lineHeight:1.5}}>Une facture du même montant et de la même date figure déjà sur ce lot — doublon probable.</div>}
        {reste!==null&&reste<-0.01&&<div className="xs" style={{color:TERRA,marginTop:6,lineHeight:1.5}}>
          Cette ligne serait facturée {eur(-reste)} au-delà de son montant{(cible(r.marcheId)||{}).type==='commande'?' de commande':' de marché'}.</div>}
        {reste!==null&&reste>=-0.01&&r.marcheId&&<div className="xs mut" style={{marginTop:6}}>Resterait à facturer sur cette ligne : {eur(reste)} HT.</div>}
      </div>;
    })}
    {!!rows.filter(r=>!r.scan).length&&<div className="row" style={{gap:8,marginTop:12,flexWrap:'wrap'}}>
      <button className="btn" disabled={!retenus.length||!!envoi} onClick={ajouter}>
        {envoi||(retenus.length?'Enregistrer '+retenus.length+' facture'+(retenus.length>1?'s':''):'Enregistrer les factures')}</button>
      <button className="btn gh" onClick={close}>Annuler</button>
    </div>}
    {!!retenus.length&&<div className="xs mut" style={{marginTop:8,lineHeight:1.5}}>
      Total retenu : <b>{eur(retenus.reduce((s,r)=>s+(+r.montant||0),0))} HT</b>. Les factures seront aussi déposées dans Drive › {ch.nom} › Factures.</div>}
  </div>;
}

function ImportMarches({data,ch,save,close}){
  const[txt,setTxt]=useState('');
  const[msg,setMsg]=useState('');
  const go=()=>{
    const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
    let artisans=[...data.artisans], marches=[...data.marches], n=0;
    for(const line of lines){
      const parts=line.split('|').map(p=>p.trim());
      if(parts.length<3)continue;
      const[lot,artisanNom,montantStr,dateStr,tvaStr]=parts;
      let art=artisanNom?artisans.find(a=>a.nom.toLowerCase()===artisanNom.toLowerCase()):null;
      if(artisanNom&&!art){
        art={id:uid(),nom:artisanNom,corps:lot,tel:'',email:'',adresse:'',siret:'',activites:'',assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''};
        artisans=[...artisans,art];
      }
      let dateSignature='';
      if(dateStr){
        const[j,mo,a]=dateStr.split('/');
        if(j&&mo&&a)dateSignature=a+'-'+mo.padStart(2,'0')+'-'+j.padStart(2,'0');
      }
      const tva=(tvaStr!==undefined&&tvaStr!=='')?+String(tvaStr).replace(',','.').replace('%','').trim():'';
      marches=[...marches,{id:uid(),chantierId:ch.id,lot,artisanId:art?art.id:'',montantHT:+String(montantStr).replace(',','.')||0,tva:isNaN(tva)?'':tva,facture:0,factures:[],statut:'signe',dateSignature,notes:''}];
      n++;
    }
    save({...data,artisans,marches});
    setMsg(n+' marché(s) importé(s).');
    setTxt('');
  };
  return <div className="card">
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Un marché par ligne, séparé par des <code>|</code> :<br/><code>Corps d'état | Artisan | Montant HT | JJ/MM/AAAA | TVA %</code><br/>Les deux derniers champs sont facultatifs ; sans TVA, le lot suit le taux du chantier ({tvaRate(ch)} %).</p>
    <textarea className="in" rows="6" value={txt} onChange={e=>setTxt(e.target.value)} placeholder={"Terrassement | SARL AMÉDÉE | 1664,36 | 25/05/2026\nBandes placo | EI SADDETIN KARA | 3033,87 | 25/05/2026 | 0"}/>
    <div className="row" style={{gap:8,marginTop:10}}>
      <button className="btn" onClick={go}>Importer</button>
      <button className="btn gh" onClick={close}>Fermer</button>
    </div>
    {msg&&<div className="xs" style={{marginTop:8,color:TERRA}}>{msg}</div>}
  </div>;
}

/* ---------------- PHOTOS ---------------- */
function Photos({data,ch,save}){
  const list=data.photos.filter(p=>p.chantierId===ch.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const [busy,setBusy]=useState(false);
  const [driveIssue,setDriveIssue]=useState(false);
  const [zoom,setZoom]=useState(null);
  const [edit,setEdit]=useState(null);
  const [driveDetail,setDriveDetail]=useState('');

  const add=async e=>{
    const files=[...e.target.files]; e.target.value='';
    if(!files.length)return;
    setBusy(true);
    setDriveIssue(false);
    const nouveaux=[];
    let driveFailed=false, lastDetail='';
    for(const file of files){
      try{
        const d=await compress(file);
        const id=uid();
        await Photo.put(id,d);
        let lien='';
        try{
          const token=await getDriveToken();
          const folderId=await driveSousDossier(token,ch.id,ch.nom,'Photos');
          lien=(await uploadToDrive(file,folderId)).webViewLink;
        }catch(x){driveFailed=true;lastDetail=x&&x.error==='auth_required'?'auth_required':((x&&(x.error||x.message))||String(x))}
        nouveaux.push({id,chantierId:ch.id,date:today(),legende:'',lot:'',lien});
      }catch(x){/* photo ignorée */}
    }
    if(nouveaux.length)save({...data,photos:[...data.photos,...nouveaux]});
    setDriveIssue(driveFailed);
    setDriveDetail(lastDetail);
    setBusy(false);
  };
  const del=async id=>{await Photo.del(id).catch(()=>{});save({...data,photos:data.photos.filter(p=>p.id!==id)})};
  const upd=p=>save({...data,photos:data.photos.map(x=>x.id===p.id?p:x)});

  /* rattrapage : les photos ajoutées alors que Drive n'était pas connecté n'ont
     jamais quitté l'application. On ne dispose plus de l'original — il n'existait
     qu'en mémoire au moment de l'ajout — mais la version réduite, elle, est
     conservée : mieux vaut la déposer que de laisser le dossier Drive vide. */
  const manquantes=list.filter(p=>!p.lien);
  const [rattrapage,setRattrapage]=useState(null);
  const envoyerManquantes=async()=>{
    setRattrapage({fait:0,total:manquantes.length});
    let photos=data.photos, fait=0, echec='';
    try{
      const token=await getDriveToken();
      const folderId=await driveSousDossier(token,ch.id,ch.nom,'Photos');
      for(const p of manquantes){
        try{
          const url=await Photo.get(p.id);
          if(!url)continue;
          const blob=await (await fetch(url)).blob();
          const nom=(p.date||today())+(p.legende?' — '+p.legende.replace(/[\\/:*?"<>|]/g,' '):'')+' — '+p.id+'.jpg';
          const{webViewLink}=await uploadToDrive(new File([blob],nom,{type:'image/jpeg'}),folderId);
          photos=photos.map(x=>x.id===p.id?{...x,lien:webViewLink}:x);
          fait++;
          setRattrapage({fait,total:manquantes.length});
        }catch(x){echec=(x&&(x.error||x.message))||String(x)}
      }
    }catch(x){echec=x&&x.error==='auth_required'?'auth_required':((x&&(x.error||x.message))||String(x))}
    if(fait)save({...data,photos});
    setRattrapage({fait,total:manquantes.length,fini:true,echec});
  };

  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{list.length} photo{list.length>1?'s':''}</span>
      <div className="row" style={{gap:14,alignItems:'center'}}>
        <BoutonDossierDrive ch={ch} sous="Photos"/>
        <label className="btn acc s">{busy?'Traitement…':'+ Photos'}
          <input type="file" accept="image/*" multiple onChange={add} style={{display:'none'}}/></label>
      </div>
    </div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Une version réduite s'affiche dans l'app ; l'original en pleine qualité est envoyé automatiquement sur votre Google Drive (dossier « {DRIVE_RACINE} › {ch.nom} › Photos »).
      <br/>Pour donner accès à un collaborateur : ouvrez le dossier avec le lien ci-dessus, puis utilisez « Partager » dans Google Drive. L'application ne peut pas partager à votre place.</p>
    {driveIssue&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {driveDetail==='auth_required'
        ?"Photo(s) enregistrée(s) dans l'app, mais Google Drive n'est pas connecté (bouton ci-dessus)."
        :"Photo(s) enregistrée(s) dans l'app, mais l'envoi de l'original vers Google Drive a échoué — détail technique : "+(driveDetail||'inconnu')+"."}
    </div>}
    {!!manquantes.length&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12,lineHeight:1.5}}>
      <b>{manquantes.length} photo{manquantes.length>1?'s':''} sur {list.length} ne {manquantes.length>1?'sont':'est'} pas sur le Drive.</b> La connexion Google est perdue à chaque fermeture de l’application : si elle n’a pas été rétablie avant l’ajout, l’envoi n’a pas eu lieu. {manquantes.length>1?'Elles sont':'Elle est'} bien conservée{manquantes.length>1?'s':''} dans l’application.
      <div style={{marginTop:8}}>
        <button className="btn acc s" disabled={!!rattrapage&&!rattrapage.fini} onClick={envoyerManquantes}>
          {rattrapage&&!rattrapage.fini?'Envoi '+rattrapage.fait+'/'+rattrapage.total+'…':'Envoyer sur le Drive'}</button>
      </div>
      <div style={{marginTop:6}}>Seule la version réduite peut être envoyée : l’original n’existait qu’au moment de l’ajout.</div>
    </div>}
    {rattrapage&&rattrapage.fini&&<div className="xs" style={{background:rattrapage.echec?'#F6E2DC':'#E3EDE4',color:rattrapage.echec?'#8A2E14':'#2F5D3A',borderLeft:'3px solid '+(rattrapage.echec?TERRA:GREEN),padding:8,marginBottom:12,lineHeight:1.5}}>
      {rattrapage.fait} photo{rattrapage.fait>1?'s':''} envoyée{rattrapage.fait>1?'s':''} sur le Drive.
      {rattrapage.echec==='auth_required'?" Connectez Google Drive (bouton ci-dessus) puis relancez l'envoi."
        :rattrapage.echec?' Interrompu — détail technique : '+rattrapage.echec+'.':''}
    </div>}
    {!list.length&&<Empty>Aucune photo. Prenez le chantier en photo à chaque visite.</Empty>}
    <div className="grid-ph">
      {list.map(p=><Vignette key={p.id} p={p} onZoom={()=>setZoom(p)} onEdit={()=>setEdit(p)}/>)}
    </div>
    {edit&&<div className="card" style={{marginTop:12}}>
      <Fld label="DATE"><input className="in" type="date" value={edit.date} onChange={e=>setEdit({...edit,date:e.target.value})}/></Fld>
      <Fld label="LÉGENDE"><input className="in" placeholder="Coulage dalle — angle nord" value={edit.legende} onChange={e=>setEdit({...edit,legende:e.target.value})}/></Fld>
      <Fld label="LOT CONCERNÉ"><select className="in" value={edit.lot} onChange={e=>setEdit({...edit,lot:e.target.value})}><option value="">— aucun —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      <Fld label="LIEN VERS L'ORIGINAL">
        <input className="in" placeholder="Lien Drive…" value={edit.lien} onChange={e=>setEdit({...edit,lien:e.target.value})}/>
        {edit.lien&&<a href={edit.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA,display:'inline-block',marginTop:6}}>Ouvrir sur Drive</a>}
      </Fld>
      <Acts onSave={()=>{upd(edit);setEdit(null)}} onCancel={()=>setEdit(null)} onDel={()=>{del(edit.id);setEdit(null)}}/>
    </div>}
    {zoom&&<Plein p={zoom} close={()=>setZoom(null)}/>}
  </div>;
}

function Vignette({p,onZoom,onEdit}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{let a=true;Photo.get(p.id).then(v=>{if(a)setSrc(v)}).catch(()=>{});return()=>{a=false}},[p.id]);
  return <div style={{border:'1px solid '+RULE,background:'#fff'}}>
    <div onClick={onZoom}>{src?<img className="ph" src={src} alt=""/>:<div className="ph"/>}</div>
    <div onClick={onEdit} style={{padding:'6px 7px'}}>
      <div className="xs mut">{fd(p.date)}</div>
      <div className="xs" style={{lineHeight:1.3}}>{p.legende||<span className="mut">Ajouter une légende</span>}</div>
      {p.lot&&<div className="xs" style={{color:NAVY,marginTop:2}}>{p.lot}</div>}
    </div>
  </div>;
}

function Plein({p,close}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{Photo.get(p.id).then(setSrc).catch(()=>{})},[p.id]);
  return <div className="modal" onClick={close}>
    <button className="xs" style={{color:'#fff',background:'none',border:'none',alignSelf:'flex-end',padding:8}}>Fermer</button>
    {src&&<img src={src} style={{maxWidth:'100%',maxHeight:'75vh',objectFit:'contain',margin:'auto'}} alt=""/>}
    <div className="xs" style={{color:'#D8D3CB',textAlign:'center',paddingTop:12}}>{fd(p.date)} — {p.legende||'sans légende'}</div>
  </div>;
}

/* ---------------- COMMANDES MATÉRIAUX ---------------- */
function Commandes({data,ch,save,ouvrir,onOuvert}){
  const [f,setF]=useState(null);
  /* une commande de matériaux se facture comme un marché : le fournisseur envoie
     sa facture, elle se range sur la commande et entre dans le suivi de facturation. */
  const [luFact,setLuFact]=useState(null);
  const addFacture=()=>setF({...f,factures:[...(f.factures||[]),{id:uid(),montant:'',date:'',lien:'',numero:''}]});
  const updFacture=(fid,patch)=>setF(p=>({...p,factures:(p.factures||[]).map(x=>x.id===fid?{...x,...patch}:x)}));
  const delFacture=fid=>setF({...f,factures:(f.factures||[]).filter(x=>x.id!==fid)});
  const importFacture=async(fid,file)=>{
    let lu=null;
    if(!/^image\//.test(file.type||'')){
      try{
        const {txt,motif}=await lireDocument(file);
        if(txt){
          const a=analyseFacture(txt);
          const cible=(f.factures||[]).find(x=>x.id===fid)||{};
          const patch={};
          const ht=a.montantHT!==null?a.montantHT:(a.montantTTC!==null&&a.tva!==null?a.montantTTC/(1+a.tva/100):null);
          if(ht!==null&&(cible.montant===''||cible.montant===undefined||cible.montant===null))patch.montant=Math.round(ht*100)/100;
          if(a.date&&!cible.date)patch.date=a.date;
          if(a.numero&&!cible.numero)patch.numero=a.numero;
          if(Object.keys(patch).length){updFacture(fid,patch);lu={patch,a};}else lu={patch:null,a};
        }else lu={motif};
      }catch(e){}
    }
    setLuFact(lu);
    try{
      const token=await getDriveToken();
      const folderId=await driveFacturesFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      updFacture(fid,{lien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import de la facture impossible.");
    }
  };
  const list=data.commandes.filter(c=>c.chantierId===ch.id).sort((a,b)=>(a.livrPrevue||'9999').localeCompare(b.livrPrevue||'9999'));
  const ok=()=>{
    if(!f.designation.trim())return;
    const factures=f.factures||[];
    const r={...f,montant:+f.montant||0,tva:f.tva===''||f.tva===undefined||f.tva===null?'':+f.tva,
      factures,facture:facturesTotal(factures)};
    save({...data,commandes:f.id?data.commandes.map(c=>c.id===f.id?r:c):[...data.commandes,{...r,id:uid(),chantierId:ch.id}]});
    setF(null);
  };
  const tot=materiauxHT(list), totTTC=materiauxTTC(list,ch);
  useEffect(()=>{
    if(!ouvrir)return;
    const c=data.commandes.find(x=>x.id===ouvrir);
    if(c)setF(c.factures?c:{...c,factures:[]});
    if(onOuvert)onOuvert();
  },[ouvrir]);
  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{list.length} commande{list.length>1?'s':''} — {eur(tot)} HT · {eur(totTTC)} TTC</span>
      <button className="btn acc s" onClick={()=>setF({designation:'',fournisseur:'',lot:'',montant:'',tva:'',dateCommande:'',livrPrevue:'',livrReelle:'',statut:'a_commander',notes:'',factures:[]})}>+ Commande</button>
    </div>
    {f&&<div className="card">
      <Fld label="DÉSIGNATION"><input className="in" placeholder="Menuiseries alu — 8 ouvrants" value={f.designation} onChange={e=>setF({...f,designation:e.target.value})}/></Fld>
      <div className="g2">
        <Fld label="FOURNISSEUR"><input className="in" value={f.fournisseur} onChange={e=>setF({...f,fournisseur:e.target.value})}/></Fld>
        <Fld label="MONTANT HT (€)"><input className="in" type="number" step="0.01" value={f.montant} onChange={e=>setF({...f,montant:e.target.value})}/></Fld>
      </div>
      <Fld label="TVA DE CETTE COMMANDE (%)">
        <input className="in" type="number" step="0.1" placeholder={'Chantier : '+tvaRate(ch)+' %'}
          value={f.tva===undefined||f.tva===null?'':f.tva} onChange={e=>setF({...f,tva:e.target.value})}/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>
          Laissez vide pour appliquer le taux du chantier ({tvaRate(ch)} %). Saisissez <b>10</b> en rénovation, <b>0</b> en autoliquidation.
          {f.montant>0&&<span> — soit <b>{eur(cmdTTC({montant:+f.montant,tva:f.tva},ch))}</b> TTC.</span>}
        </div>
      </Fld>
      <Fld label="LOT CONCERNÉ"><select className="in" value={f.lot} onChange={e=>setF({...f,lot:e.target.value})}><option value="">— aucun —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      <div className="g2">
        <Fld label="DATE DE COMMANDE"><input className="in" type="date" value={f.dateCommande} onChange={e=>setF({...f,dateCommande:e.target.value})}/></Fld>
        <Fld label="LIVRAISON PRÉVUE"><input className="in" type="date" value={f.livrPrevue} onChange={e=>setF({...f,livrPrevue:e.target.value})}/></Fld>
      </div>
      <Fld label="LIVRAISON RÉELLE"><input className="in" type="date" value={f.livrReelle} onChange={e=>setF({...f,livrReelle:e.target.value})}/></Fld>
      <Fld label="STATUT"><select className="in" value={f.statut} onChange={e=>setF({...f,statut:e.target.value})}>{CMD_ST.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Fld>
      <Fld label="DEVIS DU FOURNISSEUR">
        <FichiersDrive ch={ch} dossier="Matériaux" fichiers={f.devis} label="Importer le devis"
          onChange={v=>setF({...f,devis:v})}/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>Rangés dans Drive › {ch.nom} › Matériaux. PDF, Word ou photo.</div>
      </Fld>
      <Fld label={"FACTURES DU FOURNISSEUR — total "+eur(facturesTotal(f.factures))+" HT"}>
        {(f.factures||[]).map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center',flexWrap:'wrap'}}>
          <input className="in" type="number" step="0.01" placeholder="Montant HT €" value={x.montant} onChange={e=>updFacture(x.id,{montant:e.target.value})} style={{flex:'1 1 90px'}}/>
          <input className="in" type="date" value={x.date} onChange={e=>updFacture(x.id,{date:e.target.value})} style={{flex:'1 1 120px'}}/>
          {x.lien
            ?<span className="row" style={{gap:6,alignItems:'center',whiteSpace:'nowrap'}}><Transmis/>
              <a href={x.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Voir</a></span>
            :<label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>Importer<input type="file" accept={DOC_ACCEPT+',image/*'} style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importFacture(x.id,file)}}/></label>}
          <button className="btn dg s" onClick={()=>delFacture(x.id)}>✕</button>
        </div>)}
        <button className="btn gh s" onClick={addFacture}>+ Facture</button>
        {luFact&&luFact.motif&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
          Rien n'a pu être lu — {luFact.motif}. Montant et date à saisir à la main ; le fichier est bien envoyé sur le Drive.</div>}
        {luFact&&luFact.patch&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
          Lu sur la facture :{luFact.patch.montant!==undefined&&<span> montant <b>{eur(luFact.patch.montant)} HT</b></span>}
          {luFact.patch.date!==undefined&&<span> · date <b>{fd(luFact.patch.date)}</b></span>}. À vérifier.</div>}
        {f.montant>0&&<div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
          Commande {eur(f.montant)} HT — reste à facturer <b>{eur((+f.montant||0)-facturesTotal(f.factures))}</b> HT.</div>}
      </Fld>
      <Fld label="NOTES"><textarea className="in" rows="2" value={f.notes} onChange={e=>setF({...f,notes:e.target.value})}/></Fld>
      <DriveStatus/>
      <Acts onSave={ok} onCancel={()=>{setF(null);setLuFact(null)}} onDel={f.id?()=>{save({...data,commandes:data.commandes.filter(c=>c.id!==f.id)});setF(null)}:null}/>
    </div>}
    {!list.length&&!f&&<Empty>Aucune commande. Suivez ici les matériaux à approvisionner.</Empty>}
    {list.map(c=><LigneCmd key={c.id} c={c} ch={ch} onClick={()=>{setLuFact(null);setF(c.factures?c:{...c,factures:[]})}}/>)}
  </div>;
}

function LigneCmd({c,onClick,chantierNom,ch}){
  const s=CMD_ST.find(x=>x.id===c.statut)||CMD_ST[0];
  const retard=c.livrPrevue&&!c.livrReelle&&c.livrPrevue<today()&&c.statut!=='livre';
  return <button className="card" style={{borderLeft:'3px solid '+(retard?TERRA:s.c)}} onClick={onClick}>
    <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
      <span className="b sm">{c.designation}</span>
      <span className="pill" style={{background:(retard?TERRA:s.c)+'1A',color:retard?TERRA:s.c}}>{retard?'EN RETARD':s.label}</span>
    </div>
    <div className="xs mut" style={{marginTop:3}}>{chantierNom?chantierNom+' · ':''}{c.fournisseur||'fournisseur non précisé'}{c.lot?' · '+c.lot:''}</div>
    <div className="sp xs" style={{marginTop:8}}>
      <span>{eur(c.montant)} HT{ch?<span className="mut"> · {eur(cmdTTC(c,ch))} TTC (TVA {cmdTva(c,ch)} %)</span>:null}{(c.devis||[]).length?<span style={{color:GREEN}}> · ✓ {(c.devis||[]).length} devis</span>:null}</span>
      <span className="mut">{(c.factures||[]).length?'facturé '+eur(facturesTotal(c.factures))+' HT':(c.livrReelle?'livré le '+fd(c.livrReelle):c.livrPrevue?'prévu le '+fd(c.livrPrevue):'sans date')}</span>
    </div>
  </button>;
}

function CommandesGlob({data,open}){
  const [filtre,setFiltre]=useState('actives');
  const nom=id=>{const c=data.chantiers.find(x=>x.id===id);return c?c.nom:'—'};
  let L=[...data.commandes];
  if(filtre==='actives')L=L.filter(c=>c.statut!=='livre');
  if(filtre==='retard')L=L.filter(c=>c.livrPrevue&&!c.livrReelle&&c.livrPrevue<today()&&c.statut!=='livre');
  L.sort((a,b)=>(a.livrPrevue||'9999').localeCompare(b.livrPrevue||'9999'));
  const nR=data.commandes.filter(c=>c.livrPrevue&&!c.livrReelle&&c.livrPrevue<today()&&c.statut!=='livre').length;
  return <div>
    <H2>COMMANDES MATÉRIAUX</H2>
    {nR>0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {nR} livraison{nR>1?'s':''} en retard sur la date annoncée.</div>}
    <div className="row" style={{gap:8,marginBottom:12}}>
      {[['actives','En cours'],['retard','En retard'],['toutes','Toutes']].map(([id,l])=>
        <button key={id} className={'btn s '+(filtre===id?'':'gh')} onClick={()=>setFiltre(id)}>{l}</button>)}
    </div>
    {!L.length&&<Empty>Rien à afficher dans cette vue.</Empty>}
    {L.map(c=><LigneCmd key={c.id} c={c} chantierNom={nom(c.chantierId)} onClick={()=>open(c.chantierId)}/>)}
  </div>;
}

/* ---------------- PLANNING ---------------- */
function Planning({data,ch,up}){
  const js=ch.jalons||[];
  const [f,setF]=useState(null);
  const livr=data.commandes.filter(c=>c.chantierId===ch.id&&(c.livrPrevue||c.livrReelle))
    .map(c=>({type:'livr',id:c.id,label:'Livraison — '+c.designation,prevue:c.livrPrevue,reelle:c.livrReelle}));
  const items=[...js.map(j=>({...j,type:'jalon'})),...livr]
    .sort((a,b)=>((a.reelle||a.prevue)||'9999').localeCompare((b.reelle||b.prevue)||'9999'));
  const ok=()=>{
    if(!f.label)return;
    const n=f.id?js.map(j=>j.id===f.id?f:j):[...js,{...f,id:uid()}];
    up({jalons:n});setF(null);
  };
  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{js.length} jalon{js.length>1?'s':''} · {livr.length} livraison{livr.length>1?'s':''}</span>
      <div className="row" style={{gap:8}}>
        {!js.length&&<button className="btn gh s" onClick={()=>up({jalons:JALONS.map(l=>({id:uid(),label:l,prevue:'',reelle:''}))})}>Trame standard</button>}
        <button className="btn acc s" onClick={()=>setF({label:'',prevue:'',reelle:''})}>+ Jalon</button>
      </div>
    </div>
    {f&&<div className="card">
      <Fld label="ÉTAPE"><input className="in" list="jl" value={f.label} onChange={e=>setF({...f,label:e.target.value})}/>
        <datalist id="jl">{JALONS.map(j=><option key={j} value={j}/>)}</datalist></Fld>
      <div className="g2">
        <Fld label="DATE PRÉVUE"><input className="in" type="date" value={f.prevue} onChange={e=>setF({...f,prevue:e.target.value})}/></Fld>
        <Fld label="DATE RÉELLE"><input className="in" type="date" value={f.reelle} onChange={e=>setF({...f,reelle:e.target.value})}/></Fld>
      </div>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={f.id?()=>{up({jalons:js.filter(j=>j.id!==f.id)});setF(null)}:null}/>
    </div>}
    {!items.length&&!f&&<Empty>Aucune étape. « Trame standard » crée les 12 jalons d'une maison neuve.</Empty>}
    {items.map(i=>{
      const done=!!i.reelle, late=i.prevue&&!i.reelle&&i.prevue<today();
      const liv=i.type==='livr';
      return <div key={i.type+i.id} className="card sp" style={{borderLeft:'3px solid '+(done?GREEN:late?TERRA:RULE),padding:10,opacity:liv?.85:1}}
        onClick={()=>{if(!liv)setF(js.find(j=>j.id===i.id))}}>
        <span className="sm" style={{color:done?MUTED:INK,textDecoration:done?'line-through':'none'}}>
          {liv&&<span className="xs" style={{color:NAVY,marginRight:6}}>▸</span>}{i.label}</span>
        <span className="xs" style={{color:late?TERRA:MUTED,textAlign:'right',minWidth:74}}>
          {done?fd(i.reelle):late?'retard '+fd(i.prevue):fd(i.prevue)}</span>
      </div>;
    })}
  </div>;
}

/* ---------------- PIÈCES ---------------- */
function Docs({data,ch,up,save}){
  const d=ch.docs||{};
  const [busy,setBusy]=useState(null);
  const [signe,setSigne]=useState(null);
  const tog=id=>{const c=d[id]||{};up({docs:{...d,[id]:{...c,fait:!c.fait,date:!c.fait?today():''}}})};
  const lien=(id,v)=>up({docs:{...d,[id]:{...(d[id]||{}),lien:v}}});
  /* une pièce écrite tient rarement en un seul fichier : plans d'exécution en
     plusieurs planches, notice + annexes, marché + attestations. On garde donc
     une liste. L'ancien champ « lien » unique reste lu pour les pièces déjà
     attachées, et devient le premier élément de la liste. */
  const fichiersDe=r=>r.fichiers&&r.fichiers.length?r.fichiers
    :(r.lien?[{id:'ancien',nom:'Document',lien:r.lien}]:[]);
  const importPieces=async(id,files)=>{
    setBusy(id);
    let ajoutes=[], erreur='';
    try{
      const token=await getDriveToken();
      const folderId=await driveSousDossier(token,ch.id,ch.nom,'Pièces');
      for(const file of files){
        try{
          const{webViewLink}=await uploadToDrive(file,folderId);
          ajoutes.push({id:uid(),nom:file.name,lien:webViewLink});
        }catch(x){erreur=(x&&(x.error||x.message))||String(x)}
      }
    }catch(e){erreur=e&&e.error==='auth_required'?'auth_required':((e&&(e.error||e.message))||String(e))}
    if(ajoutes.length){
      const c=d[id]||{};
      up({docs:{...d,[id]:{...c,fichiers:[...fichiersDe(c),...ajoutes],fait:true,date:c.fait?c.date:today()}}});
    }
    if(erreur==='auth_required')alert("Connectez d'abord Google Drive (bouton ci-dessus), puis réessayez l'import.");
    else if(erreur)alert((ajoutes.length?ajoutes.length+" fichier(s) importé(s), mais l'envoi s'est interrompu — ":"Import Google Drive impossible — ")+"détail technique : "+erreur);
    setBusy(null);
  };
  const retirerFichier=(id,fid)=>{
    const c=d[id]||{};
    up({docs:{...d,[id]:{...c,fichiers:fichiersDe(c).filter(f=>f.id!==fid),lien:''}}});
  };
  const enregistrerSignature=async(doc,{nom,qualite,image})=>{
    const sid=uid(), date=new Date().toISOString();
    await Photo.put(sid,image);
    const empreinte=await empreinteSignature([ch.nom,doc.l,nom,qualite,date]);
    try{
      const blob=await (await fetch(image)).blob();
      const fichier=new File([blob],'signature-'+doc.id+'-'+date.slice(0,10)+'.jpg',{type:'image/jpeg'});
      const token=await getDriveToken();
      const folderId=await driveSignaturesFolder(token,ch.id,ch.nom);

    }catch(e){/* la signature reste enregistrée dans l'app même sans Drive */}

    up({docs:{...d,[doc.id]:{...c,signatures:[...(c.signatures||[]),{id:sid,nom,qualite,date,empreinte}]}}});

  };
  const retirerSignature=async(docId,sid)=>{
    if(!confirm('Retirer définitivement cette signature ?'))return;
    await Photo.del(sid).catch(()=>{});
    const c=d[docId]||{};
    up({docs:{...d,[docId]:{...c,signatures:(c.signatures||[]).filter(s=>s.id!==sid)}}});

    </div>
    {DOCS.map(x=>{const r=d[x.id]||{}, sgs=r.signatures||[];return <div key={x.id} className="card" style={{padding:10}}>
      <div className="row" style={{gap:10,alignItems:'flex-start'}}>
        <button className="chk" onClick={()=>tog(x.id)} style={{background:r.fait?GREEN:'#fff',borderColor:r.fait?GREEN:RULE}}>{r.fait?'✓':''}</button>
        <div style={{flex:1}}>

          {fichiersDe(r).map(f=><div key={f.id} className="row xs" style={{gap:8,marginTop:4,alignItems:'center'}}>
            <Transmis/>

            <button style={{color:MUTED,background:'none',border:'none',padding:0}} onClick={()=>{if(confirm('Retirer « '+f.nom+' » de cette pièce ? Le fichier reste sur le Drive.'))retirerFichier(x.id,f.id)}}>✕</button>
          </div>)}

              <input type="file" accept={PIECES_ACCEPT} multiple style={{display:'none'}} disabled={busy===x.id}
                onChange={e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)importPieces(x.id,fs)}}/>
            </label>
            <button className="xs" style={{color:NAVY,background:'none',border:'none',padding:0}} onClick={()=>setSigne(x)}>Faire signer</button>
          </div>
          {sgs.map(s=><div key={s.id} className="row" style={{gap:10,marginTop:8,paddingTop:8,borderTop:'1px solid '+RULE,alignItems:'center'}}>
            <VignetteSign id={s.id}/>

        </div>

    {signe&&<SignaturePad titre={signe.l+' — '+ch.nom} onAnnuler={()=>setSigne(null)} onSigner={v=>enregistrerSignature(signe,v)}/>}
  </div>;
}
