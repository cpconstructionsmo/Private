/* le logo de l'application, tel qu'il est servi à côté de la page */
let logoCache=null;
async function logoDocx(){
  if(logoCache)return logoCache;
  const r=await fetch('assets/logo.png');
  if(!r.ok)throw new Error('nologo');
  const b=new Uint8Array(await r.arrayBuffer());
  /* dimensions lues dans l'entête PNG, pour ne pas déformer l'image */
  const v=new DataView(b.buffer,b.byteOffset,b.byteLength);
  logoCache={data:b,w:v.getUint32(16),h:v.getUint32(20)};
  return logoCache;
}

async function fabriquerDocx(documentXml,titre,logo,qr,qrPlan){
  const enc=new TextEncoder();
  const entrees=[
    {nom:'[Content_Types].xml',data:enc.encode(DOCX_TYPES)},
    {nom:'_rels/.rels',data:enc.encode(DOCX_RELS)},
    {nom:'docProps/core.xml',data:enc.encode(docxCore(titre))},
    {nom:'word/_rels/document.xml.rels',data:enc.encode(docxDocRels(!!qr,!!qrPlan))},
    {nom:'word/styles.xml',data:enc.encode(DOCX_STYLES)},
    {nom:'word/document.xml',data:enc.encode(documentXml)},
  ];
  if(logo)entrees.push({nom:'word/media/logo.png',data:logo.data});
  if(qr)entrees.push({nom:'word/media/qr.png',data:qr.data});
  if(qrPlan)entrees.push({nom:'word/media/qr-plan.png',data:qrPlan.data});
  return zipEcrire(entrees);
}

async function genererMarcheDocx(d){
  let logo=null;
  try{logo=await logoDocx()}catch(e){/* sans logo, le marché reste valable */}
  let qr=null;
  try{qr=qrPourDocument(d.mapsUrl)}catch(e){/* sans localisation enregistrée, ou QR indisponible : le marché reste valable */}
  /* le plan d'exécution : l'artisan le récupère en scannant, plutôt que de
     réclamer un envoi. Sans plan déposé, le marché s'imprime comme avant. */
  let qrPlan=null;
  try{qrPlan=qrPourDocument(d.planExeUrl)}catch(e){/* sans plan déposé, ou QR indisponible : le marché reste valable */}
  const xml=marcheDocumentXml({...d,qr,qrPlan},logo);
  return fabriquerDocx(xml,'Marché de travaux n° '+(d.numero||'')+' — '+(d.lot||''),logo,qr,qrPlan);
}

/* ---------- dossier de présentation au client ----------
   Ce que le commercial pose sur la table : la page de garde, la notice
   technique du projet tel qu'il est envisagé, le coût prévisionnel, la mission
   de maîtrise d'œuvre et ce qui reste à la charge du client. Rien n'y engage
   un prix ferme — les mentions le disent, poste par poste. */
const MISSION_MOE=[
  'Esquisse et avant-projet (ESQ / APS / APD)',
  'Établissement du dossier de permis de construire (PC)',
  'Consultation des entreprises et établissement du dossier de consultation (DCE)',
  'Assistance à la passation des marchés de travaux',
  'Suivi et coordination de chantier',
  'Assistance aux opérations de réception (OPR / réception des travaux)',
];
/* la notice technique se tire de la fiche navette : chaque poste renseigné
   devient une ligne, suivie de « (envisagé) » qui dit son caractère indicatif */
function noticeTechnique(p){
  const L=[];
  navetteLignes(p&&p.navette).forEach(([lot,champs])=>{
    champs.forEach(([libelle,valeur])=>L.push(libelle+' : '+valeur));
  });
  ((p&&p.noticeLignes)||[]).filter(x=>(x.texte||'').trim()).forEach(x=>L.push(x.texte.trim()));
  return L;
}
function dossierDocumentXml(p,px,com){
  const puce=t=>par('•  '+t+' (envisagé)',{sz:18,ap:40,ind:200});
  const titre=t=>par(t,{b:true,sz:22,c:DOC_TERRA,sp:20,caps:true,av:220,ap:100,filet:DOC_TERRA});
  const hab=+(p.surfaceHabitable)||0, ann=+(p.surfaceAnnexes)||0;

  /* ---- 4. les produits retenus ---- */

/* ---------- mise au point technique, éditée en Word ----------
   Reprend la structure du modèle CP Constructions (SECTION 1 à 11) : ce que
   Loïc remplit sur la fiche part tel quel dans le compte-rendu. Un produit
   choisi dans le catalogue (ChoixProduit) est résolu par son nom et sa
   marque — pas par l'id stocké, qui n'a pas de sens pour le client. */
function mapLignes(ch,data){
  const m=ch.map||{};
  const out=[];
  const add=(titre,champs)=>{
    const L=champs.filter(([,v])=>Array.isArray(v)?v.length:(v||'').toString().trim());
    if(L.length)out.push([titre,L.map(([l,v])=>[l,Array.isArray(v)?v.join(', '):v])]);
  };
  const nomProduit=id=>{const p=(data.produits||[]).find(x=>x.id===id);
    return p?[p.nom,p.marque].filter(Boolean).join(' — '):''};

  add('2. Terrain, viabilisation et VRD',[
    ['Bornage du terrain',m.bornageFait],['Détail du bornage',m.bornageDetail],
    ['Accès chantier',m.accesChantier],['Attribution accès chantier',m.accesAttribution],
    ['Travaux préparatoires',m.travauxPrepa],['Autre travail préparatoire',m.travauxPrepaAutre],
    ['Attribution travaux préparatoires',m.travauxPrepaAttribution],
    ['Eau potable',m.eauPotable],['Demande à effectuer par',m.eauPotableDemandePar],
    ['Coffret électricité',m.elecCoffret],['Distance coffret → GTL',m.elecDistanceGtl],
    ['Posé par',m.elecPosePar],['Coût raccordement électrique',m.elecCout],
    ['Gaz',m.gaz],['Télécom / fibre',m.telecom],
    ['Eaux usées',m.eauxUsees],['Lot eaux usées',m.eauxUseesLot],
    ['Eaux pluviales',m.eauxPluviales],['Lot eaux pluviales',m.eauxPluvialesLot],
  ]);
  add('3. Gros-œuvre & substructure',[
    ['Fondations',m.fondations],['Précision fondations',m.fondationsAutre],
    ['Soubassement & plancher bas',m.soubassement],['Nombre de rangs (vide sanitaire)',m.vsRangs],
    ['Trappe d’accès fonte 60×60',m.vsTrappe?'Oui':''],['Cour anglaise',m.courAnglaise?'Oui':''],
    ['Hourdis',m.hourdis],['Plancher haut',m.plancherHaut],
    ['Piédroit au-dessus du plancher',m.piedroitPlancher],['Nombre de rangs (piédroit)',m.piedroitRangs],
    ['Appuis de fenêtre — modèle',nomProduit(m.appuisFenetreProduit)],

    ['Coloris des appuis de fenêtre',m.appuisCouleur],['Coloris des seuils',m.seuilsCouleur],
  ]);
  add('4. Charpente, couverture & zinguerie',[
    ['Charpente',m.charpenteType],['Charpente — photo / modèle',nomProduit(m.charpenteProduit)],
    ['Charpente aménageable au-dessus du garage',m.charpenteGarageAmenageable?'Oui':''],
    ['Caisson — sous-face',m.sousFaces],['Caisson sous-face — fiche produit',nomProduit(m.sousFacesProduit)],
    ['Coloris sous-faces',m.sousFacesColoris],
    ['Écran de sous-toiture HPV',m.ecranSousToiture?'Oui':''],
    ['Gouttières — modèle',m.gouttieres],['Gouttière — fiche produit',nomProduit(m.gouttieresProduit)],
    ['Coloris gouttières',m.gouttieresColoris],
    ['Coloris descente de gouttières',m.descenteGouttieresColoris],
    ['Fenêtre(s) de toit — modèle',m.fenetreToitModele],['Vitrage',m.fenetreToitVitrage],
    ['Raccords encastrés',m.fenetreToitRaccords?'Oui':''],['Volet roulant électrique',m.fenetreToitVolet?'Oui':''],
    ['Conduit de fumée',m.conduitFumee],
    ['Couverture — modèle',nomProduit(m.couvertureProduit)],['Coloris exact',m.couvertureColoris],
  ]);
  add('5. Menuiseries extérieures, façades & garage',[
    ['Porte d’entrée — modèle',nomProduit(m.porteEntreeProduit)],['Matériau porte d’entrée',m.porteEntreeMateriau],
    ['RAL intérieur',m.porteEntreeRalInt],['RAL extérieur',m.porteEntreeRalExt],['Vitrage porte d’entrée',m.porteEntreeVitrage],
    ['Menuiseries — matériau',m.menuiseriesMateriau],['Couleur menuiseries',m.menuiseriesCouleur],['RAL menuiseries',m.menuiseriesRal],
    ['Ouvrants',m.menuiseriesOuvrant],['Options de vitrage',m.vitrageOptions],['Verre sablé — localisation',m.verreSable],
    ['Coffres volets roulants',m.voletsCoffres],['Commande volets',m.voletsCommande],['Nombre',m.voletsNb],
    ['Centralisation volets',m.voletsCentralisation?'Oui':''],['Domotique',m.voletsDomotique?'Oui':''],['Marque domotique',m.voletsDomotiqueMarque],
    ['Porte de garage',m.porteGarageType],['Motorisation porte de garage',m.porteGarageMotorisation],['Finition porte de garage',m.porteGarageFinition],
    ['Seuil de porte de garage',m.seuilGarage],
    ['Enduit — finition',m.enduitFinition],['Couleur enduit',m.enduitCouleur],['Réf. nuancier enduit',m.enduitRefNuancier],
  ]);
  add('6. Plâtrerie, isolation & menuiseries intérieures',[
    ['Doublage périphérique',m.doublage],['Cloisons de distribution',m.cloisons],
    ['Isolation des combles',m.isolationCombles],['Épaisseur',m.isolationComblesEpaisseur],['R (m².K/W)',m.isolationComblesR],

    ['Baignoire',nomProduit(m.baignoireProduit)],['Receveur',nomProduit(m.receveurProduit)],
    ['Dimensions receveur',m.receveurDimensions],['Coloris receveur',m.receveurColoris],
    ['Douche',m.douche],['WC',m.wcType],['Lave-mains',m.laveMains?'Oui':''],
    ['Meuble vasque',nomProduit(m.meubleVasqueProduit)],['Largeur meuble vasque',m.meubleVasqueLargeur],
  ]);
  add('8. Chapes et revêtements de sols',[
    ['Chape',m.chapeType],['Carrelage — modèle',nomProduit(m.carrelageProduit)],
    ['Pièces traitées par l’entreprise',m.carrelageEntreprise],['Pièces réservées au maître d’ouvrage',m.carrelageReservees],
    ['Faïence — localisation',m.faienceLocalisation],['Surface',m.faienceSurface],['Hauteur de pose',m.faienceHauteur],['Faïence — lot',m.faienceLot],
  ]);
  const modifs=[['Terrain — travaux de préparation — VRD',m.modifTerrain],['Gros-œuvre',m.modifGrosOeuvre],
    ['Charpente — couverture — zinguerie',m.modifCharpente],['Menuiseries extérieures — façades',m.modifMenuiseriesExt],
    ['Cloisons de distribution — menuiseries intérieures',m.modifCloisons],
    ['Électricité — plomberie — sanitaires — chauffage',m.modifElecPlomberieChauffage],['Autres modifications',m.modifAutres]]
    .filter(([,v])=>(v||'').trim());
  if(modifs.length||m.incidenceUrbanisme)
    out.push(['9. Récapitulatif des modifications apportées au plan du permis initial',
      [...modifs,...(m.incidenceUrbanisme?[['Incidence sur l’autorisation d’urbanisme',
        m.incidenceUrbanisme+(m.incidenceObjet?' — '+m.incidenceObjet:'')]]:[])]]);
  if(m.droitImage)out.push(['11. Autorisation de diffusion d’images du chantier',[['Le maître d’ouvrage',m.droitImage]]]);
  return out;
}

/* Google compare l'adresse de retour au caractère près avec celle déclarée dans
   la console : « /Private/ » et « /Private/index.html » sont deux adresses
   différentes. On normalise pour n'en produire qu'une seule. */
const GOOGLE_REDIRECT_URI=location.origin+location.pathname.replace(/index\.html$/,'');

/* le jeton se garde entre les rechargements : après le retour de Google, l'app
   se recharge, et un jeton rangé pour la seule session serait déjà perdu. */
const jetonLu=k=>{try{return localStorage.getItem(k)||sessionStorage.getItem(k)}catch(e){return null}};
const jetonEcris=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}try{sessionStorage.setItem(k,v)}catch(e){}};
const jetonEfface=k=>{try{localStorage.removeItem(k)}catch(e){}try{sessionStorage.removeItem(k)}catch(e){}};

/* ce que Google a répondu la dernière fois : sans cela, un échec est muet et
   personne ne peut savoir pourquoi la connexion n'a pas abouti. */
let driveRetour=null;
function consumeDriveTokenFromUrl(){
  const h=String(location.hash||'').replace(/^#/,'');
  const q=String(location.search||'').replace(/^\?/,'');
  const params=new URLSearchParams(h||q);
  const token=params.get('access_token');
  const err=params.get('error');
  if(!token&&!err)return;
  if(token){
    const expiresIn=+(params.get('expires_in')||3600);
    jetonEcris('driveToken',token);
    jetonEcris('driveTokenExpiry',String(Date.now()+(expiresIn-60)*1000));
    driveRetour={ok:true};
  }else{
    driveRetour={ok:false,code:err,detail:params.get('error_description')||''};
  }
  try{history.replaceState(null,'',location.pathname+(h?location.search:''))}catch(e){}
}
consumeDriveTokenFromUrl();

/* Le dossier racine où tout est rangé. Les noms précédents sont conservés pour
   pouvoir retrouver les chantiers déjà déposés et les y ranger : renommer le
   dossier dans Drive ne doit pas couper l'application de son historique. */
const DRIVE_RACINE='CRM CP';
const DRIVE_RACINES_ANCIENNES=['CP Constructions Chantier','CP Constructions'];

async function driveChercherDossier(token,nom){
  const q=encodeURIComponent("name='"+String(nom).replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  return (j.files&&j.files.length)?j.files[0].id:'';
}

async function driveFolder(token){
  if(driveFolderId)return driveFolderId;
  let id=await driveChercherDossier(token,DRIVE_RACINE);
  if(!id){
    const c=await fetch('https://www.googleapis.com/drive/v3/files',{
      method:'POST',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({name:DRIVE_RACINE,mimeType:'application/vnd.google-apps.folder'}),
    });
    id=(await c.json()).id;
  }
  driveFolderId=id;
  return driveFolderId;
}

/* Vide les caches de dossiers : après un déplacement, les identifiants retenus
   en mémoire ne valent plus rien. */
function driveOublierDossiers(){
  driveFolderId=null;
  driveProspectsRacineId=null;
  [driveSubfolders,driveFacturesFolders,driveMarchesFolders,driveControlesFolders,

/* Range dans CRM CP tous les dossiers de chantier restés sous un ancien nom de
   racine. Un dossier Drive se déplace sans être copié : on ajoute le nouveau
   parent et on retire l'ancien, le contenu et les liens déjà enregistrés dans
   l'application restent valables. */
async function driveRangerAnciens(token){
  const cible=await driveFolder(token);
  const bilan={racine:DRIVE_RACINE,deplaces:[],anciens:[],erreurs:[]};
  for(const nom of DRIVE_RACINES_ANCIENNES){
    const vieux=await driveChercherDossier(token,nom);
    if(!vieux||vieux===cible)continue;
    bilan.anciens.push(nom);
    const q=encodeURIComponent("'"+vieux+"' in parents and trashed=false");
    const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,mimeType)&pageSize=1000',
      {headers:{Authorization:'Bearer '+token}});
    const j=await r.json();
    for(const f of (j.files||[])){
      try{
        const u=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id
          +'?addParents='+cible+'&removeParents='+vieux+'&fields=id',
          {method:'PATCH',headers:{Authorization:'Bearer '+token}});
        if(!u.ok)throw new Error('HTTP '+u.status);
        bilan.deplaces.push(f.name);
      }catch(e){bilan.erreurs.push(f.name+' — '+((e&&e.message)||String(e)))}
    }
  }
  driveOublierDossiers();
  return bilan;
}

async function driveFindOrCreateSubfolder(token,parentId,name){
  const safeName=name.replace(/'/g,"\\'");
  const q=encodeURIComponent(`name='${safeName}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parentId}' in parents`);
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(j.files&&j.files.length)return j.files[0].id;
  const c=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]}),
  });
  return(await c.json()).id;
}

/* ---------- envoi d'un mail avec pièces jointes, via l'API Gmail ----------
   Le même jeton Google que le Drive, avec en plus la permission gmail.send :
   toujours sans serveur, mais un vrai envoi cette fois — pas un brouillon
   à finir de composer. */
const u8aBase64=bytes=>{
  let bin=''; const pas=0x8000;
  for(let i=0;i<bytes.length;i+=pas)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+pas));
  return btoa(bin);
};
const base64Url=bytes=>u8aBase64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
/* le lien enregistré sur une pièce est un webViewLink ; l'identifiant du
   fichier, dont il faut repartir pour en retélécharger le contenu, s'en
   extrait — y compris pour des pièces déposées bien avant cette fonction */
const driveIdDepuisLien=lien=>{
  const m=String(lien||'').match(/\/d\/([^/]+)/)||String(lien||'').match(/[?&]id=([^&]+)/);
  return m?decodeURIComponent(m[1]):'';
};
async function driveFichierBytes(token,fileId){
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media',
    {headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error('Téléchargement depuis le Drive impossible');
  return new Uint8Array(await r.arrayBuffer());
}
/* un multipart/mixed écrit à la main : sujet, corps et pièces jointes en
   base64 — ce qu'un client de messagerie fabriquerait, sans en dépendre */
function mimeMessage({destinataire,cc,sujet,corps,pieces}){
  const lim='====cp'+Date.now()+'====';
  const motB64=s=>'=?UTF-8?B?'+u8aBase64(new TextEncoder().encode(s))+'?=';
  const decoupe=b64=>{const L=[];for(let i=0;i<b64.length;i+=76)L.push(b64.slice(i,i+76));return L};
  const entetes=[
    'To: '+destinataire,
    cc?'Cc: '+cc:null,
    'Subject: '+motB64(sujet),
    'MIME-Version: 1.0',
    'Content-Type: multipart/mixed; boundary="'+lim+'"',
  ].filter(Boolean);
  const corpsLignes=[
    '--'+lim,
    'Content-Type: text/plain; charset="UTF-8"',
    'Content-Transfer-Encoding: base64',
    '',
    ...decoupe(u8aBase64(new TextEncoder().encode(corps))),
  ];
  const piecesLignes=[];
  for(const p of (pieces||[])){
    piecesLignes.push('--'+lim,
      'Content-Type: '+p.type+'; name="'+p.nom+'"',
      'Content-Disposition: attachment; filename="'+p.nom+'"',
      'Content-Transfer-Encoding: base64','',
      ...decoupe(u8aBase64(p.data)));
  }
  return [...entetes,'',...corpsLignes,...piecesLignes,'--'+lim+'--',''].join('\r\n');
}
async function gmailEnvoyer(token,params){
  const raw=base64Url(new TextEncoder().encode(mimeMessage(params)));
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({raw}),
  });
  if(!r.ok){
    let msg=''; try{const j=await r.json(); msg=(j.error&&j.error.message)||''}catch(e){}
    throw new Error(msg||('Envoi échoué (HTTP '+r.status+')'));
  }
  return r.json();
}

function compress(file,max=900,q=.6){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*r); cv.height=Math.round(im.height*r);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

async function pdfText(file){
  if(typeof pdfjsLib==='undefined')throw new Error('Lecteur PDF non chargé — vérifiez votre connexion.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let txt='';
  for(let i=1;i<=Math.min(doc.numPages,8);i++){
    const page=await doc.getPage(i);
    const c=await page.getTextContent();

/* ---------- lecture des fichiers Word (.docx) ---------- */
/* Un .docx est un ZIP : on y prend word/document.xml et on le décompresse avec
   DecompressionStream, présent dans Safari depuis iOS 16.4 — aucune bibliothèque
   supplémentaire à charger. L'ancien .doc, binaire, ne se lit pas ainsi. */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')throw new Error('nodeflate');
  const flux=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(flux).arrayBuffer());
}
async function zipEntree(buf,cherche){
  const d=new DataView(buf), u=new Uint8Array(buf), dec=new TextDecoder('utf-8');
  /* le répertoire central se trouve par la fin : son marqueur est le dernier du fichier */
  let eocd=-1;
  for(let i=u.length-22;i>=0&&i>u.length-22-65558;i--)if(d.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('nozip');
  const n=d.getUint16(eocd+10,true);
  let p=d.getUint32(eocd+16,true);
  for(let k=0;k<n;k++){
    if(p+46>u.length||d.getUint32(p,true)!==0x02014b50)break;
    const methode=d.getUint16(p+10,true), tailleComp=d.getUint32(p+20,true);
    const lNom=d.getUint16(p+28,true), lExtra=d.getUint16(p+30,true), lCom=d.getUint16(p+32,true);
    const offset=d.getUint32(p+42,true);
    if(dec.decode(u.subarray(p+46,p+46+lNom))===cherche){
      if(d.getUint32(offset,true)!==0x04034b50)throw new Error('nozip');
      const debut=offset+30+d.getUint16(offset+26,true)+d.getUint16(offset+28,true);
      const data=u.subarray(debut,debut+tailleComp);
      return methode===0?data:await inflateRaw(data);
    }
    p+=46+lNom+lExtra+lCom;
  }
  throw new Error('nodoc');
}
const XML_ENT={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"};
const dexml=s=>String(s).replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z]+);/g,(m,e)=>{
  if(e[0]==='#')return String.fromCodePoint(e[1]==='x'||e[1]==='X'?parseInt(e.slice(2),16):parseInt(e.slice(1),10));
  return XML_ENT[e]!==undefined?XML_ENT[e]:m;
});
/* on écarte le texte supprimé en révision et les codes de champ : ils ne font pas
   partie du document tel qu'il se lit à l'écran. */
function texteDocumentXml(xml){

    .replace(/<w:del\b[\s\S]*?<\/w:del>/g,'')
    .replace(/<w:instrText[\s\S]*?<\/w:instrText>/g,'')
    .replace(/<w:(?:tab|br|cr)\b[^>]*\/?>/g,' ')
    .replace(/<\/w:(?:p|tc|tr)>/g,' ')
    .replace(/<[^>]+>/g,'');

/* un tableau se lit ligne par ligne : la version à plat perdrait les colonnes */
function lignesDocumentXml(xml){

    .replace(/<w:del\b[\s\S]*?<\/w:del>/g,'')
    .replace(/<w:instrText[\s\S]*?<\/w:instrText>/g,'')
    .replace(/<w:(?:tab|br|cr)\b[^>]*\/?>/g,' ')
    .replace(/<\/w:(?:p|tc)>/g,'\n')
    .replace(/<[^>]+>/g,'');

/* ---------- écriture d'un .docx ----------
   On ne fabrique pas un document : on reprend le vôtre et on n'y remplace que
   word/document.xml. Toutes les autres entrées du ZIP sont recopiées telles
   quelles, avec leur compression d'origine — en-tête, logo, polices, styles et
   pieds de page restent exactement ce qu'ils étaient. */
const CRC32=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}
  return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
})();

/* toutes les entrées du ZIP, données encore compressées telles qu'elles sont */
function zipEntrees(buf){
  const d=new DataView(buf), u=new Uint8Array(buf), dec=new TextDecoder('utf-8');
  let eocd=-1;
  for(let i=u.length-22;i>=0&&i>u.length-22-65558;i--)if(d.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('nozip');
  const n=d.getUint16(eocd+10,true);
  let p=d.getUint32(eocd+16,true);
  const out=[];
  for(let k=0;k<n;k++){
    if(p+46>u.length||d.getUint32(p,true)!==0x02014b50)throw new Error('nozip');
    const drapeaux=d.getUint16(p+8,true), methode=d.getUint16(p+10,true);
    const modif=d.getUint32(p+12,true), crc=d.getUint32(p+16,true);
    const tailleComp=d.getUint32(p+20,true), tailleBrute=d.getUint32(p+24,true);
    const lNom=d.getUint16(p+28,true), lExtra=d.getUint16(p+30,true), lCom=d.getUint16(p+32,true);
    const offset=d.getUint32(p+42,true);
    const nom=dec.decode(u.subarray(p+46,p+46+lNom));
    if(d.getUint32(offset,true)!==0x04034b50)throw new Error('nozip');
    const debut=offset+30+d.getUint16(offset+26,true)+d.getUint16(offset+28,true);
    out.push({nom,drapeaux,methode,modif,crc,tailleComp,tailleBrute,data:u.subarray(debut,debut+tailleComp)});
    p+=46+lNom+lExtra+lCom;
  }
  return out;
}

/* réécrit le ZIP en remplaçant les entrées nommées ; le reste est recopié octet
   pour octet, sans être décompressé ni recompressé. */
function zipReecrire(buf,remplacements){
  const enc=new TextEncoder();
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const morceaux=[], central=[];
  let offset=0, nb=0;
  for(const e of zipEntrees(buf)){
    const neuf=remplacements[e.nom];
    /* une entrée remplacée est écrite sans compression : rien à charger pour cela,
       et Word, Pages et LibreOffice lisent le STORE sans broncher. */
    const methode=neuf?0:e.methode;
    const data=neuf||e.data;
    const crc=neuf?CRC32(neuf):e.crc;
    const brute=neuf?neuf.length:e.tailleBrute;
    const drapeaux=e.drapeaux&~8; /* pas de descripteur après les données */
    const n=enc.encode(e.nom);
    const lfh=[...u32(0x04034b50),...u16(20),...u16(drapeaux),...u16(methode),...u32(e.modif),
      ...u32(crc),...u32(data.length),...u32(brute),...u16(n.length),...u16(0)];
    morceaux.push(new Uint8Array(lfh),n,data);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(drapeaux),...u16(methode),...u32(e.modif),
      ...u32(crc),...u32(data.length),...u32(brute),...u16(n.length),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(0),...u32(offset),...Array.from(n)]);
    offset+=lfh.length+n.length+data.length;
    nb++;
  }
  const cd=[].concat(...central), debutCD=offset;
  const eocd=[...u32(0x06054b50),...u16(0),...u16(0),...u16(nb),...u16(nb),
    ...u32(cd.length),...u32(debutCD),...u16(0)];
  morceaux.push(new Uint8Array(cd),new Uint8Array(eocd));
  const total=morceaux.reduce((s,m)=>s+m.length,0), out=new Uint8Array(total);
  let q=0;for(const m of morceaux){out.set(m,q);q+=m.length}
  return out;
}

/* fabrique un ZIP de toutes pièces, entrées non compressées */
function zipEcrire(entrees){
  const enc=new TextEncoder();
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const morceaux=[], central=[];
  let offset=0;
  for(const {nom,data} of entrees){
    const n=enc.encode(nom), crc=CRC32(data);
    const lfh=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(n.length),...u16(0)];
    morceaux.push(new Uint8Array(lfh),n,data);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(n.length),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(0),...u32(offset),...Array.from(n)]);
    offset+=lfh.length+n.length+data.length;
  }
  const cd=[].concat(...central), debutCD=offset;
  const eocd=[...u32(0x06054b50),...u16(0),...u16(0),...u16(entrees.length),...u16(entrees.length),
    ...u32(cd.length),...u32(debutCD),...u16(0)];
  morceaux.push(new Uint8Array(cd),new Uint8Array(eocd));
  const total=morceaux.reduce((s,m)=>s+m.length,0), out=new Uint8Array(total);
  let q=0;for(const m of morceaux){out.set(m,q);q+=m.length}
  return out;
}

const DOC_ACCEPT='application/pdf,.pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
async function lireDocument(file){
  const nom=(file.name||'').toLowerCase(), type=file.type||'';

function parseDateFr(s){
  const m=s.match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
  if(!m)return '';
  let[,j,mo,a]=m;
  if(a.length===2)a='20'+a;
  const d=new Date(+a,+mo-1,+j);
  if(isNaN(d)||+mo>12||+j>31)return '';
  return a+'-'+String(+mo).padStart(2,'0')+'-'+String(+j).padStart(2,'0');
}

/* accents et apostrophes typographiques tres variables d'un assureur a l'autre : on normalise avant de chercher */
const deaccent=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019]/g,"'").replace(/[\u00a0\u202f]/g,' ');
/* un n° de police s'arrete au premier mot de prose : on ne garde que les jetons contenant un chiffre
   (ou un bloc de 1 a 3 majuscules type « U 001 »), en ecartant les formes juridiques et petits mots */
const STOP_REF=['SA','SAS','SASU','SARL','EI','EURL','SCI','SCOP','ET','AU','DU','DE','LA','LE','EN','ES','NE','CE','SES','SON','PAR','SUR','EST','NON','RCS','TVA','SIRET','SIREN','APE','NAF','RUE','AV','BD','ZA','ZI','BP','CS'];
function cleanRef(s){
  const keep=[];
  for(const raw of String(s).trim().split(/\s+/)){
    /* une reference qui continue en chiffres ne le fait que par groupes de 3
       (« 145 071 551 », « AS 950 007 ») : tout autre nombre qui suit appartient
       deja au texte voisin — sur une attestation en colonnes, le numero de rue. */
    if(keep.length&&/^\d+$/.test(raw)&&raw.length!==3)break;
    const t=raw.replace(/^[:\-]+/,'').replace(/[.,;:)\]]+$/,'');
    if(!t)break;
    const hasDigit=/\d/.test(t);
    const shortAlpha=/^[A-Z]{1,3}$/.test(t)&&STOP_REF.indexOf(t)<0;
    if(!hasDigit&&!shortAlpha)break;
    if(hasDigit&&STOP_REF.indexOf(t.replace(/[^A-Z]/g,''))>=0&&t.replace(/[^A-Z]/g,''))break;
    keep.push(t);
    if(keep.join(' ').length>28)break;
  }
  return keep.join(' ').replace(/[.,;:]+$/,'');
}

/* lecture des surfaces sur un plan : ne marche que si le PDF a une couche texte

function analyseAttestation(txt){

    const derniere=toutes[toutes.length-1];

  }

  /* l'en-tete porte souvent le SIREN de l'agence d'assurance, jamais celui de

  const listeActivites=marqueur=>{

    return '';
  };
  out.activites=listeActivites(/activit(?:e|\u00e9)s?\s+(?:professionnelles?\s+)?(?:ou\s+missions\s+)?(?:suivantes?|garanties?)\s*[:\-]?\s*/)
             || listeActivites(/activit(?:e|\u00e9)s?\s+souscrites\s*[:\-]?\s*/);
  if(out.activites)out.champsTrouves.push('activites');
  return out;
}

/* ---------- lecture des marchés et des factures ---------- */
/* Un montant français s'écrit « 5 340,39 » ou « 5340.39 » selon le logiciel qui
   l'a produit : on ramène tout à un nombre avant de comparer quoi que ce soit. */
const NBFR="([0-9]{1,3}(?:[ \\u00a0\\u202f][0-9]{3})+(?:[.,][0-9]{1,2})?|[0-9]+(?:[.,][0-9]{1,2})?)";
const nombreFr=s=>{
  if(s===undefined||s===null)return null;
  const v=parseFloat(String(s).replace(/[   ]/g,'').replace(',','.'));
  return isNaN(v)?null:v;
};
const MOIS_FR=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
/* « En date du 03 Avril 2026 » : la date des marchés est écrite en toutes lettres */
function parseDateLongueFr(s){
  const t=deaccent(String(s||'')).toLowerCase();
  const m=t.match(new RegExp('(\\d{1,2})\\s*(?:er)?\\s+('+MOIS_FR.join('|')+')\\s+(\\d{4})'));
  if(!m)return '';
  return m[3]+'-'+String(MOIS_FR.indexOf(m[2])+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
}
const parseDateAny=s=>parseDateFr(String(s||''))||parseDateLongueFr(s);
/* taux de TVA légaux en France : on s'y recale, une décimale de lecture ne doit
   pas transformer 20 % en 19,9 % */
const TAUX_LEGAUX=[0,2.1,5.5,10,20];
const recaleTaux=t=>{
  if(t===null||t===undefined)return null;
  for(const l of TAUX_LEGAUX)if(Math.abs(t-l)<=0.3)return l;
  return Math.round(t*10)/10;
};
/* le taux réellement appliqué se déduit des montants — c'est plus sûr que le
   libellé imprimé : un marché en autoliquidation porte « TVA 20% » et 0,00 € de TVA. */
const tauxDeduit=(ht,ttc)=>(ht>0&&ttc!==null&&ttc>=0)?recaleTaux((ttc/ht-1)*100):null;
const memeMontant=(a,b)=>a!==null&&b!==null&&Math.abs(a-b)<=Math.max(0.05,Math.abs(b)*0.005);

/* Marché de travaux, modèle CP Constructions. Ne lit que les PDF qui portent une
   couche texte : un marché signé puis scanné n'en a pas, il faut l'original. */
function analyseMarche(txt){
  const t=deaccent(txt).replace(/\s+/g,' ');
  const r={numero:'',lot:'',artisan:'',montantHT:null,tva:null,montantTTC:null,date:'',
           numPolice:'',assureur:'',alertes:[],champs:[]};
  const pris=(k,v)=>{if(v!==null&&v!==undefined&&v!=='')r.champs.push(k);return v};

  let m=t.match(/Marche de travaux n\s*[°o]?\s*(\d{1,4})/i);
  if(m)r.numero=pris('numero',m[1]);
  m=t.match(/En date du ([^.]{6,40}?)(?:\s+(?:Marche|Entre|Devis|Nom|Lieu)\b|$)/i);
  if(m)r.date=pris('date',parseDateAny(m[1]));
  if(!r.date)r.date=pris('date',parseDateAny(t.slice(0,600)));

  /* le lot est titré sous le numéro ; sur certains marchés il n'est repris qu'au
     bandeau, sur d'autres il précède le montant de la ligne « lots suivants » */
  m=t.match(/lots suivants\s*:\s*([A-Za-z][^:]{2,60}?)\s*"?"?\s*[\d ]+[.,]\d{2}\s*[€E]/i);
  if(m&&!/^\s*$/.test(m[1]))r.lot=m[1].trim();
  if(!r.lot){
    m=t.match(/Marche de travaux n\s*[°o]?\s*\d{1,4}\s*(.{2,70}?)\s*(?:En date du|Entre le Maitre)/i);
    if(m)r.lot=m[1].replace(/En date du.*$/i,'').trim();
  }
  if(!r.lot){
    m=t.match(/(?:En date du [^.]{6,30}?)\s+([A-Z][A-Z \-'\/]{3,60}?)\s+Entre le Maitre/i);
    if(m)r.lot=m[1].trim();
  }
  r.lot=r.lot.replace(/[\-–—\s]+$/,'').replace(/^[\-–—\s]+/,'').trim();
  if(r.lot)r.champs.push('lot');

  /* raison sociale : uniquement celle qui suit « … l'Entreprise citée ci-dessous : »
     — le bandeau d'en-tête porte lui aussi le mot « Entreprise », en case à cocher. */
  const FIN_RS="(?=\\d{1,4}[,\\s]+(?:rue|impasse|route|avenue|bd|boulevard|chemin|place|za|zi|lieu)|\\b(?:Les|La|Le|ZA|ZI|Rue|Route|Impasse|Chemin|Avenue|Lieu)\\b|\\d{5}\\b|RC\\s*:|N\\s*[°o]\\s*(?:Qualification|de Police))";
  const RS="((?:SARL|SASU|SAS|SA|EURL|EI|SCI|SCOP|Ets|Etablissements)?\\s*[A-Z0-9][A-Za-z0-9'&.\\- ]{1,45}?)\\s*";
  m=t.match(new RegExp("ci-dessous\\s*:?\\s*Entreprise\\s+"+RS+FIN_RS,'i'))
   ||t.match(new RegExp("citee ci-dessous[^A-Za-z0-9]{0,4}Entreprise\\s+"+RS+FIN_RS,'i'));
  if(m)r.artisan=pris('artisan',m[1].replace(/\s+/g,' ').trim());

  m=t.match(/Police d'Assurance Decennale\s*:?\s*([^\s].{0,30}?)(?=\s*(?:Compagnie|Devis Quantitatif)|$)/i);
  if(m)r.numPolice=pris('numPolice',cleanRef(m[1]));
  m=t.match(/Compagnie\s*:?\s*([A-Za-z][A-Za-z0-9 &'\-\.]{1,40}?)(?=\s*(?:Devis Quantitatif|L'entreprise|Commentaire)|$)/i);
  if(m)r.assureur=pris('assureur',m[1].trim());

  const cherche=re=>{const x=t.match(new RegExp(re,'i'));return x?nombreFr(x[x.length-1]):null};
  r.montantHT=pris('montantHT',cherche("TOTAL\\s*H\\.?\\s*T\\.?\\s*[:€E]?\\s*"+NBFR));
  r.montantTTC=pris('montantTTC',cherche("TOTAL\\s*T\\.?\\s*T\\.?\\s*C\\.?\\s*[:€E]?\\s*"+NBFR));
  /* montant de la ligne « lots suivants », en secours du bloc récapitulatif */
  if(r.montantHT===null)r.montantHT=pris('montantHT',cherche("lots suivants\\s*:.{0,80}?"+NBFR+"\\s*[€E]\\s*H\\.?\\s*T"));
  const impr=t.match(/TVA\s*(\d{1,2}(?:[.,]\d)?)\s*%/i);
  const tvaImprimee=impr?nombreFr(impr[1]):null;
  const tvaMontant=cherche("TVA\\s*\\d{1,2}(?:[.,]\\d)?\\s*%\\s*[:€E]?\\s*"+NBFR);

  /* si le TTC manque mais que le montant de TVA est là, on le reconstitue */
  if(r.montantTTC===null&&r.montantHT!==null&&tvaMontant!==null)r.montantTTC=r.montantHT+tvaMontant;
  const deduit=tauxDeduit(r.montantHT,r.montantTTC);
  if(deduit!==null){
    r.tva=deduit; r.champs.push('tva');
    if(tvaImprimee!==null&&Math.abs(tvaImprimee-deduit)>0.3)
      r.alertes.push('Le contrat porte « TVA '+tvaImprimee+' % » mais les montants donnent '+deduit+' % — c’est le taux réellement appliqué qui est retenu.');
  }else if(tvaImprimee!==null){
    r.tva=recaleTaux(tvaImprimee); r.champs.push('tva');
  }
  if(r.montantHT!==null&&r.montantTTC!==null&&r.tva!==null&&!memeMontant(r.montantHT*(1+r.tva/100),r.montantTTC))
    r.alertes.push('HT, TVA et TTC ne se recoupent pas : à vérifier sur le contrat.');
  if(r.montantHT===null)r.alertes.push('Montant HT introuvable.');
  return r;
}

/* Facture d'artisan : chaque entreprise a sa mise en page, on s'accroche donc
   aux libellés de totaux plutôt qu'à une position. */
function analyseFacture(txt){
  const t=deaccent(txt).replace(/\s+/g,' ');
  const r={numero:'',date:'',montantHT:null,tva:null,montantTTC:null,emetteur:'',alertes:[],champs:[]};
  const cherche=re=>{const x=t.match(new RegExp(re,'i'));return x?nombreFr(x[x.length-1]):null};
  let m=t.match(/Facture\s*(?:n\s*[°o]?|num[eé]ro)?\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{1,19})/i);
  if(m&&/\d/.test(m[1])){r.numero=m[1].replace(/[.\-\/]+$/,'');r.champs.push('numero');}
  m=t.match(/(?:date(?:\s+de\s+facture)?|le)\s*[:\-]?\s*(\d{1,2}[\/\.\- ]\d{1,2}[\/\.\- ]\d{2,4})/i);
  r.date=parseDateAny(m?m[1]:'')||parseDateAny(t.slice(0,700));
  if(r.date)r.champs.push('date');

  r.montantTTC=cherche("(?:TOTAL\\s*T\\.?\\s*T\\.?\\s*C\\.?|MONTANT\\s*T\\.?T\\.?C\\.?|NET\\s*A\\s*PAYER|TOTAL\\s*A\\s*PAYER)\\s*[:€E]?\\s*"+NBFR);
  r.montantHT=cherche("(?:TOTAL\\s*H\\.?\\s*T\\.?|MONTANT\\s*H\\.?T\\.?|TOTAL\\s*HORS\\s*TAXES?)\\s*[:€E]?\\s*"+NBFR);
  if(r.montantHT!==null)r.champs.push('montantHT');
  if(r.montantTTC!==null)r.champs.push('montantTTC');
  const impr=t.match(/T\.?V\.?A\.?\s*(?:au taux de|a|:)?\s*(\d{1,2}(?:[.,]\d)?)\s*%/i);
  const tvaImprimee=impr?nombreFr(impr[1]):null;
  const tvaMontant=cherche("T\\.?V\\.?A\\.?\\s*(?:\\d{1,2}(?:[.,]\\d)?\\s*%)?\\s*[:€E]?\\s*"+NBFR);
  if(r.montantTTC===null&&r.montantHT!==null&&tvaMontant!==null)r.montantTTC=r.montantHT+tvaMontant;
  if(r.montantHT===null&&r.montantTTC!==null&&tvaImprimee!==null)r.montantHT=r.montantTTC/(1+tvaImprimee/100);
  const deduit=tauxDeduit(r.montantHT,r.montantTTC);
  if(deduit!==null){
    r.tva=deduit;r.champs.push('tva');
    if(tvaImprimee!==null&&Math.abs(tvaImprimee-deduit)>0.3)
      r.alertes.push('La facture porte « TVA '+tvaImprimee+' % » mais les montants donnent '+deduit+' %.');
  }else if(tvaImprimee!==null){r.tva=recaleTaux(tvaImprimee);r.champs.push('tva');}
  if(r.montantHT===null&&r.montantTTC===null)r.alertes.push('Aucun montant lisible sur cette facture.');
  /* sur autoliquidation la facture ne porte pas de TVA : ce n'est pas une anomalie */
  if(r.montantHT!==null&&r.montantTTC!==null&&r.tva!==null&&!memeMontant(r.montantHT*(1+r.tva/100),r.montantTTC))
    r.alertes.push('HT, TVA et TTC ne se recoupent pas : à vérifier sur la facture.');
  return r;
}

/* Devis d'honoraires de maîtrise d'œuvre : mêmes totaux qu'une facture, plus le
   pourcentage quand il est annoncé. Un « % » voisin du mot TVA n'en est pas un. */
function analyseHonoraires(txt){
  const r=analyseFacture(txt);
  r.pct=null;
  const t=deaccent(txt).replace(/\s+/g,' ');
  const MOTIFS=[
    "(\\d{1,2}(?:[.,]\\d{1,2})?)\\s*%\\s*(?:du|des|sur)\\s*(?:le\\s*|la\\s*)?(?:montant\\s+)?(?:total\\s+)?(?:des\\s+|du\\s+)?travaux",
    "(?:honoraires|remuneration|mission)[^.%]{0,60}?(\\d{1,2}(?:[.,]\\d{1,2})?)\\s*%",
    "taux\\s+(?:de\\s+)?(?:remuneration|honoraires)\\s*:?\\s*(\\d{1,2}(?:[.,]\\d{1,2})?)\\s*%"];
  for(const m of MOTIFS){
    const x=t.match(new RegExp(m,'i'));
    if(!x)continue;
    /* on écarte un pourcentage qui n'est en fait que le taux de TVA */
    const avant=t.slice(Math.max(0,x.index-24),x.index+x[0].length);
    if(/T\.?V\.?A\.?/i.test(avant))continue;
    const v=nombreFr(x[1]);
    if(v!==null&&v>0&&v<30){r.pct=v;r.champs.push('pct');break}
  }
  return r;
}

/* ---------- signature manuscrite ---------- */
/* empreinte du contexte signé : si le libellé du document, le chantier, le signataire
   ou l'horodatage sont modifiés après coup, l'empreinte ne correspond plus. */
async function empreinteSignature(parts){
  const txt=parts.join('|');
  if(!(window.crypto&&crypto.subtle))return '';
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16).toUpperCase();
}
const dateHeure=iso=>{
  if(!iso)return '—';
  const d=new Date(iso);
  return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
};

function load(){try{const r=localStorage.getItem(KEY);return r?nettoyer({...EMPTY,...JSON.parse(r)}):EMPTY}catch(e){return EMPTY}}

function Root(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined)return <div className="sm mut" style={{padding:40,textAlign:'center'}}>Chargement…</div>;
  if(!session)return <Login/>;

}

function Login(){
  const [email,setEmail]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
  const go=async e=>{
    e.preventDefault();

      <div className="xs mut" style={{marginBottom:20}}>Suivi de chantiers</div>
      <Fld label="EMAIL"><input className="in" type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)}/></Fld>
      <Fld label="MOT DE PASSE"><input className="in" type="password" autoComplete="current-password" value={pw} onChange={e=>setPw(e.target.value)}/></Fld>
      {err&&<div className="xs" style={{color:TERRA,marginBottom:12}}>{err}</div>}
      <button className="btn acc" style={{width:'100%'}} disabled={busy}>{busy?'Connexion…':'Se connecter'}</button>
    </form>
  </div>;
}

/* Un écran qui plante sans rien dire est indiscernable d'un bouton qui ne
   répond plus : « je ne peux plus ouvrir les chantiers » peut aussi bien
   vouloir dire « ça plante en silence ». Ce filet transforme l'un en l'autre —
   un message qu'on peut lire, avec un retour, plutôt qu'un écran figé. Seule
   une classe React peut intercepter une erreur de rendu : pas de hooks ici. */
class Secours extends React.Component{
  constructor(p){super(p);this.state={erreur:null}}
  static getDerivedStateFromError(erreur){return {erreur}}
  render(){
    if(this.state.erreur)return <div className="card" style={{borderLeft:'3px solid '+TERRA}}>
      <div className="b sm" style={{color:TERRA}}>Cet écran n’a pas pu s’afficher</div>
      <div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
        Une erreur technique l’a interrompu — {String((this.state.erreur&&this.state.erreur.message)||this.state.erreur)}.
        Revenez en arrière ; si cela se reproduit, ce message aide à comprendre pourquoi.
      </div>
      {this.props.onRetour&&<button className="btn gh s" style={{marginTop:10}} onClick={this.props.onRetour}>← Retour</button>}
    </div>;
    return this.props.children;
  }
}

function App({session}){
  const [data,setData]=useState(load);
  /* on arrive sur le tableau de bord : ce qui appelle une action se voit avant
     d'avoir à le chercher dossier par dossier */
  const [view,setView]=useState('tdb');
  const [open,setOpen]=useState(null);
  const [plus,setPlus]=useState(false);
  const [err,setErr]=useState(null);
  /* attente : lecture en cours — ok : contenu du serveur reçu — erreur : lecture impossible.
     Tant que le serveur n'a pas répondu, on n'écrit rien : sinon un appareil au cache vide
     (historique effacé, nouveau téléphone) écraserait tout le contenu enregistré. */
  const [chargement,setChargement]=useState('attente');
  const journal=useRef(creerJournalEcritures(20));

  const lire=()=>{
    setChargement('attente');
    return sb.from('app_data').select('data').eq('id','main').single()
      .then(({data:row,error})=>{
        if(error&&error.code!=='PGRST116'){setChargement('erreur');return}
        if(row&&row.data)setData(nettoyer({...EMPTY,...row.data}));
        setChargement('ok');
      })
      .catch(()=>setChargement('erreur'));
  };

  useEffect(()=>{
    let alive=true;
    sb.from('app_data').select('data').eq('id','main').single()
      .then(({data:row,error})=>{
        if(!alive)return;
        if(error&&error.code!=='PGRST116'){setChargement('erreur');return}
        if(row&&row.data)setData(nettoyer({...EMPTY,...row.data}));
        setChargement('ok');
      })
      .catch(()=>{if(alive)setChargement('erreur')});
    const channel=sb.channel('app_data_changes')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_data',filter:'id=eq.main'},payload=>{
        if(!payload.new||!payload.new.data)return;
        /* l'écho de notre propre enregistrement ne doit rien réécrire : il
           est déjà à l'écran, et il est peut-être déjà dépassé */
        if(journal.current.estDeNous(payload.new.updated_at))return;
        setData(nettoyer({...EMPTY,...payload.new.data}));
      })
      .subscribe();
    return ()=>{alive=false;sb.removeChannel(channel)};
  },[]);

  /* L'enregistrement est immédiat à l'écran et sur l'appareil ; l'envoi au
     serveur attend une courte pause. Écrire à chaque caractère saturait la
     liaison et, surtout, deux envois pouvaient se doubler en chemin : le
     plus ancien arrivant en dernier, le serveur gardait une version périmée.
     Un seul envoi à la fois, le suivant part quand le précédent est revenu. */
  const attente=useRef(null);
  const minuteur=useRef(null);
  const enVol=useRef(false);

  const envoyer=async()=>{
    if(minuteur.current){clearTimeout(minuteur.current);minuteur.current=null}
    if(enVol.current||attente.current===null)return;
    const next=attente.current; attente.current=null;
    enVol.current=true;
    const quand=horodatage();
    journal.current.noter(quand);
    const{error}=await sb.from('app_data').upsert({id:'main',data:next,updated_at:quand});
    enVol.current=false;
    setErr(error?"Synchronisation impossible — vérifiez votre connexion. Vos modifications restent enregistrées sur cet appareil.":null);
    if(attente.current!==null)envoyer();
  };

  /* quitter l'application ou la mettre en arrière-plan ne doit pas emporter
     une saisie encore en attente d'envoi */
  useEffect(()=>{
    const vider=()=>{if(attente.current!==null)envoyer()};
    const masquee=()=>{if(document.visibilityState==='hidden')vider()};
    window.addEventListener('beforeunload',vider);
    document.addEventListener('visibilitychange',masquee);
    return ()=>{window.removeEventListener('beforeunload',vider);document.removeEventListener('visibilitychange',masquee)};
  },[]);

  const save=brut=>{
    if(chargement!=='ok'){
      setErr("Vos données ne sont pas encore chargées depuis le serveur — modification annulée pour ne pas écraser le contenu enregistré. Rechargez la page une fois la connexion revenue.");
      return;
    }
    const next=nettoyer(brut);
    setData(next);
    try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){/* cache local best-effort */}
    attente.current=next;
    if(minuteur.current)clearTimeout(minuteur.current);
    minuteur.current=setTimeout(envoyer,600);
  };
  const ch=open?data.chantiers.find(c=>c.id===open):null;
  return <div>
    <header style={{background:NAVY,padding:'10px 16px',paddingTop:'calc(10px + env(safe-area-inset-top))'}}>
      <img src="assets/logo.png" alt="CP Constructions — Maîtrise d'œuvre" style={{height:38,width:'auto',maxWidth:'100%',objectFit:'contain',display:'block'}}/>
    </header>
    {chargement==='attente'&&<div className="xs" style={{background:'#EFECE6',color:MUTED,padding:'8px 16px'}}>Chargement de vos données…</div>}
    {chargement==='erreur'&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:'8px 16px',lineHeight:1.5}}>
      <b>Mode consultation.</b> Vos données n'ont pas pu être chargées depuis le serveur : ce que vous voyez vient de ce téléphone et peut être incomplet.
      Toute modification est bloquée tant que la connexion n'est pas rétablie, pour ne rien écraser.
      <button className="btn s" style={{marginLeft:8}} onClick={lire}>Réessayer</button>
    </div>}
    {err&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:'8px 16px'}}>{err}</div>}
    <main style={{padding:16}}>
      {/* la clé force un nouveau montage à chaque écran : après une erreur,
          revenir en arrière repart d'un état neuf plutôt que de rester figé */}
      <Secours key={ch?'ch:'+ch.id:'v:'+view} onRetour={ch?()=>setOpen(null):null}>
      {ch?<Fiche data={data} ch={ch} save={save} back={()=>setOpen(null)}/>
      :view==='tdb'?<TableauBord data={data} open={setOpen} allerA={v=>{setView(v);setOpen(null)}}/>
      :view==='prospects'?<Prospects data={data} save={save}/>
      :view==='biblio'?<Bordereaux data={data} save={save}/>
      :view==='produits'?<Produits data={data} save={save}/>
      :view==='fournisseurs'?<Fournisseurs data={data} save={save}/>

}

/* Le « + » qui déplie un détail juste sous la ligne : on reste où l'on est,
   sans remonter la page ni changer d'onglet. */
/* ---------- réordonner à la main ----------
   Le glisser-déposer HTML n'existe pas sur iPhone : on suit le doigt avec les
   événements « pointer », qui couvrent la souris et le tactile du même geste.
   On mesure le milieu de chaque rangée pour savoir devant laquelle on passe. */
function useGlisser(n,onOrdre){
  const refs=useRef([]);
  const [pris,setPris]=useState(-1);
  const etat=useRef({de:-1,vers:-1});
  refs.current.length=n;
  const saisir=(i,e)=>{
    e.preventDefault(); e.stopPropagation();
    etat.current={de:i,vers:i};
    setPris(i);
    const cible=e.currentTarget;
    try{cible.setPointerCapture(e.pointerId)}catch(x){}
    const bouger=ev=>{
      const y=ev.clientY;
      let v=etat.current.de;
      for(let k=0;k<refs.current.length;k++){
        const el=refs.current[k]; if(!el)continue;
        const r=el.getBoundingClientRect();
        if(y>r.top&&y<r.bottom){v=k;break}
        if(k===0&&y<=r.top)v=0;
        if(k===refs.current.length-1&&y>=r.bottom)v=k;
      }
      if(v!==etat.current.vers){etat.current.vers=v;setPris(v)}
    };
    const lacher=()=>{
      window.removeEventListener('pointermove',bouger);
      window.removeEventListener('pointerup',lacher);
      window.removeEventListener('pointercancel',lacher);
      const{de,vers}=etat.current;
      setPris(-1); etat.current={de:-1,vers:-1};
      if(de>=0&&vers>=0&&de!==vers)onOrdre(de,vers);
    };
    window.addEventListener('pointermove',bouger);
    window.addEventListener('pointerup',lacher);
    window.addEventListener('pointercancel',lacher);
  };
  const attacher=i=>el=>{refs.current[i]=el};
  return {pris,saisir,attacher};
}

/* reprend les coordonnées d'une fiche partagée depuis l'app Contacts de l'iPhone */
function ImportContact({onLu,label}){
  const [msg,setMsg]=useState('');
  const [aide,setAide]=useState(false);
  const lire=file=>{
    const r=new FileReader();
    r.onload=()=>{
      const c=lireVCard(String(r.result||''));
      const champs=[c.nom&&'nom',c.tel&&'téléphone',c.email&&'e-mail',c.adresse&&'adresse'].filter(Boolean);
      if(!champs.length){setMsg({t:'rien'});return}
      onLu(c);
      setMsg({t:'ok',champs,plusieurs:c.plusieurs});
    };
    r.onerror=()=>setMsg({t:'erreur'});
    r.readAsText(file);
  };
  return <div style={{marginBottom:12}}>
    <div className="row" style={{gap:8,flexWrap:'wrap',alignItems:'center'}}>
      <label className="btn gh s" style={{display:'inline-block',whiteSpace:'nowrap'}}>{label||'Importer depuis Contacts'}
        <input type="file" accept={VCARD_ACCEPT} style={{display:'none'}}
          onChange={e=>{const f=e.target.files[0];e.target.value='';setMsg('');if(f)lire(f)}}/></label>
      <button className="xs" style={{color:MUTED,background:'none',border:'none',padding:0}} onClick={()=>setAide(a=>!a)}>Comment faire ?</button>
    </div>
    {aide&&<div className="xs mut" style={{marginTop:6,lineHeight:1.6}}>
      Safari ne peut pas ouvrir votre carnet d'adresses : Apple ne l'autorise pour aucun site.
      On passe donc par la fiche du contact. Dans <b>Contacts</b> : ouvrez le contact →
      <b> Partager le contact</b> → <b>Enregistrer dans Fichiers</b>. Revenez ici, appuyez sur
      « {label||'Importer depuis Contacts'} » et choisissez la fiche (.vcf) que vous venez d'enregistrer.
    </div>}
    {msg&&msg.t==='ok'&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
      Fiche lue : {msg.champs.join(', ')} report{msg.champs.length>1?'és':'é'}. À vérifier avant d'enregistrer.
      {msg.plusieurs&&<span className="mut"> Le fichier contenait plusieurs contacts : le premier a été retenu.</span>}
    </div>}
    {msg&&msg.t==='rien'&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
      Aucune coordonnée trouvée dans ce fichier — ce n'est peut-être pas une fiche contact (.vcf).
    </div>}
    {msg&&msg.t==='erreur'&&<div className="xs" style={{marginTop:6,color:TERRA,lineHeight:1.5}}>Lecture du fichier impossible.</div>}
  </div>;
}

const QUALITES=['Client','Maître d’œuvre','Entreprise','Autre'];

function SignaturePad({titre,onAnnuler,onSigner}){
  const cv=useRef(null), trace=useRef(false), vide=useRef(true);
  const [nom,setNom]=useState('');
  const [qualite,setQualite]=useState('Client');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    const c=cv.current; if(!c)return;
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
    const x=c.getContext('2d');
    x.scale(dpr,dpr);
    x.fillStyle='#fff'; x.fillRect(0,0,r.width,r.height);
    x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle=INK;
  },[]);

  const pos=e=>{
    const r=cv.current.getBoundingClientRect();
    const p=e.touches&&e.touches[0]?e.touches[0]:e;
    return{x:p.clientX-r.left,y:p.clientY-r.top};
  };
  const down=e=>{e.preventDefault();trace.current=true;const{x,y}=pos(e);const c=cv.current.getContext('2d');c.beginPath();c.moveTo(x,y)};
  const move=e=>{if(!trace.current)return;e.preventDefault();const{x,y}=pos(e);const c=cv.current.getContext('2d');c.lineTo(x,y);c.stroke();vide.current=false};
  const up=()=>{trace.current=false};
  const effacer=()=>{
    const c=cv.current, r=c.getBoundingClientRect(), x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,r.width,r.height);
    vide.current=true; setErr('');
  };
  const valider=async()=>{
    if(!nom.trim()){setErr('Indiquez le nom du signataire.');return}
    if(vide.current){setErr('La signature est vide — signez dans le cadre.');return}
    setBusy(true);
    try{await onSigner({nom:nom.trim(),qualite,image:cv.current.toDataURL('image/jpeg',0.8)})}
    catch(e){setErr("Enregistrement impossible : "+((e&&e.message)||e));setBusy(false);return}
    setBusy(false);
  };

  return <div className="modal" style={{justifyContent:'center'}}>
    <div style={{background:'#fff',padding:16,maxWidth:520,width:'100%',margin:'auto',maxHeight:'100%',overflowY:'auto'}}>
      <div className="b" style={{color:NAVY}}>Signature</div>
      <div className="xs mut" style={{marginTop:3,marginBottom:12,lineHeight:1.4}}>{titre}</div>
      <div className="g2">
        <Fld label="NOM DU SIGNATAIRE"><input className="in" value={nom} onChange={e=>setNom(e.target.value)} placeholder="Mr et Mme Barbé"/></Fld>
        <Fld label="QUALITÉ"><select className="in" value={qualite} onChange={e=>setQualite(e.target.value)}>
          {QUALITES.map(q=><option key={q} value={q}>{q}</option>)}</select></Fld>
      </div>
      <span className="lbl">SIGNEZ DANS LE CADRE</span>
      <canvas ref={cv} style={{width:'100%',height:170,border:'1px dashed '+RULE,background:'#fff',touchAction:'none',display:'block'}}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}/>
      {err&&<div className="xs" style={{color:TERRA,marginTop:8}}>{err}</div>}
      <div className="xs mut" style={{marginTop:10,lineHeight:1.5}}>
        Signature manuscrite horodatée, conservée avec le document. Elle vaut commencement de preuve, mais ce n’est pas une
        signature électronique qualifiée : pour un engagement contractuel important, faites contresigner un exemplaire papier
        ou passez par un prestataire certifié.
      </div>
      <div className="row" style={{gap:8,marginTop:12}}>
        <button className="btn" onClick={valider} disabled={busy}>{busy?'Enregistrement…':'Valider la signature'}</button>
        <button className="btn gh" onClick={effacer} disabled={busy}>Effacer</button>
        <button className="btn gh" onClick={onAnnuler} disabled={busy}>Annuler</button>
      </div>
    </div>
  </div>;
}

/* import d'un fichier vers un sous-dossier Drive du chantier, avec lien de consultation */
function ImportFichier({ch,dossier,lien,onLien,label,accept}){
  const [busy,setBusy]=useState(false);
  const go=async file=>{
    setBusy(true);
    try{
      const token=await getDriveToken();
      const folderId=await driveSousDossier(token,ch.id,ch.nom,dossier);

/* Coche verte : la preuve, à l'écran, que le fichier est bien arrivé sur le Drive.
   Un lien enregistré ne s'obtient qu'après un envoi réussi. */
const Transmis=()=><span className="xs b" style={{color:GREEN,whiteSpace:'nowrap'}} title="Transmis sur Google Drive">✓ Drive</span>;

/* Liste de fichiers rattachés à une fiche et rangés dans un sous-dossier du
   chantier : import multiple, nom d'origine conservé, retrait sans suppression. */
function FichiersDrive({ch,dossier,fichiers,onChange,label,resoudre}){
  const [busy,setBusy]=useState(false);
  const L=fichiers||[];
  const importer=async files=>{
    setBusy(true);
    let ajoutes=[],erreur='';
    try{
      const token=await getDriveToken();
      /* un prospect n'a pas de chantier : il range ses pièces ailleurs */
      const folderId=resoudre?await resoudre(token):await driveSousDossier(token,ch.id,ch.nom,dossier);
      for(const file of files){
        try{
          const{webViewLink}=await uploadToDrive(file,folderId);
          ajoutes.push({id:uid(),nom:file.name,lien:webViewLink});
        }catch(x){erreur=(x&&(x.error||x.message))||String(x)}
      }
    }catch(e){erreur=e&&e.error==='auth_required'?'auth_required':((e&&(e.error||e.message))||String(e))}
    if(ajoutes.length)onChange([...L,...ajoutes]);
    if(erreur==='auth_required')alert("Connectez d'abord Google Drive (bouton ci-dessous), puis réessayez l'import.");
    else if(erreur)alert((ajoutes.length?ajoutes.length+" fichier(s) importé(s), mais l'envoi s'est interrompu — ":"Import Google Drive impossible — ")+"détail technique : "+erreur);
    setBusy(false);
  };
  return <div>
    {L.map(f=><div key={f.id} className="row xs" style={{gap:8,marginTop:4,alignItems:'center'}}>
      <Transmis/>
      <a href={f.lien} target="_blank" rel="noreferrer" style={{color:TERRA,flex:1,wordBreak:'break-word'}}>{f.nom}</a>
      <button style={{color:MUTED,background:'none',border:'none',padding:0}}
        onClick={()=>{if(confirm('Retirer « '+f.nom+' » ? Le fichier reste sur le Drive.'))onChange(L.filter(x=>x.id!==f.id))}}>✕</button>
    </div>)}
    <label className="btn gh s" style={{marginTop:6,display:'inline-block',whiteSpace:'nowrap'}}>
      {busy?'Import…':(L.length?'Ajouter des fichiers':(label||'Importer des fichiers'))}
      <input type="file" accept={PIECES_ACCEPT} multiple style={{display:'none'}} disabled={busy}
        onChange={e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)importer(fs)}}/>
    </label>
  </div>;
}

function DriveStatus({compte,onCompte}){
  const[connected,setConnected]=useState(driveConnected());
  const[aide,setAide]=useState(false);
  const[qui,setQui]=useState('');
  /* le refus de Google, s'il y en a eu un au dernier retour */
  const echec=driveRetour&&!driveRetour.ok?driveRetour:null;
  const standalone=driveDepuisEcranAccueil();
  /* Savoir dans quel Drive on écrit : à plusieurs sur un dossier commun, c'est
     la seule façon de voir qu'on s'est connecté au mauvais compte. */
  useEffect(()=>{
    let vivant=true;
    if(!connected){setQui('');return}
    driveCompteConnecte().then(m=>{if(vivant)setQui(m||'')}).catch(()=>{});
    return()=>{vivant=false};
  },[connected]);
  const attendu=(compte||'').trim().toLowerCase();
  const ecart=!!qui&&!!attendu&&qui.toLowerCase()!==attendu;
  return <div className="xs" style={{marginBottom:12,padding:'8px 10px',border:'1px solid '+RULE,background:'#fff'}}>
    <div className="sp">
      <span style={{color:connected?(ecart?TERRA:GREEN):(echec?TERRA:MUTED)}}>
        {connected?'✓ Google Drive connecté':'Google Drive non connecté'}</span>
      {connected
        ?<button className="btn gh s" onClick={()=>{disconnectDrive();setConnected(false)}}>Déconnecter</button>
        :<button className="btn acc s" onClick={startDriveAuth}>Connecter</button>}
    </div>
    {connected&&qui&&<div style={{marginTop:4}} className="mut">Compte connecté : <b>{qui}</b></div>}
    {ecart&&<div style={{marginTop:6,padding:'6px 8px',borderRadius:6,background:'#F6E2DC',
      borderLeft:'3px solid '+TERRA,color:'#8A2E14',lineHeight:1.5}}>
      <b>Ce n'est pas le Drive commun.</b> Vos fichiers partiraient dans le Drive de <b>{qui}</b> et
      personne d'autre ne les verrait. Déconnectez-vous et reconnectez-vous avec <b>{compte}</b>.
    </div>}
    {onCompte&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px solid '+RULE}}>
      <div className="mut" style={{marginBottom:4,lineHeight:1.5}}>
        Compte Google du Drive commun — chacun doit s'y connecter, sinon chaque appareil écrit dans son propre Drive.
      </div>
      <input className="in" type="email" placeholder="compte@gmail.com" value={compte||''}
        onChange={e=>onCompte(e.target.value)}/>
    </div>}
    {/* un refus se dit, avec son motif : sinon on revient sur l'app sans rien comprendre */}
    {!connected&&echec&&<div style={{marginTop:6,color:TERRA,lineHeight:1.5}}>
      Google a refusé la connexion — {DRIVE_MOTIFS[echec.code]||('code « '+echec.code+' »')}
      {echec.detail?<div className="mut" style={{marginTop:2}}>{echec.detail}</div>:null}
    </div>}
    {/* la cause la plus fréquente sur iPhone, invisible autrement */}
    {!connected&&standalone&&<div style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
      L'application est ouverte depuis l'écran d'accueil. Sur iPhone, la page de Google s'ouvre alors
      dans Safari et n'en revient pas : ouvrez le site <b>dans Safari</b> pour connecter le Drive,
      puis revenez ici — la connexion suit.
    </div>}
    {!connected&&<button className="btn gh s" style={{marginTop:8}} onClick={()=>setAide(!aide)}>
      {aide?'Masquer le diagnostic':'La connexion ne marche pas ?'}</button>}
    {aide&&<div className="mut" style={{marginTop:8,lineHeight:1.6}}>
      <div>Trois causes, dans l'ordre de fréquence :</div>
      <div style={{marginTop:6}}><b>1. Le compte Google n'est pas autorisé.</b> Si l'application Google
        est encore en mode « Test », seuls les comptes inscrits comme testeurs peuvent se connecter —
        les autres voient « accès bloqué ». Ajoutez le compte dans la console Google Cloud
        (Écran de consentement OAuth › Utilisateurs tests), ou publiez l'application.</div>
      <div style={{marginTop:6}}><b>2. L'adresse de retour n'est pas déclarée.</b> Elle doit figurer
        au caractère près dans « URI de redirection autorisés » :</div>
      <div style={{marginTop:4,padding:'6px 8px',background:'#F4F1EB',borderRadius:6,wordBreak:'break-all'}}>
        <b>{GOOGLE_REDIRECT_URI}</b></div>
      <div style={{marginTop:6}}><b>3. L'app est ouverte depuis l'écran d'accueil</b> (iPhone) :
        passez par Safari pour la connexion.</div>
      <div style={{marginTop:8}}>Identifiant de l'application :
        <span style={{wordBreak:'break-all'}}> {GOOGLE_CLIENT_ID}</span></div>
      <div style={{marginTop:6}}>Tout est déposé dans le dossier <b>{DRIVE_RACINE}</b> du Drive du compte connecté.</div>
    </div>}
  </div>;
}

/* ---------------- CHANTIERS ---------------- */
function Chantiers({data,save,open}){
  const [f,setF]=useState(null);
  const ok=()=>{
    if(!f.nom.trim())return;
    const r={...f,budget:+f.budget||0,budgetClientTTC:(f.budgetClientTTC===''||f.budgetClientTTC===undefined)?'':+f.budgetClientTTC,
      honorairesPct:+f.honorairesPct||0,honorairesMontant:f.honorairesMontant===''?'':+f.honorairesMontant};
    const nouveau=!f.id, id=f.id||uid();
    save({...data,chantiers:f.id?data.chantiers.map(c=>c.id===f.id?{...c,...r}:c):[...data.chantiers,{...r,id,docs:{},jalons:[]}]});
    setF(null);
    /* à la création, on prépare tout de suite le dossier Drive et ses sous-dossiers :
       sans cela ils n'apparaissent qu'au premier fichier déposé, et le dossier reste
       introuvable tant qu'on n'a rien envoyé. Silencieux si Drive n'est pas connecté. */
    if(nouveau)getDriveToken().then(t=>creerArborescence(t,id,r.nom)).catch(()=>{});
  };
  const eng=id=>data.marches.filter(m=>m.chantierId===id).reduce((s,m)=>s+(m.montantHT||0),0);
  const factu=id=>data.marches.filter(m=>m.chantierId===id).reduce((s,m)=>s+(m.facture||0),0);
  const [tri,setTri]=useState('signature');
  const TRIS=[['signature','Signature'],['nom','Nom'],['montant','Montant'],['avancement','Avancement']];
  const liste=[...data.chantiers].sort((a,b)=>{
    if(tri==='nom')return (a.nom||'').localeCompare(b.nom||'');
    if(tri==='montant')return eng(b.id)-eng(a.id);
    if(tri==='avancement'){
      const av=c=>{const e=eng(c.id)||budgetTravauxHT(c);return e?factu(c.id)/e:0};
      return av(b)-av(a);
    }
    // signature : les plus récents d'abord, ceux sans date à la fin
    const da=dateSignature(a,data.marches), db=dateSignature(b,data.marches);
    if(!da&&!db)return (a.nom||'').localeCompare(b.nom||'');
    if(!da)return 1;
    if(!db)return -1;
    return db.localeCompare(da);
  });
  return <div>
    <H2 action={<button className="btn acc s" onClick={()=>setF({nom:'',client:'',telClient:'',emailClient:'',adresse:'',adresseClient:'',lienDrive:'',budgetClientTTC:'',budget:'',honorairesPct:'',honorairesMontant:'',statut:'etude'})}>+ Chantier</button>}>CHANTIERS ({data.chantiers.length})</H2>
    {f&&<div className="card">
      <Fld label="NOM DU CHANTIER"><input className="in" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})} placeholder="Maison Barbé — Céaucé"/></Fld>
      <ImportContact label="Remplir depuis Contacts"
        onLu={c=>setF(p=>({...p,client:c.nom||p.client,telClient:c.tel||p.telClient,
          emailClient:c.email||p.emailClient||'',adresse:c.adresse||p.adresse}))}/>
      <div className="g2">
        <Fld label="CLIENT"><input className="in" value={f.client} onChange={e=>setF({...f,client:e.target.value})}/></Fld>
        <Fld label="TÉL. CLIENT"><input className="in" type="tel" value={f.telClient||''} onChange={e=>setF({...f,telClient:e.target.value})}/></Fld>
      </div>
      <Fld label="E-MAIL CLIENT"><input className="in" type="email" value={f.emailClient||''} onChange={e=>setF({...f,emailClient:e.target.value})}/></Fld>
      <Fld label="ADRESSE DES TRAVAUX"><input className="in" value={f.adresse} onChange={e=>setF({...f,adresse:e.target.value})} placeholder="Lot, lotissement, commune, parcelle…"/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>C'est elle qui figure sur les marchés de travaux : le lieu où l'on construit.</div></Fld>
      <Fld label="ADRESSE DU CLIENT"><input className="in" value={f.adresseClient||''} onChange={e=>setF({...f,adresseClient:e.target.value})} placeholder="Domicile actuel du client"/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>Son domicile, distinct du chantier — c'est là qu'il signe et qu'on lui écrit.</div></Fld>
      <Fld label="LOCALISATION (LIEN MAPS OU GPS)">
        <input className="in" placeholder="Lien Google Maps, ou 48.5123, -0.6234" value={f.lienMaps||''} onChange={e=>setF({...f,lienMaps:e.target.value})}/>
      </Fld>
      <div className="g2">
        <Fld label="SURFACE DE PLANCHER (m²)"><input className="in" type="number" step="0.01" value={f.surfacePlancher||''} onChange={e=>setF({...f,surfacePlancher:e.target.value})}/></Fld>
        <Fld label="SURFACE HABITABLE (m²)"><input className="in" type="number" step="0.01" value={f.surfaceHabitable||''} onChange={e=>setF({...f,surfaceHabitable:e.target.value})}/></Fld>
      </div>
      <Fld label="DOSSIER DRIVE DU CHANTIER"><input className="in" placeholder="Lien du dossier partagé…" value={f.lienDrive||''} onChange={e=>setF({...f,lienDrive:e.target.value})}/></Fld>
      <Fld label="BUDGET CLIENT TTC (€) — LE MONTANT ANNONCÉ AU CLIENT">
        <input className="in" type="number" value={f.budgetClientTTC||''} onChange={e=>setF({...f,budgetClientTTC:e.target.value})} placeholder="181500"/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>Tout compris : marchés de travaux, matériaux commandés en direct et honoraires de maîtrise d'œuvre.</div>
      </Fld>
      <div className="g2">
        <Fld label="BUDGET TRAVAUX HT (€) — ESTIMATION"><input className="in" type="number" value={f.budget} onChange={e=>setF({...f,budget:e.target.value})}/></Fld>
        <Fld label="HONORAIRES MOE (%)"><input className="in" type="number" step="0.1" value={f.honorairesPct} onChange={e=>setF({...f,honorairesPct:e.target.value})}/></Fld>
      </div>
      <Fld label="MONTANT HONORAIRES HT (€) — remplacer le calcul automatique">
        <input className="in" type="number" placeholder={'Auto : '+eur(f.budget*(f.honorairesPct||0)/100)} value={f.honorairesMontant||''} onChange={e=>setF({...f,honorairesMontant:e.target.value})}/>
      </Fld>
      <Fld label="PHASE"><select className="in" value={f.statut} onChange={e=>setF({...f,statut:e.target.value})}>
        {Object.entries(PHASE).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></Fld>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={f.id?()=>{save({...data,chantiers:data.chantiers.filter(c=>c.id!==f.id),marches:data.marches.filter(m=>m.chantierId!==f.id),photos:data.photos.filter(p=>p.chantierId!==f.id),commandes:data.commandes.filter(c=>c.chantierId!==f.id)});setF(null)}:null}/>
    </div>}
    {!data.chantiers.length&&!f&&<Empty>Aucun chantier. Ajoutez le premier avec « + Chantier ».</Empty>}
    {data.chantiers.length>1&&<div className="row" style={{gap:6,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
      <span className="xs mut">Trier par</span>
      {TRIS.map(([id,l])=><button key={id} className={'btn s '+(tri===id?'':'gh')} onClick={()=>setTri(id)}>{l}</button>)}
    </div>}
    <div className="grid-ch">
    {liste.map(c=>{
      const e=eng(c.id),fa=factu(c.id);
      const base=e||budgetTravauxHT(c);
      const av=base?Math.round(fa/base*100):0;
      /* on compare le TTC au TTC : le budget annoncé au client comprend tout */
      const co=coutOperation(c,data.marches.filter(m=>m.chantierId===c.id),data.commandes.filter(x=>x.chantierId===c.id));
      const bc=budgetClient(c);
      const nd=DOCS.filter(d=>c.docs&&c.docs[d.id]&&c.docs[d.id].fait).length;
      const np=data.photos.filter(p=>p.chantierId===c.id).length;
      const nKo=Object.values(c.controles||{}).filter(r=>r.statut==='non_conforme').length;
      return <button key={c.id} className="card" style={{borderLeft:'3px solid '+NAVY}} onClick={()=>open(c.id)}>
        <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
          <span className="b sm" style={{color:NAVY}}>{c.nom}</span>
          <span className="pill" style={{background:'rgba(44,74,94,.09)',color:NAVY}}>{PHASE[c.statut]}</span>
        </div>
        <div className="xs mut" style={{marginTop:3}}>{c.client}{c.adresse?' — '+c.adresse:''}</div>
        {dateSignature(c,data.marches)&&<div className="xs mut" style={{marginTop:3}}>Signé le {fd(dateSignature(c,data.marches))}</div>}
        {(c.surfacePlancher||c.surfaceHabitable)&&<div className="xs mut" style={{marginTop:3}}>
          {c.surfacePlancher?'SDP '+c.surfacePlancher+' m²':''}{c.surfacePlancher&&c.surfaceHabitable?' · ':''}{c.surfaceHabitable?'SHAB '+c.surfaceHabitable+' m²':''}
        </div>}
        <div className="sp" style={{marginTop:8,alignItems:'flex-end'}}>
          <span className="xs">Facturé <b>{eur(fa)}</b> / {eur(base)}</span>
          <span className="b" style={{fontSize:19,color:NAVY,lineHeight:1}}>{av} %</span>
        </div>
        <div className="bar"><div style={{height:4,width:Math.min(100,av)+'%',background:GREEN}}/></div>
        <div className="sp xs mut" style={{marginTop:6}}>
          {bc
            ?<span style={{color:co.totalTTC>bc?TERRA:MUTED}}>Engagé {eur(co.totalTTC)} / {eur(bc)} TTC</span>
            :<span>Budget client non renseigné</span>}
          <span>{nd}/{DOCS.length} pièces · {np} photo{np>1?'s':''}</span>
        </div>
        {nKo>0&&<div className="xs b" style={{color:TERRA,marginTop:4}}>{nKo} point{nKo>1?'s':''} de contrôle non conforme{nKo>1?'s':''}</div>}
      </button>;
    })}
    </div>
  </div>;
}

        <div className="g3 xs" style={{marginTop:10}}>
          <div><div className="mut">Marchés de travaux</div><div className="b">{eur(co.travTTC)}</div><div className="mut">{eur(co.travHT)} HT · {ms.length} lot{ms.length>1?'s':''}</div></div>
          <div><div className="mut">Matériaux commandés</div><div className="b">{eur(co.matTTC)}</div><div className="mut">{eur(co.matHT)} HT · {cmds.length} commande{cmds.length>1?'s':''}</div></div>
          <div><div className="mut">Honoraires MOE</div><div className="b">{eur(co.honoTTC)}</div><div className="mut">{eur(co.honoHT)} HT</div></div>
        </div>
        <div className="sp xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
          <span className="mut">Total engagé TTC</span>

        </div>
        {!!bc&&<div className="xs" style={{marginTop:8,lineHeight:1.5}}>
          {Math.round(co.totalTTC)===Math.round(bc)
            ?<span style={{color:GREEN}} className="b">Conforme au budget annoncé.</span>
            :co.totalTTC>bc
              ?<span style={{color:TERRA}} className="b">Dépassement de {eur(co.totalTTC-bc)} TTC sur le budget annoncé.</span>
              :<span style={{color:GREEN}} className="b">Marge de {eur(bc-co.totalTTC)} TTC sur le budget annoncé.</span>}
          {manque.length>0&&<div className="mut" style={{marginTop:4}}>Chiffre provisoire : il reste à arrêter {manque.join(', ')}.</div>}
        </div>}
      </div>
      <div className="g2 xs stats3" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <div><div className="mut">Avancement facturé</div>
          <div className="b" style={{fontSize:17,color:NAVY}}>{(eng||ch.budget)?Math.round(fac/(eng||ch.budget)*100):0} %</div>
          <div className="mut">facturé {eur(fac)} / {eur(eng||ch.budget)}</div></div>
        <div><div className="mut">Reste à facturer — artisans</div>
          <div className="b" style={{color:eng-fac>0?INK:GREEN}}>{eng-fac>0?eur(eng-fac)+' HT':'soldé'}</div>
          <div className="mut">engagé {eur(eng)}</div></div>
        <div><div className="mut">Reste à facturer — honoraires</div>
          <div className="b" style={{color:hono-honoFac>0?TERRA:GREEN}}>{hono-honoFac>0?eur(hono-honoFac)+' HT':'soldé'}</div>
          <div className="mut">{eur(honoTTCm(hono-honoFac,ch))} TTC</div></div>
      </div>
      <div className="xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        {jOuv===null
          ?<span className="mut">Délai de chantier : renseignez la date d'ouverture de chantier via « Modifier ».</span>
          :<div>
            <div className="sp">
              <span>Ouvert le <b>{fd(ch.dateOuverture)}</b> — <b>J+{jOuv}</b></span>
              <span style={{color:jOuv>dPrev?TERRA:MUTED}}>{jOuv>dPrev?'dépassement de '+(jOuv-dPrev)+' j':(dPrev-jOuv)+' j restants'}</span>

            <div className="bar"><div style={{height:4,width:Math.min(100,Math.round(jOuv/dPrev*100))+'%',background:jOuv>dPrev?TERRA:NAVY}}/></div>
            <div className="mut" style={{marginTop:4}}>Délai prévu : {dPrev} j (≈ {Math.round(dPrev/30.4)} mois)</div>
          </div>}
      </div>
      {(ch.surfacePlancher||ch.surfaceHabitable)&&<div className="g2 xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <div><div className="mut">Surface de plancher</div><div className="b">{ch.surfacePlancher?ch.surfacePlancher+' m²':'—'}</div></div>
        <div><div className="mut">Surface habitable</div><div className="b">{ch.surfaceHabitable?ch.surfaceHabitable+' m²':'—'}</div></div>
      </div>}
      {!maps&&<div className="xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <span className="lbl">LOCALISATION</span>

          <input className="in" style={{flex:1,padding:'6px 8px',fontSize:13}} placeholder="Lien Google Maps, ou 48.5123, -0.6234"

        </div>
        <div className="mut" style={{marginTop:5,lineHeight:1.5}}>Collez un lien Maps, des coordonnées GPS ou un nom de lieu — puis « Enregistrer » pour activer le bouton Itinéraire.</div>
      </div>}
      <div className="row xs" style={{gap:14,marginTop:10,flexWrap:'wrap'}}>
        {ch.telClient&&<a href={'tel:'+ch.telClient} style={{color:TERRA}}>Appeler le client</a>}
        {ch.telClient&&<a href={'https://wa.me/'+wa(ch.telClient)} style={{color:TERRA}}>WhatsApp</a>}
        {ch.emailClient&&<a href={'mailto:'+ch.emailClient} style={{color:TERRA}}>Écrire au client</a>}
        {maps
          ?<a href={maps} target="_blank" rel="noreferrer" style={{color:TERRA}}>Itinéraire</a>
          :mapsSearch&&<a href={mapsSearch} target="_blank" rel="noreferrer" className="mut">Chercher l'adresse</a>}
        {maps&&<button className="xs" style={{color:MUTED,background:'none',border:'none',padding:0}} onClick={()=>{if(confirm('Retirer la localisation enregistrée ?'))up({lienMaps:''})}}>Changer</button>}
        <BoutonDossierDrive ch={ch}/>
        <BoutonArborescence ch={ch}/>
        {ch.lienDrive&&<a href={ch.lienDrive} target="_blank" rel="noreferrer" style={{color:TERRA}}>Dossier partagé</a>}
      </div>
    </div>}
    <div className="tabs">
      {[['marches','MARCHÉS'],['factu','FACTURATION'],['hono','HONORAIRES'],['visite','VISITE TECH.'],['map','MAP'],['ctrl','CONTRÔLE'],['photos','PHOTOS'],['cmd','MATÉRIAUX'],['taches','TÂCHES'],['planning','PLANNING'],['docs','PIÈCES']].map(([id,l])=>
        <button key={id} className={'tab'+(tab===id?' on':'')} onClick={()=>setTab(id)}>{l}</button>)}
    </div>
    {tab==='marches'&&<Marches data={data} ch={ch} save={save} eng={eng} fac={fac}
      onFacturerCmd={id=>{setOuvrirCmd(id);setTab('cmd')}} onFacturerHono={()=>setTab('hono')}/>}
    {tab==='factu'&&<SuiviFacturation data={data} ch={ch}/>}
    {tab==='hono'&&<Honoraires data={data} ch={ch} save={save}/>}
    {tab==='visite'&&<VisiteTechnique ch={ch} up={up}/>}
    {tab==='map'&&<MAP data={data} ch={ch} up={up}/>}
    {tab==='ctrl'&&<Controles data={data} ch={ch} save={save}/>}
    {tab==='photos'&&<Photos data={data} ch={ch} save={save}/>}
    {tab==='cmd'&&<Commandes data={data} ch={ch} save={save} ouvrir={ouvrirCmd} onOuvert={()=>setOuvrirCmd(null)}/>}
    {tab==='taches'&&<Taches ch={ch} up={up}/>}
    {tab==='planning'&&<Planning data={data} ch={ch} up={up}/>}
    {tab==='docs'&&<Docs data={data} ch={ch} up={up} save={save}/>}
  </div>;
}

/* ---------------- MARCHÉS ---------------- */
const facturesTotal=list=>(list||[]).reduce((s,x)=>s+(+x.montant||0),0);

/* ---------- chiffrage d'un lot depuis un bordereau de prix ----------
   Le principe du serveur d'Hexaom : on ne retape pas un montant, on saisit des
   quantités en face d'articles dont le prix est déjà négocié, et le marché en
   découle. Le montant HT du lot n'est plus une saisie mais un résultat. */
function Quantitatif({data,f,setF,save,champ}){
  const champMontant=champ||'montantHT';
  const [ouvert,setOuvert]=useState(false);
  const [choix,setChoix]=useState('');
  const [servisSeuls,setServisSeuls]=useState(false);
  const [detail,setDetail]=useState('');
  const [verse,setVerse]=useState('');
  const B=data.bordereaux||[];
  const q=f.quantitatif;
  /* les bordereaux de l'artisan retenu d'abord : ce sont ses prix à lui */
  const dispo=f.artisanId?[...B.filter(b=>bordPourArtisan(b,f.artisanId)),...B.filter(b=>!bordPourArtisan(b,f.artisanId))]:B;
  const poser=id=>{
    const b=B.find(x=>x.id===id);if(!b)return;
    setF(p=>({...p,quantitatif:{bordereauId:b.id,nom:b.nom,
