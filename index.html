/* ---------------- MARCHÉS ---------------- */
const facturesTotal=list=>(list||[]).reduce((s,x)=>s+(+x.montant||0),0);

/* ---------- chiffrage d'un lot depuis un bordereau de prix ----------
   Le principe du serveur d'Hexaom : on ne retape pas un montant, on saisit des
   quantités en face d'articles dont le prix est déjà négocié, et le marché en
   découle. Le montant HT du lot n'est plus une saisie mais un résultat. */
function Quantitatif({data,f,setF,save}){
  const [ouvert,setOuvert]=useState(false);
  const [choix,setChoix]=useState('');
  const [servisSeuls,setServisSeuls]=useState(false);
  const [detail,setDetail]=useState('');
  const [verse,setVerse]=useState('');
  const B=data.bordereaux||[];
  const q=f.quantitatif;
  /* les bordereaux de l'artisan retenu d'abord : ce sont ses prix à lui */
  const dispo=f.artisanId?[...B.filter(b=>bordPourArtisan(b,f.artisanId)),...B.filter(b=>!bordPourArtisan(b,f.artisanId))]:B;
  const poser=id=>{
    const b=B.find(x=>x.id===id);if(!b)return;
    setF(p=>({...p,quantitatif:{bordereauId:b.id,nom:b.nom,
      lignes:(b.articles||[]).map(a=>({id:uid(),ref:a.id,code:a.code,libelle:a.libelle,unite:a.unite,pu:a.pu,qt:''}))},
      montantHT:0}));
    setOuvert(true);
  };
  /* le montant du lot suit toujours le quantitatif et la remise */
  const recale=(p,lignes)=>({...p,quantitatif:{...p.quantitatif,lignes},
    montantHT:quantitatifNet(lignes,remisePct(p))});
  const majL=(id,k,v)=>setF(p=>recale(p,p.quantitatif.lignes.map(l=>l.id===id?{...l,[k]:v}:l)));
  const majRemise=v=>setF(p=>({...p,remisePct:v===''?'':+v,
    montantHT:quantitatifNet((p.quantitatif||{}).lignes,v===''?0:+v)}));
  const ajouterLigne=()=>setF(p=>recale(p,[...p.quantitatif.lignes,
    {id:uid(),ref:'',code:'',libelle:'',unite:'U',pu:'',qt:''}]));
  const retirerLigne=id=>setF(p=>recale(p,p.quantitatif.lignes.filter(l=>l.id!==id)));
  const retirer=()=>setF(p=>({...p,quantitatif:undefined}));
  /* une ligne corrigée ici peut remonter dans le bordereau, pour ne pas la
     ressaisir au lot suivant. Ce n'est jamais automatique : c'est un geste. */
  const verserAuBordereau=l=>{
    if(!save||!q.bordereauId)return;
    const b=B.find(x=>x.id===q.bordereauId);if(!b)return;
    const A=b.articles||[];
    const existe=l.ref&&A.some(a=>a.id===l.ref);
    const articles=existe
      ?A.map(a=>a.id===l.ref?{...a,code:l.code,libelle:l.libelle,unite:l.unite,pu:+l.pu||0}:a)
      :[...A,{id:l.ref||uid(),code:l.code,libelle:l.libelle,unite:l.unite,pu:+l.pu||0}];
    save({...data,bordereaux:B.map(x=>x.id===b.id?{...x,articles,maj:today()}:x)});
    setVerse(l.id);
  };
  if(!q)return <Fld label="CHIFFRER CE LOT DEPUIS UN BORDEREAU">
    {B.length
      ?<div className="row" style={{gap:8,flexWrap:'wrap',alignItems:'center'}}>
        <select className="in" value={choix} onChange={e=>setChoix(e.target.value)} style={{flex:'1 1 200px'}}>
          <option value="">— aucun, je saisis le montant —</option>
          {dispo.map(b=><option key={b.id} value={b.id}>{b.nom} ({(b.articles||[]).length} articles)</option>)}
        </select>
        <button className="btn gh s" disabled={!choix} onClick={()=>poser(choix)}>Chiffrer</button>
      </div>
      :<div className="xs mut" style={{lineHeight:1.5}}>Aucun bordereau de prix. Importez un marché déjà rédigé depuis l'onglet ARTISANS,
        et vous pourrez ensuite chiffrer vos lots en saisissant seulement les quantités.</div>}
  </Fld>;
  /* la saisie se fait sur la liste entière : une ligne qui disparaît dès qu'on
     la laisse à zéro rendrait le chiffrage impraticable. Le repli est un choix. */
  const lignes=q.lignes||[], servies=lignes.filter(l=>ligneQt(l)>0);
  const vues=servisSeuls?servies:lignes;
  const brut=quantitatifHT(lignes), r=remisePct(f), net=quantitatifNet(lignes,r);
  return <Fld label={'QUANTITATIF — '+eur(net)+' HT'}>
    <div className="sp xs" style={{flexWrap:'wrap',gap:8,marginBottom:6}}>
      <span className="mut">{q.nom} — {servies.length} article{servies.length>1?'s':''} servi{servies.length>1?'s':''} sur {lignes.length}</span>
      <div className="row" style={{gap:10}}>
        <button className="btn gh s" onClick={()=>setOuvert(!ouvert)}>{ouvert?'Replier':'Saisir les quantités'}</button>
        <button className="btn dg s" onClick={retirer}>Retirer</button>
      </div>
    </div>
    <div className="row xs" style={{gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:8}}>
      <span className="mut">Remise négociée</span>
      <input className="in" type="number" step="0.1" placeholder="0" style={{padding:'3px 6px',fontSize:12,width:70,textAlign:'right'}}
        aria-label="Remise en pourcentage" value={f.remisePct===undefined||f.remisePct===null?'':f.remisePct}
        onChange={e=>majRemise(e.target.value)}/>
      <span className="mut">%</span>
      {r>0&&<span className="mut">— {eurc(brut)} moins {eurc(Math.round(brut*r)/100)} = <b style={{color:NAVY}}>{eurc(net)}</b></span>}
    </div>
    {ouvert&&<div>
      {servies.length>0&&<label className="xs mut row" style={{gap:6,marginBottom:6,alignItems:'center'}}>
        <input type="checkbox" checked={servisSeuls} onChange={e=>setServisSeuls(e.target.checked)}/>
        N'afficher que les {servies.length} articles servis</label>}
      {/* le libellé et son prix tiennent sur une ligne, la quantité et son total
          sur l'autre : sur un téléphone, rien ne sort de l'écran. */}
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,tableLayout:'fixed'}}>
        <tbody>{vues.map(l=><tr key={l.id} style={{borderBottom:'1px solid '+RULE}}>
          <td style={{padding:'6px 0'}}>
            <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
              <span style={{flex:1}}>{l.libelle||<span className="mut">sans libellé</span>}</span>
              <span className="row" style={{gap:6,alignItems:'center',whiteSpace:'nowrap'}}>
                <span className="mut">{eurc(l.pu)} / {l.unite}</span>
                <Plus actif={detail===l.id} titre="Modifier cette ligne" onClick={()=>setDetail(detail===l.id?'':l.id)}/>
              </span>
            </div>
            <div className="sp" style={{gap:8,alignItems:'center',marginTop:3}}>
              <span className="mut" style={{fontSize:11}}>{l.code}</span>
              <span className="row" style={{gap:8,alignItems:'center',whiteSpace:'nowrap'}}>
                <input className="in" type="number" step="0.001" placeholder="Qté" aria-label={'Quantité — '+(l.libelle||l.code)}
                  style={{padding:'3px 6px',fontSize:12,width:76,textAlign:'right'}}
                  value={l.qt===''||l.qt===undefined?'':l.qt} onChange={e=>majL(l.id,'qt',e.target.value===''?'':+e.target.value)}/>
                <span style={{minWidth:84,display:'inline-block',textAlign:'right'}}>
                  <span className="b" style={{color:ligneQt(l)?INK:MUTED}}>{ligneQt(l)?eurc(lignePT(l)):'—'}</span>
                  {/* la quantité s'écrit au millième, comme sur le marché imprimé */}
                  {ligneQt(l)>0&&<span className="mut" style={{fontSize:11,display:'block'}}>{nb3(l.qt)} {l.unite}</span>}
                </span>
              </span>
            </div>
            {detail===l.id&&<div style={{marginTop:6,padding:'8px 10px',background:'#F4F1EB',borderRadius:6,
              borderLeft:'3px solid '+TERRA}}>
              <div className="lbl">LIBELLÉ</div>
              <input className="in" style={{padding:'4px 6px',fontSize:12}} value={l.libelle||''}
                onChange={e=>majL(l.id,'libelle',e.target.value)}/>
              <div className="row" style={{gap:8,marginTop:6,flexWrap:'wrap'}}>
                <span style={{flex:'1 1 100px'}}><div className="lbl">CODE</div>
                  <input className="in" style={{padding:'4px 6px',fontSize:12,width:'100%'}} value={l.code||''}
                    onChange={e=>majL(l.id,'code',e.target.value)}/></span>
                <span style={{flex:'0 0 60px'}}><div className="lbl">UNITÉ</div>
                  <input className="in" style={{padding:'4px 6px',fontSize:12,width:'100%'}} value={l.unite||''}
                    onChange={e=>majL(l.id,'unite',artUnite(e.target.value))}/></span>
                <span style={{flex:'0 0 100px'}}><div className="lbl">PRIX UNITAIRE</div>
                  <input className="in" type="number" step="0.01" style={{padding:'4px 6px',fontSize:12,width:'100%',textAlign:'right'}}
                    value={l.pu===''||l.pu===undefined?'':l.pu} onChange={e=>majL(l.id,'pu',e.target.value===''?'':+e.target.value)}/></span>
              </div>
              <div className="row" style={{gap:12,marginTop:8,alignItems:'center',flexWrap:'wrap'}}>
                {save&&q.bordereauId&&<button className="btn gh s" onClick={()=>verserAuBordereau(l)}>
                  {verse===l.id?'Reporté ✓':'Reporter dans le bordereau'}</button>}
                <button className="btn dg s" onClick={()=>{setDetail('');retirerLigne(l.id)}}>Retirer la ligne</button>
              </div>
              <div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
                Ce qui est corrigé ici ne vaut que pour ce marché. « Reporter dans le bordereau » l'enregistre
                aussi dans la grille, pour tous les lots à venir.</div>
            </div>}
          </td>
        </tr>)}</tbody>
        <tfoot>
          {r>0&&<tr><td style={{padding:'6px 0'}}><div className="sp">
            <span className="mut">Sous-total</span><span className="mut">{eurc(brut)}</span></div></td></tr>}
          {r>0&&<tr><td style={{padding:'2px 0'}}><div className="sp">
            <span className="mut">Remise {r} %</span><span className="mut">− {eurc(Math.round(brut*r)/100)}</span></div></td></tr>}
          <tr style={{borderTop:'2px solid '+RULE}}>
            <td style={{padding:'8px 0'}}><div className="sp"><span className="b">TOTAL H.T.</span>
              <span className="b" style={{color:NAVY}}>{eurc(net)}</span></div></td>
          </tr>
        </tfoot>
      </table>
      <button className="btn gh s" style={{marginTop:8}} onClick={ajouterLigne}>+ Ligne</button>
      <div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>Le « + » d'une ligne ouvre son libellé, son code, son unité
        et son prix : tout se corrige ici, sans quitter le lot.</div>
    </div>}
  </Fld>;
}

function Marches({data,ch,save,eng,fac,onFacturerCmd,onFacturerHono}){
  const [f,setF]=useState(null);
  const [showImport,setShowImport]=useState(false);
  const [showLire,setShowLire]=useState(false);
  const [showFact,setShowFact]=useState(false);
  const ms=data.marches.filter(m=>m.chantierId===ch.id);
  const cmds=data.commandes.filter(c=>c.chantierId===ch.id);
  const openRow=m=>setF(m.factures?m:{...m,factures:m.facture?[{id:uid(),montant:m.facture,date:m.dateSignature||today(),lien:''}]:[]});
  const ok=()=>{
    if(!f.lot)return;
    const factures=f.factures||[];
    const r={...f,montantHT:+f.montantHT||0,tva:f.tva===''||f.tva===undefined||f.tva===null?'':+f.tva,
      remisePct:f.remisePct===''||f.remisePct===undefined||f.remisePct===null?'':+f.remisePct,
      factures,facture:facturesTotal(factures)};
    save({...data,marches:f.id?data.marches.map(m=>m.id===f.id?r:m):[...data.marches,{...r,id:uid(),chantierId:ch.id}]});
    setF(null);
  };
  /* pas de date du jour par défaut : une facture porte la sienne, et une date
     pré-remplie empêcherait la lecture du fichier de reporter la vraie. */
  const addFacture=()=>setF({...f,factures:[...(f.factures||[]),{id:uid(),montant:'',date:'',lien:'',numero:''}]});
  const updFacture=(fid,patch)=>setF(p=>({...p,factures:(p.factures||[]).map(x=>x.id===fid?{...x,...patch}:x)}));
  const delFacture=fid=>setF({...f,factures:(f.factures||[]).filter(x=>x.id!==fid)});
  /* à l'import d'une facture on la lit au passage : le montant et la date s'y
     trouvent, autant les reprendre plutôt que de les retaper. On ne remplit que
     ce qui est vide — une saisie de l'utilisateur n'est jamais écrasée. */
  const [luFacture,setLuFacture]=useState(null);
  const importFacture=async(fid,file)=>{
    let lu=null;
    if(!/^image\//.test(file.type||'')){
      try{
        const {txt,motif}=await lireDocument(file);
        if(txt){
          const a=analyseFacture(txt);
          const cible=(f.factures||[]).find(x=>x.id===fid)||{};
          const patch={};
          const ht=a.montantHT!==null?a.montantHT:(a.montantTTC!==null&&a.tva!==null?a.montantTTC/(1+a.tva/100):null);
          if(ht!==null&&(cible.montant===''||cible.montant===undefined||cible.montant===null))patch.montant=Math.round(ht*100)/100;
          if(a.date&&!cible.date)patch.date=a.date;
          if(a.numero&&!cible.numero)patch.numero=a.numero;
          if(Object.keys(patch).length){updFacture(fid,patch);lu={patch,a};}
          else lu={patch:null,a};
        }else lu={motif};
      }catch(e){/* lecture impossible : l'envoi sur le Drive reste prioritaire */}
    }
    setLuFacture(lu?{...lu,fid}:null);
    try{
      const token=await getDriveToken();
      const folderId=await driveFacturesFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      updFacture(fid,{lien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import de la facture impossible.");
    }
  };
  const importContrat=async file=>{
    try{
      const token=await getDriveToken();
      const folderId=await driveMarchesFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      setF({...f,contratLien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import du contrat impossible.");
    }
  };
  const nom=id=>{const a=data.artisans.find(x=>x.id===id);return a?a.nom:'Non attribué'};

  /* ---------- sortie du marché de travaux ----------
     Le modèle reste votre fichier : vous le désignez au moment de sortir le
     marché, il n'est ni copié ni stocké. Le document produit part sur le Drive
     du chantier et son lien se pose sur le lot. */
  const [sortie,setSortie]=useState(null);
  const numeroSuivant=()=>{
    const n=data.marches.filter(m=>m.chantierId===ch.id)
      .map(m=>+String(m.numeroMarche||'').replace(/\D/g,'')||0);
    return String(Math.max(0,...n)+1);
  };
  const sortirMarche=async()=>{
    const a=data.artisans.find(x=>x.id===f.artisanId)||null;
    const pb=controlerMarche(f,a,ch);
    if(marcheBloque(pb)){setSortie({etat:'refus',pb});return}
    setSortie({etat:'travail'});
    try{
      const ht=+f.montantHT||0, tx=marcheTva(f,ch), r=remisePct(f);
      const brut=f.quantitatif?quantitatifHT(f.quantitatif.lignes):ht;
      const numero=f.numeroMarche||numeroSuivant();
      const doc=await genererMarcheDocx({
        lot:f.lot, lotDetail:(f.quantitatif&&f.quantitatif.nom)||f.lot,
        numero, date:fd(f.dateSignature||today()),
        entreprise:a.nom||'', adresse:a.adresse||'', siret:a.siret||'',
        decennale:a.numPolice||'', compagnie:a.assureur||'',
        decennaleFin:a.decennaleFin?fd(a.decennaleFin):'',
        client:ch.client||'', clientAdresse:ch.adresseClient||'', clientTel:ch.telClient||'',
        chantierAdresse:ch.adresse||'', chantierNom:ch.nom||'',
        ht, brut, remise:r, tva:tx, tvaMontant:Math.round(ht*tx)/100, ttc:Math.round(ht*(100+tx))/100,
        lignes:((f.quantitatif||{}).lignes||[]).filter(l=>ligneQt(l)>0),
      });
      const nomFichier='Marché '+numero+' — '+(f.lot||'lot')+' — '+(a.nom||'entreprise')+'.docx';
      const fichier=new File([doc],nomFichier,
        {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      const token=await getDriveToken();
      const folderId=await driveMarchesFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(fichier,folderId);
      setF(p=>({...p,contratLien:webViewLink,numeroMarche:numero}));
      setSortie({etat:'ok',nom:nomFichier,lien:webViewLink,numero,pb});
    }catch(e){
      const c=String((e&&(e.error||e.message))||e);
      setSortie({etat:'erreur',msg:
        c==='auth_required'?"Le marché a été rédigé, mais Google Drive n'est pas connecté (bouton ci-dessous) — reconnectez-le puis relancez.":
        "Sortie impossible — "+c});
    }
  };

  /* un seul volet ouvert à la fois : la clé dit quelle ligne et quelle colonne */
  const [ouv,setOuv]=useState('');
  const [envoi,setEnvoi]=useState('');
  /* tout fichier déposé depuis ces volets part sur le Drive du chantier, dans
     son sous-dossier, et le lien est enregistré sur la ligne concernée. */
  const versDrive=async(file,dossier)=>{
    const token=await getDriveToken();
    const folderId=dossier==='Marchés'?await driveMarchesFolder(token,ch.id,ch.nom)
                  :dossier==='Factures'?await driveFacturesFolder(token,ch.id,ch.nom)
                  :await driveSousDossier(token,ch.id,ch.nom,dossier);
    return (await uploadToDrive(file,folderId)).webViewLink;
  };
  const envoyer=async(file,dossier,appliquer)=>{
    setEnvoi(file.name);
    try{appliquer(await versDrive(file,dossier))}
    catch(e){alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton en bas de l'onglet)."
      :"Envoi sur le Drive impossible — "+((e&&(e.error||e.message))||String(e)));}
    setEnvoi('');
  };
  const majMarche=(id,patch)=>save({...data,marches:data.marches.map(m=>m.id===id?{...m,...patch}:m)});
  const majCmd=(id,patch)=>save({...data,commandes:data.commandes.map(c=>c.id===id?{...c,...patch}:c)});
  const majCh=patch=>save({...data,chantiers:data.chantiers.map(c=>c.id===ch.id?{...c,...patch}:c)});
  const joindreContrat=(id,file)=>envoyer(file,'Marchés',lien=>majMarche(id,{contratLien:lien}));
  const joindreFactureMarche=(id,fid,file)=>envoyer(file,'Factures',lien=>{
    const m=data.marches.find(x=>x.id===id)||{};
    majMarche(id,{factures:(m.factures||[]).map(x=>x.id===fid?{...x,lien}:x)});
  });
  const joindreFactureCmd=(id,fid,file)=>envoyer(file,'Factures',lien=>{
    const c=data.commandes.find(x=>x.id===id)||{};
    majCmd(id,{factures:(c.factures||[]).map(x=>x.id===fid?{...x,lien}:x)});
  });
  const joindreFactureHono=(fid,file)=>envoyer(file,'Honoraires',lien=>
    majCh({honoFactures:(ch.honoFactures||[]).map(x=>x.id===fid?{...x,lien}:x)}));
  const joindreDevisCmd=(id,file)=>envoyer(file,'Matériaux',lien=>{
    const c=data.commandes.find(x=>x.id===id)||{};
    majCmd(id,{devis:[...(c.devis||[]),{id:uid(),nom:file.name,lien}]});
  });
  const joindreDevisHono=file=>envoyer(file,'Honoraires',lien=>
    majCh({devisHono:{nom:file.name,lien,date:today()}}));
  return <div>
    {envoi&&<div className="xs" style={{color:NAVY,marginBottom:8}}>Envoi de « {envoi} » sur le Drive…</div>}
    <div className="sp" style={{marginBottom:12,flexWrap:'wrap',gap:8}}>
      <span className="xs mut">{ms.length} lot{ms.length>1?'s':''} — facturé {eur(fac)} / {eur(eng)}</span>
      <div className="row" style={{gap:8,flexWrap:'wrap'}}>
        <button className="btn gh s" onClick={()=>{setShowLire(!showLire);setShowImport(false);setShowFact(false)}}>Lire des contrats</button>
        <button className="btn gh s" onClick={()=>{setShowFact(!showFact);setShowLire(false);setShowImport(false)}}>Lire des factures</button>
        <button className="btn gh s" onClick={()=>{setShowImport(!showImport);setShowLire(false);setShowFact(false)}}>Import rapide</button>
        <button className="btn acc s" onClick={()=>setF({lot:'',artisanId:'',montantHT:'',statut:'consulter',dateSignature:'',notes:'',factures:[],contratLien:''})}>+ Lot</button>
      </div>
    </div>
    {showLire&&<LireMarches data={data} ch={ch} save={save} close={()=>setShowLire(false)}/>}
    {showFact&&<LireFactures data={data} ch={ch} save={save} close={()=>setShowFact(false)}/>}
    {showImport&&<ImportMarches data={data} ch={ch} save={save} close={()=>setShowImport(false)}/>}
    {f&&<div className="card">
      <Fld label="CORPS D'ÉTAT"><input className="in" list="corps-list" value={f.lot} onChange={e=>setF({...f,lot:e.target.value})} placeholder="Ex. Maçonnerie — Gros œuvre"/>
        <datalist id="corps-list">{CORPS.map(c=><option key={c} value={c}/>)}</datalist></Fld>
      <Fld label="ARTISAN"><select className="in" value={f.artisanId} onChange={e=>setF({...f,artisanId:e.target.value})}><option value="">— non attribué —</option>{data.artisans.map(a=><option key={a.id} value={a.id}>{a.nom} ({a.corps})</option>)}</select></Fld>
      <div className="g2">
        <Fld label="MONTANT MARCHÉ HT (€)"><input className="in" type="number" value={f.montantHT} disabled={!!f.quantitatif}
          onChange={e=>setF({...f,montantHT:e.target.value})} style={f.quantitatif?{background:'#F2EFE9'}:null}/></Fld>
        <Fld label="TVA DE CE LOT (%)">
          <input className="in" type="number" step="0.1" placeholder={'Chantier : '+tvaRate(ch)+' %'} value={f.tva===undefined||f.tva===null?'':f.tva} onChange={e=>setF({...f,tva:e.target.value})}/>
        </Fld>
      </div>
      <div className="xs mut" style={{marginTop:-6,marginBottom:12,lineHeight:1.5}}>
        {f.quantitatif
          ?<span>Le montant est celui du quantitatif ci-dessous : il se recalcule à chaque quantité saisie. </span>
          :<span>Laissez la TVA vide pour appliquer le taux du chantier ({tvaRate(ch)} %). Saisissez <b>0</b> pour un artisan en franchise de TVA ou en autoliquidation. </span>}
        {f.montantHT>0&&<span>— soit <b>{eur(marcheTTC({montantHT:+f.montantHT,tva:f.tva},ch))}</b> TTC.</span>}
      </div>
      <Quantitatif data={data} f={f} setF={setF} save={save}/>
      <Fld label="STATUT"><select className="in" value={f.statut} onChange={e=>setF({...f,statut:e.target.value})}>{STATUTS.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Fld>
      <Fld label="DATE DE SIGNATURE"><input className="in" type="date" value={f.dateSignature} onChange={e=>setF({...f,dateSignature:e.target.value})}/></Fld>
      <Fld label="CONTRAT DE MARCHÉ (PDF)">
        {f.contratLien
          ?<div className="row" style={{gap:14,alignItems:'center',flexWrap:'wrap'}}>
            <Transmis/>
            <a href={f.contratLien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir le contrat</a>
            <label className="xs" style={{color:NAVY}}>Remplacer<input type="file" accept={PIECES_ACCEPT} style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importContrat(file)}}/></label>
          </div>
          :<label className="xs" style={{color:NAVY}}>Importer le contrat<input type="file" accept={PIECES_ACCEPT} style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importContrat(file)}}/></label>}
      </Fld>
      {(()=>{
        const a=data.artisans.find(x=>x.id===f.artisanId)||null;
        const pb=controlerMarche(f,a,ch);
        const stop=marcheBloque(pb);
        const chiffre=!!(f.quantitatif&&(f.quantitatif.lignes||[]).some(l=>ligneQt(l)>0));
        return <Fld label={'SORTIR LE MARCHÉ DE TRAVAUX'+(f.numeroMarche?' — N° '+f.numeroMarche:'')}>
          <div className="xs mut" style={{lineHeight:1.5}}>
            Le contrat est rédigé ici, avec vos couleurs, ses clauses, l'adresse des travaux
            et le quantitatif du lot, puis déposé dans Drive › Marchés. Aucun modèle à fournir.
          </div>
          {/* ce qui manque se dit avant, pas après signature */}
          {pb.length>0&&<div style={{marginTop:8,padding:'8px 10px',borderRadius:8,
            background:stop?'#F6E2DC':'#FBF3E2',borderLeft:'3px solid '+(stop?TERRA:AMBER)}}>
            <div className="xs b" style={{color:stop?TERRA:AMBER}}>
              {stop?'Le marché ne peut pas être émis en l’état :':'À vérifier avant signature :'}</div>
            {pb.map((x,i)=><div key={i} className="xs" style={{marginTop:3,lineHeight:1.5,
              color:x.bloquant?TERRA:MUTED}}>{x.bloquant?'• ':'· '}{x.texte}</div>)}
          </div>}
          <div className="row" style={{gap:14,alignItems:'center',flexWrap:'wrap',marginTop:8}}>
            <button className={'btn s '+(stop?'gh':'acc')} disabled={stop||(sortie&&sortie.etat==='travail')}
              style={{whiteSpace:'nowrap',opacity:stop?.5:1}} onClick={sortirMarche}>
              {sortie&&sortie.etat==='travail'?'Rédaction…':'Rédiger le marché et l’envoyer sur le Drive'}</button>
            <input className="in" style={{padding:'4px 8px',fontSize:12,width:110}} placeholder="N° du marché"
              aria-label="Numéro du marché" value={f.numeroMarche||''} onChange={e=>setF({...f,numeroMarche:e.target.value})}/>
          </div>
          {!chiffre&&!stop&&<div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
            Ce lot n'est pas chiffré : le marché sortira avec son contrat et ses totaux, sans détail d'articles.</div>}
          {sortie&&sortie.etat==='ok'&&<div className="xs" style={{marginTop:8,color:GREEN,lineHeight:1.5}}>
            Marché n° {sortie.numero} rédigé et déposé sur le Drive.{' '}
            <a href={sortie.lien} target="_blank" rel="noreferrer" style={{color:TERRA}}>Ouvrir le document</a>
            <div className="mut" style={{marginTop:2,wordBreak:'break-word'}}>{sortie.nom}</div>
            <div className="mut" style={{marginTop:2}}>À relire avant signature.</div></div>}
          {sortie&&sortie.etat==='erreur'&&<div className="xs" style={{marginTop:8,color:TERRA,lineHeight:1.5}}>{sortie.msg}</div>}
        </Fld>;
      })()}
      <Fld label="NOTES"><textarea className="in" rows="2" value={f.notes} onChange={e=>setF({...f,notes:e.target.value})}/></Fld>
      <Fld label={"FACTURES — total "+eur(facturesTotal(f.factures))}>
        {(f.factures||[]).map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center'}}>
          <input className="in" type="number" placeholder="Montant €" value={x.montant} onChange={e=>updFacture(x.id,{montant:e.target.value})} style={{flex:'1 1 90px'}}/>
          <input className="in" type="date" value={x.date} onChange={e=>updFacture(x.id,{date:e.target.value})} style={{flex:'1 1 120px'}}/>
          {x.lien
            ?<span className="row" style={{gap:6,alignItems:'center',whiteSpace:'nowrap'}}><Transmis/>
              <a href={x.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Voir</a></span>
            :<label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>Importer<input type="file" accept={DOC_ACCEPT+',image/*'} style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importFacture(x.id,file)}}/></label>}
          <button className="btn dg s" onClick={()=>delFacture(x.id)}>✕</button>
        </div>)}
        <button className="btn gh s" onClick={addFacture}>+ Facture</button>
        {luFacture&&luFacture.motif&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
          Rien n'a pu être lu — {luFacture.motif}. Le montant et la date sont à saisir à la main ; le fichier est bien envoyé sur le Drive.</div>}
        {luFacture&&luFacture.patch&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
          Lu sur la facture :{luFacture.patch.montant!==undefined&&<span> montant <b>{eur(luFacture.patch.montant)} HT</b></span>}
          {luFacture.patch.date!==undefined&&<span> · date <b>{fd(luFacture.patch.date)}</b></span>}
          {luFacture.a.tva!==null&&<span className="mut"> (TVA {luFacture.a.tva} % sur la facture)</span>}. À vérifier.
          {luFacture.a.alertes.map((x,i)=><div key={i} style={{color:AMBER}}>{x}</div>)}</div>}
        {luFacture&&luFacture.patch===null&&<div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
          Facture lue, mais montant et date étaient déjà saisis : rien n'a été modifié.</div>}
      </Fld>
      <DriveStatus/>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={f.id?()=>{save({...data,marches:data.marches.filter(m=>m.id!==f.id)});setF(null)}:null}/>
    </div>}
    {!ms.length&&!f&&<Empty>Aucun lot. Ajoutez les corps d'état à consulter, ou utilisez « Import rapide ».</Empty>}
    {!!ms.length&&<div>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,tableLayout:'fixed'}}>
        <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
          <th style={{padding:'6px 4px'}}>Entreprise</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Marché de travaux</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Factures</th>
        </tr></thead>
        <tbody>
          {ms.map(m=>{
            const st=STATUTS.find(x=>x.id===m.statut);
            const art=data.artisans.find(a=>a.id===m.artisanId);
            const kE='m-ent:'+m.id, kD='m-doc:'+m.id;
            return <React.Fragment key={m.id}>
              <tr style={{borderBottom:'1px solid '+RULE,verticalAlign:'top'}}>
                {/* à gauche l'entreprise et son corps de métier */}
                <td style={{padding:'8px 4px'}}>
                  <div className="row" style={{gap:6,alignItems:'flex-start'}}>
                    <button onClick={()=>setOuv(ouv===kE?'':kE)} className="b"
                      style={{textAlign:'left',background:'none',border:'none',padding:0,color:NAVY,cursor:'pointer',flex:1}}>
                      {nom(m.artisanId)}</button>
                    <Plus actif={ouv===kE} titre="Voir l’entreprise" onClick={()=>setOuv(ouv===kE?'':kE)}/>
                  </div>
                  <div className="mut" style={{marginTop:2}}>{m.lot}</div>
                  {st&&<div style={{color:st.c,marginTop:2}}>{st.label}</div>}
                  <button onClick={()=>openRow(m)} style={{background:'none',border:'none',padding:0,marginTop:2,color:TERRA,cursor:'pointer',textAlign:'left'}}>Modifier le lot ›</button>
                </td>
                {/* au centre le marché lui-même */}
                <td style={{padding:'8px 4px',textAlign:'right'}}>
                  <div className="row" style={{gap:6,justifyContent:'flex-end',alignItems:'center'}}>
                    <span className="b" style={{whiteSpace:'nowrap'}}>{eur(m.montantHT)} HT</span>
                    {m.contratLien&&<span style={{color:GREEN}} title="Marché sur le Drive">✓</span>}
                    <Plus actif={ouv===kD} titre="Voir le marché de travaux" onClick={()=>setOuv(ouv===kD?'':kD)}/>
                  </div>
                  <div className="mut" style={{marginTop:2,whiteSpace:'nowrap'}}>{eur(marcheTTC(m,ch))} TTC · TVA {marcheTva(m,ch)} %</div>
                  <div className="mut" style={{marginTop:2,whiteSpace:'nowrap'}}>{m.dateSignature?'signé le '+fd(m.dateSignature):'non signé'}</div>
                  {m.quantitatif&&<div className="mut" style={{marginTop:2,whiteSpace:'nowrap'}}>
                    chiffré — {(m.quantitatif.lignes||[]).filter(l=>ligneQt(l)>0).length} articles</div>}
                  {remisePct(m)>0&&<div className="mut" style={{marginTop:2,whiteSpace:'nowrap'}}>
                    remise {remisePct(m)} % sur {eur(quantitatifHT((m.quantitatif||{}).lignes))}</div>}
                </td>
                {/* à droite chaque facture, une par une */}
                <td style={{padding:'8px 4px'}}>
                  <ColFactures liste={m.factures} engage={+m.montantHT||0} ouv={ouv} setOuv={setOuv}
                    cle={'m-fac:'+m.id} onLien={(fid,file)=>joindreFactureMarche(m.id,fid,file)}/>
                </td>
              </tr>
              {ouv===kE&&<Volet cols={3}><FicheEntreprise a={art}/></Volet>}
              {ouv===kD&&<Volet cols={3}>
                <div className="lbl">MARCHÉ DE TRAVAUX SIGNÉ</div>
                {m.contratLien
                  ?<div className="row xs" style={{gap:12,alignItems:'center',flexWrap:'wrap',marginTop:4}}><Transmis/>
                    <a href={m.contratLien} target="_blank" rel="noreferrer" style={{color:TERRA}}>Ouvrir le marché</a>
                    <label style={{color:NAVY,cursor:'pointer'}}>Remplacer
                      <input type="file" accept={PIECES_ACCEPT} style={{display:'none'}}
                        onChange={e=>{const x=e.target.files[0];e.target.value='';if(x)joindreContrat(m.id,x)}}/></label></div>
                  :<label className="xs" style={{color:NAVY,cursor:'pointer',display:'block',marginTop:4}}>
                    Importer le marché — il part sur le Drive › Marchés
                    <input type="file" accept={PIECES_ACCEPT} style={{display:'none'}}
                      onChange={e=>{const x=e.target.files[0];e.target.value='';if(x)joindreContrat(m.id,x)}}/></label>}
              </Volet>}
            </React.Fragment>;
          })}
        </tbody>
      </table>
    </div>}
    {!!cmds.length&&<div style={{marginTop:18}}>
      <div className="h2" style={{marginBottom:8}}>ACHATS DE MATÉRIAUX</div>
      <div className="xs mut" style={{marginBottom:8,lineHeight:1.5}}>
        Achetés en direct, hors marchés de travaux. Ils se facturent comme un lot : le « + » ouvre les devis et les justificatifs.
      </div>
      <div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,tableLayout:'fixed'}}>
          <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
            <th style={{padding:'6px 4px'}}>Fournisseur</th>
            <th style={{padding:'6px 4px',textAlign:'right'}}>Commande</th>
            <th style={{padding:'6px 4px',textAlign:'right'}}>Factures</th>
          </tr></thead>
          <tbody>
            {cmds.map(c=>{
              const kE='c-ent:'+c.id, kD='c-doc:'+c.id, dv=c.devis||[];
              const stc=CMD_ST.find(x=>x.id===c.statut);
              return <React.Fragment key={c.id}>
                <tr style={{borderBottom:'1px solid '+RULE,verticalAlign:'top'}}>
                  <td style={{padding:'8px 4px'}}>
                    <div className="row" style={{gap:6,alignItems:'flex-start'}}>
                      <button onClick={()=>setOuv(ouv===kE?'':kE)} className="b"
                        style={{textAlign:'left',background:'none',border:'none',padding:0,color:NAVY,cursor:'pointer',flex:1}}>
                        {c.fournisseur||'Fournisseur non précisé'}</button>
                      <Plus actif={ouv===kE} titre="Voir la commande" onClick={()=>setOuv(ouv===kE?'':kE)}/>
                    </div>
                    <div className="mut" style={{marginTop:2}}>{c.designation}</div>
                    {stc&&<div style={{color:stc.c,marginTop:2}}>{stc.label}</div>}
                    {onFacturerCmd&&<button onClick={()=>onFacturerCmd(c.id)}
                      style={{background:'none',border:'none',padding:0,marginTop:2,color:TERRA,cursor:'pointer',textAlign:'left'}}>Modifier l'achat ›</button>}
                  </td>
                  <td style={{padding:'8px 4px',textAlign:'right'}}>
                    <div className="row" style={{gap:6,justifyContent:'flex-end',alignItems:'center'}}>
                      <span className="b" style={{whiteSpace:'nowrap'}}>{eur(c.montant)} HT</span>
                      {dv.length>0&&<span style={{color:GREEN}} title="Devis sur le Drive">✓</span>}
                      <Plus actif={ouv===kD} titre="Voir les devis" onClick={()=>setOuv(ouv===kD?'':kD)}/>
                    </div>
                    <div className="mut" style={{marginTop:2,whiteSpace:'nowrap'}}>{eur(cmdTTC(c,ch))} TTC · TVA {cmdTva(c,ch)} %</div>
                    <div className="mut" style={{marginTop:2,whiteSpace:'nowrap'}}>
                      {c.dateCommande?'commandé le '+fd(c.dateCommande):'non commandé'}</div>
                  </td>
                  <td style={{padding:'8px 4px'}}>
                    <ColFactures liste={c.factures} engage={+c.montant||0} ouv={ouv} setOuv={setOuv}
                      cle={'c-fac:'+c.id} onLien={(fid,file)=>joindreFactureCmd(c.id,fid,file)}/>
                  </td>
                </tr>
                {ouv===kE&&<Volet cols={3}>
                  <div className="b sm" style={{color:NAVY}}>{c.designation}</div>
                  <Ligne l="Fournisseur" v={c.fournisseur}/>
                  <Ligne l="Lot rattaché" v={c.lot}/>
                  <Ligne l="Livraison prévue" v={c.livrPrevue?fd(c.livrPrevue):''}/>
                  <Ligne l="Livraison réelle" v={c.livrReelle?fd(c.livrReelle):''}/>
                  <Ligne l="Notes" v={c.notes}/>
                  <div className="xs mut" style={{marginTop:3}}>
                    {eur(c.montant)} HT · TVA {cmdTva(c,ch)} % · {eur(cmdTTC(c,ch))} TTC</div>
                </Volet>}
                {ouv===kD&&<Volet cols={3}>
                  <div className="lbl">DEVIS ET BONS DE COMMANDE</div>
                  {dv.map(x=><div key={x.id} className="row xs" style={{gap:10,marginTop:4,alignItems:'center'}}><Transmis/>
                    <a href={x.lien} target="_blank" rel="noreferrer" style={{color:TERRA,wordBreak:'break-word'}}>{x.nom}</a></div>)}
                  {!dv.length&&<div className="xs mut" style={{marginTop:4}}>Aucun devis déposé.</div>}
                  <label className="xs" style={{color:NAVY,cursor:'pointer',display:'block',marginTop:6}}>
                    Ajouter un devis — il part sur le Drive › Matériaux
                    <input type="file" accept={PIECES_ACCEPT} style={{display:'none'}}
                      onChange={e=>{const x=e.target.files[0];e.target.value='';if(x)joindreDevisCmd(c.id,x)}}/></label>
                </Volet>}
              </React.Fragment>;
            })}
          </tbody>
        </table>
      </div>
    </div>}
    {!!honoAmount(ch)&&<div style={{marginTop:18}}>

/* récapitulatif budgétaire : travaux et honoraires, hors puis avec honoraires */
function RecapBudget({ch,ms,cmds}){
  const honoHT=honoAmount(ch), txHono=honoTva(ch);
  const travHT=travauxHTot(ms), travTTC=travauxTTC(ms,ch), travTVA=travTTC-travHT;
  const vent=ventilationTva(ms,ch);
  /* matériaux commandés directement : ils font partie du coût de l'ouvrage au
     même titre que les marchés, et suivent le taux de TVA du chantier. */
  const cs=cmds||[];
  const matHT=materiauxHT(cs), matTTC=materiauxTTC(cs,ch), matTVA=matTTC-matHT;
  const ventMat=ventilationTvaCmd(cs,ch);
  const honoTVA=honoHT*txHono/100, honoTTC=honoHT+honoTVA;
  const ouvHT=travHT+matHT, ouvTVA=travTVA+matTVA, ouvTTC=travTTC+matTTC;
  const totHT=ouvHT+honoHT, totTVA=ouvTVA+honoTVA, totTTC=ouvTTC+honoTTC;
  const bc=budgetClient(ch), manque=posteManquants(ch,ms,cs);
  const cell={padding:'7px 4px',textAlign:'right',whiteSpace:'nowrap'};
  return <div className="card" style={{marginTop:14,borderLeft:'3px solid '+NAVY}}>
    <div className="h2" style={{marginBottom:10}}>RÉCAPITULATIF BUDGÉTAIRE</div>
    <div style={{overflowX:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:330}}>
        <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
          <th style={{padding:'6px 4px'}}>Poste</th>
          <th style={{...cell,padding:'6px 4px'}}>HT</th>
          <th style={{...cell,padding:'6px 4px'}}>TVA</th>
          <th style={{...cell,padding:'6px 4px'}}>TTC</th>

        <tbody>
          <tr style={{borderBottom:vent.length>1?'none':'1px solid '+RULE}}>
            <td style={{padding:'7px 4px'}}>Travaux <span className="mut">({ms.length} lot{ms.length>1?'s':''})</span></td>
            <td style={cell}>{eur(travHT)}</td>
            <td style={cell} className="mut">{eur(travTVA)}</td>
            <td style={cell}>{eur(travTTC)}</td>
          </tr>
          {vent.length>1&&vent.map((v,i)=>
            <tr key={v.taux} style={{borderBottom:i===vent.length-1?'1px solid '+RULE:'none'}}>
              <td style={{padding:'3px 4px 3px 14px'}} className="mut">dont TVA {v.taux} % <span style={{fontSize:11}}>({v.n} lot{v.n>1?'s':''})</span></td>
              <td style={cell} className="mut">{eur(v.ht)}</td>
              <td style={cell} className="mut">{eur(v.tva)}</td>
              <td style={cell} className="mut">{eur(v.ttc)}</td>
            </tr>)}
          {!!cs.length&&<tr style={{borderBottom:ventMat.length>1?'none':'1px solid '+RULE}}>
            <td style={{padding:'7px 4px'}}>Matériaux commandés <span className="mut">({cs.length} commande{cs.length>1?'s':''})</span></td>
            <td style={cell}>{eur(matHT)}</td>
            <td style={cell} className="mut">{eur(matTVA)}</td>
            <td style={cell}>{eur(matTTC)}</td>
          </tr>}
          {ventMat.length>1&&ventMat.map((v,i)=>
            <tr key={'mat'+v.taux} style={{borderBottom:i===ventMat.length-1?'1px solid '+RULE:'none'}}>
              <td style={{padding:'3px 4px 3px 14px'}} className="mut">dont TVA {v.taux} % <span style={{fontSize:11}}>({v.n} commande{v.n>1?'s':''})</span></td>
              <td style={cell} className="mut">{eur(v.ht)}</td>
              <td style={cell} className="mut">{eur(v.tva)}</td>
              <td style={cell} className="mut">{eur(v.ttc)}</td>
            </tr>)}
          <tr style={{borderBottom:'1px solid '+RULE}}>
            <td style={{padding:'7px 4px'}}>Honoraires MOE <span className="mut">(TVA {txHono} %)</span></td>
            <td style={cell}>{eur(honoHT)}</td>
            <td style={cell} className="mut">{eur(honoTVA)}</td>
            <td style={cell}>{eur(honoTTC)}</td>
          </tr>
          <tr style={{borderTop:'2px solid '+RULE}}>
            <td style={{padding:'8px 4px'}} className="b">Total hors honoraires</td>
            <td style={cell} className="b">{eur(ouvHT)}</td>
            <td style={cell} className="mut">{eur(ouvTVA)}</td>
            <td style={cell} className="b">{eur(ouvTTC)}</td>
          </tr>
          <tr>
            <td style={{padding:'8px 4px',color:NAVY}} className="b">Total honoraires inclus</td>
            <td style={{...cell,color:NAVY}} className="b">{eur(totHT)}</td>
            <td style={cell} className="mut">{eur(totTVA)}</td>
            <td style={{...cell,color:NAVY,fontSize:15}} className="b">{eur(totTTC)}</td>
          </tr>
        </tbody>
      </table>
    </div>
    {bc
      ?<div className="xs mut" style={{marginTop:10,lineHeight:1.5}}>
        Budget annoncé au client : <b>{eur(bc)} TTC</b>, tout compris — marchés, matériaux commandés en direct et honoraires.
        <br/>Total honoraires inclus ci-dessus : <b>{eur(totTTC)} TTC</b>.
        <br/>{Math.round(totTTC)===Math.round(bc)
          ?<span style={{color:GREEN}}><b>Conforme au budget annoncé.</b></span>

      </div>}
    <div className="xs mut" style={{marginTop:8,lineHeight:1.5}}>TVA calculée ligne par ligne : chaque marché et chaque commande de matériaux peut avoir son propre taux (0 % en franchise ou autoliquidation, 10 % en rénovation), sinon il suit celui du chantier ({tvaRate(ch)} %). À vérifier avec votre comptable.
      {!!cs.length&&' N’inscrivez en commande que les matériaux achetés en direct : une fourniture déjà comprise dans un marché de travaux serait comptée deux fois.'}</div>
  </div>;
}

/* Toutes les factures saisies, en TTC, avec le détail de TVA et le HT en regard —
   travaux au taux de chaque lot, honoraires au taux du chantier. */
function SuiviFacturation({data,ch}){
  const ms=data.marches.filter(m=>m.chantierId===ch.id);
  const cmds=data.commandes.filter(c=>c.chantierId===ch.id);
  const F=facturesChantier(ch,ms,cmds);
  const vent=ventileFactures(F);
  const htFac=F.reduce((s,f)=>s+f.ht,0);
  const tvaFac=vent.reduce((s,v)=>s+v.tva,0);
  const ttcFac=htFac+tvaFac;
  const co=coutOperation(ch,ms,cmds);
  const bc=budgetClient(ch);
  /* le reste à facturer se mesure sur le budget annoncé s'il est saisi,
     sinon sur ce qui est réellement engagé */
  const ref=bc||co.totalTTC, refLabel=bc?'budget client':'total engagé';
  const reste=ref-ttcFac;
  const pct=ref?Math.round(ttcFac/ref*100):0;
  const cell={padding:'7px 4px',textAlign:'right',whiteSpace:'nowrap'};
  return <div>
    <div className="g2">
      <Stat l={bc?'Budget client TTC':'Total engagé TTC'} v={eur(ref)} c={NAVY}/>
      <Stat l="Facturé au client TTC" v={eur(ttcFac)}/>

      Budget client non renseigné : l'avancement est calculé sur le total engagé. Saisissez le montant TTC annoncé au client via « Modifier » sur la fiche.</div>}
    <div className="card" style={{marginTop:12,borderLeft:'3px solid '+NAVY}}>
      <div className="h2" style={{marginBottom:10}}>FACTURES ÉMISES ({F.length})</div>
      {!F.length
        ?<div className="xs mut" style={{lineHeight:1.5}}>Aucune facture saisie. Les factures des marchés et des achats de matériaux s'ajoutent depuis l'onglet MARCHÉS (« Lire des factures »), celles des honoraires depuis l'onglet HONORAIRES.</div>
        :<div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:320}}>
            <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
              <th style={{padding:'6px 4px'}}>Facture</th>
              <th style={{...cell,padding:'6px 4px'}}>HT</th>
              <th style={{...cell,padding:'6px 4px'}}>TVA</th>
              <th style={{...cell,padding:'6px 4px'}}>TTC</th>
            </tr></thead>
            <tbody>
              {F.map(f=><tr key={f.id} style={{borderBottom:'1px solid '+RULE}}>
                <td style={{padding:'7px 4px'}}>
                  {/* même présentation pour toutes les lignes : le fichier joint change
                      le lien, pas la lecture de la liste */}
                  <span className="b" style={{color:TERRA,textTransform:'uppercase'}}>
                    {f.lien?<a href={f.lien} target="_blank" rel="noreferrer" style={{color:'inherit'}}>{f.libelle}</a>:f.libelle}
                  </span>
                  <div className="mut" style={{fontSize:11}}>{f.poste}{f.numero?' n° '+f.numero:''} · {f.date?fd(f.date):'sans date'} · TVA {f.taux} %</div>
                </td>
                <td style={cell}>{eur(f.ht)}</td>
                <td style={cell} className="mut">{eur(f.ht*f.taux/100)}</td>
                <td style={cell}>{eur(f.ht*(1+f.taux/100))}</td>
              </tr>)}

                <td style={{padding:'8px 4px'}} className="b">Total facturé</td>
                <td style={cell} className="b">{eur(htFac)}</td>

      <div className="h2" style={{marginBottom:10}}>DÉTAIL DE TVA SUR LES FACTURES</div>

        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:330}}>
          <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
            <th style={{padding:'6px 4px'}}>Taux</th>
            <th style={{...cell,padding:'6px 4px'}}>Base HT</th>
            <th style={{...cell,padding:'6px 4px'}}>TVA</th>
            <th style={{...cell,padding:'6px 4px'}}>TTC</th>

          <tbody>
            {vent.map(v=><tr key={v.taux} style={{borderBottom:'1px solid '+RULE}}>
              <td style={{padding:'7px 4px'}}>TVA {v.taux} % <span className="mut" style={{fontSize:11}}>({v.n} facture{v.n>1?'s':''})</span></td>

        <br/>Chaque marché peut porter son propre taux (0 % en franchise ou autoliquidation) ; à défaut il suit celui du chantier ({tvaRate(ch)} %). À vérifier avec votre comptable avant tout usage fiscal.

}

/* ---------------- LECTURE DES CONTRATS ---------------- */
/* rapproche « EI SADETTIN KARA » et « SADETTIN KARA » : la forme juridique et la
   ponctuation varient d'un document à l'autre, le nom non. */
const cleNom=s=>deaccent(String(s||'')).toUpperCase()
  .replace(/\b(SARL|SASU|SAS|SA|EURL|EI|SCI|SCOP|ETS|ETABLISSEMENTS|ENTREPRISE|MONSIEUR|MME|M)\b/g,'')
  .replace(/[^A-Z0-9]/g,'');

function LireMarches({data,ch,save,close}){
  const [rows,setRows]=useState([]);
  const [busy,setBusy]=useState('');
  const [envoi,setEnvoi]=useState('');
  const trouveArtisan=nom=>{
    const k=cleNom(nom); if(k.length<3)return '';
    const a=data.artisans.find(x=>{const c=cleNom(x.nom);
      return c===k||(c.length>=4&&k.length>=4&&(c.indexOf(k)>=0||k.indexOf(c)>=0))});
    return a?a.id:'';
  };
  const lire=async files=>{
    setBusy('Lecture de '+files.length+' document'+(files.length>1?'s':'')+'…');
    const out=[];
    for(const file of files){
      const {txt,motif}=await lireDocument(file);
      if(!txt){out.push({id:uid(),file,nomFichier:file.name,scan:true,motif,retenu:false,alertes:[]});continue}
      const a=analyseMarche(txt);
      out.push({id:uid(),file,nomFichier:file.name,scan:false,retenu:a.montantHT!==null,
        numero:a.numero,lot:a.lot||'',artisanId:trouveArtisan(a.artisan),artisanNom:a.artisan||'',
        montantHT:a.montantHT===null?'':a.montantHT,tva:a.tva===null?'':a.tva,
        date:a.date||'',alertes:a.alertes});
    }
    setRows(r=>[...r,...out]);
    setBusy('');
  };
  const upd=(id,patch)=>setRows(rs=>rs.map(r=>r.id===id?{...r,...patch}:r));
  const retenus=rows.filter(r=>r.retenu&&!r.scan);
  const scans=rows.filter(r=>r.scan);
  const ajouter=async()=>{
    let artisans=[...data.artisans];
    const nouveaux=retenus.map(r=>{
      let aid=r.artisanId;
      if(!aid&&r.artisanNom){
        const a={id:uid(),nom:r.artisanNom,corps:r.lot||'',tel:'',email:'',adresse:'',siret:'',activites:'',
                 assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''};
        artisans=[...artisans,a]; aid=a.id;
      }
      /* la TVA reste vide quand elle est celle du chantier : le lot suit alors
         automatiquement toute correction faite au niveau du chantier. */
      const taux=r.tva===''?'':(+r.tva===tvaRate(ch)?'':+r.tva);
      return {id:uid(),chantierId:ch.id,lot:r.lot||'Lot sans intitulé',artisanId:aid,
        montantHT:+r.montantHT||0,tva:taux,statut:'signe',dateSignature:r.date||'',
        notes:r.numero?'Marché n°'+r.numero:'',facture:0,factures:[],contratLien:'',__src:r.id};
    });
    let etat={...data,artisans,marches:[...data.marches,...nouveaux.map(m=>{const{__src,...x}=m;return x})]};
    save(etat);
    /* le contrat lu part aussi sur le Drive : il est déjà en main, autant ne pas
       repasser. Silencieux si le Drive n'est pas connecté. */
    try{
      setEnvoi('Envoi des contrats sur le Drive…');
      const token=await getDriveToken();
      const folderId=await driveMarchesFolder(token,ch.id,ch.nom);
      const liens={};
      for(const m of nouveaux){
        const r=retenus.find(x=>x.id===m.__src);
        if(!r||!r.file)continue;
        try{const{webViewLink}=await uploadToDrive(r.file,folderId);liens[m.id]=webViewLink}catch(e){}
      }
      if(Object.keys(liens).length){
        etat={...etat,marches:etat.marches.map(m=>liens[m.id]?{...m,contratLien:liens[m.id]}:m)};
        save(etat);
      }
    }catch(e){/* Drive non connecté : les marchés sont enregistrés quand même */}
    setEnvoi('');
    close();
  };
  const dejaLa=lot=>!!lot&&data.marches.some(m=>m.chantierId===ch.id&&cleNom(m.lot)===cleNom(lot));
  return <div className="card" style={{borderLeft:'3px solid '+TERRA}}>
    <div className="h2" style={{marginBottom:8}}>LIRE DES CONTRATS DE MARCHÉ</div>
    <div className="xs mut" style={{lineHeight:1.6,marginBottom:10}}>
      Choisissez les contrats en PDF : le lot, l'entreprise, le montant HT, le taux de TVA et la date
      sont lus puis proposés ci-dessous. <b>Rien n'est enregistré avant votre validation.</b>
      <br/>PDF ou Word (.docx). Un contrat signé puis scanné ne contient aucun texte : prenez le fichier d'origine, les montants sont les mêmes.
    </div>
    <label className="btn gh s" style={{display:'inline-block',whiteSpace:'nowrap'}}>{busy||'Choisir des contrats (PDF ou Word)'}
      <input type="file" accept={DOC_ACCEPT} multiple style={{display:'none'}} disabled={!!busy}
        onChange={e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)lire(fs)}}/></label>
    {!!scans.length&&<div className="xs" style={{marginTop:10,background:'#FBF3DF',color:'#6A4E06',borderLeft:'3px solid '+AMBER,padding:8,lineHeight:1.5}}>
      {scans.length} document{scans.length>1?'s':''} n'ont rien donné :

      <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
        <span className="xs mut" style={{wordBreak:'break-all'}}>{r.nomFichier}</span>
        <label className="xs" style={{whiteSpace:'nowrap'}}>
          <input type="checkbox" checked={r.retenu} onChange={e=>upd(r.id,{retenu:e.target.checked})}/> retenir
        </label>
      </div>
      <div className="g2" style={{marginTop:8}}>
        <Fld label="CORPS D'ÉTAT"><input className="in" list="corps-lire" value={r.lot} onChange={e=>upd(r.id,{lot:e.target.value})}/>
          <datalist id="corps-lire">{CORPS.map(c=><option key={c} value={c}/>)}</datalist></Fld>
        <Fld label="ARTISAN">

      <div className="g3">
        <Fld label="MONTANT HT (€)"><input className="in" type="number" step="0.01" value={r.montantHT} onChange={e=>upd(r.id,{montantHT:e.target.value})}/></Fld>
        <Fld label="TVA (%)"><input className="in" type="number" step="0.1" placeholder={String(tvaRate(ch))} value={r.tva} onChange={e=>upd(r.id,{tva:e.target.value})}/></Fld>

      {r.alertes.map((a,i)=><div key={i} className="xs" style={{color:AMBER,marginTop:6,lineHeight:1.5}}>{a}</div>)}
