/* ---------------- CONVENTIONS DE RÉTROCESSION ----------------
   Une convention par entreprise, reprenant ses marchés qui portent un taux.
   Elle se dépose dans Drive › Rétrocessions — le dossier de la maîtrise
   d'œuvre, pas celui que l'on remet au client. */
function ConventionsRetro({data,ch,ms}){
  const [etat,setEtat]=useState({});
  const parArtisan=new Map();
  ms.forEach(m=>{
    const t=+m.retroPct||0;
    if(!(t>0)||!m.artisanId)return;
    if(!parArtisan.has(m.artisanId))parArtisan.set(m.artisanId,[]);
    parArtisan.get(m.artisanId).push(m);
  });
  const groupes=[...parArtisan.entries()].map(([id,lots])=>({
    artisan:data.artisans.find(a=>a.id===id)||{id,nom:'Entreprise inconnue'},
    lots, total:Math.round(lots.reduce((s,m)=>s+retroMontant(m),0)*100)/100,
  }));
  const produire=async g=>{
    setEtat(p=>({...p,[g.artisan.id]:{etat:'travail'}}));
    try{
      const doc=await genererRetroDocx({
        numero:(g.artisan.nom||'').slice(0,3).toUpperCase()+'-'+today().replace(/-/g,''),
        date:fd(today()),
        entreprise:g.artisan.nom||'', adresse:g.artisan.adresse||'', siret:g.artisan.siret||'',
        affaires:g.lots.map(m=>({chantier:ch.nom||'',lot:m.lot||'',numero:m.numeroMarche||'',
          montant:+m.montantHT||0, taux:+m.retroPct||0, retro:retroMontant(m)})),
        total:g.total,
      });
      const nom='Convention apport d’affaires — '+(g.artisan.nom||'entreprise')+' — '+(ch.nom||'')+'.docx';
      const fichier=new File([doc],nom,
        {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      const token=await getDriveToken();
      const folderId=await driveRetroFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(fichier,folderId);
      setEtat(p=>({...p,[g.artisan.id]:{etat:'ok',lien:webViewLink,nom}}));
    }catch(e){
      const c=String((e&&(e.error||e.message))||e);
      setEtat(p=>({...p,[g.artisan.id]:{etat:'erreur',msg:c==='auth_required'
        ?"La convention a été rédigée, mais Google Drive n'est pas connecté — reconnectez-le puis relancez."
        :"Sortie impossible — "+c}}));
    }
  };
  if(!groupes.length)return null;
  return <div style={{marginTop:18}}>
    <div className="h2" style={{marginBottom:8}}>CONVENTIONS D’APPORT D’AFFAIRES</div>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>
      Une convention par entreprise ayant un taux de rétrocession sur ce chantier : elle nomme les marchés
      concernés, leurs montants et la rémunération due, et se dépose dans Drive › Rétrocessions.
    </p>
    <div className="xs" style={{marginTop:8,padding:'8px 10px',borderRadius:8,
      background:'#FBF3E2',borderLeft:'3px solid '+AMBER,lineHeight:1.6}}>
      <b style={{color:AMBER}}>Ce qui rend cette convention défendable</b> — elle est rédigée comme un apport
      d’affaires avec une contrepartie réelle (quantitatif, marché, planning, coordination, réception),
      facturée et soumise à TVA, et son article « Indépendance et probité » écarte tout lien entre le choix
      de l’entreprise et la rémunération.
    </div>
    {groupes.map(g=>{
      const s=etat[g.artisan.id]||{};
      return <div key={g.artisan.id} className="card" style={{marginTop:8,borderLeft:'3px solid '+NAVY}}>
        <div className="sp"><span className="b sm" style={{color:NAVY}}>{g.artisan.nom}</span>
          <span className="xs b" style={{whiteSpace:'nowrap'}}>{eur(g.total)} HT</span></div>
        <div className="xs mut" style={{marginTop:3,lineHeight:1.5}}>
          {g.lots.map(m=>m.lot+' — '+eur(m.montantHT)+' × '+(+m.retroPct||0)+' %').join(' · ')}</div>
        <button className="btn gh s" style={{marginTop:8}} disabled={s.etat==='travail'}
          onClick={()=>produire(g)}>{s.etat==='travail'?'Rédaction…':'Rédiger la convention'}</button>
        {s.etat==='ok'&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
          Déposée dans Drive › Rétrocessions.{' '}
          <a href={s.lien} target="_blank" rel="noreferrer" style={{color:TERRA}}>Ouvrir</a>
          <div className="mut" style={{marginTop:2,wordBreak:'break-word'}}>{s.nom}</div></div>}
        {s.etat==='erreur'&&<div className="xs" style={{marginTop:6,color:TERRA}}>{s.msg}</div>}
      </div>;
    })}
  </div>;
}

/* ---------------- HONORAIRES ---------------- */
function Honoraires({data,ch,save}){
  const hf=ch.honoFactures||[];
  const [busy,setBusy]=useState(null);
  const [busyRetro,setBusyRetro]=useState(null);
  const total=honoAmount(ch), facture=sumMontants(hf), reste=total-facture;
  /* chaque facture peut porter son taux : le TTC encaissé se somme facture par facture */
  const factureTTC=honoFactureTTC(ch), resteTTC=honoResteTTC(ch), totalTTC=honoTotalTTC(ch);
  const divergents=honoTauxDivergents(ch);
  const ms=data.marches.filter(m=>m.chantierId===ch.id);
  const cmds=data.commandes.filter(c=>c.chantierId===ch.id);
  const groupes=[
    {titre:'Marchés de travaux',type:'marche',lignes:ms.map(m=>({src:m,label:m.lot,sous:''}))},
    {titre:'Matériaux commandés',type:'commande',lignes:cmds.map(c=>({src:c,label:c.designation,sous:c.fournisseur||''}))},
  ].filter(g=>g.lignes.length);
  const toutes=[...ms,...cmds];
  const retroDu=toutes.reduce((s,x)=>s+retroMontant(x),0);
  const retroFac=toutes.reduce((s,x)=>s+(+x.retroFacture||0),0);
  const upHono=list=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,honoFactures:list}:x)});
  const upCh=patch=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,...patch}:x)});
  /* le devis d'honoraires : on le range dans Drive › Honoraires et on le lit au
     passage. Ce qui en est lu est proposé, jamais écrit d'office. */
  const [devisBusy,setDevisBusy]=useState(false);
  const [devisLu,setDevisLu]=useState(null);
  const importDevisHono=async file=>{
    setDevisBusy(true); setDevisLu(null);
    let lu=null;
    try{
      const {txt,motif}=await lireDocument(file);
      lu=txt?{a:analyseHonoraires(txt)}:{motif};
    }catch(e){lu={motif:'lecture impossible'}}
    let lien='';
    try{
      const token=await getDriveToken();
      const folderId=await driveHonoFolder(token,ch.id,ch.nom);
      lien=(await uploadToDrive(file,folderId)).webViewLink;
    }catch(e){
      if(e&&e.error==='auth_required')alert("Connectez d'abord Google Drive : le devis n'a pas été déposé.");
    }
    upCh({devisHono:{nom:file.name,lien,date:today()}});
    setDevisLu(lu); setDevisBusy(false);
  };
  const reporterHono=()=>{
    const a=devisLu&&devisLu.a; if(!a)return;
    const patch={};
    if(a.montantHT!==null)patch.honorairesMontant=Math.round(a.montantHT*100)/100;
    if(a.pct!==null)patch.honorairesPct=a.pct;
    if(a.tva!==null&&a.tva!==undefined&&(ch.tvaHono===undefined||ch.tvaHono===null||ch.tvaHono===''))patch.tvaHono=a.tva;
    if(Object.keys(patch).length)upCh(patch);
    setDevisLu(null);
  };
  const add=()=>upHono([...hf,{id:uid(),montant:'',date:'',libelle:'',lien:'',numero:'',tva:''}]);
  const [luHono,setLuHono]=useState(null);
  const upd=(id,patch)=>upHono(hf.map(x=>x.id===id?{...x,...patch}:x));
  const del=id=>upHono(hf.filter(x=>x.id!==id));
  const updRetro=(type,id,patch)=>save(type==='marche'
    ?{...data,marches:data.marches.map(m=>m.id===id?{...m,...patch}:m)}
    :{...data,commandes:data.commandes.map(c=>c.id===id?{...c,...patch}:c)});
  /* la facture jointe est lue au passage : montant, date et numéro s'y trouvent.
     On ne remplit que ce qui est vide — une saisie n'est jamais écrasée. */
  const importFacture=async(id,file)=>{
    setBusy(id); setLuHono(null);
    let lu=null, acc={};
    if(!/^image\//.test(file.type||'')){
      try{
        const {txt,motif}=await lireDocument(file);
        if(txt){
          const a=analyseFacture(txt);
          const cible=hf.find(x=>x.id===id)||{};
          const patch={};
          const ht=a.montantHT!==null?a.montantHT:(a.montantTTC!==null&&a.tva!==null?a.montantTTC/(1+a.tva/100):null);
          if(ht!==null&&(cible.montant===''||cible.montant===undefined||cible.montant===null))patch.montant=Math.round(ht*100)/100;
          if(a.date&&!cible.date)patch.date=a.date;
          if(a.numero&&!cible.numero)patch.numero=a.numero;
          if(a.tva!==null&&a.tva!==undefined&&(cible.tva===''||cible.tva===undefined||cible.tva===null))patch.tva=a.tva;
          if(Object.keys(patch).length){acc={...acc,...patch};upd(id,acc);lu={patch,id};}else lu={patch:null,id};
        }else lu={motif,id};
      }catch(e){}
    }
    setLuHono(lu);
    try{
      const token=await getDriveToken();
      const folderId=await driveHonoFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      acc={...acc,lien:webViewLink};
      upd(id,acc);
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import de la facture impossible.");
    }
    setBusy(null);
  };
  const importRetro=async(type,id,file)=>{
    setBusyRetro(id);
    try{
      const token=await getDriveToken();
      const folderId=await driveRetroFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      updRetro(type,id,{retroLien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton en bas de page).":"Import de la facture impossible.");
    }
    setBusyRetro(null);
  };
  return <div>
    <div className="g2">
      <Stat l="Honoraires TTC" v={eur(totalTTC)} c={NAVY}/>
      <Stat l="Déjà facturé TTC" v={eur(factureTTC)}/>
      <Stat l={"Reste à facturer TTC"} v={reste>0?eur(resteTTC):'soldé'} c={reste>0?TERRA:GREEN}/>
      <Stat l="Reste à facturer HT" v={reste>0?eur(reste):'soldé'} c={reste>0?INK:GREEN}/>
    </div>
    <div className="card" style={{marginTop:8,borderLeft:'3px solid '+NAVY}}>
      <Fld label="DEVIS D'HONORAIRES (PDF OU WORD)">
        {ch.devisHono&&ch.devisHono.nom
          ?<div className="row" style={{gap:12,alignItems:'center',flexWrap:'wrap'}}>
            {ch.devisHono.lien?<Transmis/>:<span className="xs" style={{color:AMBER,whiteSpace:'nowrap'}}>non déposé sur le Drive</span>}
            <span className="xs" style={{wordBreak:'break-all'}}>{ch.devisHono.nom}</span>
            {ch.devisHono.lien&&<a href={ch.devisHono.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir</a>}
            <label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>{devisBusy?'Lecture…':'Remplacer'}
              <input type="file" accept={DOC_ACCEPT} style={{display:'none'}} disabled={devisBusy}
                onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importDevisHono(f)}}/></label>
          </div>
          :<label className="btn gh s" style={{display:'inline-block',whiteSpace:'nowrap'}}>{devisBusy?'Lecture…':'Importer le devis d’honoraires'}
            <input type="file" accept={DOC_ACCEPT} style={{display:'none'}} disabled={devisBusy}
              onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importDevisHono(f)}}/></label>}
        <div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>Rangé dans Drive › {ch.nom} › Honoraires, et lu au passage pour vous proposer le montant.</div>
        {devisLu&&devisLu.motif&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
          Rien n'a pu être lu — {devisLu.motif}. Le fichier est bien enregistré.</div>}
        {devisLu&&devisLu.a&&<div className="xs" style={{marginTop:8,padding:8,border:'1px solid '+RULE,borderRadius:8,lineHeight:1.6}}>
          {devisLu.a.montantHT===null&&devisLu.a.pct===null
            ?<span style={{color:AMBER}}>Devis lu, mais ni montant ni pourcentage d'honoraires n'y ont été trouvés.</span>
            :<span>Lu sur le devis :
              {devisLu.a.montantHT!==null&&<span> honoraires <b>{eur(devisLu.a.montantHT)} HT</b></span>}
              {devisLu.a.pct!==null&&<span> · taux <b>{devisLu.a.pct} %</b></span>}
              {devisLu.a.tva!==null&&<span className="mut"> · TVA {devisLu.a.tva} %</span>}
              {devisLu.a.date&&<span className="mut"> · {fd(devisLu.a.date)}</span>}.
            </span>}
          {devisLu.a.alertes.map((x,i)=><div key={i} style={{color:AMBER}}>{x}</div>)}
          <div className="row" style={{gap:8,marginTop:8,flexWrap:'wrap'}}>
            {(devisLu.a.montantHT!==null||devisLu.a.pct!==null)&&
              <button className="btn s" onClick={reporterHono}>Reporter sur le chantier</button>}
            <button className="btn gh s" onClick={()=>setDevisLu(null)}>Ne rien changer</button>
          </div>
        </div>}
      </Fld>
      <div className="xs mut" style={{lineHeight:1.6}}>
        Base HT : <b>{eur(total)}</b>{ch.honorairesMontant!==undefined&&ch.honorairesMontant!==null&&ch.honorairesMontant!==''?' (montant saisi)':' ('+(ch.honorairesPct||0)+' % de '+eur(budgetTravauxHT(ch))+' HT de travaux)'} · TVA {honoTva(ch)} %{honoTva(ch)!==tvaRate(ch)?' (le chantier est à '+tvaRate(ch)+' %)':''}<br/>
        Déjà facturé : <b>{eur(facture)} HT</b> — reste <b>{eur(reste)} HT</b>.<br/>
        {!!divergents.length&&<span style={{color:AMBER}}>
          {hf.filter(x=>Math.abs(honoFactTva(x,ch)-honoTva(ch))>0.01).length} facture{hf.filter(x=>Math.abs(honoFactTva(x,ch)-honoTva(ch))>0.01).length>1?'s ont été émises':' a été émise'} à
          {' '}{divergents.map(t=>t+' %').join(' et ')} au lieu de {honoTva(ch)} % : le total TTC les compte à leur propre taux,
          c'est pourquoi il ne vaut pas {honoTva(ch)===0?'simplement les '+eur(total)+' HT':eur(total)+' × '+(1+honoTva(ch)/100).toFixed(2).replace('.',',')}.
          <br/></span>}
        Le montant des honoraires se modifie via « Modifier » sur la fiche du chantier.
      </div>
    </div>
    {retroDu>0&&<div className="card" style={{marginTop:8,borderLeft:'3px solid '+NAVY}}>
      <div className="xs mut">Recette totale du chantier — honoraires + rétrocessions</div>
      <div className="b" style={{fontSize:20,marginTop:2,color:NAVY}}>{eur(total+retroDu)} HT</div>
      <div className="xs mut" style={{marginTop:6}}>Encaissé : <b>{eur(facture+retroFac)}</b> · Reste à facturer : <b style={{color:(total+retroDu-facture-retroFac)>0?TERRA:GREEN}}>{eur(total+retroDu-facture-retroFac)}</b></div>
    </div>}
    {reste<0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginTop:8}}>
      Vous avez facturé {eur(-reste)} HT de plus que le montant d'honoraires prévu.</div>}
    <div className="sp" style={{margin:'14px 0 12px'}}>
      <span className="h2">MES FACTURES ({hf.length})</span>
      <button className="btn acc s" onClick={add}>+ Facture</button>
    </div>
    {!hf.length&&<Empty>Aucune facture d'honoraires. Ajoutez-les au fur et à mesure de vos appels de fonds.</Empty>}
    {hf.map(x=><div key={x.id} className="card" style={{padding:10}}>
      <div className="g2">
        <Fld label="MONTANT HT (€)"><input className="in" type="number" value={x.montant} onChange={e=>upd(x.id,{montant:e.target.value})}/></Fld>
        <Fld label="DATE"><input className="in" type="date" value={x.date||''} onChange={e=>upd(x.id,{date:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="LIBELLÉ"><input className="in" placeholder="Acompte, phase PC, situation n°…" value={x.libelle||''} onChange={e=>upd(x.id,{libelle:e.target.value})}/></Fld>
        <Fld label="N° DE FACTURE"><input className="in" value={x.numero||''} onChange={e=>upd(x.id,{numero:e.target.value})}/></Fld>
      </div>
      <Fld label="TVA DE CETTE FACTURE (%)">
        <input className="in" type="number" step="0.1" placeholder={'Honoraires : '+honoTva(ch)+' %'}
          value={x.tva===undefined||x.tva===null?'':x.tva} onChange={e=>upd(x.id,{tva:e.target.value})}/>
      </Fld>
      <div className="sp" style={{flexWrap:'wrap',gap:8}}>
        <span className="xs mut">{eur((+x.montant||0)*(1+honoFactTva(x,ch)/100))} TTC · TVA {honoFactTva(x,ch)} %</span>
        <div className="row" style={{gap:14,alignItems:'center',flexWrap:'wrap'}}>
          {x.lien
            ?<span className="row" style={{gap:10,alignItems:'center',whiteSpace:'nowrap'}}><Transmis/>
              <a href={x.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Voir la facture</a></span>
            :<label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>{busy===x.id?'Lecture…':'Joindre la facture'}
              <input type="file" accept={DOC_ACCEPT+',image/*'} style={{display:'none'}} disabled={busy===x.id}
                onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importFacture(x.id,file)}}/></label>}
          <button className="btn dg s" onClick={()=>del(x.id)}>Supprimer</button>
        </div>
      </div>
      {luHono&&luHono.id===x.id&&luHono.motif&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
        Rien n'a pu être lu — {luHono.motif}. Montant et date à saisir à la main ; le fichier est bien envoyé sur le Drive.</div>}
      {luHono&&luHono.id===x.id&&luHono.patch&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
        Lu sur la facture :{luHono.patch.montant!==undefined&&<span> montant <b>{eur(luHono.patch.montant)} HT</b></span>}
        {luHono.patch.date!==undefined&&<span> · date <b>{fd(luHono.patch.date)}</b></span>}
        {luHono.patch.numero!==undefined&&<span> · n° <b>{luHono.patch.numero}</b></span>}
        {luHono.patch.tva!==undefined&&<span> · TVA <b>{luHono.patch.tva} %</b></span>}. À vérifier.</div>}
    </div>)}

    <div className="sp" style={{margin:'20px 0 12px'}}>
      <span className="h2">RÉTROCESSIONS</span>
      <span className="xs mut">{eur(retroFac)} / {eur(retroDu)} HT</span>
    </div>
    {!groupes.length
      ?<Empty>Aucun marché ni matériau sur ce chantier. Les rétrocessions se calculent à partir des marchés de travaux et des commandes de matériaux.</Empty>
      :<div>
        <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Saisissez le taux ligne par ligne (0 % s'il n'y a pas de rétrocession). Le montant dû se calcule sur le montant HT du marché ou de la commande.</p>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:430}}>
            <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
              <th style={{padding:'6px 4px'}}>Désignation</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:62}}>Rétro %</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:82}}>Montant dû</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:92}}>Facturé</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:74}}>Facture</th>
            </tr></thead>
            <tbody>
              {groupes.map(g=>[
                <tr key={g.type+'-t'} style={{background:'#F3F1EC'}}>
                  <td colSpan="5" className="xs b" style={{padding:'5px 4px',color:NAVY,letterSpacing:'.04em'}}>{g.titre}</td>
                </tr>,
                ...g.lignes.map(({src,label,sous})=>{
                  const du=retroMontant(src), fac=+src.retroFacture||0;
                  return <tr key={g.type+src.id} style={{borderBottom:'1px solid '+RULE}}>
                    <td style={{padding:'6px 4px'}}>
                      <div className={du>0?'b':''}>{label}</div>
                      <div className="mut">{eur(retroBase(src))} HT{sous?' · '+sous:''}</div>
                    </td>
                    <td style={{padding:'6px 4px'}}>
                      <input className="in" type="number" step="0.5" placeholder="0" style={{padding:'5px 4px',fontSize:13,textAlign:'right'}}
                        value={src.retroPct===undefined||src.retroPct===null?'':src.retroPct}
                        onChange={e=>updRetro(g.type,src.id,{retroPct:e.target.value===''?'':+e.target.value})}/>
                    </td>
                    <td style={{padding:'6px 4px',textAlign:'right',whiteSpace:'nowrap'}} className={du>0?'b':'mut'}>{du>0?eur(du):'—'}</td>
                    <td style={{padding:'6px 4px'}}>
                      <input className="in" type="number" placeholder="—" style={{padding:'5px 4px',fontSize:13,textAlign:'right'}}
                        value={src.retroFacture===undefined||src.retroFacture===null?'':src.retroFacture}
                        onChange={e=>updRetro(g.type,src.id,{retroFacture:e.target.value===''?'':+e.target.value})}/>
                      {du>0&&fac>0&&fac<du&&<div className="mut" style={{textAlign:'right',marginTop:2}}>reste {eur(du-fac)}</div>}
                    </td>
                    <td style={{padding:'6px 4px',textAlign:'right',whiteSpace:'nowrap'}}>
                      {src.retroLien
                        ?<a href={src.retroLien} target="_blank" rel="noreferrer" style={{color:TERRA}}>Voir</a>
                        :<label style={{color:NAVY}}>{busyRetro===src.id?'Envoi…':'Joindre'}
                          <input type="file" accept="application/pdf,image/*" style={{display:'none'}} disabled={busyRetro===src.id}
                            onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importRetro(g.type,src.id,file)}}/></label>}
                    </td>
                  </tr>;
                })
              ])}
              <tr style={{borderTop:'2px solid '+RULE}}>
                <td style={{padding:'8px 4px'}} className="b">TOTAL</td>
                <td/>
                <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}} className="b">{eur(retroDu)}</td>
                <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}} className="b">{eur(retroFac)}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
        {retroDu-retroFac>0&&<div className="xs" style={{marginTop:10,color:TERRA}}>Reste à facturer en rétrocessions : <b>{eur(retroDu-retroFac)} HT</b></div>}
        <ConventionsRetro data={data} ch={ch} ms={ms}/>
      </div>}
    <DriveStatus/>
  </div>;
}

/* ---------------- CONTRÔLE CHANTIER ---------------- */
function ThumbCtrl({id,onZoom,onDel}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{let a=true;Photo.get(id).then(v=>{if(a)setSrc(v)}).catch(()=>{});return()=>{a=false}},[id]);
  return <div style={{position:'relative',width:66,height:52,border:'1px solid '+RULE,background:'#EFECE6',flex:'0 0 auto'}}>
    {src&&<img src={src} onClick={onZoom} alt="" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>}
    <button onClick={onDel} title="Retirer la photo" style={{position:'absolute',top:-1,right:-1,width:18,height:18,lineHeight:'16px',padding:0,fontSize:11,border:'none',background:TERRA,color:'#fff'}}>✕</button>
  </div>;
}

function Controles({data,ch,save}){
  const c=ch.controles||{};
  const [ouvert,setOuvert]=useState({});
  const [busy,setBusy]=useState(null);
  const [filtre,setFiltre]=useState('tous');
  const [zoom,setZoom]=useState(null);

  const upCtrl=next=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
  const setPt=(key,patch)=>{
    const cur=c[key]||{};
    upCtrl({...c,[key]:{...cur,...patch,date:patch.date!==undefined?patch.date:(cur.date||today())}});
  };
  const addPhotos=async(key,corpsL,ptL,files)=>{
    setBusy(key);
    const nouveaux=[];
    for(const file of files){
      try{
        const d=await compress(file);
        const pid=uid();
        await Photo.put(pid,d);
        let lien='';
        try{
          const token=await getDriveToken();
          const folderId=await driveControlesFolder(token,ch.id,ch.nom);
          lien=(await uploadToDrive(file,folderId)).webViewLink;
        }catch(x){/* miniature conservée même sans Drive */}
        nouveaux.push({id:pid,chantierId:ch.id,date:today(),legende:'Contrôle — '+corpsL+' : '+ptL,lot:'',lien});
      }catch(x){/* photo ignorée */}
    }
    if(nouveaux.length){
      const cur=c[key]||{};
      const next={...c,[key]:{...cur,photos:[...(cur.photos||[]),...nouveaux.map(p=>p.id)],date:cur.date||today()}};
      save({...data,photos:[...data.photos,...nouveaux],chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
    }
    setBusy(null);
  };
  const delPhoto=async(key,pid)=>{
    await Photo.del(pid).catch(()=>{});
    const cur=c[key]||{};
    const next={...c,[key]:{...cur,photos:(cur.photos||[]).filter(x=>x!==pid)}};
    save({...data,photos:data.photos.filter(p=>p.id!==pid),chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
  };

  const keep=(g,k)=>{
    const r=c[g.id+'.'+k]||{};
    if(filtre==='todo')return !r.statut;
    if(filtre==='ko')return r.statut==='non_conforme';
    return true;
  };
  const tot=CONTROLES.reduce((s,g)=>s+g.pts.length,0);
  const nOk=Object.values(c).filter(r=>r.statut==='conforme').length;
  const nKo=Object.values(c).filter(r=>r.statut==='non_conforme').length;
  const nNe=Object.values(c).filter(r=>r.statut==='neant').length;

  return <div>
    <div className="g3 xs" style={{marginBottom:12}}>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">Conformes</div><div className="b" style={{color:GREEN,fontSize:16}}>{nOk}</div></div>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">Non conformes</div><div className="b" style={{color:TERRA,fontSize:16}}>{nKo}</div></div>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">À contrôler</div><div className="b" style={{fontSize:16}}>{tot-nOk-nKo-nNe}</div></div>
    </div>
    {nKo>0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {nKo} point{nKo>1?'s':''} non conforme{nKo>1?'s':''} à lever avant réception.</div>}
    <div className="row" style={{gap:8,marginBottom:12,flexWrap:'wrap'}}>
      {[['tous','Tous'],['todo','À contrôler'],['ko','Non conformes']].map(([id,l])=>
        <button key={id} className={'btn s '+(filtre===id?'':'gh')} onClick={()=>setFiltre(id)}>{l}</button>)}
    </div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Les photos de contrôle sont aussi ajoutées à l'onglet PHOTOS et envoyées sur votre Google Drive (dossier « {DRIVE_RACINE} › {ch.nom} › Contrôles »).</p>
    {CONTROLES.map(g=>{
      const pts=g.pts.filter(([k])=>keep(g,k));
      if(!pts.length)return null;
      const rs=g.pts.map(([k])=>c[g.id+'.'+k]||{});
      const gOk=rs.filter(r=>r.statut==='conforme').length, gKo=rs.filter(r=>r.statut==='non_conforme').length;
      const gDone=rs.filter(r=>r.statut).length;
      const isOpen=filtre!=='tous'||ouvert[g.id];
      return <div key={g.id} style={{marginBottom:8}}>
        <button className="card sp" style={{borderLeft:'3px solid '+(gKo?TERRA:gDone===g.pts.length?GREEN:RULE),padding:10,marginBottom:0}}
          onClick={()=>setOuvert({...ouvert,[g.id]:!ouvert[g.id]})}>
          <span className="b sm" style={{color:NAVY}}>{g.l}</span>
          <span className="xs mut">{gDone}/{g.pts.length}{gKo?' · '+gKo+' NC':''} {isOpen?'▾':'▸'}</span>
        </button>
        {isOpen&&pts.map(([k,label])=>{
          const key=g.id+'.'+k, r=c[key]||{};
          const st=CTRL_ST.find(s=>s.id===r.statut);
          return <div key={k} className="card" style={{borderLeft:'3px solid '+(st?st.c:RULE),padding:10,marginBottom:0,borderTop:'none'}}>
            <div className="sm" style={{lineHeight:1.35}}>{label}</div>
            <div className="row" style={{gap:6,marginTop:8,flexWrap:'wrap'}}>
              {CTRL_ST.map(s=><button key={s.id} className="btn s" onClick={()=>setPt(key,{statut:r.statut===s.id?'':s.id})}
                style={{background:r.statut===s.id?s.c:'transparent',borderColor:r.statut===s.id?s.c:RULE,color:r.statut===s.id?'#fff':MUTED}}>{s.label}</button>)}
            </div>
            {r.statut&&<div style={{marginTop:10}}>
              <div className="g2">
                <div><span className="lbl">DATE DU CONTRÔLE</span>
                  <input className="in" type="date" value={r.date||today()} onChange={e=>setPt(key,{date:e.target.value})}/></div>
                <div><span className="lbl">JUSTIFICATIF</span>
                  <input className="in" placeholder="Observation, référence…" value={r.note||''} onChange={e=>setPt(key,{note:e.target.value})}/></div>
              </div>
              <div className="row" style={{gap:6,marginTop:8,flexWrap:'wrap',alignItems:'center'}}>
                {(r.photos||[]).map(pid=><ThumbCtrl key={pid} id={pid} onZoom={()=>setZoom({id:pid,date:r.date,legende:label})} onDel={()=>delPhoto(key,pid)}/>)}
                <label className="btn gh s" style={{whiteSpace:'nowrap'}}>{busy===key?'Envoi…':'+ Photo'}
                  <input type="file" accept="image/*" multiple style={{display:'none'}} disabled={busy===key}
                    onChange={e=>{const files=[...e.target.files];e.target.value='';if(files.length)addPhotos(key,g.l,label,files)}}/></label>
              </div>
            </div>}
          </div>;
        })}
      </div>;
    })}
    {zoom&&<Plein p={zoom} close={()=>setZoom(null)}/>}
  </div>;
}

/* ---------------- ARTISANS ---------------- */
function Artisans({data,save}){
  const [f,setF]=useState(null);
  const [lecture,setLecture]=useState(null);
  const ok=()=>{if(!f.nom.trim())return;save({...data,artisans:f.id?data.artisans.map(a=>a.id===f.id?f:a):[...data.artisans,{...f,id:uid()}]});setF(null)};
  const importDecennale=async file=>{
    setLecture({etat:'lecture'});
    let extrait=null,erreurLecture='';
    try{extrait=analyseAttestation(await pdfText(file))}
    catch(e){erreurLecture=(e&&e.message)||String(e)}
    let lien='';
    try{
      const token=await getDriveToken();
      const folderId=await driveAttestationsFolder(token);
      lien=(await uploadToDrive(file,folderId)).webViewLink;
    }catch(e){
      setLecture({etat:'erreur',msg:e&&e.error==='auth_required'?"Connectez Google Drive (bouton ci-dessous) puis réimportez le PDF.":"Envoi du PDF vers Google Drive impossible."});
      return;
    }
    setF(prev=>{
      const n={...prev,lienAttestation:lien};
      if(extrait){
        if(extrait.assureur&&!prev.assureur)n.assureur=extrait.assureur;
        if(extrait.numPolice&&!prev.numPolice)n.numPolice=extrait.numPolice;
        if(extrait.decennaleFin&&!prev.decennaleFin)n.decennaleFin=extrait.decennaleFin;
        if(extrait.siret&&!prev.siret)n.siret=extrait.siret;
        if(extrait.activites&&!prev.activites)n.activites=extrait.activites;
      }
      return n;
    });
    if(!extrait)setLecture({etat:'illisible',msg:erreurLecture});
    else if(!extrait.champsTrouves.length)setLecture({etat:'rien'});
    else setLecture({etat:'ok',champs:extrait.champsTrouves,incertain:extrait.dateIncertaine});
  };
  const st=a=>{
    if(!a.decennaleFin)return{t:'Décennale non renseignée',c:TERRA};
    const j=Math.round((new Date(a.decennaleFin)-new Date())/86400000);
    if(j<0)return{t:'Décennale expirée le '+fd(a.decennaleFin),c:TERRA};
    if(j<60)return{t:'Décennale expire dans '+j+' j',c:AMBER};
    return{t:'Décennale valide jusqu\u2019au '+fd(a.decennaleFin),c:GREEN};
  };
  const al=data.artisans.filter(a=>!a.decennaleFin||new Date(a.decennaleFin)<new Date());
  const formulaire=f?<div className="card">
      <Fld label="RAISON SOCIALE"><input className="in" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})}/></Fld>
      <Fld label="CORPS D'ÉTAT"><select className="in" value={f.corps} onChange={e=>setF({...f,corps:e.target.value})}><option value="">— choisir —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      <Fld label="ATTESTATION DÉCENNALE (PDF)">
        <div className="row" style={{gap:14,alignItems:'center',flexWrap:'wrap'}}>
          <label className="btn gh s" style={{whiteSpace:'nowrap'}}>{lecture&&lecture.etat==='lecture'?'Lecture du PDF…':(f.lienAttestation?'Remplacer le PDF':'Importer le PDF')}
            <input type="file" accept="application/pdf" style={{display:'none'}} disabled={lecture&&lecture.etat==='lecture'}
              onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importDecennale(file)}}/></label>
          {f.lienAttestation&&<a href={f.lienAttestation} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir l'attestation</a>}
        </div>
        {lecture&&lecture.etat==='ok'&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
          PDF importé. Champs remplis automatiquement : {lecture.champs.map(c=>({assureur:'assureur',numPolice:'n° de police',decennaleFin:'date de validité',siret:'SIRET',activites:'activités garanties'}[c])).filter(Boolean).join(', ')}.
          {lecture.incertain&&' La date a été déduite sans mot-clé explicite.'} À vérifier avant d'enregistrer.</div>}
        {lecture&&lecture.etat==='rien'&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
          PDF importé, mais aucune information reconnue automatiquement. Saisissez les champs à la main.</div>}
        {lecture&&lecture.etat==='illisible'&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
          PDF importé, mais son texte n'a pas pu être lu (attestation scannée ou image). Saisissez les champs à la main.</div>}
        {lecture&&lecture.etat==='erreur'&&<div className="xs" style={{marginTop:6,color:TERRA,lineHeight:1.5}}>{lecture.msg}</div>}
      </Fld>
      <div className="g2">
        <Fld label="TÉLÉPHONE"><input className="in" type="tel" value={f.tel} onChange={e=>setF({...f,tel:e.target.value})}/></Fld>
        <Fld label="EMAIL"><input className="in" type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></Fld>
      </div>
      <Fld label="ADRESSE"><input className="in" value={f.adresse||''} onChange={e=>setF({...f,adresse:e.target.value})}/></Fld>
      <Fld label="SIRET / SIREN"><input className="in" value={f.siret||''} onChange={e=>setF({...f,siret:e.target.value})}/></Fld>
      <Fld label="ACTIVITÉS GARANTIES PAR LA DÉCENNALE">
        <textarea className="in" rows={3} value={f.activites||''} onChange={e=>setF({...f,activites:e.target.value})}/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>Le lot que vous lui confiez doit figurer dans cette liste, sinon la garantie ne joue pas.</div>
      </Fld>
      <div className="g2">
        <Fld label="ASSUREUR"><input className="in" value={f.assureur} onChange={e=>setF({...f,assureur:e.target.value})}/></Fld>
        <Fld label="N° DE POLICE"><input className="in" value={f.numPolice} onChange={e=>setF({...f,numPolice:e.target.value})}/></Fld>
      </div>
      <Fld label="DÉCENNALE VALIDE JUSQU'AU"><input className="in" type="date" value={f.decennaleFin} onChange={e=>setF({...f,decennaleFin:e.target.value})}/></Fld>
      <Fld label="LIEN VERS L'ATTESTATION"><input className="in" placeholder="Rempli par l'import du PDF, ou collez un lien…" value={f.lienAttestation} onChange={e=>setF({...f,lienAttestation:e.target.value})}/></Fld>
      <DriveStatus/>
      <Acts onSave={()=>{setLecture(null);ok()}} onCancel={()=>{setLecture(null);setF(null)}} onDel={f.id?()=>{save({...data,artisans:data.artisans.filter(a=>a.id!==f.id)});setLecture(null);setF(null)}:null}/>
    </div>:null;
  return <div>
    <Bordereaux data={data} save={save}/>
    <H2 action={<button className="btn acc s" onClick={()=>{setLecture(null);setF({nom:'',corps:'',tel:'',email:'',adresse:'',siret:'',activites:'',assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''})}}>+ Artisan</button>}>ARTISANS ({data.artisans.length})</H2>
    {al.length>0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {al.length} artisan{al.length>1?'s':''} sans décennale valide. Ne pas signer de marché avant régularisation.</div>}
    {f&&!f.id&&formulaire}
    {!data.artisans.length&&!f&&<Empty>Aucun artisan. Constituez votre carnet d'adresses.</Empty>}
    {data.artisans.map(a=>{
      const s=st(a),n=data.marches.filter(m=>m.artisanId===a.id).length;
      /* la fiche s'ouvre sous la carte touchée : on ne remonte pas la page */
      if(f&&f.id===a.id)return <React.Fragment key={a.id}>{formulaire}</React.Fragment>;
      return <div key={a.id} className="card" style={{borderLeft:'3px solid '+s.c}}>
        <div onClick={()=>{setLecture(null);setF(a)}}>
          <div className="sp"><span className="b sm" style={{color:NAVY}}>{a.nom}</span><span className="xs mut">{a.corps}</span></div>
          <div className="xs" style={{color:s.c,marginTop:3}}>{s.t}</div>
          <div className="xs mut" style={{marginTop:2}}>{n} lot{n>1?'s':''} attribué{n>1?'s':''}</div>
          {a.adresse&&<div className="xs mut" style={{marginTop:2}}>{a.adresse}</div>}
          {a.activites&&<div className="xs mut" style={{marginTop:2,lineHeight:1.5}}>Couvert : {a.activites}</div>}
        </div>
        <div className="row xs" style={{gap:14,marginTop:8}}>
          {a.tel&&<a href={'tel:'+a.tel} style={{color:TERRA}}>Appeler</a>}
          {a.tel&&<a href={'https://wa.me/'+wa(a.tel)} style={{color:TERRA}}>WhatsApp</a>}
          {a.email&&<a href={'mailto:'+a.email} style={{color:TERRA}}>Email</a>}
          {a.lienAttestation&&<a href={a.lienAttestation} target="_blank" rel="noreferrer" style={{color:TERRA}}>Attestation</a>}
        </div>
      </div>;
    })}
  </div>;
}

/* ---------------- BIBLIOTHÈQUE DE PRIX ----------------
   Un marché déjà rédigé sous Word contient sa propre grille : code, libellé,
   unité, prix unitaire. On l'en extrait une fois pour toutes, on la rattache à
   l'artisan qui l'applique, et elle sert ensuite à chiffrer les lots suivants. */
function Bordereaux({data,save}){
  const [f,setF]=useState(null);
  const [imp,setImp]=useState(null);
  const [deplie,setDeplie]=useState(false);
  const B=data.bordereaux||[];
  const nomArt=id=>(data.artisans.find(a=>a.id===id)||{}).nom||'';
  const importer=async file=>{
    setImp({etat:'lecture'});
    const {txt,motif}=await lireDocumentLignes(file);
    if(!txt){setImp({etat:'erreur',msg:motif||'fichier illisible'});return}
    const lots=analyseBordereau(txt);
    if(!lots.length){setImp({etat:'erreur',msg:'aucun tableau « DÉSIGNATION DES TRAVAUX » trouvé dans ce document'});return}
    /* le prix unitaire est ce qui se garde ; la quantité appartient au chantier
       d'origine et n'a rien à faire dans une grille tarifaire. */
    const neufs=lots.map(l=>({id:uid(),nom:l.nom,corps:'',artisanIds:[],maj:today(),
      articles:l.articles.map(a=>({id:uid(),code:a.code,libelle:a.libelle,unite:a.unite,pu:a.pu}))}));
    save({...data,bordereaux:[...B,...neufs]});
    setImp({etat:'ok',lots:lots.map((l,i)=>({nom:l.nom,n:l.articles.length,ht:quantitatifHT(l.articles)}))});
  };
  const ok=()=>{
    if(!f.nom.trim())return;
    const n={...f,maj:today()};
    save({...data,bordereaux:f.neuf?[...B,{...n,neuf:undefined}]:B.map(b=>b.id===f.id?n:b)});
    setF(null);
  };
  const majArt=(i,k,v)=>setF(p=>({...p,articles:p.articles.map((a,j)=>j===i?{...a,[k]:v}:a)}));
  const ouvert=deplie||!!f;
  return <div style={{marginBottom:20,paddingBottom:16,borderBottom:'1px solid '+RULE}}>
    <H2 action={ouvert
      ?<button className="btn gh s" onClick={()=>{setImp(null);setF({neuf:true,id:uid(),nom:'',corps:'',artisanIds:[],articles:[]})}}>+ Bordereau</button>
      :<button className="btn gh s" onClick={()=>setDeplie(true)}>Ouvrir</button>}>
      BIBLIOTHÈQUE DE PRIX ({B.length})</H2>
    {!ouvert&&<div className="xs mut" style={{lineHeight:1.5}}>
      Les grilles tarifaires de vos artisans, article par article. Elles servent à chiffrer un lot depuis l'onglet MARCHÉS :
      vous ne saisissez que les quantités, le montant du marché en découle.</div>}
    {ouvert&&!f&&<div className="card">
      <div className="xs mut" style={{lineHeight:1.5}}>Déposez un marché de travaux au format Word : l'application y lit chaque tableau
        « DÉSIGNATION DES TRAVAUX » et en retient les prix unitaires, lot par lot.</div>
      <div className="row" style={{gap:14,alignItems:'center',flexWrap:'wrap',marginTop:10}}>
        <label className="btn acc s" style={{whiteSpace:'nowrap'}}>{imp&&imp.etat==='lecture'?'Lecture du document…':'Importer un marché Word'}
          <input type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style={{display:'none'}}
            disabled={imp&&imp.etat==='lecture'}
            onChange={e=>{const x=e.target.files[0];e.target.value='';if(x)importer(x)}}/></label>
      </div>
      {imp&&imp.etat==='erreur'&&<div className="xs" style={{marginTop:8,color:TERRA,lineHeight:1.5}}>Rien n'a été importé : {imp.msg}.</div>}
      {imp&&imp.etat==='ok'&&<div className="xs" style={{marginTop:8,color:GREEN,lineHeight:1.5}}>
        {imp.lots.length} bordereau{imp.lots.length>1?'x':''} importé{imp.lots.length>1?'s':''}.
        Ouvrez chacun pour lui rattacher son artisan.
        <div style={{marginTop:6,color:MUTED}}>{imp.lots.map(l=><div key={l.nom}>{l.nom} — {l.n} articles, {eur(l.ht)} au quantitatif d'origine</div>)}</div>
      </div>}
    </div>}
    {f&&<div className="card">
      <Fld label="INTITULÉ DU BORDEREAU"><input className="in" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})}/></Fld>
      <div className="g2">
        <Fld label="CORPS D'ÉTAT"><select className="in" value={f.corps||''} onChange={e=>setF({...f,corps:e.target.value})}>
          <option value="">— choisir —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      </div>
      {/* une même grille peut servir à plusieurs entreprises : Plomberie Ornaise
          et BVPC appliquent les mêmes prix, elles la partagent. */}
      <Fld label={'ENTREPRISES QUI APPLIQUENT CES PRIX ('+bordArtisans(f).length+')'}>
        {!data.artisans.length&&<div className="xs mut">Aucun artisan au carnet d'adresses.</div>}
        <div style={{display:'flex',flexWrap:'wrap',gap:'6px 16px'}}>
          {data.artisans.map(a=>{
            const coche=bordPourArtisan(f,a.id);
            return <label key={a.id} className="xs row" style={{gap:6,alignItems:'center',cursor:'pointer'}}>
              <input type="checkbox" checked={coche} onChange={()=>setF(p=>{
                const L=bordArtisans(p);
                return {...p,artisanId:undefined,artisanIds:coche?L.filter(x=>x!==a.id):[...L,a.id]};
              })}/>
              <span>{a.nom}</span></label>;
          })}
        </div>
      </Fld>
      <div className="lbl" style={{marginTop:14}}>ARTICLES ({f.articles.length})</div>
      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:520}}>
        <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
          <th style={{padding:'6px 4px'}}>Code</th><th style={{padding:'6px 4px'}}>Libellé</th>
          <th style={{padding:'6px 4px'}}>U</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Prix unitaire</th><th/>
        </tr></thead>
        <tbody>{f.articles.map((a,i)=><tr key={a.id||i} style={{borderBottom:'1px solid '+RULE}}>
          <td style={{padding:'3px 4px'}}><input className="in" style={{padding:'4px 6px',fontSize:12,width:120}} value={a.code||''} onChange={e=>majArt(i,'code',e.target.value)}/></td>
          <td style={{padding:'3px 4px'}}><input className="in" style={{padding:'4px 6px',fontSize:12}} value={a.libelle||''} onChange={e=>majArt(i,'libelle',e.target.value)}/></td>
          <td style={{padding:'3px 4px'}}><input className="in" style={{padding:'4px 6px',fontSize:12,width:52}} value={a.unite||''} onChange={e=>majArt(i,'unite',artUnite(e.target.value))}/></td>
          <td style={{padding:'3px 4px'}}><input className="in" style={{padding:'4px 6px',fontSize:12,width:90,textAlign:'right'}} type="number" step="0.01" placeholder="€ HT"
            value={a.pu===undefined||a.pu===null?'':a.pu} onChange={e=>majArt(i,'pu',e.target.value===''?'':+e.target.value)}/></td>
          <td style={{padding:'3px 4px'}}><button className="btn gh s" onClick={()=>setF(p=>({...p,articles:p.articles.filter((x,j)=>j!==i)}))}>✕</button></td>
        </tr>)}</tbody>
      </table></div>
      {!f.articles.length&&<div className="xs mut" style={{padding:'10px 0'}}>Aucun article. Ajoutez-en un, ou revenez en arrière et importez un marché Word.</div>}
      {/* la référence neuve se pose en tête : on la voit, on la remplit, on n'a pas
          à faire défiler 160 lignes pour la retrouver. */}
      <button className="btn acc s" style={{marginTop:8}}
        onClick={()=>setF(p=>({...p,articles:[{id:uid(),code:'',libelle:'',unite:'U',pu:''},...p.articles]}))}>+ Référence</button>
      <Acts onSave={ok} onCancel={()=>setF(null)}
        onDel={f.neuf?null:()=>{save({...data,bordereaux:B.filter(b=>b.id!==f.id)});setF(null)}}/>
    </div>}
    {ouvert&&!B.length&&!f&&<Empty>Aucun bordereau. Importez un marché déjà rédigé pour constituer votre grille.</Empty>}
    {ouvert&&!f&&B.map(b=>{
      const noms=bordArtisans(b).map(nomArt).filter(Boolean);
      const art=noms.join(', ');
      return <button key={b.id} className="card" style={{borderLeft:'3px solid '+(art?NAVY:AMBER)}} onClick={()=>setF(b)}>
        <div className="sp"><span className="b sm" style={{color:NAVY}}>{b.nom}</span>
          <span className="xs mut" style={{whiteSpace:'nowrap'}}>{(b.articles||[]).length} articles</span></div>
        <div className="xs" style={{marginTop:3,color:art?MUTED:AMBER}}>{art?art+(b.corps?' — '+b.corps:''):'Aucune entreprise rattachée'}</div>
        {b.maj&&<div className="xs mut" style={{marginTop:2}}>Prix à jour au {fd(b.maj)}</div>}
      </button>;
    })}
  </div>;
}

/* ---------------- TABLEAU DE BORD ----------------
   Ce qui appelle une action aujourd'hui, et rien d'autre : les chiffrages qu'on
   attend de vous, les étapes en retard, les pièces qui manquent à la phase où
   en est chaque chantier, et les décennales qui tombent. */

/* les pièces attendues à la phase courante et qui ne sont pas encore cochées */
function piecesManquantes(ch){
  const attendues=DOCS_PHASE[ch.statut]||[];
  const d=ch.docs||{};
  return attendues.filter(id=>!(d[id]&&d[id].fait))
    .map(id=>(DOCS.find(x=>x.id===id)||{l:id}).l);
}
/* les pièces du terrain qui manquent encore à un prospect */
function piecesProspectManquantes(p){
  const pj=(p&&p.pj)||{};
  return PIECES_PROSPECT.filter(d=>{
    const c=pj[d.id]||{};
    const F=c.fichiers||(d.id==='apd'?((p&&p.plans)||[]):[]);
    return !c.fait&&!F.length;
  }).map(d=>d.l);
}
/* jalons en retard, et ceux qui tombent dans les quinze jours */
function jalonsUrgents(ch){
  const t=today();
  const limite=new Date(Date.now()+15*86400000).toISOString().slice(0,10);
  return (ch.jalons||[]).filter(j=>j.prevue&&!j.reelle&&j.prevue<=limite)
    .map(j=>({...j,retard:j.prevue<t,jours:joursDepuis(j.prevue)}))
    .sort((a,b)=>(a.prevue||'').localeCompare(b.prevue||''));
}

function TableauBord({data,open,allerA}){
  const P=data.prospects||[];
  const chiffrages=P.filter(prospectAFaire)
    .map(p=>({...p,attente:joursDepuis(p.demandeLe)||0}))
    .sort((a,b)=>b.attente-a.attente);
  /* on ne parle que des chantiers vivants : un dossier clos n'a plus de retard */
  const actifs=data.chantiers.filter(c=>c.statut!=='clos');
  const retards=[];
  actifs.forEach(c=>jalonsUrgents(c).forEach(j=>retards.push({ch:c,j})));
  retards.sort((a,b)=>(a.j.prevue||'').localeCompare(b.j.prevue||''));
  const pieces=actifs.map(c=>({ch:c,manque:piecesManquantes(c)})).filter(x=>x.manque.length);
  const t=today();
  const decen=data.artisans.map(a=>({a,j:a.decennaleFin?Math.round((new Date(a.decennaleFin)-new Date(t))/86400000):null}))
    .filter(x=>x.j===null||x.j<60).sort((a,b)=>(a.j===null?-1e9:a.j)-(b.j===null?-1e9:b.j));
  const rien=!chiffrages.length&&!retards.length&&!pieces.length&&!decen.length;
  const Bloc=({titre,n,c,children})=><div className="card" style={{borderLeft:'3px solid '+c}}>
    <div className="sp" style={{marginBottom:8}}>
      <span className="b sm" style={{color:c}}>{titre}</span>
      <span className="pill" style={{background:c+'1A',color:c}}>{n}</span></div>
    {children}</div>;
  const item=(k,onClick,gauche,droite,couleur)=><button key={k} onClick={onClick}
    style={{display:'flex',width:'100%',justifyContent:'space-between',gap:10,alignItems:'baseline',
      textAlign:'left',background:'none',border:'none',borderTop:'1px solid '+RULE,padding:'7px 0'}}>
    <span className="xs" style={{flex:1,minWidth:0}}>{gauche}</span>
    <span className="xs b" style={{color:couleur||MUTED,whiteSpace:'nowrap'}}>{droite}</span></button>;
  return <div>
    <H2>TABLEAU DE BORD</H2>
    <div className="g2" style={{marginBottom:10}}>
      <Stat l="Chiffrages à réaliser" v={String(chiffrages.length)} c={chiffrages.length?TERRA:GREEN}/>
      <Stat l="Étapes en retard" v={String(retards.filter(r=>r.j.retard).length)} c={retards.some(r=>r.j.retard)?TERRA:GREEN}/>
      <Stat l="Chantiers en cours" v={String(actifs.length)} c={NAVY}/>
      <Stat l="Décennales à surveiller" v={String(decen.length)} c={decen.length?AMBER:GREEN}/>
    </div>
    {rien&&<div className="card" style={{borderLeft:'3px solid '+GREEN}}>
      <div className="b sm" style={{color:GREEN}}>Rien ne réclame d’action</div>
      <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>Aucun chiffrage en attente, aucune étape en retard, aucune pièce manquante à la phase en cours et aucune décennale proche de son terme.</div>
    </div>}

    {chiffrages.length>0&&<Bloc titre="DEMANDES DE CHIFFRAGE" n={chiffrages.length} c={TERRA}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Déposées par le commercial, elles attendent votre réponse.</div>
      {chiffrages.map(p=>{
        const mq=piecesProspectManquantes(p);
        return item(p.id,()=>allerA('prospects'),
          <span><b>{p.nom}</b>{p.commercial?<span className="mut"> · {p.commercial}</span>:null}
            <span className="mut">{p.commune?' · '+p.commune:''}</span>
            {mq.length>0&&<div className="mut" style={{marginTop:2,lineHeight:1.5}}>Manque : {mq.join(' · ')}</div>}</span>,
          p.attente>0?p.attente+' j':'aujourd’hui', p.attente>7?TERRA:p.attente>3?AMBER:MUTED);
      })}
    </Bloc>}

    {retards.length>0&&<div style={{marginTop:8}}><Bloc titre="ÉTAPES À TENIR" n={retards.length} c={retards.some(r=>r.j.retard)?TERRA:AMBER}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>En retard, ou prévues dans les quinze jours.</div>
      {retards.map(({ch,j})=>item(ch.id+':'+j.id,()=>open(ch.id),
        <span><b>{j.label}</b><span className="mut"> · {ch.nom}</span></span>,
        j.retard?'retard '+j.jours+' j':fd(j.prevue), j.retard?TERRA:AMBER))}
    </Bloc></div>}

    {pieces.length>0&&<div style={{marginTop:8}}><Bloc titre="PIÈCES À AJOUTER" n={pieces.reduce((s,x)=>s+x.manque.length,0)} c={AMBER}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Les pièces attendues à la phase où en est chaque dossier.</div>
      {pieces.map(({ch,manque})=>item(ch.id,()=>open(ch.id),
        <span><b>{ch.nom}</b><span className="mut"> · {PHASE[ch.statut]}</span>
          <div className="mut" style={{marginTop:2,lineHeight:1.5}}>{manque.join(' · ')}</div></span>,
        manque.length+' pièce'+(manque.length>1?'s':''), AMBER))}
    </Bloc></div>}

    {decen.length>0&&<div style={{marginTop:8}}><Bloc titre="ASSURANCES DÉCENNALES" n={decen.length} c={AMBER}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Sans décennale à jour, l’application refuse d’émettre le marché.</div>
      {decen.map(({a,j})=>item(a.id,()=>allerA('artisans'),
        <span><b>{a.nom}</b>{a.corps?<span className="mut"> · {a.corps}</span>:null}</span>,
        j===null?'non renseignée':j<0?'expirée depuis '+(-j)+' j':'dans '+j+' j',
        j===null||j<0?TERRA:AMBER))}
    </Bloc></div>}
  </div>;
}

/* ---------------- PROSPECTS ----------------
   L'affaire avant qu'elle soit une affaire : le commercial dépose ce qu'il sait
   du projet et demande un chiffrage, le maître d'œuvre le pose et arrête sa
   marge. Une fois signée, la fiche se transforme en chantier. */
function Prospects({data,save}){
  const [f,setF]=useState(null);
  const [ouv,setOuv]=useState('');
  const [filtre,setFiltre]=useState('actifs');
  const P=data.prospects||[];
  const maj=(id,p)=>save({...data,prospects:P.map(x=>x.id===id?{...x,...p}:x)});
  const neuf=()=>({nom:'',client:'',telClient:'',emailClient:'',adresseClient:'',commune:'',
    commercial:'',demandeLe:today(),statut:'demande',
    typeTerrain:'',surfaceTerrain:'',prestation:'',chauffage:'',niveaux:'',nbChambres:'',
    surfaceHabitable:'',surfaceAnnexes:'',budgetClient:'',demande:'',
    courtier:false,courtierNom:'',courtierTel:'',
    postes:[],coutHT:'',margePct:'',margeMontant:'',tva:'',remisLe:'',reponse:'',
    retroPct:'',retroMontant:'',
    dommageOuvrage:'',taxeAmenagement:'',taxeRaccordement:'',taxes:[],
    pj:{},chiffrages:[],plans:[],pieces:[]});
  const ok=()=>{
    if(!(f.nom||'').trim())return;
    const r={...f,surfaceTerrain:f.surfaceTerrain===''?'':+f.surfaceTerrain,
      surfaceHabitable:f.surfaceHabitable===''?'':+f.surfaceHabitable,
      surfaceAnnexes:f.surfaceAnnexes===''?'':+f.surfaceAnnexes,
      nbChambres:f.nbChambres===''?'':+f.nbChambres,
      budgetClient:f.budgetClient===''?'':+f.budgetClient,
      coutHT:f.coutHT===''?'':+f.coutHT,margePct:f.margePct===''?'':+f.margePct,
      margeMontant:f.margeMontant===''?'':+f.margeMontant,tva:f.tva===''?'':+f.tva,
      retroPct:f.retroPct===''?'':+f.retroPct,retroMontant:f.retroMontant===''?'':+f.retroMontant,
      dommageOuvrage:f.dommageOuvrage===''?'':+f.dommageOuvrage,
      taxeAmenagement:f.taxeAmenagement===''?'':+f.taxeAmenagement,
      taxeRaccordement:f.taxeRaccordement===''?'':+f.taxeRaccordement};
    save({...data,prospects:f.id?P.map(x=>x.id===f.id?{...x,...r}:x):[...P,{...r,id:uid()}]});
    setF(null);
  };
  /* la fiche signée devient un chantier : on ne ressaisit pas ce qui est déjà là */
  const transformer=p=>{
    if(!confirm('Créer le chantier « '+p.nom+' » à partir de ce prospect ?\n\nLe prospect est conservé et passe en « Signé ».'))return;
    const id=uid();
    const ch={id,nom:p.nom,client:p.client||'',telClient:p.telClient||'',emailClient:p.emailClient||'',
      adresse:p.commune||'',adresseClient:p.adresseClient||'',
      surfaceHabitable:p.surfaceHabitable||'',surfacePlancher:'',
      budgetClientTTC:prospectPrixTTC(p)||'',budget:prospectCoutHT(p)||'',
      honorairesPct:'',honorairesMontant:prospectMargeHT(p)||'',
      statut:'etude',lienDrive:'',docs:{},jalons:[],prospectId:p.id};
    save({...data,chantiers:[...data.chantiers,ch],
      prospects:P.map(x=>x.id===p.id?{...x,statut:'gagne',chantierId:id}:x)});
    getDriveToken().then(t=>creerArborescence(t,id,ch.nom)).catch(()=>{});
  };
  const L=P.filter(p=>filtre==='tous'?true:filtre==='afaire'?prospectAFaire(p)
    :['demande','encours','chiffre','attente'].indexOf(p.statut)>=0)
    .sort((a,b)=>{
      /* ce qui attend une réponse remonte, puis le plus ancien d'abord */
      const pa=prospectAFaire(a)?0:1, pb=prospectAFaire(b)?0:1;
      if(pa!==pb)return pa-pb;
      return (a.demandeLe||'9999').localeCompare(b.demandeLe||'9999');
    });
  const nAF=P.filter(prospectAFaire).length;
  return <div>
    <H2 action={<button className="btn acc s" onClick={()=>setF(neuf())}>+ Prospect</button>}>PROSPECTS ({P.length})</H2>
    {nAF>0&&<div className="xs" style={{marginBottom:10,padding:'8px 10px',borderRadius:8,
      background:'#F6E2DC',borderLeft:'3px solid '+TERRA,lineHeight:1.6}}>
      <b style={{color:TERRA}}>{nAF} chiffrage{nAF>1?'s':''} à réaliser</b> — ce sont les fiches en tête de liste.
    </div>}
    {f&&<div className="card" style={{borderLeft:'3px solid '+TERRA}}>
      <Fld label="NOM DU PROJET"><input className="in" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})} placeholder="Maison Dupont — Ceaucé"/></Fld>
      <ImportContact label="Remplir depuis Contacts"
        onLu={c=>setF(p=>({...p,client:c.nom||p.client,telClient:c.tel||p.telClient,
          emailClient:c.email||p.emailClient||'',adresseClient:c.adresse||p.adresseClient}))}/>
      <div className="g2">
        <Fld label="CLIENT"><input className="in" value={f.client} onChange={e=>setF({...f,client:e.target.value})}/></Fld>
        <Fld label="TÉL. CLIENT"><input className="in" type="tel" value={f.telClient||''} onChange={e=>setF({...f,telClient:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="E-MAIL CLIENT"><input className="in" type="email" value={f.emailClient||''} onChange={e=>setF({...f,emailClient:e.target.value})}/></Fld>
        <Fld label="ADRESSE DU CLIENT"><input className="in" value={f.adresseClient||''} onChange={e=>setF({...f,adresseClient:e.target.value})}/></Fld>
      </div>
      <Fld label="COMMUNE DE CONSTRUCTION"><input className="in" value={f.commune||''} onChange={e=>setF({...f,commune:e.target.value})} placeholder="Lotissement, commune, parcelle…"/></Fld>

      <div className="h2" style={{marginTop:16,marginBottom:8,fontSize:13}}>LA DEMANDE DU COMMERCIAL</div>
      <div className="g2">
        <Fld label="COMMERCIAL"><input className="in" value={f.commercial||''} onChange={e=>setF({...f,commercial:e.target.value})}/></Fld>
        <Fld label="DEMANDÉ LE"><input className="in" type="date" value={f.demandeLe||''} onChange={e=>setF({...f,demandeLe:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="TYPE DE TERRAIN"><input className="in" list="pterr" value={f.typeTerrain||''} onChange={e=>setF({...f,typeTerrain:e.target.value})}/>
          <datalist id="pterr">{TERRAINS.map(t=><option key={t} value={t}/>)}</datalist></Fld>
        <Fld label="SURFACE DU TERRAIN (m²)"><input className="in" type="number" step="1" value={f.surfaceTerrain||''} onChange={e=>setF({...f,surfaceTerrain:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="PRESTATION SOUHAITÉE"><input className="in" list="ppres" value={f.prestation||''} onChange={e=>setF({...f,prestation:e.target.value})}/>
          <datalist id="ppres">{PRESTATIONS.map(t=><option key={t} value={t}/>)}</datalist></Fld>
        <Fld label="TYPE DE CHAUFFAGE"><input className="in" list="pchauf" value={f.chauffage||''} onChange={e=>setF({...f,chauffage:e.target.value})}/>
          <datalist id="pchauf">{CHAUFFAGES.map(t=><option key={t} value={t}/>)}</datalist></Fld>
      </div>
      <div className="g2">
        <Fld label="NIVEAUX"><input className="in" list="pniv" value={f.niveaux||''} onChange={e=>setF({...f,niveaux:e.target.value})}/>
          <datalist id="pniv">{NIVEAUX.map(t=><option key={t} value={t}/>)}</datalist></Fld>
        <Fld label="NOMBRE DE CHAMBRES"><input className="in" type="number" step="1" value={f.nbChambres||''} onChange={e=>setF({...f,nbChambres:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="SURFACE HABITABLE (m²)"><input className="in" type="number" step="0.01" value={f.surfaceHabitable||''} onChange={e=>setF({...f,surfaceHabitable:e.target.value})}/></Fld>
        <Fld label="SURFACES ANNEXES (m²)"><input className="in" type="number" step="0.01" value={f.surfaceAnnexes||''} onChange={e=>setF({...f,surfaceAnnexes:e.target.value})} placeholder="Garage, cellier, préau…"/></Fld>
      </div>
      <div className="xs mut" style={{marginTop:-4,marginBottom:10,lineHeight:1.5}}>
        Surface pondérée retenue pour le ratio : <b>{surfacePonderee(f).toLocaleString('fr-FR')} m²</b> — l'habitable plus la moitié des annexes.
      </div>
      <Fld label="BUDGET ANNONCÉ PAR LE CLIENT (€ TTC)"><input className="in" type="number" value={f.budgetClient||''} onChange={e=>setF({...f,budgetClient:e.target.value})}/></Fld>
      <Fld label="FINANCEMENT">
        <label className="row xs" style={{gap:8,alignItems:'center',cursor:'pointer'}}>
          <input type="checkbox" checked={!!f.courtier} onChange={e=>setF({...f,courtier:e.target.checked})}/>
          <span>Le client passe par un courtier</span></label>
        {f.courtier&&<div className="g2" style={{marginTop:8}}>
          <input className="in" placeholder="Nom du courtier" value={f.courtierNom||''} onChange={e=>setF({...f,courtierNom:e.target.value})}/>
          <input className="in" type="tel" placeholder="Téléphone" value={f.courtierTel||''} onChange={e=>setF({...f,courtierTel:e.target.value})}/>
        </div>}
      </Fld>
      <Fld label="PRÉCISIONS DE LA DEMANDE"><textarea className="in" rows="3" value={f.demande||''} onChange={e=>setF({...f,demande:e.target.value})} placeholder="Contraintes du terrain, souhaits particuliers, délais…"/></Fld>

      <div className="h2" style={{marginTop:16,marginBottom:8,fontSize:13}}>VOTRE CHIFFRAGE</div>
      <PostesChiffrage postes={f.postes||[]} onChange={v=>setF({...f,postes:v})}/>
      {!prospectPostesHT(f)&&<Fld label="COÛT DES TRAVAUX HT (€) — SANS DÉTAIL PAR POSTE">
        <input className="in" type="number" value={f.coutHT||''} onChange={e=>setF({...f,coutHT:e.target.value})}/></Fld>}
      <div className="g2">
        <Fld label="MARGE MAÎTRE D’ŒUVRE (%)"><input className="in" type="number" step="0.1" value={f.margePct||''} onChange={e=>setF({...f,margePct:e.target.value})}/></Fld>
        <Fld label="MARGE EN € — remplace le calcul"><input className="in" type="number"
          placeholder={'Auto : '+eur(prospectCoutHT(f)*(+f.margePct||0)/100)}
          value={f.margeMontant||''} onChange={e=>setF({...f,margeMontant:e.target.value})}/></Fld>
      </div>
      <Fld label="TVA (%)"><input className="in" type="number" step="0.1" placeholder="20" value={f.tva===undefined?'':f.tva} onChange={e=>setF({...f,tva:e.target.value})}/></Fld>

      <div className="h2" style={{marginTop:16,marginBottom:4,fontSize:13}}>ASSURANCE ET TAXES</div>
      <div className="xs mut" style={{marginBottom:8,lineHeight:1.5}}>
        Elles pèsent sur l'opération sans être le prix de la maison : elles s'ajoutent au total sans entrer dans le ratio au m².
      </div>
      <div className="g2">
        <Fld label="DOMMAGES-OUVRAGE ESTIMÉE (€)"><input className="in" type="number" value={f.dommageOuvrage||''} onChange={e=>setF({...f,dommageOuvrage:e.target.value})}/></Fld>
        <Fld label="TAXE D’AMÉNAGEMENT (€)"><input className="in" type="number" value={f.taxeAmenagement||''} onChange={e=>setF({...f,taxeAmenagement:e.target.value})}/></Fld>
      </div>
      <Fld label="TAXE DE RACCORDEMENT (€)"><input className="in" type="number" value={f.taxeRaccordement||''} onChange={e=>setF({...f,taxeRaccordement:e.target.value})} placeholder="Eau, électricité, assainissement…"/></Fld>
      <LignesMontants lignes={f.taxes||[]} onChange={v=>setF({...f,taxes:v})}
        label="AUTRES TAXES ET PARTICIPATIONS" ajout="+ Taxe" exemple="Redevance archéologie, PFAC, PVR…"/>

      <div className="h2" style={{marginTop:16,marginBottom:8,fontSize:13}}>RÉTROCESSION PRÉVUE</div>
      <div className="xs" style={{marginBottom:8,padding:'8px 10px',borderRadius:8,
        background:'#F4F1EB',borderLeft:'3px solid '+NAVY,lineHeight:1.6}}>
        <b style={{color:NAVY}}>Interne</b> — elle porte sur le coût des travaux, pas sur votre marge.
        Elle n'apparaît ni sur le chiffrage remis au commercial, ni sur aucun document client.
      </div>
      <div className="g2">
        <Fld label="TAUX DE RÉTROCESSION (%)"><input className="in" type="number" step="0.1" value={f.retroPct||''} onChange={e=>setF({...f,retroPct:e.target.value})}/></Fld>
        <Fld label="MONTANT EN € — remplace le calcul"><input className="in" type="number"
          placeholder={'Auto : '+eur(prospectCoutHT(f)*(+f.retroPct||0)/100)}
          value={f.retroMontant||''} onChange={e=>setF({...f,retroMontant:e.target.value})}/></Fld>
      </div>

      <RecapChiffrage p={f} interne/>
      <div className="g2">
        <Fld label="STATUT"><select className="in" value={f.statut} onChange={e=>setF({...f,statut:e.target.value})}>
          {PROSPECT_ST.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Fld>
        <Fld label="CHIFFRAGE REMIS LE"><input className="in" type="date" value={f.remisLe||''} onChange={e=>setF({...f,remisLe:e.target.value})}/></Fld>
      </div>
      <Fld label="VOTRE RÉPONSE AU COMMERCIAL"><textarea className="in" rows="3" value={f.reponse||''} onChange={e=>setF({...f,reponse:e.target.value})} placeholder="Hypothèses retenues, postes exclus, réserves…"/></Fld>
      <Acts onSave={ok} onCancel={()=>setF(null)}
        onDel={f.id?()=>{if(confirm('Supprimer ce prospect ?')){save({...data,prospects:P.filter(x=>x.id!==f.id)});setF(null)}}:null}/>
    </div>}
    {P.length>0&&<div className="row" style={{gap:6,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
      <span className="xs mut">Afficher</span>
      {[['afaire','À chiffrer'],['actifs','En cours'],['tous','Tous']].map(([id,l])=>
        <button key={id} className={'btn s '+(filtre===id?'':'gh')} onClick={()=>setFiltre(id)}>{l}</button>)}
    </div>}
    {!P.length&&!f&&<Empty>Aucun prospect. « + Prospect » ouvre la première demande de chiffrage.</Empty>}
    {P.length>0&&!L.length&&<Empty>Aucun prospect dans cette vue.</Empty>}
    {L.map(p=>{
      const st=prospectSt(p.statut), prix=prospectPrixTTC(p), r=ratioM2(prix,p);
      const attente=prospectAFaire(p)?joursDepuis(p.demandeLe):null;
      return <div key={p.id} className="card" style={{borderLeft:'3px solid '+st.c}}>
        <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
          <span className="b sm" style={{color:NAVY}}>{p.nom}</span>
          <div className="row" style={{gap:6,alignItems:'center',flex:'0 0 auto'}}>
            <span className="pill" style={{background:st.c+'1A',color:st.c}}>{st.label}</span>
            <Plus actif={ouv===p.id} titre="Voir le détail" onClick={()=>setOuv(ouv===p.id?'':p.id)}/>
          </div>
        </div>
        <div className="xs mut" style={{marginTop:3}}>{p.client}{p.commune?' — '+p.commune:''}</div>
        {attente!==null&&attente>0&&<div className="xs b" style={{color:attente>7?TERRA:AMBER,marginTop:3}}>
          En attente depuis {attente} jour{attente>1?'s':''}</div>}
        <div className="g3 xs" style={{marginTop:8}}>
          <div><div className="mut">Prix du projet</div><div className="b">{prix?eur(prix)+' TTC':'à chiffrer'}</div></div>
          <div><div className="mut">Surface pondérée</div><div>{surfacePonderee(p)?surfacePonderee(p).toLocaleString('fr-FR')+' m²':'—'}</div></div>
          <div><div className="mut">Ratio</div><div className="b" style={{color:r?NAVY:MUTED}}>{eurM2(r)}</div></div>
        </div>
        {ouv===p.id&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
          <DetailProspect p={p} maj={v=>maj(p.id,v)}/>
          <div className="row" style={{gap:8,marginTop:12,flexWrap:'wrap'}}>
            <button className="btn s" onClick={()=>setF({...neuf(),...p})}>Modifier</button>
            {p.statut!=='gagne'&&<button className="btn gh s" onClick={()=>transformer(p)}>Transformer en chantier</button>}
            {p.chantierId&&<span className="xs" style={{color:GREEN,alignSelf:'center'}}>✓ Chantier créé</span>}
          </div>
        </div>}
      </div>;
    })}
  </div>;
}

/* le chiffrage poste par poste : un libellé, un montant, et la somme en bas */
function PostesChiffrage({postes,onChange}){
  const L=postes||[];
  const set=(id,p)=>onChange(L.map(x=>x.id===id?{...x,...p}:x));
  return <Fld label="CHIFFRAGE PAR POSTE">
    {L.map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center'}}>
      <input className="in" style={{flex:1,minWidth:0}} list="pcorps" value={x.libelle||''}
        placeholder="Corps d’état" onChange={e=>set(x.id,{libelle:e.target.value})}/>
      <input className="in" style={{width:110,flex:'0 0 auto'}} type="number" value={x.montant||''}
        placeholder="€ HT" onChange={e=>set(x.id,{montant:e.target.value})}/>
      <button className="xs" style={{color:MUTED,background:'none',border:'none',padding:'0 4px'}}
        onClick={()=>onChange(L.filter(y=>y.id!==x.id))}>✕</button>
    </div>)}
    <datalist id="pcorps">{CORPS.map(c=><option key={c} value={c}/>)}</datalist>
    <div className="row" style={{gap:10,alignItems:'center',marginTop:4}}>
      <button className="btn gh s" onClick={()=>onChange([...L,{id:uid(),libelle:'',montant:''}])}>+ Poste</button>
      {L.length>0&&<span className="xs b">Total {eur(prospectPostesHT({postes:L}))} HT</span>}
    </div>
  </Fld>;
}

/* une liste libellé + montant : taxes, participations, tout ce qui s'ajoute */
function LignesMontants({lignes,onChange,label,ajout,exemple}){
  const L=lignes||[];
  const set=(id,p)=>onChange(L.map(x=>x.id===id?{...x,...p}:x));
  const total=L.reduce((s,x)=>s+(+x.montant||0),0);
  return <Fld label={label}>
    {L.map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center'}}>
      <input className="in" style={{flex:1,minWidth:0}} value={x.libelle||''}
        placeholder={exemple} onChange={e=>set(x.id,{libelle:e.target.value})}/>
      <input className="in" style={{width:110,flex:'0 0 auto'}} type="number" value={x.montant||''}
        placeholder="€" onChange={e=>set(x.id,{montant:e.target.value})}/>
      <button className="xs" style={{color:MUTED,background:'none',border:'none',padding:'0 4px'}}
        onClick={()=>onChange(L.filter(y=>y.id!==x.id))}>✕</button>
    </div>)}
    <div className="row" style={{gap:10,alignItems:'center',marginTop:4}}>
      <button className="btn gh s" onClick={()=>onChange([...L,{id:uid(),libelle:'',montant:''}])}>{ajout}</button>
      {L.length>0&&<span className="xs b">Total {eur(total)}</span>}
    </div>
  </Fld>;
}

/* le récapitulatif du chiffrage, tel qu'il se lit une fois les postes saisis.
   « interne » ajoute la rétrocession : elle n'a pas à figurer ailleurs. */
function RecapChiffrage({p,interne}){
  const cout=prospectCoutHT(p), marge=prospectMargeHT(p);
  const ht=prospectPrixHT(p), ttc=prospectPrixTTC(p);
  const rTTC=ratioM2(ttc,p), rHT=ratioM2(ht,p);
  const bud=+((p&&p.budgetClient))||0;
  const taxes=prospectTaxes(p), dOuv=prospectDO(p), op=prospectOperationTTC(p);
  const retro=prospectRetro(p);
  if(!cout&&!marge&&!taxes&&!dOuv)return null;
  const ligne=(l,v,c)=><div className="sp xs" style={{padding:'2px 0'}}>
    <span className="mut">{l}</span><span style={{color:c}}>{v}</span></div>;
  return <div className="card" style={{marginTop:4,marginBottom:12,background:'#F4F1EB',borderLeft:'3px solid '+NAVY}}>
    <div className="g2 xs">

/* Les trois pièces attendues avant de chiffrer : chacune se coche quand elle
   est là. L'étude géorisques se lit en plus, pour en tirer les obligations. */
function PiecesProspect({p,maj,dossier}){
  const pj=p.pj||{};
  const [lecture,setLecture]=useState('');
  const item=id=>pj[id]||{};
  /* le plan d'avant-projet vivait dans « plans » avant que les pièces soient
     structurées : on continue de le lire là où il se trouve */
  const fichiers=id=>item(id).fichiers||(id==='apd'?(p.plans||[]):[]);
  const set=(id,v)=>maj({pj:{...pj,[id]:{...item(id),...v}}});
  const coche=id=>{const c=item(id);set(id,{fait:!c.fait,date:!c.fait?today():''})};
  const analyser=async file=>{
    setLecture('lecture');
    try{
      const r=analyseGeorisques(await pdfText(file));
      if(!r.lu){setLecture('rien');return}
      set('georisque',{analyse:{...r,le:today()}});
      setLecture(r.obligations.length||r.vigilances.length?'ok':'vide');
    }catch(e){setLecture('erreur')}
  };
  const A=item('georisque').analyse;
  return <div style={{marginTop:12}}>
    <div className="xs b" style={{color:NAVY,marginBottom:6,letterSpacing:'.04em'}}>PIÈCES DU TERRAIN</div>
    {PIECES_PROSPECT.map(d=>{
      const c=item(d.id), F=fichiers(d.id);
      return <div key={d.id} className="card" style={{padding:10,marginBottom:6,
        borderLeft:'3px solid '+(c.fait?GREEN:RULE)}}>
        <div className="row" style={{gap:8,alignItems:'center'}}>
          <button className="chk" onClick={()=>coche(d.id)}
            style={{background:c.fait?GREEN:'transparent',borderColor:c.fait?GREEN:RULE}}>{c.fait?'✓':''}</button>
          <span className="sm" style={{flex:1,color:c.fait?MUTED:INK}}>{d.l}</span>
          {c.fait&&c.date&&<span className="xs mut" style={{whiteSpace:'nowrap'}}>{fd(c.date)}</span>}
        </div>
        <div style={{marginTop:6,paddingLeft:32}}>
          <FichiersDrive resoudre={dossier} fichiers={F}
            onChange={v=>set(d.id,{fichiers:v,fait:v.length?true:c.fait,date:v.length&&!c.fait?today():c.date})}
            label="Importer"/>
        </div>
      </div>;
    })}
    <Fld label="LIRE L’ÉTUDE GÉORISQUES ET EN TIRER LES OBLIGATIONS">
      <label className="btn gh s" style={{whiteSpace:'nowrap'}}>{lecture==='lecture'?'Lecture de l’étude…':'Analyser l’étude (PDF)'}
        <input type="file" accept="application/pdf" style={{display:'none'}} disabled={lecture==='lecture'}
          onChange={e=>{const x=e.target.files[0];e.target.value='';if(x)analyser(x)}}/></label>
      {lecture==='rien'&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>Ce PDF ne ressemble pas à une étude géorisques — aucun risque n’y est nommé. S’il est scanné sans texte, il faudra le lire vous-même.</div>}
      {lecture==='vide'&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>Étude lue : aucune obligation particulière n’en ressort.</div>}
      {lecture==='erreur'&&<div className="xs" style={{marginTop:6,color:TERRA,lineHeight:1.5}}>Lecture du PDF impossible.</div>}
    </Fld>
    {A&&<div style={{marginTop:6}}>

      {A.obligations.map((o,i)=><div key={'o'+i} className="card" style={{padding:10,marginBottom:6,
        borderLeft:'3px solid '+TERRA,background:'#F6E2DC'}}>

        <div className="xs" style={{marginTop:4,lineHeight:1.6}}>{o.texte}</div>
        {o.ref&&<div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>{o.ref}</div>}
