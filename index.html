/* ---------------- HONORAIRES ---------------- */
function Honoraires({data,ch,save}){
  const hf=ch.honoFactures||[];
  const [busy,setBusy]=useState(null);
  const [busyRetro,setBusyRetro]=useState(null);
  const total=honoAmount(ch), facture=sumMontants(hf), reste=total-facture;
  /* chaque facture peut porter son taux : le TTC encaissé se somme facture par facture */
  const factureTTC=honoFactureTTC(ch), resteTTC=honoResteTTC(ch), totalTTC=honoTotalTTC(ch);
  const divergents=honoTauxDivergents(ch);
  const ms=data.marches.filter(m=>m.chantierId===ch.id);
  const cmds=data.commandes.filter(c=>c.chantierId===ch.id);
  const groupes=[
    {titre:'Marchés de travaux',type:'marche',lignes:ms.map(m=>({src:m,label:m.lot,sous:''}))},
    {titre:'Matériaux commandés',type:'commande',lignes:cmds.map(c=>({src:c,label:c.designation,sous:c.fournisseur||''}))},
  ].filter(g=>g.lignes.length);
  const toutes=[...ms,...cmds];
  const retroDu=toutes.reduce((s,x)=>s+retroMontant(x),0);
  const retroFac=toutes.reduce((s,x)=>s+(+x.retroFacture||0),0);
  const upHono=list=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,honoFactures:list}:x)});
  const upCh=patch=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,...patch}:x)});
  /* le devis d'honoraires : on le range dans Drive › Honoraires et on le lit au
     passage. Ce qui en est lu est proposé, jamais écrit d'office. */
  const [devisBusy,setDevisBusy]=useState(false);
  const [devisLu,setDevisLu]=useState(null);
  const importDevisHono=async file=>{
    setDevisBusy(true); setDevisLu(null);
    let lu=null;
    try{
      const {txt,motif}=await lireDocument(file);
      lu=txt?{a:analyseHonoraires(txt)}:{motif};
    }catch(e){lu={motif:'lecture impossible'}}
    let lien='';
    try{
      const token=await getDriveToken();
      const folderId=await driveHonoFolder(token,ch.id,ch.nom);
      lien=(await uploadToDrive(file,folderId)).webViewLink;
    }catch(e){
      if(e&&e.error==='auth_required')alert("Connectez d'abord Google Drive : le devis n'a pas été déposé.");
    }
    upCh({devisHono:{nom:file.name,lien,date:today()}});
    setDevisLu(lu); setDevisBusy(false);
  };
  const reporterHono=()=>{
    const a=devisLu&&devisLu.a; if(!a)return;
    const patch={};
    if(a.montantHT!==null)patch.honorairesMontant=Math.round(a.montantHT*100)/100;
    if(a.pct!==null)patch.honorairesPct=a.pct;
    if(a.tva!==null&&a.tva!==undefined&&(ch.tvaHono===undefined||ch.tvaHono===null||ch.tvaHono===''))patch.tvaHono=a.tva;
    if(Object.keys(patch).length)upCh(patch);
    setDevisLu(null);
  };
  const add=()=>upHono([...hf,{id:uid(),montant:'',date:'',libelle:'',lien:'',numero:'',tva:''}]);
  const [luHono,setLuHono]=useState(null);
  const upd=(id,patch)=>upHono(hf.map(x=>x.id===id?{...x,...patch}:x));
  const del=id=>upHono(hf.filter(x=>x.id!==id));
  const updRetro=(type,id,patch)=>save(type==='marche'
    ?{...data,marches:data.marches.map(m=>m.id===id?{...m,...patch}:m)}
    :{...data,commandes:data.commandes.map(c=>c.id===id?{...c,...patch}:c)});
  /* la facture jointe est lue au passage : montant, date et numéro s'y trouvent.
     On ne remplit que ce qui est vide — une saisie n'est jamais écrasée. */
  const importFacture=async(id,file)=>{
    setBusy(id); setLuHono(null);
    let lu=null, acc={};
    if(!/^image\//.test(file.type||'')){
      try{
        const {txt,motif}=await lireDocument(file);
        if(txt){
          const a=analyseFacture(txt);
          const cible=hf.find(x=>x.id===id)||{};
          const patch={};
          const ht=a.montantHT!==null?a.montantHT:(a.montantTTC!==null&&a.tva!==null?a.montantTTC/(1+a.tva/100):null);
          if(ht!==null&&(cible.montant===''||cible.montant===undefined||cible.montant===null))patch.montant=Math.round(ht*100)/100;
          if(a.date&&!cible.date)patch.date=a.date;
          if(a.numero&&!cible.numero)patch.numero=a.numero;
          if(a.tva!==null&&a.tva!==undefined&&(cible.tva===''||cible.tva===undefined||cible.tva===null))patch.tva=a.tva;
          if(Object.keys(patch).length){acc={...acc,...patch};upd(id,acc);lu={patch,id};}else lu={patch:null,id};
        }else lu={motif,id};
      }catch(e){}
    }
    setLuHono(lu);
    try{
      const token=await getDriveToken();
      const folderId=await driveHonoFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      acc={...acc,lien:webViewLink};
      upd(id,acc);
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import de la facture impossible.");
    }
    setBusy(null);
  };
  const importRetro=async(type,id,file)=>{
    setBusyRetro(id);
    try{
      const token=await getDriveToken();
      const folderId=await driveRetroFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      updRetro(type,id,{retroLien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton en bas de page).":"Import de la facture impossible.");
    }
    setBusyRetro(null);
  };
  return <div>
    <div className="g2">
      <Stat l="Honoraires TTC" v={eur(totalTTC)} c={NAVY}/>
      <Stat l="Déjà facturé TTC" v={eur(factureTTC)}/>
      <Stat l={"Reste à facturer TTC"} v={reste>0?eur(resteTTC):'soldé'} c={reste>0?TERRA:GREEN}/>
      <Stat l="Reste à facturer HT" v={reste>0?eur(reste):'soldé'} c={reste>0?INK:GREEN}/>
    </div>
    <div className="card" style={{marginTop:8,borderLeft:'3px solid '+NAVY}}>
      <Fld label="DEVIS D'HONORAIRES (PDF OU WORD)">
        {ch.devisHono&&ch.devisHono.nom
          ?<div className="row" style={{gap:12,alignItems:'center',flexWrap:'wrap'}}>
            {ch.devisHono.lien?<Transmis/>:<span className="xs" style={{color:AMBER,whiteSpace:'nowrap'}}>non déposé sur le Drive</span>}
            <span className="xs" style={{wordBreak:'break-all'}}>{ch.devisHono.nom}</span>
            {ch.devisHono.lien&&<a href={ch.devisHono.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir</a>}
            <label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>{devisBusy?'Lecture…':'Remplacer'}
              <input type="file" accept={DOC_ACCEPT} style={{display:'none'}} disabled={devisBusy}
                onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importDevisHono(f)}}/></label>
          </div>
          :<label className="btn gh s" style={{display:'inline-block',whiteSpace:'nowrap'}}>{devisBusy?'Lecture…':'Importer le devis d’honoraires'}
            <input type="file" accept={DOC_ACCEPT} style={{display:'none'}} disabled={devisBusy}
              onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importDevisHono(f)}}/></label>}
        <div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>Rangé dans Drive › {ch.nom} › Honoraires, et lu au passage pour vous proposer le montant.</div>
        {devisLu&&devisLu.motif&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
          Rien n'a pu être lu — {devisLu.motif}. Le fichier est bien enregistré.</div>}
        {devisLu&&devisLu.a&&<div className="xs" style={{marginTop:8,padding:8,border:'1px solid '+RULE,borderRadius:8,lineHeight:1.6}}>
          {devisLu.a.montantHT===null&&devisLu.a.pct===null
            ?<span style={{color:AMBER}}>Devis lu, mais ni montant ni pourcentage d'honoraires n'y ont été trouvés.</span>
            :<span>Lu sur le devis :
              {devisLu.a.montantHT!==null&&<span> honoraires <b>{eur(devisLu.a.montantHT)} HT</b></span>}
              {devisLu.a.pct!==null&&<span> · taux <b>{devisLu.a.pct} %</b></span>}
              {devisLu.a.tva!==null&&<span className="mut"> · TVA {devisLu.a.tva} %</span>}
              {devisLu.a.date&&<span className="mut"> · {fd(devisLu.a.date)}</span>}.
            </span>}
          {devisLu.a.alertes.map((x,i)=><div key={i} style={{color:AMBER}}>{x}</div>)}
          <div className="row" style={{gap:8,marginTop:8,flexWrap:'wrap'}}>
            {(devisLu.a.montantHT!==null||devisLu.a.pct!==null)&&
              <button className="btn s" onClick={reporterHono}>Reporter sur le chantier</button>}
            <button className="btn gh s" onClick={()=>setDevisLu(null)}>Ne rien changer</button>
          </div>
        </div>}
      </Fld>
      <div className="xs mut" style={{lineHeight:1.6}}>
        Base HT : <b>{eur(total)}</b>{ch.honorairesMontant!==undefined&&ch.honorairesMontant!==null&&ch.honorairesMontant!==''?' (montant saisi)':' ('+(ch.honorairesPct||0)+' % de '+eur(budgetTravauxHT(ch))+' HT de travaux)'} · TVA {honoTva(ch)} %{honoTva(ch)!==tvaRate(ch)?' (le chantier est à '+tvaRate(ch)+' %)':''}<br/>
        Déjà facturé : <b>{eur(facture)} HT</b> — reste <b>{eur(reste)} HT</b>.<br/>
        {!!divergents.length&&<span style={{color:AMBER}}>
          {hf.filter(x=>Math.abs(honoFactTva(x,ch)-honoTva(ch))>0.01).length} facture{hf.filter(x=>Math.abs(honoFactTva(x,ch)-honoTva(ch))>0.01).length>1?'s ont été émises':' a été émise'} à
          {' '}{divergents.map(t=>t+' %').join(' et ')} au lieu de {honoTva(ch)} % : le total TTC les compte à leur propre taux,
          c'est pourquoi il ne vaut pas {honoTva(ch)===0?'simplement les '+eur(total)+' HT':eur(total)+' × '+(1+honoTva(ch)/100).toFixed(2).replace('.',',')}.
          <br/></span>}
        Le montant des honoraires se modifie via « Modifier » sur la fiche du chantier.
      </div>
    </div>
    {retroDu>0&&<div className="card" style={{marginTop:8,borderLeft:'3px solid '+NAVY}}>
      <div className="xs mut">Recette totale du chantier — honoraires + rétrocessions</div>
      <div className="b" style={{fontSize:20,marginTop:2,color:NAVY}}>{eur(total+retroDu)} HT</div>
      <div className="xs mut" style={{marginTop:6}}>Encaissé : <b>{eur(facture+retroFac)}</b> · Reste à facturer : <b style={{color:(total+retroDu-facture-retroFac)>0?TERRA:GREEN}}>{eur(total+retroDu-facture-retroFac)}</b></div>
    </div>}
    {reste<0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginTop:8}}>
      Vous avez facturé {eur(-reste)} HT de plus que le montant d'honoraires prévu.</div>}
    <div className="sp" style={{margin:'14px 0 12px'}}>
      <span className="h2">MES FACTURES ({hf.length})</span>
      <button className="btn acc s" onClick={add}>+ Facture</button>
    </div>
    {!hf.length&&<Empty>Aucune facture d'honoraires. Ajoutez-les au fur et à mesure de vos appels de fonds.</Empty>}
    {hf.map(x=><div key={x.id} className="card" style={{padding:10}}>
      <div className="g2">
        <Fld label="MONTANT HT (€)"><input className="in" type="number" value={x.montant} onChange={e=>upd(x.id,{montant:e.target.value})}/></Fld>
        <Fld label="DATE"><input className="in" type="date" value={x.date||''} onChange={e=>upd(x.id,{date:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="LIBELLÉ"><input className="in" placeholder="Acompte, phase PC, situation n°…" value={x.libelle||''} onChange={e=>upd(x.id,{libelle:e.target.value})}/></Fld>
        <Fld label="N° DE FACTURE"><input className="in" value={x.numero||''} onChange={e=>upd(x.id,{numero:e.target.value})}/></Fld>
      </div>
      <Fld label="TVA DE CETTE FACTURE (%)">
        <input className="in" type="number" step="0.1" placeholder={'Honoraires : '+honoTva(ch)+' %'}
          value={x.tva===undefined||x.tva===null?'':x.tva} onChange={e=>upd(x.id,{tva:e.target.value})}/>
      </Fld>
      <div className="sp" style={{flexWrap:'wrap',gap:8}}>
        <span className="xs mut">{eur((+x.montant||0)*(1+honoFactTva(x,ch)/100))} TTC · TVA {honoFactTva(x,ch)} %</span>
        <div className="row" style={{gap:14,alignItems:'center',flexWrap:'wrap'}}>
          {x.lien
            ?<span className="row" style={{gap:10,alignItems:'center',whiteSpace:'nowrap'}}><Transmis/>
              <a href={x.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Voir la facture</a></span>
            :<label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>{busy===x.id?'Lecture…':'Joindre la facture'}
              <input type="file" accept={DOC_ACCEPT+',image/*'} style={{display:'none'}} disabled={busy===x.id}
                onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importFacture(x.id,file)}}/></label>}
          <button className="btn dg s" onClick={()=>del(x.id)}>Supprimer</button>
        </div>
      </div>
      {luHono&&luHono.id===x.id&&luHono.motif&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
        Rien n'a pu être lu — {luHono.motif}. Montant et date à saisir à la main ; le fichier est bien envoyé sur le Drive.</div>}
      {luHono&&luHono.id===x.id&&luHono.patch&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
        Lu sur la facture :{luHono.patch.montant!==undefined&&<span> montant <b>{eur(luHono.patch.montant)} HT</b></span>}
        {luHono.patch.date!==undefined&&<span> · date <b>{fd(luHono.patch.date)}</b></span>}
        {luHono.patch.numero!==undefined&&<span> · n° <b>{luHono.patch.numero}</b></span>}
        {luHono.patch.tva!==undefined&&<span> · TVA <b>{luHono.patch.tva} %</b></span>}. À vérifier.</div>}
    </div>)}

    <div className="sp" style={{margin:'20px 0 12px'}}>
      <span className="h2">RÉTROCESSIONS</span>
      <span className="xs mut">{eur(retroFac)} / {eur(retroDu)} HT</span>
    </div>
    {!groupes.length
      ?<Empty>Aucun marché ni matériau sur ce chantier. Les rétrocessions se calculent à partir des marchés de travaux et des commandes de matériaux.</Empty>
      :<div>
        <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Saisissez le taux ligne par ligne (0 % s'il n'y a pas de rétrocession). Le montant dû se calcule sur le montant HT du marché ou de la commande.</p>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:430}}>
            <thead><tr style={{textAlign:'left',borderBottom:'2px solid '+RULE}}>
              <th style={{padding:'6px 4px'}}>Désignation</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:62}}>Rétro %</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:82}}>Montant dû</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:92}}>Facturé</th>
              <th style={{padding:'6px 4px',textAlign:'right',width:74}}>Facture</th>
            </tr></thead>
            <tbody>
              {groupes.map(g=>[
                <tr key={g.type+'-t'} style={{background:'#F3F1EC'}}>
                  <td colSpan="5" className="xs b" style={{padding:'5px 4px',color:NAVY,letterSpacing:'.04em'}}>{g.titre}</td>
                </tr>,
                ...g.lignes.map(({src,label,sous})=>{
                  const du=retroMontant(src), fac=+src.retroFacture||0;
                  return <tr key={g.type+src.id} style={{borderBottom:'1px solid '+RULE}}>
                    <td style={{padding:'6px 4px'}}>
                      <div className={du>0?'b':''}>{label}</div>
                      <div className="mut">{eur(retroBase(src))} HT{sous?' · '+sous:''}</div>
                    </td>
                    <td style={{padding:'6px 4px'}}>
                      <input className="in" type="number" step="0.5" placeholder="0" style={{padding:'5px 4px',fontSize:13,textAlign:'right'}}
                        value={src.retroPct===undefined||src.retroPct===null?'':src.retroPct}
                        onChange={e=>updRetro(g.type,src.id,{retroPct:e.target.value===''?'':+e.target.value})}/>
                    </td>
                    <td style={{padding:'6px 4px',textAlign:'right',whiteSpace:'nowrap'}} className={du>0?'b':'mut'}>{du>0?eur(du):'—'}</td>
                    <td style={{padding:'6px 4px'}}>
                      <input className="in" type="number" placeholder="—" style={{padding:'5px 4px',fontSize:13,textAlign:'right'}}
                        value={src.retroFacture===undefined||src.retroFacture===null?'':src.retroFacture}
                        onChange={e=>updRetro(g.type,src.id,{retroFacture:e.target.value===''?'':+e.target.value})}/>
                      {du>0&&fac>0&&fac<du&&<div className="mut" style={{textAlign:'right',marginTop:2}}>reste {eur(du-fac)}</div>}
                    </td>
                    <td style={{padding:'6px 4px',textAlign:'right',whiteSpace:'nowrap'}}>
                      {src.retroLien
                        ?<a href={src.retroLien} target="_blank" rel="noreferrer" style={{color:TERRA}}>Voir</a>
                        :<label style={{color:NAVY}}>{busyRetro===src.id?'Envoi…':'Joindre'}
                          <input type="file" accept="application/pdf,image/*" style={{display:'none'}} disabled={busyRetro===src.id}
                            onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importRetro(g.type,src.id,file)}}/></label>}
                    </td>
                  </tr>;
                })
              ])}
              <tr style={{borderTop:'2px solid '+RULE}}>
                <td style={{padding:'8px 4px'}} className="b">TOTAL</td>
                <td/>
                <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}} className="b">{eur(retroDu)}</td>
                <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}} className="b">{eur(retroFac)}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
        {retroDu-retroFac>0&&<div className="xs" style={{marginTop:10,color:TERRA}}>Reste à facturer en rétrocessions : <b>{eur(retroDu-retroFac)} HT</b></div>}
      </div>}
    <DriveStatus/>
  </div>;
}

/* ---------------- CONTRÔLE CHANTIER ---------------- */
function ThumbCtrl({id,onZoom,onDel}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{let a=true;Photo.get(id).then(v=>{if(a)setSrc(v)}).catch(()=>{});return()=>{a=false}},[id]);
  return <div style={{position:'relative',width:66,height:52,border:'1px solid '+RULE,background:'#EFECE6',flex:'0 0 auto'}}>
    {src&&<img src={src} onClick={onZoom} alt="" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>}
    <button onClick={onDel} title="Retirer la photo" style={{position:'absolute',top:-1,right:-1,width:18,height:18,lineHeight:'16px',padding:0,fontSize:11,border:'none',background:TERRA,color:'#fff'}}>✕</button>
  </div>;
}

function Controles({data,ch,save}){
  const c=ch.controles||{};
  const [ouvert,setOuvert]=useState({});
  const [busy,setBusy]=useState(null);
  const [filtre,setFiltre]=useState('tous');
  const [zoom,setZoom]=useState(null);

  const upCtrl=next=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
  const setPt=(key,patch)=>{
    const cur=c[key]||{};
    upCtrl({...c,[key]:{...cur,...patch,date:patch.date!==undefined?patch.date:(cur.date||today())}});
  };
  const addPhotos=async(key,corpsL,ptL,files)=>{
    setBusy(key);
    const nouveaux=[];
    for(const file of files){
      try{
        const d=await compress(file);
        const pid=uid();
        await Photo.put(pid,d);
        let lien='';
        try{
          const token=await getDriveToken();
          const folderId=await driveControlesFolder(token,ch.id,ch.nom);
          lien=(await uploadToDrive(file,folderId)).webViewLink;
        }catch(x){/* miniature conservée même sans Drive */}
        nouveaux.push({id:pid,chantierId:ch.id,date:today(),legende:'Contrôle — '+corpsL+' : '+ptL,lot:'',lien});
      }catch(x){/* photo ignorée */}
    }
    if(nouveaux.length){
      const cur=c[key]||{};
      const next={...c,[key]:{...cur,photos:[...(cur.photos||[]),...nouveaux.map(p=>p.id)],date:cur.date||today()}};
      save({...data,photos:[...data.photos,...nouveaux],chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
    }
    setBusy(null);
  };
  const delPhoto=async(key,pid)=>{
    await Photo.del(pid).catch(()=>{});
    const cur=c[key]||{};
    const next={...c,[key]:{...cur,photos:(cur.photos||[]).filter(x=>x!==pid)}};
    save({...data,photos:data.photos.filter(p=>p.id!==pid),chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
  };

  const keep=(g,k)=>{
    const r=c[g.id+'.'+k]||{};
    if(filtre==='todo')return !r.statut;
    if(filtre==='ko')return r.statut==='non_conforme';
    return true;
  };
  const tot=CONTROLES.reduce((s,g)=>s+g.pts.length,0);
  const nOk=Object.values(c).filter(r=>r.statut==='conforme').length;
  const nKo=Object.values(c).filter(r=>r.statut==='non_conforme').length;
  const nNe=Object.values(c).filter(r=>r.statut==='neant').length;

  return <div>
    <div className="g3 xs" style={{marginBottom:12}}>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">Conformes</div><div className="b" style={{color:GREEN,fontSize:16}}>{nOk}</div></div>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">Non conformes</div><div className="b" style={{color:TERRA,fontSize:16}}>{nKo}</div></div>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">À contrôler</div><div className="b" style={{fontSize:16}}>{tot-nOk-nKo-nNe}</div></div>
    </div>
    {nKo>0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {nKo} point{nKo>1?'s':''} non conforme{nKo>1?'s':''} à lever avant réception.</div>}
    <div className="row" style={{gap:8,marginBottom:12,flexWrap:'wrap'}}>
      {[['tous','Tous'],['todo','À contrôler'],['ko','Non conformes']].map(([id,l])=>
        <button key={id} className={'btn s '+(filtre===id?'':'gh')} onClick={()=>setFiltre(id)}>{l}</button>)}
    </div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Les photos de contrôle sont aussi ajoutées à l'onglet PHOTOS et envoyées sur votre Google Drive (dossier « CP Constructions › {ch.nom} › Contrôles »).</p>
    {CONTROLES.map(g=>{
      const pts=g.pts.filter(([k])=>keep(g,k));
      if(!pts.length)return null;
      const rs=g.pts.map(([k])=>c[g.id+'.'+k]||{});
      const gOk=rs.filter(r=>r.statut==='conforme').length, gKo=rs.filter(r=>r.statut==='non_conforme').length;
      const gDone=rs.filter(r=>r.statut).length;
      const isOpen=filtre!=='tous'||ouvert[g.id];
      return <div key={g.id} style={{marginBottom:8}}>
        <button className="card sp" style={{borderLeft:'3px solid '+(gKo?TERRA:gDone===g.pts.length?GREEN:RULE),padding:10,marginBottom:0}}
          onClick={()=>setOuvert({...ouvert,[g.id]:!ouvert[g.id]})}>
          <span className="b sm" style={{color:NAVY}}>{g.l}</span>
          <span className="xs mut">{gDone}/{g.pts.length}{gKo?' · '+gKo+' NC':''} {isOpen?'▾':'▸'}</span>
        </button>
        {isOpen&&pts.map(([k,label])=>{
          const key=g.id+'.'+k, r=c[key]||{};
          const st=CTRL_ST.find(s=>s.id===r.statut);
          return <div key={k} className="card" style={{borderLeft:'3px solid '+(st?st.c:RULE),padding:10,marginBottom:0,borderTop:'none'}}>
            <div className="sm" style={{lineHeight:1.35}}>{label}</div>
            <div className="row" style={{gap:6,marginTop:8,flexWrap:'wrap'}}>
              {CTRL_ST.map(s=><button key={s.id} className="btn s" onClick={()=>setPt(key,{statut:r.statut===s.id?'':s.id})}
                style={{background:r.statut===s.id?s.c:'transparent',borderColor:r.statut===s.id?s.c:RULE,color:r.statut===s.id?'#fff':MUTED}}>{s.label}</button>)}
            </div>
            {r.statut&&<div style={{marginTop:10}}>
              <div className="g2">
                <div><span className="lbl">DATE DU CONTRÔLE</span>
                  <input className="in" type="date" value={r.date||today()} onChange={e=>setPt(key,{date:e.target.value})}/></div>
                <div><span className="lbl">JUSTIFICATIF</span>
                  <input className="in" placeholder="Observation, référence…" value={r.note||''} onChange={e=>setPt(key,{note:e.target.value})}/></div>
              </div>
              <div className="row" style={{gap:6,marginTop:8,flexWrap:'wrap',alignItems:'center'}}>
                {(r.photos||[]).map(pid=><ThumbCtrl key={pid} id={pid} onZoom={()=>setZoom({id:pid,date:r.date,legende:label})} onDel={()=>delPhoto(key,pid)}/>)}
                <label className="btn gh s" style={{whiteSpace:'nowrap'}}>{busy===key?'Envoi…':'+ Photo'}
                  <input type="file" accept="image/*" multiple style={{display:'none'}} disabled={busy===key}
                    onChange={e=>{const files=[...e.target.files];e.target.value='';if(files.length)addPhotos(key,g.l,label,files)}}/></label>
              </div>
            </div>}
          </div>;
        })}
      </div>;
    })}
    {zoom&&<Plein p={zoom} close={()=>setZoom(null)}/>}
  </div>;
}

/* ---------------- ARTISANS ---------------- */
function Artisans({data,save}){
  const [f,setF]=useState(null);
  const [lecture,setLecture]=useState(null);
  const ok=()=>{if(!f.nom.trim())return;save({...data,artisans:f.id?data.artisans.map(a=>a.id===f.id?f:a):[...data.artisans,{...f,id:uid()}]});setF(null)};
  const importDecennale=async file=>{
    setLecture({etat:'lecture'});
    let extrait=null,erreurLecture='';
    try{extrait=analyseAttestation(await pdfText(file))}
    catch(e){erreurLecture=(e&&e.message)||String(e)}
    let lien='';
    try{
      const token=await getDriveToken();
      const folderId=await driveAttestationsFolder(token);
      lien=(await uploadToDrive(file,folderId)).webViewLink;
    }catch(e){
      setLecture({etat:'erreur',msg:e&&e.error==='auth_required'?"Connectez Google Drive (bouton ci-dessous) puis réimportez le PDF.":"Envoi du PDF vers Google Drive impossible."});
      return;
    }
    setF(prev=>{
      const n={...prev,lienAttestation:lien};
      if(extrait){
        if(extrait.assureur&&!prev.assureur)n.assureur=extrait.assureur;
        if(extrait.numPolice&&!prev.numPolice)n.numPolice=extrait.numPolice;
        if(extrait.decennaleFin&&!prev.decennaleFin)n.decennaleFin=extrait.decennaleFin;
        if(extrait.siret&&!prev.siret)n.siret=extrait.siret;
        if(extrait.activites&&!prev.activites)n.activites=extrait.activites;
      }
      return n;
    });
    if(!extrait)setLecture({etat:'illisible',msg:erreurLecture});
    else if(!extrait.champsTrouves.length)setLecture({etat:'rien'});
    else setLecture({etat:'ok',champs:extrait.champsTrouves,incertain:extrait.dateIncertaine});
  };
  const st=a=>{
    if(!a.decennaleFin)return{t:'Décennale non renseignée',c:TERRA};
    const j=Math.round((new Date(a.decennaleFin)-new Date())/86400000);
    if(j<0)return{t:'Décennale expirée le '+fd(a.decennaleFin),c:TERRA};
    if(j<60)return{t:'Décennale expire dans '+j+' j',c:AMBER};
    return{t:'Décennale valide jusqu\u2019au '+fd(a.decennaleFin),c:GREEN};
  };
  const al=data.artisans.filter(a=>!a.decennaleFin||new Date(a.decennaleFin)<new Date());
  return <div>
    <H2 action={<button className="btn acc s" onClick={()=>setF({nom:'',corps:'',tel:'',email:'',adresse:'',siret:'',activites:'',assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''})}>+ Artisan</button>}>ARTISANS ({data.artisans.length})</H2>
    {al.length>0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {al.length} artisan{al.length>1?'s':''} sans décennale valide. Ne pas signer de marché avant régularisation.</div>}
    {f&&<div className="card">
      <Fld label="RAISON SOCIALE"><input className="in" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})}/></Fld>

            <input type="file" accept="application/pdf" style={{display:'none'}} disabled={lecture&&lecture.etat==='lecture'}

          {f.lienAttestation&&<a href={f.lienAttestation} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir l'attestation</a>}
        </div>
        {lecture&&lecture.etat==='ok'&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
          PDF importé. Champs remplis automatiquement : {lecture.champs.map(c=>({assureur:'assureur',numPolice:'n° de police',decennaleFin:'date de validité',siret:'SIRET',activites:'activités garanties'}[c])).filter(Boolean).join(', ')}.
          {lecture.incertain&&' La date a été déduite sans mot-clé explicite.'} À vérifier avant d'enregistrer.</div>}
        {lecture&&lecture.etat==='rien'&&<div className="xs" style={{marginTop:6,color:AMBER,lineHeight:1.5}}>
          PDF importé, mais aucune information reconnue automatiquement. Saisissez les champs à la main.</div>}

      <Fld label="ACTIVITÉS GARANTIES PAR LA DÉCENNALE">
        <textarea className="in" rows={3} value={f.activites||''} onChange={e=>setF({...f,activites:e.target.value})}/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>Le lot que vous lui confiez doit figurer dans cette liste, sinon la garantie ne joue pas.</div>
      </Fld>

        <Fld label="ASSUREUR"><input className="in" value={f.assureur} onChange={e=>setF({...f,assureur:e.target.value})}/></Fld>
        <Fld label="N° DE POLICE"><input className="in" value={f.numPolice} onChange={e=>setF({...f,numPolice:e.target.value})}/></Fld>

      <Fld label="LIEN VERS L'ATTESTATION"><input className="in" placeholder="Rempli par l'import du PDF, ou collez un lien…" value={f.lienAttestation} onChange={e=>setF({...f,lienAttestation:e.target.value})}/></Fld>
      <DriveStatus/>
      <Acts onSave={()=>{setLecture(null);ok()}} onCancel={()=>{setLecture(null);setF(null)}} onDel={f.id?()=>{save({...data,artisans:data.artisans.filter(a=>a.id!==f.id)});setLecture(null);setF(null)}:null}/>
    </div>}
    {!data.artisans.length&&!f&&<Empty>Aucun artisan. Constituez votre carnet d'adresses.</Empty>}
    {data.artisans.map(a=>{
      const s=st(a),n=data.marches.filter(m=>m.artisanId===a.id).length;
      return <div key={a.id} className="card" style={{borderLeft:'3px solid '+s.c}}>
        <div onClick={()=>setF(a)}>
          <div className="sp"><span className="b sm" style={{color:NAVY}}>{a.nom}</span><span className="xs mut">{a.corps}</span></div>
          <div className="xs" style={{color:s.c,marginTop:3}}>{s.t}</div>
          <div className="xs mut" style={{marginTop:2}}>{n} lot{n>1?'s':''} attribué{n>1?'s':''}</div>

          {a.activites&&<div className="xs mut" style={{marginTop:2,lineHeight:1.5}}>Couvert : {a.activites}</div>}

    })}
  </div>;
}

/* ---------------- BILAN ---------------- */
function Bilan({data,open}){
  const L=data.chantiers.map(c=>{
    const ms=data.marches.filter(m=>m.chantierId===c.id);
    const eng=ms.reduce((s,m)=>s+(m.montantHT||0),0);
    const fac=ms.reduce((s,m)=>s+(m.facture||0),0);
    const cs=data.commandes.filter(x=>x.chantierId===c.id);
    const mat=cs.reduce((s,x)=>s+(x.montant||0),0);
    const hono=honoAmount(c), honoFac=sumMontants(c.honoFactures);
    const retroSrc=[...ms,...cs];
    const retro=retroSrc.reduce((s,x)=>s+retroMontant(x),0);
    const retroFac=retroSrc.reduce((s,x)=>s+(+x.retroFacture||0),0);
    const av=(eng||budgetTravauxHT(c))?Math.round(fac/(eng||budgetTravauxHT(c))*100):0;
    /* le coût de l'opération, c'est les marchés, les matériaux achetés en direct
       ET les honoraires : c'est exactement ce que couvre le budget annoncé. */
    const co=coutOperation(c,ms,cs);
    const bc=budgetClient(c);
    const F=facturesChantier(c,ms,cs), ventF=ventileFactures(F);
    const htFac=F.reduce((s,f)=>s+f.ht,0), tvaFac=ventF.reduce((s,v)=>s+v.tva,0);
    return {...c,eng,fac,mat,hono,honoFac,retro,retroFac,av,
      ouvHT:co.travHT+co.matHT,ouvTTC:co.travTTC+co.matTTC,
      totalHT:co.totalHT,totalTTC:co.totalTTC,budgetClientTTC:bc,
      factureHT:htFac,factureTVA:tvaFac,factureTTC:htFac+tvaFac,
      honoTTC:co.honoTTC,ecart:bc-co.totalTTC};
  });
  const T=k=>L.reduce((s,l)=>s+(l[k]||0),0);
  const te=T('eng'),tf=T('fac'),th=T('hono'),tm=T('mat');
  const tbTTC=T('budgetClientTTC'),thTTC=T('honoTTC'),thFac=T('honoFac');
  const tOuvTTC=T('ouvTTC'),tTotTTC=T('totalTTC');
  const tFacHT=T('factureHT'),tFacTVA=T('factureTVA'),tFacTTC=T('factureTTC');
  const tr=T('retro'),trFac=T('retroFac');
  const csv=()=>{
    const rows=[['Chantier','Client','Phase','Avancement %','Budget client TTC','Marchés HT','Matériaux HT','Honoraires HT','Total engagé TTC','Écart TTC','Facturé HT','TVA facturée','Facturé TTC','Reste à facturer TTC','Rétrocessions dues HT','Rétrocessions facturées HT'],
      ...L.map(l=>[l.nom,l.client,PHASE[l.statut]||'',l.av,Math.round(l.budgetClientTTC),l.eng,l.mat,Math.round(l.hono),Math.round(l.totalTTC),Math.round(l.ecart),Math.round(l.factureHT),Math.round(l.factureTVA),Math.round(l.factureTTC),Math.round((l.budgetClientTTC||l.totalTTC)-l.factureTTC),Math.round(l.retro),Math.round(l.retroFac)]),
      ['TOTAL','','','',Math.round(tbTTC),te,tm,Math.round(th),Math.round(tTotTTC),Math.round(tbTTC-tTotTTC),Math.round(tFacHT),Math.round(tFacTVA),Math.round(tFacTTC),Math.round((tbTTC||tTotTTC)-tFacTTC),Math.round(tr),Math.round(trFac)]];
    const a=document.createElement('a');
    a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(rows.map(r=>r.map(v=>'"'+v+'"').join(';')).join('\n'));
    a.download='CP-suivi-financier-'+today()+'.csv';a.click();
  };
  return <div>
    <H2 action={<button className="btn gh s" onClick={csv}>Export CSV</button>}>SUIVI FINANCIER</H2>
    <div className="g2">
      <Stat l="Budget client TTC — tous chantiers" v={eur(tbTTC)} c={NAVY}/>
      <Stat l="Total engagé TTC — honoraires inclus" v={eur(tTotTTC)} c={tTotTTC>tbTTC?TERRA:GREEN}/>
      <Stat l="Facturé au client TTC" v={eur(tFacTTC)}/>
      <Stat l="Reste à facturer TTC" v={(tbTTC||tTotTTC)-tFacTTC>0?eur((tbTTC||tTotTTC)-tFacTTC):'soldé'} c={(tbTTC||tTotTTC)-tFacTTC>0?TERRA:GREEN}/>
      <Stat l="Coût de l’ouvrage TTC — hors honoraires" v={eur(tOuvTTC)}/>
      <Stat l="Engagé auprès des artisans" v={eur(te)}/>
      <Stat l="Matériaux commandés" v={eur(tm)}/>
      <Stat l="Déjà facturé par les artisans" v={eur(tf)}/>
    </div>
    <div className="card" style={{marginTop:8,borderLeft:'3px solid '+NAVY}}>
      <div className="xs mut">Facturation au client — tous chantiers</div>
      <div className="b" style={{fontSize:20,marginTop:2,color:NAVY}}>{eur(tFacTTC)} TTC</div>
      <div className="xs mut" style={{marginTop:2}}>{eur(tFacHT)} HT + {eur(tFacTVA)} de TVA</div>
      <div className="xs mut" style={{marginTop:8,lineHeight:1.5}}>Le détail facture par facture, avec la ventilation de TVA, se trouve sur l'onglet FACTURATION de chaque chantier.</div>
    </div>
    <div className="card" style={{marginTop:8}}>
      <div className="xs mut">Honoraires de maîtrise d’œuvre — TTC</div>
      <div className="b" style={{fontSize:20,marginTop:2,color:NAVY}}>{eur(thTTC)}</div>
      <div className="xs mut" style={{marginTop:2}}>{eur(th)} HT</div>
      <div className="g2 xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <div><div className="mut">Honoraires facturés</div><div className="b">{eur(thFac)} HT</div></div>
        <div><div className="mut">Reste à facturer</div><div className="b" style={{color:th-thFac>0?TERRA:GREEN}}>{th-thFac>0?eur(th-thFac)+' HT':'soldé'}</div></div>
      </div>
      {tr>0&&<div className="g2 xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
        <div><div className="mut">Rétrocessions dues</div><div className="b">{eur(tr)} HT</div></div>
        <div><div className="mut">Rétrocessions facturées</div><div className="b" style={{color:tr-trFac>0?TERRA:GREEN}}>{eur(trFac)} HT</div></div>
      </div>}
      {tr>0&&<div className="xs" style={{marginTop:10,paddingTop:10,borderTop:'2px solid '+TERRA}}>
        <div className="mut">Recette totale — honoraires + rétrocessions</div>
        <div className="b" style={{fontSize:18,color:NAVY,marginTop:2}}>{eur(th+tr)} HT</div>
        <div className="mut" style={{marginTop:2}}>encaissé {eur(thFac+trFac)} · reste {eur(th+tr-thFac-trFac)}</div>
      </div>}
      <div className="xs mut" style={{marginTop:10,lineHeight:1.5}}>Montants TTC calculés avec le taux de TVA saisi sur chaque chantier (20 % par défaut). À vérifier avec votre comptable avant tout usage fiscal.</div>
    </div>
    {!L.length&&<Empty>Aucun chantier à suivre.</Empty>}
    {L.map(l=><button key={l.id} className="card" style={{borderLeft:'3px solid '+(l.budgetClientTTC&&l.ecart<0?TERRA:NAVY)}} onClick={()=>open(l.id)}>
      <div className="sp"><span className="b sm" style={{color:NAVY}}>{l.nom}</span>
        {l.budgetClientTTC
          ?<span className="xs" style={{color:l.ecart<0?TERRA:GREEN,whiteSpace:'nowrap'}}>{l.ecart<0?'dépassement '+eur(-l.ecart):'marge '+eur(l.ecart)}</span>
          :<span className="xs mut" style={{whiteSpace:'nowrap'}}>budget non renseigné</span>}</div>
      <div className="sp xs" style={{marginTop:6}}><span className="mut">Avancement facturé</span><span className="b">{l.av} %</span></div>
      <div className="bar"><div style={{height:4,width:Math.min(100,l.av)+'%',background:GREEN}}/></div>
      <div className="g3 xs" style={{marginTop:8}}>
        <div><div className="mut">Budget client TTC</div><div>{l.budgetClientTTC?eur(l.budgetClientTTC):'—'}</div></div>
        <div><div className="mut">Engagé TTC</div><div>{eur(l.totalTTC)}</div></div>
        <div><div className="mut">Facturé TTC</div><div>{eur(l.factureTTC)}</div></div>
      </div>
      {l.retro>0&&<div className="xs mut" style={{marginTop:6}}>Rétrocessions : <b>{eur(l.retro)}</b> HT dont {eur(l.retroFac)} facturé</div>}
    </button>)}
  </div>;
}
const Stat=({l,v,c})=><div className="card" style={{margin:0}}><div className="xs mut" style={{lineHeight:1.3}}>{l}</div><div className="b" style={{fontSize:16,marginTop:4,color:c||INK}}>{v}</div></div>;

/* ---------------- DONNÉES ---------------- */
function Donnees({data,save,session}){
  const [msg,setMsg]=useState('');
  const exp=()=>{
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='CP-sauvegarde-'+today()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    setMsg('Sauvegarde exportée. Sur iPhone, choisissez « Enregistrer dans Fichiers » pour la ranger dans iCloud Drive. Les vignettes photo ne sont pas incluses.');
  };
  const imp=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.chantiers)throw 0;
      if(!confirm("« Restaurer » REMPLACE toutes vos données actuelles ("+data.chantiers.length+" chantier(s)) par le contenu du fichier.\n\nPour ajouter sans rien perdre, utilisez « Ajouter ».\n\nRemplacer malgré tout ?"))return;
      save({...EMPTY,...d});setMsg('Sauvegarde restaurée.')}catch(x){setMsg('Fichier illisible — restauration annulée.')}};
    r.readAsText(f);
  };
  /* ajoute le contenu d'un fichier sans toucher à l'existant : les artisans déjà
     connus sont réutilisés (nom identique, casse ignorée) et seuls leurs champs
     vides sont complétés ; tous les identifiants entrants sont régénérés.
     Le fichier peut ne contenir que des artisans (carnet d'adresses) : dans ce
     cas rien d'autre n'est touché. */
  /* ne complète que ce qui est vide : une saisie de l'utilisateur n'est jamais écrasée */
  const vide=v=>v===''||v===null||v===undefined||(Array.isArray(v)&&!v.length)
              ||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
  const combler=(ex,src,ignore)=>{
    let n=0;
    for(const k of Object.keys(src||{})){
      if(k==='id'||k==='chantierId'||(ignore&&ignore.indexOf(k)>=0))continue;
      if(vide(src[k]))continue;
      if(vide(ex[k])){ex[k]=src[k];n++;continue}
      // sous-objets (pièces, MAP, visite technique) : on descend d'un niveau
      if(typeof ex[k]==='object'&&!Array.isArray(ex[k])&&typeof src[k]==='object'&&!Array.isArray(src[k]))
        n+=combler(ex[k],src[k]);
    }
    return n;
  };
  const ajouter=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let d;
      try{d=JSON.parse(r.result)}catch(x){setMsg('Fichier illisible — rien n\'a été modifié.');return}
      if(!d||typeof d!=='object'){setMsg("Fichier illisible — rien n'a été modifié.");return}
      const entrants=Array.isArray(d.chantiers)?d.chantiers:[];
      if(!entrants.length&&!(Array.isArray(d.artisans)&&d.artisans.length)){
        setMsg("Ce fichier ne contient ni chantier ni artisan — rien n'a été modifié.");return}
      const cle=x=>(x||'').trim().toLowerCase();
      const connu=c=>data.chantiers.find(x=>cle(x.nom)===cle(c.nom));
      const aCompleter=entrants.filter(connu);
      if(aCompleter.length&&!confirm(
        'Ces chantiers sont déjà dans vos données :\n\n  '+aCompleter.map(c=>c.nom).join('\n  ')+
        "\n\nIls vont être COMPLÉTÉS : les lots absents seront ajoutés et les champs restés vides remplis."+
        "\nRien de ce que vous avez saisi ne sera modifié, et rien ne sera supprimé.\n\nContinuer ?"))return;

      const artisans=data.artisans.map(a=>({...a}));
      const mapA={}; let crees=0, completes=0;
      for(const a of (d.artisans||[])){
        const ex=artisans.find(x=>cle(x.nom)===cle(a.nom));
        if(ex){
          mapA[a.id]=ex.id;
          let modif=false;
          for(const k of ['corps','tel','email','adresse','siret','activites','assureur','numPolice','decennaleFin','lienAttestation'])
            if(a[k]&&!String(ex[k]||'').trim()){ex[k]=a[k];modif=true}
          if(modif)completes++;
        }else{
          const id=uid(); mapA[a.id]=id; artisans.push({...a,id}); crees++;
        }
      }

      const chantiers=data.chantiers.map(c=>({...c}));
      const marches=data.marches.map(m=>({...m}));
      const commandes=data.commandes.map(c=>({...c}));
      const mapC={};
      let ajoutes=0, fusionnes=0, lotsAjoutes=0, lotsCompletes=0, cmdAjoutees=0, champs=0;
      for(const c of entrants){
        const ex=connu(c);
        if(ex){
          const cible=chantiers.find(x=>x.id===ex.id);
          mapC[c.id]=cible.id;
          champs+=combler(cible,c,['nom']);
          fusionnes++;
        }else{
          const id=uid(); mapC[c.id]=id; chantiers.push({...c,id}); ajoutes++;
        }
      }
      for(const m of (d.marches||[])){
        const cid=mapC[m.chantierId]; if(!cid)continue;
        const aid=mapA[m.artisanId]||'';
        const ex=marches.find(x=>x.chantierId===cid&&cle(x.lot)===cle(m.lot));
        if(ex){
          // jamais les montants déjà facturés : ils viennent du terrain, pas d'un fichier
          if(combler(ex,{...m,artisanId:aid},['facture','factures','lot']))lotsCompletes++;
        }else{ marches.push({...m,id:uid(),chantierId:cid,artisanId:aid}); lotsAjoutes++ }
      }
      for(const k of (d.commandes||[])){
        const cid=mapC[k.chantierId]; if(!cid)continue;
        const ex=commandes.find(x=>x.chantierId===cid&&cle(x.designation)===cle(k.designation));
        if(ex)combler(ex,k,['designation']);
        else{ commandes.push({...k,id:uid(),chantierId:cid}); cmdAjoutees++ }
      }

      save({...data,chantiers,artisans,marches,commandes});
      const bilanArt=crees+' artisan(s) créé(s)'+(completes?', '+completes+' complété(s)':'');
      if(!entrants.length){setMsg('Carnet d\u2019adresses mis à jour : '+bilanArt+'. Aucun chantier dans ce fichier.');return}
      setMsg([
        ajoutes?ajoutes+' chantier(s) ajouté(s)':'',
        fusionnes?fusionnes+' chantier(s) complété(s) ('+champs+' champ(s) rempli(s))':'',
        lotsAjoutes+' lot(s) ajouté(s)'+(lotsCompletes?', '+lotsCompletes+' complété(s)':''),
        cmdAjoutees?cmdAjoutees+' commande(s) ajoutée(s)':'',
        bilanArt+'.'
      ].filter(Boolean).join(' — '));
    };
    r.readAsText(f);
  };
  return <div>
    <H2>DONNÉES</H2>
    <div className="card">
      <div className="sm b">Synchronisation</div>
      <p className="xs mut" style={{lineHeight:1.5}}>Les données sont enregistrées en ligne et se synchronisent automatiquement entre tous vos appareils connectés. Exportez quand même régulièrement en secours.<br/>
        <b>Ajouter</b> intègre le contenu d'un fichier à vos données actuelles, sans rien effacer — un chantier complet, ou seulement des artisans. <b>Restaurer</b> remplace tout par le fichier.</p>
      <div className="row" style={{gap:8,marginTop:10}}>
        <button className="btn" onClick={exp}>Exporter</button>
        <label className="btn acc">Ajouter<input type="file" accept=".json,application/json,text/plain" onChange={ajouter} style={{display:'none'}}/></label>
        <label className="btn gh">Restaurer<input type="file" accept=".json,application/json,text/plain" onChange={imp} style={{display:'none'}}/></label>
      </div>
      {msg&&<div className="xs" style={{marginTop:8,color:TERRA}}>{msg}</div>}
    </div>
    <div className="card">
      <div className="sm b">Version</div>
      <div className="xs mut" style={{marginTop:6,lineHeight:1.6}}>{VERSION}
        <br/>Si ce repère ne correspond pas à la dernière mise à jour annoncée, la page vient du cache :
        fermez complètement l’application puis rouvrez-la.</div>
    </div>
    <div className="card">
      <div className="sm b">Contenu</div>
      <div className="xs mut" style={{marginTop:6,lineHeight:1.6}}>
        {data.chantiers.length} chantier(s) · {data.marches.length} lot(s) · {data.artisans.length} artisan(s) · {data.commandes.length} commande(s) · {data.photos.length} photo(s)
      </div>
    </div>
    <div className="card">
      <div className="sm b">Compte</div>
      <div className="xs mut" style={{marginTop:6}}>{session&&session.user&&session.user.email}</div>
      <button className="btn gh s" style={{marginTop:10}} onClick={()=>sb.auth.signOut()}>Se déconnecter</button>
    </div>
    <div className="card">
      <div className="sm b">Limites connues</div>
      <ul className="xs mut" style={{margin:'6px 0 0',paddingLeft:16,lineHeight:1.6}}>
        <li>La synchronisation nécessite une connexion internet ; hors ligne, les modifications restent sur l'appareil jusqu'au retour du réseau.</li>
        <li>Photos réduites avant envoi pour rester rapide sur mobile ; gardez les originaux sur le Drive.</li>
        <li>L'export ne contient pas les photos elles-mêmes, seulement les légendes et dates.</li>
        <li>Les PDF importés sont envoyés sur votre Google Drive (dossier « CP Constructions ») ; la première fois, Google demande votre autorisation.</li>
      </ul>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
