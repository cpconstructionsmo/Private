/* ---------------- AGENDA ----------------
   Des rendez-vous ajoutés à la main, marqués professionnel ou personnel — pas
   de compte Google à connecter, juste ce que vous y mettez. Vue calendrier :
   la grille garde toujours 6 semaines (42 cases), semaine commençant le lundi,
   pour ne pas sauter en hauteur d'un mois à l'autre. */
const MOIS_NOMS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS_NOMS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const JOURS_LONGS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const decalerJour=(iso,n)=>{
  const[y,m,d]=iso.split('-').map(Number);
  return isoDate(new Date(y,m-1,d+n));
};
const dateLongue=iso=>{
  if(!iso)return '';
  const[y,m,d]=iso.split('-').map(Number);
  return JOURS_LONGS[(new Date(y,m-1,d).getDay()+6)%7]+' '+d+' '+MOIS_NOMS[m-1].toLowerCase()+' '+y;
};
const isoDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function grilleCalendrier(annee,mois){
  const premier=new Date(annee,mois,1);
  const decalage=(premier.getDay()+6)%7; // lundi=0
  const debut=new Date(annee,mois,1-decalage);
  const cases=[];
  for(let i=0;i<42;i++){
    const d=new Date(debut.getFullYear(),debut.getMonth(),debut.getDate()+i);
    cases.push({date:isoDate(d),jour:d.getDate(),dansMois:d.getMonth()===mois});
  }
  return cases;
}
/* la plage d'un rendez-vous, quand on lui connaît une fin : « 08:00 – 12:00 »,
   et sa durée. Une fin antérieure ou égale au début ne veut rien dire — on
   s'en tient alors à l'heure de début plutôt que d'afficher une plage absurde. */
const minutesHeure=h=>{const m=/^(\d{1,2}):(\d{2})$/.exec(h||'');return m?(+m[1])*60+(+m[2]):null};
const dureeRdv=(debut,fin)=>{
  const a=minutesHeure(debut),b=minutesHeure(fin);
  if(a===null||b===null||b<=a)return '';
  const n=b-a,h=Math.floor(n/60),mn=n%60;
  return (h?h+' h':'')+(mn?(h?' ':'')+mn+' min':'');
};
const plageHoraire=(debut,fin)=>debut?(dureeRdv(debut,fin)?debut+' – '+fin:debut):'';

/* les rendez-vous d'une journée posés sur l'axe des heures : chacun avec son
   créneau en minutes, et sa colonne quand plusieurs se chevauchent — sans
   quoi deux rendez-vous simultanés se recouvriraient et on n'en verrait
   qu'un. Un rendez-vous sans heure de fin occupe une demi-heure, le temps
   qu'il reste visible. */
const DUREE_DEFAUT=30;
const disposerJournee=rdvs=>{
  const L=(rdvs||[]).map(x=>{
    const d=minutesHeure(x.heure);
    if(d===null)return null;
    const f=minutesHeure(x.heureFin);
    return {rdv:x,debut:d,fin:(f!==null&&f>d)?f:d+DUREE_DEFAUT};
  }).filter(Boolean).sort((a,b)=>a.debut-b.debut||a.fin-b.fin);
  /* on avance par grappes de rendez-vous qui se chevauchent : à l'intérieur
     d'une grappe, chacun prend la première colonne encore libre, et tous se
     partagent la largeur */
  let grappe=[],finGrappe=-1;
  const clore=()=>{
    const n=grappe.reduce((m,x)=>Math.max(m,x.col+1),1);
    grappe.forEach(x=>{x.cols=n});
    grappe=[];
  };
  L.forEach(x=>{
    if(grappe.length&&x.debut>=finGrappe)clore();
    const prises=grappe.filter(y=>y.fin>x.debut).map(y=>y.col);
    let c=0; while(prises.indexOf(c)>=0)c++;
    x.col=c; grappe.push(x);
    finGrappe=grappe.length===1?x.fin:Math.max(finGrappe,x.fin);
  });
  if(grappe.length)clore();
  return L;
};

/* la récurrence ne se pose qu'à la création : une fois les rendez-vous
   posés, chacun s'édite ou se supprime indépendamment des autres */
const RECURRENCES=[['','Aucune'],['semaine','Toutes les semaines'],['2semaines','Toutes les deux semaines'],['mois','Tous les mois']];
const prochaineOccurrence=(date,rec)=>{
  const[y,m,d]=date.split('-').map(Number);
  if(rec==='semaine')return isoDate(new Date(y,m-1,d+7));
  if(rec==='2semaines')return isoDate(new Date(y,m-1,d+14));
  if(rec==='mois')return isoDate(new Date(y,m,d));
  return date;
};
const genererSerie=(base,rec,fin)=>{
  if(!rec)return [base];
  const L=[base];
  let cur=base.date;
  /* avec une date de fin, elle arrête la boucle bien avant ; sans fin, on
     plafonne pour ne pas créer des années de rendez-vous d'un coup */
  const max=fin?200:24;
  for(let i=1;i<max;i++){
    cur=prochaineOccurrence(cur,rec);
    if(fin&&cur>fin)break;
    L.push({...base,id:uid(),date:cur});
  }
  return L;
};
/* la journée sur son axe des heures, à la manière d'un agenda classique :
   chaque rendez-vous occupe la hauteur de sa durée, et l'on voit d'un coup
   d'œil les plages où l'on est pris. */
function JourAgenda({date,rdvs,onOuvrir,onCreer}){
  const HEURE=46;
  const poses=disposerJournee(rdvs);
  const sansHeure=(rdvs||[]).filter(x=>minutesHeure(x.heure)===null);
  /* les heures ouvrables par défaut, élargies à ce qui déborde */
  const h0=Math.max(0,Math.min(7,...poses.map(p=>Math.floor(p.debut/60))));
  const h1=Math.min(24,Math.max(20,...poses.map(p=>Math.ceil(p.fin/60))));
  const d0=h0*60,d1=h1*60;
  const heures=[];for(let h=h0;h<h1;h++)heures.push(h);
  const t=today();
  return <div>
    {sansHeure.length>0&&<div style={{marginBottom:8}}>
      <div className="xs mut" style={{marginBottom:4}}>SANS HEURE</div>
      {sansHeure.map(x=><div key={x.id} onClick={()=>onOuvrir(x)}
        style={{cursor:'pointer',marginBottom:4,padding:'5px 8px',borderRadius:5,
          borderLeft:'3px solid '+(x.type==='perso'?TERRA:NAVY),
          background:x.type==='perso'?'#F6E2DC':'#E4EAEE'}}>
        <span className="xs b">{x.titre||'(sans titre)'}</span>
        {x.client?<span className="xs mut"> · {x.client}</span>:null}</div>)}
    </div>}
    {!poses.length&&!sansHeure.length&&
      <Empty>Journée libre. Cliquez une heure pour y poser un rendez-vous.</Empty>}
    <div className="row" style={{alignItems:'stretch',gap:0}}>
      <div style={{flex:'0 0 44px'}}>
        {heures.map(h=><div key={h} className="xs mut"
          style={{height:HEURE,textAlign:'right',paddingRight:6,transform:'translateY(-6px)'}}>{h}h</div>)}
      </div>
      <div style={{flex:1,position:'relative',borderLeft:'1px solid '+RULE}}>
        {/* les tranches d'heure : cliquer l'une d'elles y pose un rendez-vous */}
        {heures.map((h,i)=><div key={h} onClick={()=>onCreer(String(h).padStart(2,'0')+':00')}
          style={{position:'absolute',left:0,right:0,top:i*HEURE,height:HEURE,cursor:'pointer',
            borderTop:'1px solid '+RULE,background:(h<8||h>=19)?'#FAF8F4':'transparent'}}/>)}
        <div style={{height:(d1-d0)/60*HEURE}}/>
        {/* et par-dessus, les plages occupées */}
        {poses.map(p=>{const perso=p.rdv.type==='perso';
          return <div key={p.rdv.id} onClick={e=>{e.stopPropagation();onOuvrir(p.rdv)}}
            style={{position:'absolute',
              top:(p.debut-d0)/60*HEURE,
              height:Math.max(20,(p.fin-p.debut)/60*HEURE-2),
              left:'calc('+(p.col*100/p.cols)+'% + 3px)',
              width:'calc('+(100/p.cols)+'% - 6px)',
              background:perso?'#F6E2DC':'#E4EAEE',
              borderLeft:'3px solid '+(perso?TERRA:NAVY),
              borderRadius:4,padding:'2px 6px',overflow:'hidden',cursor:'pointer'}}>
            <div className="xs b" style={{color:perso?TERRA:NAVY,lineHeight:1.3}}>{p.rdv.titre||'(sans titre)'}</div>
            <div className="xs mut" style={{lineHeight:1.3}}>
              {plageHoraire(p.rdv.heure,p.rdv.heureFin)}
              {dureeRdv(p.rdv.heure,p.rdv.heureFin)?' · '+dureeRdv(p.rdv.heure,p.rdv.heureFin):''}
              {p.rdv.client?' · '+p.rdv.client:''}</div>
            {p.rdv.lieu&&(p.fin-p.debut)>=60?<div className="xs mut" style={{lineHeight:1.3}}>{p.rdv.lieu}</div>:null}
          </div>})}
        {/* le trait de l'heure courante, comme sur un agenda ouvert au jour même */}
        {date===t&&(()=>{const n=new Date().getHours()*60+new Date().getMinutes();
          if(n<d0||n>d1)return null;
          return <div style={{position:'absolute',left:0,right:0,top:(n-d0)/60*HEURE,
            borderTop:'2px solid '+TERRA,pointerEvents:'none'}}/>})()}
      </div>
    </div>
  </div>;
}

function Agenda({data,save}){
  const [f,setF]=useState(null);
  const [jour,setJour]=useState(null);   /* la journée ouverte, en vue heure par heure */
  const [mois,setMois]=useState(()=>{const d=new Date();return {annee:d.getFullYear(),m:d.getMonth()}});
  const R=data.rendezvous||[];
  const neuf=date=>({id:uid(),titre:'',date:date||today(),heure:'',heureFin:'',client:'',lieu:'',type:'pro',notes:'',recurrence:'',recurrenceFin:''});
  const estNouveau=f&&!R.some(x=>x.id===f.id);
  const ok=()=>{
    if(!(f.titre||'').trim()||!f.date)return;
    const {recurrence,recurrenceFin,...base}=f;
    if(estNouveau)save({...data,rendezvous:[...R,...genererSerie(base,recurrence,recurrenceFin)]});
    else save({...data,rendezvous:R.map(x=>x.id===f.id?base:x)});
    setF(null);
  };
  const del=()=>{if(confirm('Supprimer ce rendez-vous ?')){save({...data,rendezvous:R.filter(x=>x.id!==f.id)});setF(null)}};

  const parJour={};
  R.forEach(x=>{(parJour[x.date]=parJour[x.date]||[]).push(x)});
  Object.keys(parJour).forEach(d=>parJour[d].sort((a,b)=>(a.heure||'99:99').localeCompare(b.heure||'99:99')));
  const cases=grilleCalendrier(mois.annee,mois.m);
  const auj=today();
  const prochains=R.slice()
    .filter(x=>(x.date||'')>=auj)
    .sort((a,b)=>((a.date||'9999')+' '+(a.heure||'99:99')).localeCompare((b.date||'9999')+' '+(b.heure||'99:99')))
    .slice(0,5);
  const decaler=n=>setMois(m=>{const d=new Date(m.annee,m.m+n,1);return {annee:d.getFullYear(),m:d.getMonth()}});

  const Badge=({x})=><span className="xs" style={{marginLeft:8,padding:'1px 8px',borderRadius:20,fontWeight:600,
    background:x.type==='perso'?'#F6E2DC':'#E4EAEE',color:x.type==='perso'?TERRA:NAVY}}>
    {x.type==='perso'?'Perso':'Pro'}</span>;
  const Puce=({x})=><div onClick={e=>{e.stopPropagation();setF(x)}}
    title={[plageHoraire(x.heure,x.heureFin),x.titre,x.client,x.lieu].filter(Boolean).join(' — ')}
    style={{fontSize:10.5,marginTop:2,padding:'1px 4px',borderRadius:4,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',
      cursor:'pointer',background:x.type==='perso'?'#F6E2DC':'#E4EAEE',color:x.type==='perso'?TERRA:NAVY}}>
    {x.heure?x.heure+' ':''}{x.titre||'(sans titre)'}</div>;

  return <div>
    <H2 action={<button className="btn acc s" onClick={()=>setF(neuf(jour))}>+ Rendez-vous</button>}>
      AGENDA ({R.length})</H2>

    {f&&<div className="card" style={{borderLeft:'3px solid '+TERRA,marginBottom:20}}>
      <Fld label="TITRE"><input className="in" value={f.titre} onChange={e=>setF({...f,titre:e.target.value})}
        placeholder="Visite chantier, RDV notaire…"/></Fld>
      <div className="g2">
        <Fld label="NOM DU CLIENT"><input className="in" value={f.client||''} onChange={e=>setF({...f,client:e.target.value})}
          placeholder="M. et Mme Louveau"/></Fld>
        <Fld label="LIEU"><input className="in" value={f.lieu||''} onChange={e=>setF({...f,lieu:e.target.value})}
          placeholder="23 route des Hameaux, Résenlieu"/></Fld>
      </div>
      <div className="g2">
        <Fld label="DATE"><input className="in" type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})}/></Fld>
        <Fld label="HEURE DE DÉBUT"><input className="in" type="time" value={f.heure||''} onChange={e=>setF({...f,heure:e.target.value})}/></Fld>
      </div>
      <Fld label="HEURE DE FIN (OPTIONNELLE)">
        <input className="in" type="time" value={f.heureFin||''} onChange={e=>setF({...f,heureFin:e.target.value})}/>
      </Fld>
      {!!(f.heure&&f.heureFin)&&<div className="xs mut" style={{marginTop:-6,marginBottom:12,lineHeight:1.5}}>
        {dureeRdv(f.heure,f.heureFin)
          ?'Soit '+dureeRdv(f.heure,f.heureFin)+', de '+f.heure+' à '+f.heureFin+'.'
          :'L’heure de fin doit être postérieure à l’heure de début — sans quoi seul le début sera retenu.'}</div>}
      <Fld label="TYPE">
        <select className="in" value={f.type||'pro'} onChange={e=>setF({...f,type:e.target.value})}>
          <option value="pro">Professionnel</option>
          <option value="perso">Personnel</option>
        </select>
      </Fld>
      {estNouveau&&<div className="g2">
        <Fld label="RÉCURRENCE">
          <select className="in" value={f.recurrence||''} onChange={e=>setF({...f,recurrence:e.target.value})}>
            {RECURRENCES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
        </Fld>
        {!!f.recurrence&&<Fld label="JUSQU’AU (OPTIONNEL)">
          <input className="in" type="date" value={f.recurrenceFin||''} onChange={e=>setF({...f,recurrenceFin:e.target.value})}/>
        </Fld>}
      </div>}
      {!!f.recurrence&&<div className="xs mut" style={{marginTop:-6,marginBottom:12,lineHeight:1.5}}>
        Crée un rendez-vous par occurrence, jusqu’à la date choisie{f.recurrenceFin?'':' (24 au maximum, faute de date de fin)'}.
        Chacun pourra ensuite être modifié ou supprimé indépendamment des autres.</div>}
      <Fld label="NOTES"><textarea className="in" rows="3" value={f.notes||''} onChange={e=>setF({...f,notes:e.target.value})}
        placeholder="Contact, précisions…"/></Fld>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={estNouveau?null:del}/>
    </div>}

    {!f&&jour&&<>
      <div className="sp" style={{marginBottom:10,alignItems:'center'}}>
        <button className="btn s" onClick={()=>setJour(decalerJour(jour,-1))} aria-label="Jour précédent">←</button>
        <span className="b" style={{color:NAVY,textAlign:'center',flex:1,minWidth:0}}>{dateLongue(jour)}</span>
        <button className="btn s" onClick={()=>setJour(decalerJour(jour,1))} aria-label="Jour suivant">→</button>
      </div>
      <div className="row" style={{gap:6,marginBottom:10,flexWrap:'wrap'}}>
        <button className="btn gh s" onClick={()=>setJour(null)}>Retour au mois</button>
        <span className="xs mut" style={{flex:1,textAlign:'right'}}>Cliquez une heure pour y poser un rendez-vous.</span>
      </div>
      <JourAgenda date={jour} rdvs={parJour[jour]||[]}
        onOuvrir={x=>setF(x)}
        onCreer={h=>setF({...neuf(jour),heure:h})}/>
    </>}

    {!f&&!jour&&<>
      <div className="sp" style={{marginBottom:10,alignItems:'center'}}>
        <button className="btn s" onClick={()=>decaler(-1)} aria-label="Mois précédent">←</button>
        <span className="b" style={{color:NAVY}}>{MOIS_NOMS[mois.m]} {mois.annee}</span>
        <div className="row" style={{gap:6}}>
          <button className="btn s" onClick={()=>{const d=new Date();setMois({annee:d.getFullYear(),m:d.getMonth()})}}>Aujourd’hui</button>
          <button className="btn s" onClick={()=>decaler(1)} aria-label="Mois suivant">→</button>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:1,background:RULE,
        border:'1px solid '+RULE,borderRadius:8,overflow:'hidden'}}>
        {JOURS_NOMS.map(j=><div key={j} className="xs mut" style={{background:'#F4F1EB',padding:'6px 4px',textAlign:'center',fontWeight:600}}>{j}</div>)}
        {cases.map(c=><div key={c.date} data-date={c.date} onClick={()=>setJour(c.date)}
          style={{background:'#fff',minHeight:76,padding:'4px 5px',cursor:'pointer',opacity:c.dansMois?1:.4}}>
          <div className="xs" style={{fontWeight:c.date===auj?700:500,color:c.date===auj?TERRA:INK}}>{c.jour}</div>
          {(parJour[c.date]||[]).slice(0,3).map(x=><Puce key={x.id} x={x}/>)}
          {(parJour[c.date]||[]).length>3&&<div className="xs mut" style={{marginTop:2}}>
            +{(parJour[c.date]||[]).length-3} autre{(parJour[c.date]||[]).length-3>1?'s':''}</div>}
        </div>)}
      </div>

      {prochains.length>0&&<div style={{marginTop:24}}>
        <div className="h2" style={{marginBottom:8}}>PROCHAINS RENDEZ-VOUS</div>
        {prochains.map(x=><div key={x.id} className="card" onClick={()=>setF(x)} style={{cursor:'pointer'}}>
          <div className="sp">
            <span className="b sm" style={{color:NAVY}}>{x.titre}<Badge x={x}/></span>
            <span className="xs mut" style={{whiteSpace:'nowrap'}}>{fd(x.date)}
              {x.heure?' · '+plageHoraire(x.heure,x.heureFin):''}
              {dureeRdv(x.heure,x.heureFin)?' ('+dureeRdv(x.heure,x.heureFin)+')':''}</span>
          </div>
          {(x.client||x.lieu)&&<div className="xs mut" style={{marginTop:3}}>{[x.client,x.lieu].filter(Boolean).join(' · ')}</div>}
        </div>)}
      </div>}
      {!R.length&&<Empty>Aucun rendez-vous. Cliquez un jour du calendrier, ou « + Rendez-vous ».</Empty>}
    </>}
  </div>;
}

/* ---------------- TABLEAU DE BORD ----------------
   Ce qui appelle une action aujourd'hui, et rien d'autre : les chiffrages qu'on
   attend de vous, les étapes en retard, les pièces qui manquent à la phase où
   en est chaque chantier, et les décennales qui tombent. */

/* les pièces attendues à la phase courante et qui ne sont pas encore cochées */
function piecesManquantes(ch){
  const attendues=DOCS_PHASE[ch.statut]||[];
  const d=ch.docs||{};
  return attendues.filter(id=>!(d[id]&&d[id].fait))
    .map(id=>(DOCS.find(x=>x.id===id)||{l:id}).l);
}
/* les pièces du terrain qui manquent encore à un prospect */
function piecesProspectManquantes(p){
  const pj=(p&&p.pj)||{};
  return PIECES_PROSPECT.filter(d=>{
    const c=pj[d.id]||{};
    const F=c.fichiers||(d.id==='apd'?((p&&p.plans)||[]):[]);
    return !c.fait&&!F.length;
  }).map(d=>d.l);
}
/* jalons en retard, et ceux qui tombent dans les quinze jours */
function jalonsUrgents(ch){
  const t=today();
  const limite=new Date(Date.now()+15*86400000).toISOString().slice(0,10);
  return (ch.jalons||[]).filter(j=>j.prevue&&!j.reelle&&j.prevue<=limite)
    .map(j=>({...j,retard:j.prevue<t,jours:joursDepuis(j.prevue)}))
    .sort((a,b)=>(a.prevue||'').localeCompare(b.prevue||''));
}

function TableauBord({data,open,allerA}){
  const P=data.prospects||[];
  const chiffrages=P.filter(prospectAFaire)
    .map(p=>({...p,attente:joursDepuis(p.demandeLe)||0}))
    .sort((a,b)=>b.attente-a.attente);
  /* on ne parle que des chantiers vivants : un dossier clos n'a plus de retard */
  const actifs=data.chantiers.filter(c=>c.statut!=='clos');
  const retards=[];
  actifs.forEach(c=>jalonsUrgents(c).forEach(j=>retards.push({ch:c,j})));
  retards.sort((a,b)=>(a.j.prevue||'').localeCompare(b.j.prevue||''));
  const pieces=actifs.map(c=>({ch:c,manque:piecesManquantes(c)})).filter(x=>x.manque.length);
  const t=today();
  const decen=data.artisans.map(a=>({a,j:a.decennaleFin?Math.round((new Date(a.decennaleFin)-new Date(t))/86400000):null}))
    .filter(x=>x.j===null||x.j<60).sort((a,b)=>(a.j===null?-1e9:a.j)-(b.j===null?-1e9:b.j));
  /* les tâches en retard, tous chantiers vivants confondus — celles qu'on a
     notées et qu'on a laissées filer. À la différence d'un rendez-vous, c'est
     bien un problème : ça compte dans « rien ne réclame d'action ». */
  const tachesRetard=[];
  actifs.forEach(c=>(c.taches||[]).forEach(x=>{
    if(!x.fait&&x.echeance&&x.echeance<t)tachesRetard.push({ch:c,x,jours:joursDepuis(x.echeance)});
  }));
  tachesRetard.sort((a,b)=>(a.x.echeance||'').localeCompare(b.x.echeance||''));
  /* la liste de travail : toutes les tâches ouvertes, tous chantiers vivants
     confondus — pas seulement celles en retard. En retard puis urgence
     décroissante puis échéance ; sans échéance, en dernier. */
  const rangTache=x=>{
    if(x.echeance&&x.echeance<t)return 0;
    if(x.urgence==='Très urgente')return 1;
    if(x.urgence==='Urgente')return 2;
    return 3;
  };
  const tachesAFaire=[];
  actifs.forEach(c=>(c.taches||[]).forEach(x=>{if(!x.fait)tachesAFaire.push({ch:c,x})}));
  tachesAFaire.sort((a,b)=>rangTache(a.x)-rangTache(b.x)||(a.x.echeance||'9999-99-99').localeCompare(b.x.echeance||'9999-99-99'));
  /* les rendez-vous des sept prochains jours — un aperçu, pas une alerte : il
     ne compte pas dans « rien ne réclame d'action », un rendez-vous n'est pas
     un problème. */
  const limiteRdv=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const rdvProches=(data.rendezvous||[]).filter(x=>x.date&&x.date>=t&&x.date<=limiteRdv)
    .sort((a,b)=>((a.date||'')+' '+(a.heure||'99:99')).localeCompare((b.date||'')+' '+(b.heure||'99:99')));
  const rien=!chiffrages.length&&!retards.length&&!pieces.length&&!decen.length&&!tachesRetard.length;
  const Bloc=({titre,n,c,children})=><div className="card" style={{borderLeft:'3px solid '+c}}>
    <div className="sp" style={{marginBottom:8}}>
      <span className="b sm" style={{color:c}}>{titre}</span>
      <span className="pill" style={{background:c+'1A',color:c}}>{n}</span></div>
    {children}</div>;
  const item=(k,onClick,gauche,droite,couleur)=><button key={k} onClick={onClick}
    style={{display:'flex',width:'100%',justifyContent:'space-between',gap:10,alignItems:'baseline',
      textAlign:'left',background:'none',border:'none',borderTop:'1px solid '+RULE,padding:'7px 0'}}>
    <span className="xs" style={{flex:1,minWidth:0}}>{gauche}</span>
    <span className="xs b" style={{color:couleur||MUTED,whiteSpace:'nowrap'}}>{droite}</span></button>;
  return <div>
    <H2>TABLEAU DE BORD</H2>
    <div className="g2" style={{marginBottom:10}}>
      <Stat l="Chiffrages à réaliser" v={String(chiffrages.length)} c={chiffrages.length?TERRA:GREEN}/>
      <Stat l="Étapes en retard" v={String(retards.filter(r=>r.j.retard).length)} c={retards.some(r=>r.j.retard)?TERRA:GREEN}/>
      <Stat l="Chantiers en cours" v={String(actifs.length)} c={NAVY}/>
      <Stat l="Décennales à surveiller" v={String(decen.length)} c={decen.length?AMBER:GREEN}/>
      <Stat l="Rendez-vous (7 j)" v={String(rdvProches.length)} c={NAVY}/>
      <Stat l="Tâches en retard" v={String(tachesRetard.length)} c={tachesRetard.length?TERRA:GREEN}/>
    </div>

    {rdvProches.length>0&&<div style={{marginBottom:8}}><Bloc titre="AGENDA — 7 PROCHAINS JOURS" n={rdvProches.length} c={NAVY}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Vos rendez-vous professionnels et personnels des sept prochains jours.</div>
      {rdvProches.map(x=>item(x.id,()=>allerA('agenda'),
        <span><b>{x.titre||'(sans titre)'}</b>{x.client?<span className="mut"> · {x.client}</span>:null}
          {x.lieu?<div className="mut" style={{marginTop:2,lineHeight:1.5}}>{x.lieu}</div>:null}</span>,
        (x.date===t?'aujourd’hui':fd(x.date))+(x.heure?' · '+plageHoraire(x.heure,x.heureFin):''),
        x.date===t?TERRA:NAVY))}
    </Bloc></div>}

    {tachesAFaire.length>0&&<div style={{marginBottom:8}}><Bloc titre="TÂCHES À RÉALISER" n={tachesAFaire.length} c={tachesRetard.length?TERRA:NAVY}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Toutes les tâches ouvertes, tous chantiers confondus. Cochées comme faites dans l’onglet TÂCHES de chaque chantier, elles sortent d’ici.</div>
      {tachesAFaire.map(({ch,x})=>{
        const retard=x.echeance&&x.echeance<t;
        const droite=retard?'retard '+joursDepuis(x.echeance)+' j'
          :x.urgence?x.urgence+(x.echeance?' · '+fd(x.echeance):'')
          :x.echeance?fd(x.echeance):'—';
        const couleur=retard?TERRA:x.urgence==='Très urgente'?TERRA:x.urgence==='Urgente'?AMBER:MUTED;
        return item(ch.id+':'+x.id,()=>open(ch.id),
          <span><b>{x.texte}</b><span className="mut"> · {ch.nom}</span></span>,
          droite, couleur);
      })}
    </Bloc></div>}

    {rien&&<div className="card" style={{borderLeft:'3px solid '+GREEN}}>
      <div className="b sm" style={{color:GREEN}}>Rien ne réclame d’action</div>
      <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>Aucun chiffrage en attente, aucune étape en retard, aucune pièce manquante à la phase en cours, aucune décennale proche de son terme et aucune tâche en retard.</div>
    </div>}

    {chiffrages.length>0&&<Bloc titre="DEMANDES DE CHIFFRAGE" n={chiffrages.length} c={TERRA}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Déposées par le commercial, elles attendent votre réponse.</div>
      {chiffrages.map(p=>{
        const mq=piecesProspectManquantes(p);
        if(!navetteRemplie(p.navette))mq.push('Fiche navette');
        return item(p.id,()=>allerA('prospects'),
          <span><b>{p.nom}</b>{p.commercial?<span className="mut"> · {p.commercial}</span>:null}
            <span className="mut">{p.commune?' · '+p.commune:''}</span>
            {mq.length>0&&<div className="mut" style={{marginTop:2,lineHeight:1.5}}>Manque : {mq.join(' · ')}</div>}</span>,
          p.attente>0?p.attente+' j':'aujourd’hui', p.attente>7?TERRA:p.attente>3?AMBER:MUTED);
      })}
    </Bloc>}

    {retards.length>0&&<div style={{marginTop:8}}><Bloc titre="ÉTAPES À TENIR" n={retards.length} c={retards.some(r=>r.j.retard)?TERRA:AMBER}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>En retard, ou prévues dans les quinze jours.</div>
      {retards.map(({ch,j})=>item(ch.id+':'+j.id,()=>open(ch.id),
        <span><b>{j.label}</b><span className="mut"> · {ch.nom}</span></span>,
        j.retard?'retard '+j.jours+' j':fd(j.prevue), j.retard?TERRA:AMBER))}
    </Bloc></div>}

    {pieces.length>0&&<div style={{marginTop:8}}><Bloc titre="PIÈCES À AJOUTER" n={pieces.reduce((s,x)=>s+x.manque.length,0)} c={AMBER}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Les pièces attendues à la phase où en est chaque dossier.</div>
      {pieces.map(({ch,manque})=>item(ch.id,()=>open(ch.id),
        <span><b>{ch.nom}</b><span className="mut"> · {PHASE[ch.statut]}</span>
          <div className="mut" style={{marginTop:2,lineHeight:1.5}}>{manque.join(' · ')}</div></span>,
        manque.length+' pièce'+(manque.length>1?'s':''), AMBER))}
    </Bloc></div>}

    {decen.length>0&&<div style={{marginTop:8}}><Bloc titre="ASSURANCES DÉCENNALES" n={decen.length} c={AMBER}>
      <div className="xs mut" style={{marginBottom:2,lineHeight:1.5}}>Sans décennale à jour, l’application refuse d’émettre le marché.</div>
      {decen.map(({a,j})=>item(a.id,()=>allerA('artisans'),
        <span><b>{a.nom}</b>{a.corps?<span className="mut"> · {a.corps}</span>:null}</span>,
        j===null?'non renseignée':j<0?'expirée depuis '+(-j)+' j':'dans '+j+' j',
        j===null||j<0?TERRA:AMBER))}
    </Bloc></div>}
  </div>;
}

/* ---------------- PROSPECTS ----------------
   L'affaire avant qu'elle soit une affaire : le commercial dépose ce qu'il sait
   du projet et demande un chiffrage, le maître d'œuvre le pose et arrête sa
   marge. Une fois signée, la fiche se transforme en chantier. */
function Prospects({data,save}){
  const [f,setF]=useState(null);
  const [ouv,setOuv]=useState('');
  const [filtre,setFiltre]=useState('actifs');
  const P=data.prospects||[];
  const maj=(id,p)=>save({...data,prospects:P.map(x=>x.id===id?{...x,...p}:x)});
  const neuf=()=>({nom:'',civilite:'',client:'',telClient:'',emailClient:'',adresseClient:'',
    afficherClient2:false,client2:'',civilite2:'',telClient2:'',emailClient2:'',adresseClient2:'',commune:'',
    commercial:'',commercialTel:'',demandeLe:today(),statut:'demande',produits:[],
    typeTerrain:'',surfaceTerrain:'',prestation:'',chauffage:'',niveaux:'',nbChambres:'',
    surfaceHabitable:'',surfaceAnnexes:'',budgetClient:'',demande:'',
    courtier:false,courtierNom:'',courtierTel:'',financement:'',
    postes:[],coutHT:'',margePct:'',margeMontant:'',tva:'',remisLe:'',reponse:'',
    retroPct:'',retroMontant:'',
    terrainPrix:'',fraisNotaire:'',raccordements:[],travauxClient:[],
    dommageOuvrage:'',taxeAmenagement:'',taxeRaccordement:'',taxes:[],
    navette:{},decouverte:{},pj:{},chiffrages:[],plans:[],pieces:[]});
  const ok=()=>{
    if(!(f.nom||'').trim())return;
    const r={...f,surfaceTerrain:f.surfaceTerrain===''?'':+f.surfaceTerrain,
      surfaceHabitable:f.surfaceHabitable===''?'':+f.surfaceHabitable,
      surfaceAnnexes:f.surfaceAnnexes===''?'':+f.surfaceAnnexes,
      nbChambres:f.nbChambres===''?'':+f.nbChambres,
      budgetClient:f.budgetClient===''?'':+f.budgetClient,
      coutHT:f.coutHT===''?'':+f.coutHT,margePct:f.margePct===''?'':+f.margePct,
      margeMontant:f.margeMontant===''?'':+f.margeMontant,tva:f.tva===''?'':+f.tva,
      retroPct:f.retroPct===''?'':+f.retroPct,retroMontant:f.retroMontant===''?'':+f.retroMontant,
      dommageOuvrage:f.dommageOuvrage===''?'':+f.dommageOuvrage,
      taxeAmenagement:f.taxeAmenagement===''?'':+f.taxeAmenagement,
      taxeRaccordement:f.taxeRaccordement===''?'':+f.taxeRaccordement,
      terrainPrix:f.terrainPrix===''?'':+f.terrainPrix,
      fraisNotaire:f.fraisNotaire===''?'':+f.fraisNotaire};
    save({...data,prospects:f.id?P.map(x=>x.id===f.id?{...x,...r}:x):[...P,{...r,id:uid()}]});
    setF(null);
  };
  /* la fiche signée devient un chantier : on ne ressaisit pas ce qui est déjà là */
  const transformer=p=>{
    if(!confirm('Créer le chantier « '+p.nom+' » à partir de ce prospect ?\n\nLe prospect est conservé et passe en « Signé ».'))return;
    const id=uid();
    const ch={id,nom:p.nom,client:p.client||'',telClient:p.telClient||'',emailClient:p.emailClient||'',
      adresse:p.commune||'',adresseClient:p.adresseClient||'',
      surfaceHabitable:p.surfaceHabitable||'',surfacePlancher:'',
      budgetClientTTC:prospectPrixTTC(p)||'',budget:prospectCoutHT(p)||'',
      honorairesPct:'',honorairesMontant:prospectMargeHT(p)||'',
      statut:'etude',lienDrive:'',docs:{},jalons:[],prospectId:p.id};
    save({...data,chantiers:[...data.chantiers,ch],
      prospects:P.map(x=>x.id===p.id?{...x,statut:'gagne',chantierId:id}:x)});
    getDriveToken().then(t=>creerArborescence(t,id,ch.nom)).catch(()=>{});
  };
  const L=P.filter(p=>filtre==='tous'?true:filtre==='afaire'?prospectAFaire(p)
    :['demande','encours','chiffre','attente'].indexOf(p.statut)>=0)
    .sort((a,b)=>{
      /* ce qui attend une réponse remonte, puis le plus ancien d'abord */
      const pa=prospectAFaire(a)?0:1, pb=prospectAFaire(b)?0:1;
      if(pa!==pb)return pa-pb;
      return (a.demandeLe||'9999').localeCompare(b.demandeLe||'9999');
    });
  const nAF=P.filter(prospectAFaire).length;
  return <div>
    <H2 action={<button className="btn acc s" onClick={()=>setF(neuf())}>+ Prospect</button>}>PROSPECTS ({P.length})</H2>
    {nAF>0&&<div className="xs" style={{marginBottom:10,padding:'8px 10px',borderRadius:8,
      background:'#F6E2DC',borderLeft:'3px solid '+TERRA,lineHeight:1.6}}>
      <b style={{color:TERRA}}>{nAF} chiffrage{nAF>1?'s':''} à réaliser</b> — ce sont les fiches en tête de liste.
    </div>}
    {f&&<div className="card" style={{borderLeft:'3px solid '+TERRA}}>
      <Fld label="NOM DU PROJET"><input className="in" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})} placeholder="Maison Dupont — Ceaucé"/></Fld>
      <ImportContact label="Remplir depuis Contacts"
        onLu={c=>setF(p=>({...p,client:c.nom||p.client,telClient:c.tel||p.telClient,
          emailClient:c.email||p.emailClient||'',adresseClient:c.adresse||p.adresseClient}))}/>
      <div className="g2">
        <Fld label="CIVILITÉ">
          <select className="in" value={f.civilite||''} onChange={e=>setF({...f,civilite:e.target.value})}>
            <option value="">—</option>
            <option value="Mme">Mme</option>
            <option value="M.">M.</option>
            <option value="SCI">SCI</option>
            <option value="SAS">SAS</option>
            <option value="Autre">Autre</option>
          </select>
        </Fld>
        <Fld label="CLIENT"><input className="in" value={f.client} onChange={e=>setF({...f,client:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="TÉL. CLIENT"><input className="in" type="tel" value={f.telClient||''} onChange={e=>setF({...f,telClient:e.target.value})}/></Fld>
        <Fld label="E-MAIL CLIENT"><input className="in" type="email" value={f.emailClient||''} onChange={e=>setF({...f,emailClient:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="ADRESSE DU CLIENT"><input className="in" value={f.adresseClient||''} onChange={e=>setF({...f,adresseClient:e.target.value})}/></Fld>
        <div style={{display:'flex',alignItems:'flex-end'}}>
          <label className="row xs" style={{gap:8,alignItems:'center',cursor:'pointer',width:'100%'}}>
            <input type="checkbox" checked={!!f.afficherClient2} onChange={e=>setF({...f,afficherClient2:e.target.checked})}/>
            <span>Afficher le 2e acheteur</span>
          </label>
        </div>
      </div>
      {f.afficherClient2&&<>
        <div className="h2" style={{marginTop:16,marginBottom:8,fontSize:13}}>DEUXIÈME ACHETEUR</div>
        <div className="g2">
          <Fld label="CIVILITÉ 2">
            <select className="in" value={f.civilite2||''} onChange={e=>setF({...f,civilite2:e.target.value})}>
              <option value="">—</option>
              <option value="Mme">Mme</option>
              <option value="M.">M.</option>
              <option value="SCI">SCI</option>
              <option value="SAS">SAS</option>
              <option value="Autre">Autre</option>
            </select>
          </Fld>
          <Fld label="CLIENT 2"><input className="in" value={f.client2||''} onChange={e=>setF({...f,client2:e.target.value})}/></Fld>
        </div>
        <div className="g2">
          <Fld label="TÉL. CLIENT 2"><input className="in" type="tel" value={f.telClient2||''} onChange={e=>setF({...f,telClient2:e.target.value})}/></Fld>
          <Fld label="E-MAIL CLIENT 2"><input className="in" type="email" value={f.emailClient2||''} onChange={e=>setF({...f,emailClient2:e.target.value})}/></Fld>
        </div>
        <div className="g2">
          <Fld label="ADRESSE DU CLIENT 2"><input className="in" value={f.adresseClient2||''} onChange={e=>setF({...f,adresseClient2:e.target.value})}/></Fld>
          <span />
        </div>
      </>}
      <FormDecouverte dec={f.decouverte} onChange={v=>setF({...f,decouverte:v})}/>
      <Fld label="COMMUNE DE CONSTRUCTION"><input className="in" value={f.commune||''} onChange={e=>setF({...f,commune:e.target.value})} placeholder="Lotissement, commune, parcelle…"/></Fld>

      <div className="h2" style={{marginTop:16,marginBottom:8,fontSize:13}}>LA DEMANDE DU COMMERCIAL</div>
      <div className="g2">
        <Fld label="COMMERCIAL"><input className="in" value={f.commercial||''} onChange={e=>setF({...f,commercial:e.target.value})}/></Fld>
        <Fld label="TÉL. DU COMMERCIAL"><input className="in" type="tel" value={f.commercialTel||''} onChange={e=>setF({...f,commercialTel:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="DEMANDÉ LE"><input className="in" type="date" value={f.demandeLe||''} onChange={e=>setF({...f,demandeLe:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="TYPE DE TERRAIN"><input className="in" list="pterr" value={f.typeTerrain||''} onChange={e=>setF({...f,typeTerrain:e.target.value})}/>
          <datalist id="pterr">{TERRAINS.map(t=><option key={t} value={t}/>)}</datalist></Fld>
        <Fld label="SURFACE DU TERRAIN (m²)"><input className="in" type="number" step="1" value={f.surfaceTerrain||''} onChange={e=>setF({...f,surfaceTerrain:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="PRESTATION SOUHAITÉE"><input className="in" list="ppres" value={f.prestation||''} onChange={e=>setF({...f,prestation:e.target.value})}/>
          <datalist id="ppres">{PRESTATIONS.map(t=><option key={t} value={t}/>)}</datalist></Fld>
        <Fld label="TYPE DE CHAUFFAGE"><input className="in" list="pchauf" value={f.chauffage||''} onChange={e=>setF({...f,chauffage:e.target.value})}/>
          <datalist id="pchauf">{CHAUFFAGES.map(t=><option key={t} value={t}/>)}</datalist></Fld>
      </div>
      <div className="g2">
        <Fld label="NIVEAUX"><input className="in" list="pniv" value={f.niveaux||''} onChange={e=>setF({...f,niveaux:e.target.value})}/>
          <datalist id="pniv">{NIVEAUX.map(t=><option key={t} value={t}/>)}</datalist></Fld>
        <Fld label="NOMBRE DE CHAMBRES"><input className="in" type="number" step="1" value={f.nbChambres||''} onChange={e=>setF({...f,nbChambres:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="SURFACE HABITABLE (m²)"><input className="in" type="number" step="0.01" value={f.surfaceHabitable||''} onChange={e=>setF({...f,surfaceHabitable:e.target.value})}/></Fld>
        <Fld label="SURFACES ANNEXES (m²)"><input className="in" type="number" step="0.01" value={f.surfaceAnnexes||''} onChange={e=>setF({...f,surfaceAnnexes:e.target.value})} placeholder="Garage, cellier, préau…"/></Fld>
      </div>
      <div className="xs mut" style={{marginTop:-4,marginBottom:10,lineHeight:1.5}}>
        Surface pondérée retenue pour le ratio : <b>{surfacePonderee(f).toLocaleString('fr-FR')} m²</b> — l'habitable plus la moitié des annexes.
      </div>
      <Fld label="BUDGET ANNONCÉ PAR LE CLIENT (€ TTC)"><input className="in" type="number" value={f.budgetClient||''} onChange={e=>setF({...f,budgetClient:e.target.value})}/></Fld>
      <Fld label="MODE DE FINANCEMENT">
        <input className="in" list="pfin" value={f.financement||''} onChange={e=>setF({...f,financement:e.target.value})} placeholder="PTZ, comptant, crédit classique…"/>
        <datalist id="pfin">{FINANCEMENTS.map(x=><option key={x} value={x}/>)}</datalist>
      </Fld>
      <Fld label="COURTIER">
        <label className="row xs" style={{gap:8,alignItems:'center',cursor:'pointer'}}>
          <input type="checkbox" checked={!!f.courtier} onChange={e=>setF({...f,courtier:e.target.checked})}/>
          <span>Le client passe par un courtier</span></label>
        {f.courtier&&<div className="g2" style={{marginTop:8}}>
          <input className="in" placeholder="Nom du courtier" value={f.courtierNom||''} onChange={e=>setF({...f,courtierNom:e.target.value})}/>
          <input className="in" type="tel" placeholder="Téléphone" value={f.courtierTel||''} onChange={e=>setF({...f,courtierTel:e.target.value})}/>
        </div>}
      </Fld>
      <Fld label="PRÉCISIONS DE LA DEMANDE"><textarea className="in" rows="3" value={f.demande||''} onChange={e=>setF({...f,demande:e.target.value})} placeholder="Contraintes du terrain, souhaits particuliers, délais…"/></Fld>

      <FormNavette nav={f.navette||{}} onChange={v=>setF({...f,navette:v})}/>

      <div className="h2" style={{marginTop:16,marginBottom:8,fontSize:13}}>VOTRE CHIFFRAGE</div>
      <PostesChiffrage postes={f.postes||[]} onChange={v=>setF({...f,postes:v})}/>
      {!prospectPostesHT(f)&&<Fld label="COÛT DES TRAVAUX HT (€) — SANS DÉTAIL PAR POSTE">
        <input className="in" type="number" value={f.coutHT||''} onChange={e=>setF({...f,coutHT:e.target.value})}/></Fld>}
      <div className="g2">
        <Fld label="MARGE MAÎTRE D’ŒUVRE (%)"><input className="in" type="number" step="0.1" value={f.margePct||''} onChange={e=>setF({...f,margePct:e.target.value})}/></Fld>
        <Fld label="MARGE EN € — remplace le calcul"><input className="in" type="number"
          placeholder={'Auto : '+eur(prospectCoutHT(f)*(+f.margePct||0)/100)}
          value={f.margeMontant||''} onChange={e=>setF({...f,margeMontant:e.target.value})}/></Fld>
      </div>
      <Fld label="TVA (%)"><input className="in" type="number" step="0.1" placeholder="20" value={f.tva===undefined?'':f.tva} onChange={e=>setF({...f,tva:e.target.value})}/></Fld>

      <div className="h2" style={{marginTop:16,marginBottom:4,fontSize:13}}>LE RESTE DE L’OPÉRATION</div>
      <div className="xs mut" style={{marginBottom:8,lineHeight:1.5}}>
        Terrain, raccordements, taxes et travaux gardés par le client : ils pèsent sur son budget sans être
        le prix de la maison. Ils s'ajoutent au total sans entrer dans le ratio au m².
      </div>
      <div className="g2">
        <Fld label="PRIX DU TERRAIN (€)"><input className="in" type="number" value={f.terrainPrix||''} onChange={e=>setF({...f,terrainPrix:e.target.value})}/></Fld>
        <Fld label="FRAIS DE NOTAIRE (€)">
          <input className="in" type="number" value={f.fraisNotaire||''} onChange={e=>setF({...f,fraisNotaire:e.target.value})}
            placeholder={f.terrainPrix?'≈ '+eur(notaireEstime(f)):'Frais d’acte du terrain'}/>
          {!!f.terrainPrix&&<div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>
            Environ 7,5 % chez un particulier, nettement moins chez un lotisseur assujetti à la TVA.</div>}
        </Fld>
      </div>
      <LignesMontants lignes={f.raccordements||[]} onChange={v=>setF({...f,raccordements:v})}
        label="RACCORDEMENTS" ajout="+ Raccordement" exemple="Enedis, compteur d’eau, fibre…" liste={RACCORDEMENTS}/>
      <LignesMontants lignes={f.travauxClient||[]} onChange={v=>setF({...f,travauxClient:v})}
        label="TRAVAUX À CHARGE DU CLIENT" ajout="+ Poste" exemple="Peinture, cuisine…" liste={TRAVAUX_CLIENT}/>
      <div className="g2">
        <Fld label="DOMMAGES-OUVRAGE ESTIMÉE (€)"><input className="in" type="number" value={f.dommageOuvrage||''} onChange={e=>setF({...f,dommageOuvrage:e.target.value})}/></Fld>
        <Fld label="TAXE D’AMÉNAGEMENT (€)"><input className="in" type="number" value={f.taxeAmenagement||''} onChange={e=>setF({...f,taxeAmenagement:e.target.value})}/></Fld>
      </div>
      <LignesMontants lignes={f.taxes||[]} onChange={v=>setF({...f,taxes:v})}
        label="AUTRES TAXES ET PARTICIPATIONS" ajout="+ Taxe" exemple="Redevance archéologie, PFAC, PVR…"/>

      <div className="h2" style={{marginTop:16,marginBottom:8,fontSize:13}}>RÉTROCESSION PRÉVUE</div>
      <div className="xs" style={{marginBottom:8,padding:'8px 10px',borderRadius:8,
        background:'#F4F1EB',borderLeft:'3px solid '+NAVY,lineHeight:1.6}}>
        <b style={{color:NAVY}}>Interne</b> — elle porte sur le coût des travaux, pas sur votre marge.
        Elle n'apparaît ni sur le chiffrage remis au commercial, ni sur aucun document client.
      </div>
      <div className="g2">
        <Fld label="TAUX DE RÉTROCESSION (%)"><input className="in" type="number" step="0.1" value={f.retroPct||''} onChange={e=>setF({...f,retroPct:e.target.value})}/></Fld>
        <Fld label="MONTANT EN € — remplace le calcul"><input className="in" type="number"
          placeholder={'Auto : '+eur(prospectCoutHT(f)*(+f.retroPct||0)/100)}
          value={f.retroMontant||''} onChange={e=>setF({...f,retroMontant:e.target.value})}/></Fld>
      </div>

      <RecapChiffrage p={f} interne/>
      <div className="g2">
        <Fld label="STATUT"><select className="in" value={f.statut} onChange={e=>setF({...f,statut:e.target.value})}>
          {PROSPECT_ST.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Fld>
        <Fld label="CHIFFRAGE REMIS LE"><input className="in" type="date" value={f.remisLe||''} onChange={e=>setF({...f,remisLe:e.target.value})}/></Fld>
      </div>
      <Fld label="VOTRE RÉPONSE AU COMMERCIAL"><textarea className="in" rows="3" value={f.reponse||''} onChange={e=>setF({...f,reponse:e.target.value})} placeholder="Hypothèses retenues, postes exclus, réserves…"/></Fld>
      <Acts onSave={ok} onCancel={()=>setF(null)}
        onDel={f.id?()=>{if(confirm('Supprimer ce prospect ?')){save({...data,prospects:P.filter(x=>x.id!==f.id)});setF(null)}}:null}/>
    </div>}
    {P.length>0&&<div className="row" style={{gap:6,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
      <span className="xs mut">Afficher</span>
      {[['afaire','À chiffrer'],['actifs','En cours'],['tous','Tous']].map(([id,l])=>
        <button key={id} className={'btn s '+(filtre===id?'':'gh')} onClick={()=>setFiltre(id)}>{l}</button>)}
    </div>}
    {!P.length&&!f&&<Empty>Aucun prospect. « + Prospect » ouvre la première demande de chiffrage.</Empty>}
    {P.length>0&&!L.length&&<Empty>Aucun prospect dans cette vue.</Empty>}
    {L.map(p=>{
      const st=prospectSt(p.statut), prix=prospectPrixTTC(p), r=ratioM2(prix,p);
      const attente=prospectAFaire(p)?joursDepuis(p.demandeLe):null;
      return <div key={p.id} className="card" style={{borderLeft:'3px solid '+st.c}}>
        <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
          <span className="b sm" style={{color:NAVY}}>{p.nom}</span>
          <div className="row" style={{gap:6,alignItems:'center',flex:'0 0 auto'}}>
            <span className="pill" style={{background:st.c+'1A',color:st.c}}>{st.label}</span>
            <Plus actif={ouv===p.id} titre="Voir le détail" onClick={()=>setOuv(ouv===p.id?'':p.id)}/>
          </div>
        </div>
        <div className="xs mut" style={{marginTop:3,lineHeight:1.5}}>
          {p.adresseClient&&<div>{p.adresseClient}</div>}
          {p.adresseClient2 && String(p.adresseClient2).trim() && String(p.adresseClient2).trim() !== String(p.adresseClient||'').trim() && <div>{p.adresseClient2}</div>}
          {p.commune&&<div>{p.commune}</div>}
        </div>
        {attente!==null&&attente>0&&<div className="xs b" style={{color:attente>7?TERRA:AMBER,marginTop:3}}>
          En attente depuis {attente} jour{attente>1?'s':''}</div>}
        <div className="g3 xs" style={{marginTop:8}}>
          <div><div className="mut">Prix du projet</div><div className="b">{prix?eur(prix)+' TTC':'à chiffrer'}</div></div>
          <div><div className="mut">Surface pondérée</div><div>{surfacePonderee(p)?surfacePonderee(p).toLocaleString('fr-FR')+' m²':'—'}</div></div>
          <div><div className="mut">Ratio</div><div className="b" style={{color:r?NAVY:MUTED}}>{eurM2(r)}</div></div>
        </div>
        {ouv===p.id&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
          <DetailProspect p={p} maj={v=>maj(p.id,v)} data={data}/>
          <div className="row" style={{gap:8,marginTop:12,flexWrap:'wrap'}}>
            <button className="btn s" onClick={()=>setF({...neuf(),...p})}>Modifier</button>
            {p.statut!=='gagne'&&<button className="btn gh s" onClick={()=>transformer(p)}>Transformer en chantier</button>}
            {p.chantierId&&<span className="xs" style={{color:GREEN,alignSelf:'center'}}>✓ Chantier créé</span>}
          </div>
        </div>}
      </div>;
    })}
  </div>;
}

/* le chiffrage poste par poste : un libellé, un montant, et la somme en bas */
function PostesChiffrage({postes,onChange}){
  const L=postes||[];
  const set=(id,p)=>onChange(L.map(x=>x.id===id?{...x,...p}:x));
  return <Fld label="CHIFFRAGE PAR POSTE">
    {L.map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center'}}>
      <input className="in" style={{flex:1,minWidth:0}} list="pcorps" value={x.libelle||''}
        placeholder="Corps d’état" onChange={e=>set(x.id,{libelle:e.target.value})}/>
      <input className="in" style={{width:110,flex:'0 0 auto'}} type="number" value={x.montant||''}
        placeholder="€ HT" onChange={e=>set(x.id,{montant:e.target.value})}/>
      <button className="xs" style={{color:MUTED,background:'none',border:'none',padding:'0 4px'}}
        onClick={()=>onChange(L.filter(y=>y.id!==x.id))}>✕</button>

}

/* ---------- la fiche de découverte ----------
   Ce que Loïc remplit chez le client, au tout premier rendez-vous — avant même
   la demande de chiffrage plus bas sur cette fiche. */
function RechercheZonage({dec,set}){
  const [travail,setTravail]=useState('');
  const adresse=dec.adresseProjet||'';
  const ouvrir=async(nom,construire)=>{
    const onglet=window.open('','_blank');
    setTravail(nom);
    let g=null;
    try{g=await geocoderAdresse(adresse)}catch(e){/* on ouvre quand même, sur la page de recherche */}
    if(onglet)onglet.location.href=construire(g);
    setTravail('');
  };
  return <div className="card" style={{padding:10,marginBottom:10,borderLeft:'3px solid '+TERRA}}>
    <div className="xs b" style={{color:TERRA,marginBottom:4,letterSpacing:'.03em'}}>RECHERCHE DE ZONAGE DU TERRAIN</div>
    <div className="xs mut" style={{marginBottom:8,lineHeight:1.5}}>
      Ouvre les outils officiels sur l'adresse du projet — vérifiez que la bonne parcelle s'affiche,
      puis reportez le résultat ci-dessous.
    </div>
    <div className="row" style={{gap:6,flexWrap:'wrap',marginBottom:8}}>
      <button className="btn gh s" disabled={!adresse||travail==='geo'} onClick={()=>ouvrir('geo',lienGeorisques)}>
        {travail==='geo'?'Recherche…':'Géorisques (sol, risques)'}</button>
      <button className="btn gh s" disabled={!adresse||travail==='gpu'} onClick={()=>ouvrir('gpu',lienGeoportailUrbanisme)}>
        {travail==='gpu'?'Recherche…':'Géoportail de l’urbanisme'}</button>
      <button className="btn gh s" onClick={()=>window.open(LIEN_ATLAS_PATRIMOINES,'_blank')}>
        Atlas des patrimoines (bâtiments de France)</button>
    </div>
    {!adresse&&<div className="xs mut" style={{marginBottom:8}}>
      Saisissez l'adresse du projet ci-dessus pour positionner la recherche.</div>}
    <div className="g2">
      <Fld label="TYPE DE SOL"><input className="in" value={dec.typeSol||''} onChange={e=>set('typeSol',e.target.value)}/></Fld>
      <Fld label="BÂTIMENTS DE FRANCE">
        <select className="in" value={dec.batimentsFrance||''} onChange={e=>set('batimentsFrance',e.target.value)}>
          <option value="">—</option>{DEC_OUI_NON_VERIF.map(o=><option key={o} value={o}>{o}</option>)}

        <option value="">—</option>{DEC_OUI_NON_VERIF.map(o=><option key={o} value={o}>{o}</option>)}

}

/* ce qui a été renseigné, pour l'affichage et pour le document */
const navetteLignes=nav=>{
  const N=nav||{}, out=[];
  NAVETTE.forEach(g=>{
    const L=g.champs.filter(([k])=>(N[k]||'').trim()).map(([k,l])=>[l,N[k]]);
    if(L.length)out.push([g.lot,L]);
  });
  const e=N.elecOptions||[];
  if(e.length||(N.elecNotes||'').trim())
    out.push(['Électricité',[['Options',e.join(' · ')+((N.elecNotes||'').trim()?(e.length?' · ':'')+N.elecNotes:'')]]]);
  return out;
};
const navetteRemplie=nav=>navetteLignes(nav).length>0;

/* ce qui a été renseigné dans la fiche de découverte, groupé par section — pour
   l'écran comme pour le document Word : commune, superficie, surface habitable,
   chambres et chauffage viennent du prospect lui-même, pas de la fiche. */
const decouverteLignes=p=>{
  const N=(p&&p.decouverte)||{}, out=[];
  const projet=[['adresseProjet','Adresse du projet'],['sectionCadastre','Section cadastrale'],
    ['typeSol','Type de sol'],['batimentsFrance','Bâtiments de France'],['natura2000','Zone Natura 2000']]
    .filter(([k])=>(N[k]||'').trim()).map(([k,l])=>[l,N[k]]);
  if(projet.length)out.push(['Le projet',projet]);

  const foyer=[['nbAdultes',"Nombre d'adultes"],['nbEnfants',"Nombre d'enfants"],['logementActuel','Logement actuel']]
    .filter(([k])=>(N[k]||'').toString().trim()).map(([k,l])=>[l,N[k]]);
  if(foyer.length)out.push(['1. Le foyer',foyer]);

  const terrain=[];
  if(N.statutTerrain)terrain.push(['Statut du terrain',N.statutTerrain]);
  if((p.commune||'').trim())terrain.push(['Commune / secteur envisagé',p.commune]);
  if(p.surfaceTerrain)terrain.push(['Superficie',p.surfaceTerrain+' m²']);
  if(N.viabilise)terrain.push(['Terrain viabilisé',N.viabilise]);
  if(N.etudeSol)terrain.push(["Étude de sol réalisée",N.etudeSol]);
  if((N.particularites||'').trim())terrain.push(['Particularités',N.particularites]);
  if(terrain.length)out.push(['2. Le terrain',terrain]);

  const budget=[['enveloppe','Enveloppe globale visée',v=>eurDoc(v)],['apport','Apport personnel',v=>eurDoc(v)],
    ['situationFinancement','Situation de financement']]
    .filter(([k])=>(N[k]||'').toString().trim())
    .map(([k,l,f])=>[l,f?f(N[k]):N[k]]);
  if(budget.length)out.push(['3. Budget & financement',budget]);

  const prog=[];
  if(N.niveauSouhaite)prog.push(['Plain-pied ou étage',N.niveauSouhaite]);
  if(p.surfaceHabitable)prog.push(['Surface habitable visée',p.surfaceHabitable+' m²']);
  if(p.nbChambres)prog.push(['Nombre de chambres',p.nbChambres]);
  if(N.suiteParentale)prog.push(['Suite parentale',N.suiteParentale]);
  if(N.bureau)prog.push(['Bureau / coin télétravail',N.bureau]);
  if(N.buanderie)prog.push(['Buanderie / cellier / dépendance',N.buanderie]);
  if((N.exterieur||[]).length)prog.push(['Extérieur souhaité',N.exterieur.join(', ')]);
  if(prog.length)out.push(['4. Le programme',prog]);

  if((N.style||'').trim())out.push(['5. Style & matériaux',[['Style architectural',N.style]]]);

  const tech=[['fondations','Type de fondations'],['videSanitaire','Vide sanitaire'],['mur','Type de mur'],
    ['charpente','Type de charpente'],['couverture','Couverture'],['menuiseries','Menuiseries extérieures']]
    .filter(([k])=>(N[k]||'').trim()).map(([k,l])=>[l,N[k]]);
  if((p.chauffage||'').trim())tech.push(['Chauffage souhaité',p.chauffage]);
  if((N.ecs||'').trim())tech.push(["Production d'eau chaude",N.ecs]);
  if((N.vmc||'').trim())tech.push(['VMC',N.vmc]);
  if(tech.length)out.push(['6. Aspects techniques',tech]);

  const cal=[];
  if((N.echeance||'').trim())cal.push(['Échéance souhaitée',N.echeance]);
  if((N.contraintesCalendrier||'').trim())cal.push(['Contraintes de calendrier',N.contraintesCalendrier]);
  if(cal.length)out.push(['7. Calendrier',cal]);

  const prio=DEC_PRIORITES.filter(([k])=>N[k]).sort((a,b)=>(+N[a[0]])-(+N[b[0]]));
  if(prio.length)out.push(['8. Vos priorités',prio.map(([k,l])=>[l,'Rang '+N[k]])]);

  const vig=[['experiencePrec','Expériences précédentes'],['craintes','Craintes ou questions exprimées'],
    ['remarques','Autres remarques']].filter(([k])=>(N[k]||'').trim()).map(([k,l])=>[l,N[k]]);
  if(vig.length)out.push(['9. Vigilances & remarques',vig]);

  const synth=[['pointsCles','Points clés du projet'],['actions','Actions à mener par CP Constructions']]
    .filter(([k])=>(N[k]||'').trim()).map(([k,l])=>[l,N[k]]);
  if(N.prochainRdvDate||(N.prochainRdvObjet||'').trim())
    synth.push(['Prochain rendez-vous',[N.prochainRdvDate?fd(N.prochainRdvDate):'',N.prochainRdvObjet].filter(Boolean).join(' — ')]);
  if(synth.length)out.push(['Synthèse & prochaines étapes',synth]);

  return out;
};
const decouverteRemplie=p=>decouverteLignes(p).length>0;

/* une liste libellé + montant : taxes, participations, tout ce qui s'ajoute */
function LignesMontants({lignes,onChange,label,ajout,exemple,liste}){
  const L=lignes||[];
  const set=(id,p)=>onChange(L.map(x=>x.id===id?{...x,...p}:x));
  const total=sommeLignes(L);
  /* les suggestions ont besoin d'un identifiant qui leur soit propre */
  const dl=liste?'dl'+String(label).replace(/[^A-Za-z]/g,'').slice(0,12):null;
  return <Fld label={label}>
    {dl&&<datalist id={dl}>{liste.map(x=><option key={x} value={x}/>)}</datalist>}
    {L.map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center'}}>
      <input className="in" style={{flex:1,minWidth:0}} value={x.libelle||''} list={dl||undefined}
        placeholder={exemple} onChange={e=>set(x.id,{libelle:e.target.value})}/>
      <input className="in" style={{width:110,flex:'0 0 auto'}} type="number" value={x.montant||''}
        placeholder="€" onChange={e=>set(x.id,{montant:e.target.value})}/>
      <button className="xs" style={{color:MUTED,background:'none',border:'none',padding:'0 4px'}}
        onClick={()=>onChange(L.filter(y=>y.id!==x.id))}>✕</button>
    </div>)}
    <div className="row" style={{gap:10,alignItems:'center',marginTop:4}}>
      <button className="btn gh s" onClick={()=>onChange([...L,{id:uid(),libelle:'',montant:''}])}>{ajout}</button>
      {L.length>0&&<span className="xs b">Total {eur(total)}</span>}
    </div>
  </Fld>;
}

/* le récapitulatif du chiffrage, tel qu'il se lit une fois les postes saisis.
   « interne » ajoute la rétrocession : elle n'a pas à figurer ailleurs. */
function RecapChiffrage({p,interne}){
  const cout=prospectCoutHT(p), marge=prospectMargeHT(p);
  const ht=prospectPrixHT(p), ttc=prospectPrixTTC(p);
  const rTTC=ratioM2(ttc,p), rHT=ratioM2(ht,p);
  const bud=+((p&&p.budgetClient))||0;
  const taxes=prospectTaxes(p), dOuv=prospectDO(p), op=prospectOperationTTC(p);
  const terr=prospectTerrain(p), racc=prospectRaccordements(p), tvx=prospectTravauxClient(p);
  const annexe=terr+racc+tvx+taxes+dOuv;
  const retro=prospectRetro(p);
  if(!cout&&!marge&&!annexe)return null;
  const ligne=(l,v,c)=><div className="sp xs" style={{padding:'2px 0'}}>
    <span className="mut">{l}</span><span style={{color:c}}>{v}</span></div>;
  return <div className="card" style={{marginTop:4,marginBottom:12,background:'#F4F1EB',borderLeft:'3px solid '+NAVY}}>
    <div className="g2 xs">
      <div><div className="mut">Coût des travaux</div><div className="b">{eur(cout)} HT</div></div>
      <div><div className="mut">Marge maîtrise d’œuvre</div><div className="b">{eur(marge)} HT{cout?' · '+Math.round(marge/cout*1000)/10+' %':''}</div></div>
    </div>
    <div className="sp" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE,alignItems:'flex-end'}}>
      <span className="xs mut">Prix de la maison</span>
      <span className="b" style={{fontSize:19,color:NAVY,lineHeight:1}}>{eur(ttc)} TTC</span>
    </div>
    <div className="xs mut" style={{textAlign:'right',marginTop:2}}>{eur(ht)} HT · TVA {prospectTva(p)} %</div>
    <div className="sp" style={{marginTop:10,paddingTop:10,borderTop:'2px solid '+TERRA,alignItems:'flex-end'}}>
      <span className="xs mut">Ratio au m² pondéré</span>
      <span className="b" style={{fontSize:18,color:TERRA,lineHeight:1}}>{eurM2(rTTC)} TTC</span>
    </div>
    <div className="xs mut" style={{textAlign:'right',marginTop:2}}>
      {eurM2(rHT)} HT · sur {surfacePonderee(p).toLocaleString('fr-FR')} m² pondérés</div>
    {annexe>0&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE}}>
      <div className="xs mut" style={{marginBottom:4}}>S’ajoutent au prix de la maison</div>
      {+p.terrainPrix>0&&ligne('Terrain',eur(p.terrainPrix))}
      {+p.fraisNotaire>0&&ligne('Frais de notaire',eur(p.fraisNotaire))}
      {(p.raccordements||[]).filter(x=>+x.montant).map(x=>
        <div key={x.id} className="sp xs" style={{padding:'2px 0'}}>
          <span className="mut">{x.libelle||'Raccordement'}</span><span>{eur(x.montant)}</span></div>)}
      {+p.taxeRaccordement>0&&ligne('Raccordements',eur(p.taxeRaccordement))}
      {(p.travauxClient||[]).filter(x=>+x.montant).map(x=>
        <div key={x.id} className="sp xs" style={{padding:'2px 0'}}>
          <span className="mut">{x.libelle||'Travaux client'} <i>(à sa charge)</i></span><span>{eur(x.montant)}</span></div>)}
      {dOuv>0&&ligne('Dommages-ouvrage estimée',eur(dOuv))}
      {+p.taxeAmenagement>0&&ligne('Taxe d’aménagement',eur(p.taxeAmenagement))}
      {(p.taxes||[]).filter(x=>+x.montant).map(x=>
        <div key={x.id} className="sp xs" style={{padding:'2px 0'}}>
          <span className="mut">{x.libelle||'Autre taxe'}</span><span>{eur(x.montant)}</span></div>)}
      <div className="sp" style={{marginTop:8,paddingTop:8,borderTop:'1px solid '+RULE,alignItems:'flex-end'}}>
        <span className="xs b">Coût total de l’opération</span>
        <span className="b" style={{fontSize:17,color:NAVY,lineHeight:1}}>{eur(op)} TTC</span>
      </div>
      {tvx>0&&<div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>
        Dont {eur(tvx)} de travaux que le client garde à sa charge — hors marchés.</div>}
    </div>}
    {bud>0&&<div className="xs" style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+RULE,
      color:op>bud?TERRA:GREEN,lineHeight:1.5}}>
      Budget annoncé par le client {eur(bud)} TTC — {op>bud?'dépassé de '+eur(op-bud):'marge de '+eur(bud-op)}
      {(taxes>0||dOuv>0)&&<span className="mut"> (opération complète, taxes et assurance comprises)</span>}
    </div>}
    {interne&&retro>0&&<div className="xs" style={{marginTop:10,paddingTop:10,borderTop:'2px solid '+NAVY}}>
      <div className="sp"><span className="mut">Rétrocession prévue — interne</span>
        <span className="b" style={{color:NAVY}}>{eur(retro)} HT</span></div>
      <div className="mut" style={{marginTop:2}}>
        {+p.retroPct>0&&!(p.retroMontant!==''&&p.retroMontant!==undefined&&p.retroMontant!==null)
          ? p.retroPct+' % du coût des travaux'
          : 'montant arrêté à la main'} · recette totale {eur(marge+retro)} HT avec la marge</div>
    </div>}
  </div>;
}

/* les produits que ce projet retient, cochés dans la base */

    {ouvre&&<div style={{marginTop:8,maxHeight:280,overflowY:'auto',border:'1px solid '+RULE,
      borderRadius:8,padding:'8px 10px'}}>

}

/* ---------- la fiche de découverte, sortie en Word ---------- */
function SortirDecouverte({p,maj}){
  const [etat,setEtat]=useState(null);
  const rempli=decouverteRemplie(p);
  const produire=async()=>{
    setEtat({etat:'travail'});
    try{
      const buf=await genererDecouverteDocx(p);
      const nom='Fiche de découverte — '+(p.nom||'projet')+'.docx';
      const token=await getDriveToken();
      const dossierId=await driveProspectFolder(token,p.id,p.nom);
      const {webViewLink}=await uploadToDrive(new File([buf],nom,
        {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),dossierId);
      maj({decouverteLe:today()});
      setEtat({etat:'ok',lien:webViewLink,nom});
    }catch(e){
      const c=String((e&&(e.error||e.message))||e);
      setEtat({etat:'erreur',msg:c==='auth_required'
        ?"La fiche a été composée, mais Google Drive n'est pas connecté — reconnectez-le puis relancez."
        :'Sortie impossible — '+c});
    }

    <div className="b sm" style={{color:TERRA}}>Fiche de découverte (Word)</div>

      Reprend tout ce qui est saisi ci-dessus, pour le dossier client.
      {p.decouverteLe?<span> Dernière sortie le {fd(p.decouverteLe)}.</span>:null}
    </div>
    <div className="row" style={{gap:8,marginTop:8,flexWrap:'wrap'}}>
      <button className="btn acc s" disabled={etat&&etat.etat==='travail'} onClick={produire}>
        {etat&&etat.etat==='travail'?'Composition…':'Sortir la fiche Word'}</button>
      {etat&&etat.etat==='ok'&&<a href={etat.lien} target="_blank" rel="noreferrer" className="btn gh s"

    {etat&&etat.etat==='erreur'&&<div className="xs" style={{marginTop:8,color:TERRA,lineHeight:1.5}}>{etat.msg}</div>}
