<style>
  /* Charte : bleu ardoise, terre cuite, fond crème. Angles adoucis, ombres
     légères plutôt que traits durs — l'écran reste lisible en plein soleil
     sur un chantier, ce qui interdit les gris trop clairs et les fines lignes. */
  :root{
    --navy:#2C4A5E; --terra:#C5563A; --ink:#1A2B36; --rule:#E2DDD3; --mut:#6E7B84;
    --green:#3F7A5A; --amber:#B07D12; --fond:#F7F5F0; --surface:#fff;
    --ombre:0 1px 2px rgba(26,43,54,.05), 0 2px 8px rgba(26,43,54,.05);
    --ombre-h:0 2px 4px rgba(26,43,54,.07), 0 6px 18px rgba(26,43,54,.09);
    --r:12px; --r-s:9px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--fond);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica Neue,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  input,select,textarea,button{font-family:inherit;font-size:16px}
  a{text-decoration:none}
  .row{display:flex}.sp{display:flex;justify-content:space-between;align-items:center}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
        padding:14px;margin-bottom:10px;width:100%;text-align:left;display:block;
        box-shadow:var(--ombre);transition:box-shadow .15s,transform .08s,border-color .15s}
  button.card:active{transform:scale(.994)}
  .xs{font-size:12px}.sm{font-size:14px}.b{font-weight:650}.mut{color:var(--mut)}

  .in{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:var(--r-s);
      background:var(--surface);color:var(--ink);font-size:16px;transition:border-color .15s,box-shadow .15s}
  .in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(44,74,94,.12)}
  .lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
       color:var(--mut);margin:0 0 5px;font-weight:600}
  .fld{margin-bottom:14px}

  .btn{padding:10px 15px;font-size:14px;font-weight:600;border:1px solid var(--navy);
       background:var(--navy);color:#fff;border-radius:999px;white-space:nowrap;
       transition:filter .15s,transform .08s;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn:hover{filter:brightness(1.08)}
  .btn.acc{background:var(--terra);border-color:var(--terra)}
  .btn.gh{background:transparent;color:var(--navy);border-color:var(--rule);font-weight:600}
  .btn.gh:hover{background:#EFEDE7;filter:none}
  .btn.dg{background:transparent;color:var(--terra);border-color:var(--terra)}
  .btn.s{padding:6px 11px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default;transform:none;filter:none}

  .h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);
      border-bottom:2px solid var(--terra);padding-bottom:5px;display:inline-block}

  .tabs{display:flex;overflow-x:auto;gap:4px;border-bottom:1px solid var(--rule);
        margin-bottom:16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:10px 13px;font-size:12px;letter-spacing:.04em;font-weight:600;
       background:none;border:none;border-radius:var(--r-s) var(--r-s) 0 0;
       border-bottom:2px solid transparent;color:var(--mut);white-space:nowrap;transition:color .15s,background .15s}
  .tab.on{color:var(--navy);border-bottom-color:var(--terra);background:rgba(197,86,58,.06)}

  nav.bot{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);
          backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
          border-top:1px solid var(--rule);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
  /* sept onglets sur une largeur d'iPhone : on resserre la graisse plutôt que
     de couper les mots. La colonne de gauche, sur ordinateur, reprend sa taille. */
  nav.bot button{flex:1;min-width:0;padding:9px 1px;font-size:9.5px;letter-spacing:0;font-weight:700;
                 background:none;border:none;border-radius:var(--r-s);color:var(--mut);
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
  @media (min-width:430px){nav.bot button{font-size:10.5px;letter-spacing:.01em}}
  nav.bot button.on{color:var(--navy);background:rgba(197,86,58,.1)}

  .bar{height:6px;background:#EAE6DE;border-radius:999px;margin-top:9px;overflow:hidden}
  .bar>div{border-radius:999px;transition:width .4s ease}
  .chk{width:24px;height:24px;min-width:24px;display:flex;align-items:center;justify-content:center;
       font-size:14px;color:#fff;border:1px solid var(--rule);background:var(--surface);
       border-radius:7px;transition:background .15s,border-color .15s}
  .grid-ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#EFECE6;border-radius:var(--r-s)}
  .modal{position:fixed;inset:0;background:rgba(26,43,54,.94);z-index:50;display:flex;flex-direction:column;padding:16px}
  #root{padding-bottom:82px}
  .grid-ch{display:grid;gap:10px}
  nav.bot.masquee{display:none}
  table{font-variant-numeric:tabular-nums}
  /* état d'une fiche : une pastille se repère mieux qu'un mot coloré */
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;
        font-weight:700;letter-spacing:.03em;white-space:nowrap;line-height:1.5}

  /* ---------- version ordinateur : la navigation passe en colonne à gauche ---------- */
  @media (min-width:900px){
    #root{padding-bottom:0;padding-left:244px}
    header{position:fixed;top:0;left:0;width:244px;height:78px;z-index:20;display:flex;flex-direction:column;justify-content:center}
    nav.bot{top:78px;bottom:0;right:auto;width:244px;flex-direction:column;gap:2px;
            border-top:none;border-right:1px solid var(--rule);background:var(--surface);
            backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 10px 20px;overflow-y:auto}
    nav.bot.masquee{display:flex}
    nav.bot button{flex:0 0 auto;text-align:left;padding:11px 14px;font-size:12.5px;font-weight:600;letter-spacing:.02em;border-radius:var(--r-s)}
    nav.bot button.on{background:rgba(197,86,58,.1)}
    nav.bot button:hover{background:#F3F1EC}
    main{max-width:1120px;padding:28px 34px 64px!important}
    .grid-ch{grid-template-columns:1fr 1fr;gap:14px}
    .grid-ch>.card{margin-bottom:0}
    .stats3{grid-template-columns:repeat(3,1fr)}
    .fld .in{max-width:520px}
    .fld textarea.in{max-width:760px}
    .grid-ph{grid-template-columns:repeat(4,1fr)}
    .tabs{position:sticky;top:0;background:var(--fond);z-index:10}
    button.card:hover{box-shadow:var(--ombre-h);border-color:#CFC8BB;cursor:pointer}
  }
  @media (min-width:1400px){
    main{max-width:1280px}
    .grid-ch{grid-template-columns:repeat(3,1fr)}
    .grid-ph{grid-template-columns:repeat(5,1fr)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- fiche contact Apple (.vcf) ----------
   Safari n'expose pas l'API Contacts : aucune page web ne peut ouvrir le carnet
   d'adresses de l'iPhone, même avec autorisation. Ce qui marche, c'est la fiche
   partagée par l'app Contacts (« Partager le contact » → Enregistrer dans
   Fichiers), qu'on lit ici. C'est un geste de plus, mais rien n'est retapé. */
const VCARD_ACCEPT='.vcf,.vcard,text/vcard,text/x-vcard,text/directory,text/plain';
/* découpe en respectant les séparateurs échappés (\; et \,) */
const vcSplit=(s,sep)=>{
  const out=[];let cur='';
  for(let i=0;i<s.length;i++){
    if(s[i]==='\\'&&i+1<s.length){cur+=s[i]+s[i+1];i++;continue}
    if(s[i]===sep){out.push(cur);cur='';continue}
    cur+=s[i];
  }
  out.push(cur);return out;
};
const vcUnescape=s=>String(s||'').replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').replace(/\s+/g,' ').trim();
/* les fiches exportées par d'anciens carnets sont en quoted-printable */
const qpDecode=s=>{
  const t=String(s).replace(/=\n/g,'');
  const b=[];
  for(let i=0;i<t.length;i++){
    if(t[i]==='='&&/^[0-9A-Fa-f]{2}$/.test(t.substr(i+1,2))){b.push(parseInt(t.substr(i+1,2),16));i+=2}
    else b.push(t.charCodeAt(i)&0xff);
  }
  try{return new TextDecoder('utf-8').decode(new Uint8Array(b))}catch(e){return t}
};
const lireVCard=txt=>{
  /* dépliage : une ligne continuée commence par une espace ou une tabulation */
  const t=String(txt||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n[ \t]/g,'');
  const cartes=t.split(/BEGIN:VCARD/i).slice(1);
  const corps=cartes.length?cartes[0]:t;
  const res={nom:'',tel:'',email:'',adresse:'',plusieurs:cartes.length>1};
  const tels=[],mails=[],adrs=[];
  let fn='',n='',org='';
  for(const ligne of corps.split('\n')){
    const i=ligne.indexOf(':');
    if(i<0)continue;
    const champs=ligne.slice(0,i).split(';');
    /* Apple préfixe certaines lignes d'un groupe : « item1.TEL » */
    const cle=champs[0].replace(/^[^.]+\./,'').toUpperCase();
    const params=champs.slice(1).join(';');
    let v=ligne.slice(i+1);
    if(/QUOTED-PRINTABLE/i.test(params))v=qpDecode(v);
    const mobile=/(IPHONE|CELL|MOBILE|PREF)/i.test(params)?0:1;
    if(cle==='FN')fn=vcUnescape(v);
    else if(cle==='N')n=v;
    else if(cle==='ORG')org=vcUnescape(vcSplit(v,';')[0]);
    else if(cle==='TEL')tels.push({p:mobile,v:vcUnescape(v)});
    else if(cle==='EMAIL')mails.push({p:mobile,v:vcUnescape(v)});
    else if(cle==='ADR')adrs.push({p:/HOME/i.test(params)?0:1,v});
  }
  if(!fn&&n){
    /* N:Famille;Prénom;Autres;Titre;Suffixe */
    const p=vcSplit(n,';').map(vcUnescape);
    fn=[p[3],p[1],p[2],p[0],p[4]].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  }
  res.nom=fn||org;
  tels.sort((a,b)=>a.p-b.p);
  res.tel=tels.length?tels[0].v.replace(/[^\d+ ]/g,'').replace(/\s+/g,' ').trim():'';
  mails.sort((a,b)=>a.p-b.p);
  res.email=mails.length?mails[0].v:'';
  adrs.sort((a,b)=>a.p-b.p);
  if(adrs.length){
    /* ADR:BP;Complément;Rue;Ville;Région;Code postal;Pays */
    const p=vcSplit(adrs[0].v,';').map(vcUnescape);
    const rue=[p[1],p[2]].filter(Boolean).join(' ');
    const ville=[p[5],p[3]].filter(Boolean).join(' ');
    const pays=/^(fr|france)$/i.test(p[6]||'')?'':p[6];
    res.adresse=[rue,ville,pays].filter(Boolean).join(', ').replace(/\s+/g,' ').trim();
  }
  return res;
};
const honoAmount=ch=>(ch.honorairesMontant!==undefined&&ch.honorairesMontant!==null&&ch.honorairesMontant!=='')?+ch.honorairesMontant:budgetTravauxHT(ch)*(ch.honorairesPct||0)/100;
const tvaRate=ch=>(ch&&ch.tva!==undefined&&ch.tva!==null&&ch.tva!=='')?+ch.tva:20;
const ttc=(ht,ch)=>(ht||0)*(1+tvaRate(ch)/100);
/* « date de signature » : celle du contrat de maîtrise d'œuvre, sinon le jalon
   de signature des marchés, sinon le plus ancien marché signé. */
const dateSignature=(ch,marches)=>{
  const c=(ch.docs||{}).contrat_moe;
  if(c&&c.date)return c.date;
  const j=(ch.jalons||[]).find(x=>/signature/i.test(x.label||''));
  if(j&&j.reelle)return j.reelle;
  const ds=(marches||[]).filter(m=>m.chantierId===ch.id&&m.dateSignature).map(m=>m.dateSignature).sort();
  return ds[0]||'';
};
/* Un seul chiffre est annoncé au client, et il est TTC tout compris : marchés de
   travaux, matériaux commandés en direct et honoraires de maîtrise d'œuvre.
   C'est le seul budget saisi ; tout le reste se lit sur les pièces enregistrées. */
const budgetClient=ch=>{
  const v=ch&&ch.budgetClientTTC;
  if(v!==undefined&&v!==null&&v!=='')return +v||0;
  /* reprise de l'ancienne saisie « montant TTC annoncé au client » */
  return (ch&&ch.budgetBase==='ttc')?+ch.budget||0:0;
};
/* budget de travaux HT : ne sert plus qu'à calculer des honoraires en pourcentage */
const budgetTravauxHT=ch=>+(ch&&ch.budget)||0;
const DELAI_DEFAUT=365;
const delaiPrevu=ch=>(ch&&ch.delaiPrevu)?+ch.delaiPrevu:DELAI_DEFAUT;
const joursDepuis=d=>d?Math.floor((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/86400000):null;
/* itinéraire : uniquement le lien que vous avez collé — une recherche sur l'adresse tombe souvent
   à côté (lieux-dits, hameaux), donc elle est proposée à part et clairement nommée « recherche » */
/* on accepte un lien Maps collé, des coordonnées GPS, ou un nom de lieu : tout est ramené à une URL ouvrable */
const normaliseMaps=v=>{
  const s=String(v||'').trim();
  if(!s)return '';
  const gps=s.match(/^\(?\s*(-?\d{1,3}[.,]\d+)\s*[,;]\s*(-?\d{1,3}[.,]\d+)\s*\)?$/);
  if(gps)return 'https://www.google.com/maps/search/?api=1&query='+gps[1].replace(',','.')+','+gps[2].replace(',','.');
  if(/^https?:\/\//i.test(s))return s;
  if(/^(www\.)?(google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(s))return 'https://'+s.replace(/^www\./,'');
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);
};
const mapsUrl=ch=>normaliseMaps(ch.lienMaps);
const mapsSearchUrl=ch=>ch.adresse?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ch.adresse):'';
const sumMontants=list=>(list||[]).reduce((s,x)=>s+(+x.montant||0),0);
/* la TVA se règle par marché : autoliquidation, franchise en base (art. 293 B), taux réduits…
   sans taux propre, le marché suit celui du chantier. 0 est une valeur valide, pas une absence. */
const marcheTva=(m,ch)=>(m.tva!==undefined&&m.tva!==null&&m.tva!=='')?+m.tva:tvaRate(ch);
const marcheTTC=(m,ch)=>(m.montantHT||0)*(1+marcheTva(m,ch)/100);
const travauxHTot=ms=>ms.reduce((s,m)=>s+(m.montantHT||0),0);
/* la TVA se règle aussi par commande : un escalier peut être facturé à 10 % en
   rénovation quand le reste du chantier est à 20 %. Sans taux propre, la commande
   suit celui du chantier. 0 est une valeur valide, pas une absence. */
/* les honoraires de maîtrise d'œuvre ne relèvent pas forcément du taux des
   travaux : franchise en base côté MOE, ou taux normal quand le chantier est
   à 10 %. Chaque facture d'honoraires peut elle-même porter le sien. */
const honoTva=ch=>(ch&&ch.tvaHono!==undefined&&ch.tvaHono!==null&&ch.tvaHono!=='')?+ch.tvaHono:tvaRate(ch);
const honoTTCm=(ht,ch)=>(ht||0)*(1+honoTva(ch)/100);
const honoFactTva=(f,ch)=>(f&&f.tva!==undefined&&f.tva!==null&&f.tva!=='')?+f.tva:honoTva(ch);
/* Ce que la maîtrise d'œuvre aura coûté au client se compose : les factures déjà
   émises à LEUR taux, plus le solde au taux en vigueur. Appliquer le taux courant
   à l'ensemble puis en retrancher un facturé calculé autrement oppose deux bases —
   et donne un reste TTC qui contredit le reste HT. */
const honoFactureHT=ch=>sumMontants(ch&&ch.honoFactures);
const honoFactureTTC=ch=>((ch&&ch.honoFactures)||[]).reduce((s,f)=>s+(+f.montant||0)*(1+honoFactTva(f,ch)/100),0);
const honoResteHT=ch=>honoAmount(ch)-honoFactureHT(ch);
const honoResteTTC=ch=>honoTTCm(honoResteHT(ch),ch);
const honoTotalTTC=ch=>honoFactureTTC(ch)+honoResteTTC(ch);
/* factures émises sous un taux différent de celui en vigueur : c'est ce qui fait
   que le total TTC ne se retrouve pas en multipliant simplement le HT. */
const honoTauxDivergents=ch=>{
  const t=honoTva(ch);
  return [...new Set(((ch&&ch.honoFactures)||[]).map(f=>honoFactTva(f,ch)).filter(x=>Math.abs(x-t)>0.01))];
};
const cmdTva=(c,ch)=>(c&&c.tva!==undefined&&c.tva!==null&&c.tva!=='')?+c.tva:tvaRate(ch);
const cmdTTC=(c,ch)=>(+(c&&c.montant)||0)*(1+cmdTva(c,ch)/100);
const materiauxHT=cs=>(cs||[]).reduce((s,c)=>s+(+c.montant||0),0);
const materiauxTTC=(cs,ch)=>(cs||[]).reduce((s,c)=>s+cmdTTC(c,ch),0);
const ventilationTvaCmd=(cs,ch)=>{
  const map=new Map();
  for(const c of (cs||[])){
    const t=cmdTva(c,ch);
    const cur=map.get(t)||{taux:t,ht:0,n:0};
    cur.ht+=(+c.montant||0); cur.n++; map.set(t,cur);
  }
  return [...map.values()].map(x=>({...x,tva:x.ht*x.taux/100,ttc:x.ht*(1+x.taux/100)})).sort((a,b)=>b.taux-a.taux);
};
const travauxTTC=(ms,ch)=>ms.reduce((s,m)=>s+marcheTTC(m,ch),0);
const ventilationTva=(ms,ch)=>{
  const map=new Map();
  for(const m of ms){
    const t=marcheTva(m,ch);
    const cur=map.get(t)||{taux:t,ht:0,n:0};
    cur.ht+=(m.montantHT||0); cur.n++;
    map.set(t,cur);
  }
  return [...map.values()].map(x=>({...x,tva:x.ht*x.taux/100,ttc:x.ht*(1+x.taux/100)})).sort((a,b)=>b.taux-a.taux);
};

/* Coût réel de l'opération, poste par poste — c'est lui qui se compare au budget
   annoncé au client. Les matériaux commandés en direct suivent le taux du chantier. */
const coutOperation=(ch,ms,cs)=>{
  const marches=ms||[], cmds=cs||[];
  const travHT=travauxHTot(marches), travTTC=travauxTTC(marches,ch);
  const matHT=materiauxHT(cmds), matTTC=materiauxTTC(cmds,ch);
  const honoHT=honoAmount(ch), honoTTC=honoTotalTTC(ch);
  return {travHT,travTVA:travTTC-travHT,travTTC,
          matHT,matTVA:matTTC-matHT,matTTC,
          honoHT,honoTVA:honoTTC-honoHT,honoTTC,
          totalHT:travHT+matHT+honoHT,totalTTC:travTTC+matTTC+honoTTC};
};
/* une commande n'est définitive qu'une fois passée : tant qu'elle est « à commander »,
   le chiffrage peut encore bouger, et l'écart annoncé serait prématuré. */
const cmdDefinitive=c=>!!c&&(c.statut!=='a_commander'||!!c.dateCommande);
/* l'écart n'a de sens qu'une fois les trois postes arrêtés */
const posteManquants=(ch,ms,cs)=>{
  const m=[];
  if(!(ms||[]).length)m.push('les marchés de travaux');
  if((cs||[]).some(c=>!cmdDefinitive(c)))m.push('les commandes de matériaux');
  if(!honoAmount(ch))m.push('les honoraires');
  return m;
};
/* Toutes les factures émises au client : celles des marchés (au taux du lot)
   et celles des honoraires (au taux du chantier). */
const facturesChantier=(ch,ms,cs)=>{
  const L=[];
  for(const m of (ms||[])){
    const tx=marcheTva(m,ch);
    const fs=m.factures||[];
    if(fs.length)for(const f of fs)
      L.push({id:f.id,date:f.date||'',libelle:m.lot,poste:'Travaux',ht:+f.montant||0,taux:tx,lien:f.lien||'',numero:f.numero||''});
    else if(+m.facture)
      L.push({id:m.id+'-f',date:m.dateSignature||'',libelle:m.lot,poste:'Travaux',ht:+m.facture||0,taux:tx,lien:''});
  }
  for(const c of (cs||[])){
    const tx=cmdTva(c,ch);
    for(const f of (c.factures||[]))
      L.push({id:f.id,date:f.date||'',libelle:c.designation||'Achat de matériaux',poste:'Matériaux',ht:+f.montant||0,taux:tx,lien:f.lien||'',numero:f.numero||''});
  }
  for(const f of (ch.honoFactures||[]))
    L.push({id:f.id,date:f.date||'',libelle:f.libelle||'Honoraires de maîtrise d’œuvre',poste:'Honoraires',ht:+f.montant||0,taux:honoFactTva(f,ch),lien:f.lien||'',numero:f.numero||''});
  return L.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
};
const ventileFactures=L=>{
  const map=new Map();
  for(const f of (L||[])){
    const cur=map.get(f.taux)||{taux:f.taux,ht:0,n:0};
    cur.ht+=f.ht; cur.n++; map.set(f.taux,cur);
  }
  return [...map.values()].map(x=>({...x,tva:x.ht*x.taux/100,ttc:x.ht*(1+x.taux/100)})).sort((a,b)=>b.taux-a.taux);
};

/* la rétrocession porte aussi bien sur un marché (montantHT) que sur une commande de matériaux (montant) */
const retroBase=x=>+(x.montantHT!==undefined&&x.montantHT!==null?x.montantHT:x.montant)||0;
const retroMontant=x=>retroBase(x)*(+x.retroPct||0)/100;
const EMPTY={chantiers:[],artisans:[],marches:[],photos:[],commandes:[],bordereaux:[],prospects:[]};

/* ---------- chiffrage d'un prospect ----------
   Le coût, c'est la somme des postes chiffrés ; à défaut, le montant global saisi.
   La marge du maître d'œuvre s'exprime en pourcentage de ce coût, ou en euros si
   l'on préfère l'arrêter soi-même. Le prix du projet est la somme des deux. */
const prospectPostesHT=p=>((p&&p.postes)||[]).reduce((s,x)=>s+(+x.montant||0),0);
const prospectCoutHT=p=>{
  const d=prospectPostesHT(p);
  return d||+((p&&p.coutHT))||0;
};
const prospectMargeHT=p=>{
  if(!p)return 0;
  if(p.margeMontant!==undefined&&p.margeMontant!==null&&p.margeMontant!=='')return +p.margeMontant||0;
  return Math.round(prospectCoutHT(p)*(+p.margePct||0))/100;
};
const prospectPrixHT=p=>Math.round((prospectCoutHT(p)+prospectMargeHT(p))*100)/100;
const prospectTva=p=>{const v=p&&p.tva;return (v===undefined||v===null||v==='')?20:(+v||0)};
const prospectPrixTTC=p=>Math.round(prospectPrixHT(p)*(1+prospectTva(p)/100)*100)/100;

/* ---------- ratio au m² ----------
   Le prix d'une maison ne se rapporte pas à la seule surface habitable : un
   garage, un cellier ou un préau coûtent, sans être habitables. L'usage retient
   la moitié de ces surfaces annexes — c'est la surface pondérée. */
const surfaceHab=p=>+((p&&p.surfaceHabitable))||0;
const surfaceAnn=p=>+((p&&p.surfaceAnnexes))||0;
const surfacePonderee=p=>Math.round((surfaceHab(p)+surfaceAnn(p)*0.5)*100)/100;
/* null quand la surface manque : un ratio sans dénominateur ne s'invente pas */
const ratioM2=(prix,p)=>{const s=surfacePonderee(p);return s>0?Math.round((+prix||0)/s):null};
const eurM2=v=>v===null?'—':v.toLocaleString('fr-FR',{maximumFractionDigits:0})+' €/m²';

/* ---------- rétrocession prévue ----------
   Elle porte sur ce que touchent les entreprises, c'est-à-dire le coût des
   travaux — jamais sur la marge, qui vous revient déjà. */
const prospectRetro=p=>{
  if(!p)return 0;
  if(p.retroMontant!==undefined&&p.retroMontant!==null&&p.retroMontant!=='')return +p.retroMontant||0;
  return Math.round(prospectCoutHT(p)*(+p.retroPct||0))/100;
};

/* ---------- ce qui s'ajoute au prix de la maison ----------
   Assurance dommages-ouvrage et taxes ne sont pas le prix du bâtiment : elles
   pèsent sur l'opération. On les additionne à part pour ne pas fausser le ratio
   au m², qui ne vaut que rapporté au coût de construction. */
const prospectAutresTaxes=p=>((p&&p.taxes)||[]).reduce((s,x)=>s+(+x.montant||0),0);
const prospectTaxes=p=>Math.round(((+((p&&p.taxeAmenagement))||0)
  +(+((p&&p.taxeRaccordement))||0)+prospectAutresTaxes(p))*100)/100;
const prospectDO=p=>+((p&&p.dommageOuvrage))||0;
const prospectOperationTTC=p=>Math.round((prospectPrixTTC(p)+prospectTaxes(p)+prospectDO(p))*100)/100;

/* ---------- lecture d'une étude géorisques ----------
   Le rapport de georisques.gouv.fr énumère tous les risques, y compris ceux
   dont le terrain n'est pas affecté. On ne retient donc un risque que si son
   voisinage ne le dément pas, et on en tire les obligations réelles. */
const geoNorm=s=>String(s||'').replace(/\s+/g,' ').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019]/g,"'");
const GEO_NEG=/n(?:'|’|e )est pas concerne|non concerne|aucun[e]? (?:cavite|risque|information|prescription|arrete|zonage)|pas de (?:risque|cavite|termite|prescription)|neant|hors zone|niveau nul/;
/* le terrain est-il vraiment concerné, ou le rapport le mentionne-t-il pour dire non ? */
function geoConcerne(t,motif){
  const re=new RegExp(motif,'g'); let m,vu=false;
  while((m=re.exec(t)))if(!GEO_NEG.test(t.slice(m.index,m.index+180)))vu=true;
  return vu;
}
/* le niveau annoncé au voisinage d'un mot : 0 nul, 1 faible, 2 moyen, 3 fort */
function geoNiveau(t,motif){
  const ECH=[[/\bfort|\belev/,3],[/\bmoyen|\bmodere/,2],[/\bfaible/,1],[/\bnul\b|\baucun/,0]];
  const re=new RegExp(motif,'g'); let m,best=null;
  while((m=re.exec(t))){
    const f=t.slice(Math.max(0,m.index-140),m.index+240);
    for(const [rx,n] of ECH)if(rx.test(f)&&(best===null||n>best))best=n;
  }
  return best;
}
function analyseGeorisques(txt){
  const t=geoNorm(txt);
  if(!t)return {lu:false,obligations:[],vigilances:[]};
  /* un vrai rapport géorisques nomme au moins l'un de ces risques */
  const lu=/(retrait[- ]gonflement|sismicite|radon|risques? (?:naturels|technologiques)|georisques)/.test(t);
  const O=[],V=[];
  const add=(L,titre,texte,ref)=>L.push({titre,texte,ref});

  /* --- argiles : la seule obligation d'étude de sol pour la maison neuve --- */
  const arg=geoNiveau(t,'retrait[- ]gonflement|argile');
  if(arg!==null&&arg>=2)
    add(O,'Étude géotechnique de conception (G2) obligatoire',
      'Le terrain est exposé au retrait-gonflement des argiles à un niveau '+(arg===3?'fort':'moyen')+
      '. Une étude géotechnique de conception G2 doit être réalisée avant l’établissement des plans, et ses préconisations suivies par le gros œuvre. L’étude préalable G1 est due par le vendeur du terrain ; la G2 incombe au constructeur.',
      'Loi ELAN n° 2018-1021 art. 68 · art. L. 132-4 à L. 132-6 et R. 132-4 du code de la construction · décret n° 2019-495 du 22 mai 2019');
  else if(arg===1)
    add(V,'Retrait-gonflement des argiles — exposition faible',
      'Aucune étude n’est imposée à ce niveau, mais une reconnaissance de sol reste prudente avant d’arrêter les fondations.',
      'Arrêté du 22 juillet 2020 définissant les zones d’exposition');

  /* --- sismicité : la zone commande les règles de construction --- */
  let z=null;
  const mz=t.match(/zone (?:de )?sismicite\s*:?\s*([1-5])/)||t.match(/sismicite (?:de )?(?:zone )?([1-5])/);
  if(mz)z=+mz[1];
  else if(/sismicite (?:forte|5)/.test(t))z=5;
  else if(/sismicite moyenne/.test(t))z=4;
  else if(/sismicite moderee/.test(t))z=3;
  else if(/sismicite faible/.test(t))z=2;
  else if(/sismicite tres faible/.test(t))z=1;
  if(z!==null&&z>=2){
    const regle=z>=5?'l’Eurocode 8 (NF EN 1998-1) s’applique intégralement'
      :z>=3?'le guide CPMI-EC8 zones 3 et 4 (DHUP, août 2021) peut être suivi en lieu et place de l’Eurocode 8 — il a remplacé les anciennes règles PS-MI (NF P 06-014)'
      :'les dispositions constructives de l’Eurocode 8 s’appliquent aux bâtiments de catégorie d’importance III et IV ; une maison individuelle de catégorie II n’est pas soumise à justification en zone 2';
    add(z>=3?O:V,'Zone de sismicité '+z+' — règles parasismiques',
      'Le terrain est en zone de sismicité '+z+' : '+regle+'. À faire figurer dans la notice descriptive et à répercuter sur le lot gros œuvre.',
      'Arrêté du 22 octobre 2010 modifié · arrêté du 8 septembre 2021 · art. R. 132-4 et D. 563-8-1 du code de l’environnement');
  }

  /* --- radon : un potentiel 3 impose de traiter le soubassement --- */
  const mr=t.match(/potentiel radon[^.]{0,60}?([123])/)||t.match(/radon[^.]{0,40}?categorie\s*([123])/);
  const radon=mr?+mr[1]:(/radon[^.]{0,60}significatif/.test(t)?3:null);
  if(radon===3)
    add(O,'Zone à potentiel radon 3',
      'Commune classée en potentiel radon significatif. Prévoir un traitement du soubassement — vide sanitaire ventilé ou dallage étanche — et une ventilation permanente du logement. Le mesurage est obligatoire dans les établissements recevant du public, pas dans la maison individuelle, mais la conception doit en tenir compte.',
      'Art. L. 125-5 et R. 125-23 du code de l’environnement · art. R. 1333-29 du code de la santé publique · arrêté du 27 juin 2018');
  else if(radon===2)
    add(V,'Zone à potentiel radon 2',
      'Potentiel modéré lié à la nature du sous-sol. Une ventilation soignée et un vide sanitaire ventilé suffisent généralement.','');

  /* --- plans de prévention : leurs prescriptions priment sur tout le reste --- */
  if(geoConcerne(t,'plan de prevention des risques|ppri|pprn|ppr[ti]\\b'))
    add(O,'Plan de prévention des risques applicable',
      'Le terrain est couvert par un PPR. Son règlement impose des prescriptions opposables — cote de plancher, matériaux, implantation — qui priment sur les choix du projet. Le règlement doit être obtenu en mairie et joint au dossier de permis.',
      'Art. L. 562-1 et suivants du code de l’environnement');
  if(geoConcerne(t,'inondation|remontee de nappe|submersion'))
    add(V,'Risque d’inondation ou de remontée de nappe',
      'À vérifier avant d’arrêter le niveau du plancher bas et le principe de fondation. Un sous-sol peut être proscrit.','');

  /* --- les risques qui changent la conception ou le prix --- */
  if(geoConcerne(t,'cavite'))
    add(O,'Cavités souterraines signalées',
      'Une reconnaissance spécifique du sous-sol est nécessaire avant tout dimensionnement de fondation. Le surcoût doit figurer au chiffrage.','');
  if(geoConcerne(t,'mouvement de terrain|glissement|effondrement'))
    add(V,'Mouvements de terrain répertoriés',
      'À croiser avec l’étude géotechnique : le mode de fondation et les terrassements peuvent en dépendre.','');
  if(geoConcerne(t,'termite'))
    add(O,'Zone de présence de termites',
      'Un dispositif de protection contre les termites doit être mis en œuvre entre le sol et le bâtiment, et une notice remise au maître de l’ouvrage à la réception.',
      'Art. L. 126-6, R. 126-13 et R. 126-14 du code de la construction · arrêté du 27 juin 2006');
  if(geoConcerne(t,"secteur d'information sur les sols|\\bsis\\b|pollution des sols|site pollue"))
    add(O,'Secteur d’information sur les sols (SIS)',
      'Le terrain est en secteur d’information sur les sols : une attestation de prise en compte de la pollution, établie par un bureau d’études certifié, est exigée à la demande de permis de construire.',
      'Art. L. 556-1, L. 556-2 et R. 556-3 du code de l’environnement');
  if(geoConcerne(t,'installation classee|icpe|seveso'))
    add(V,'Installation classée à proximité',
      'Vérifier les servitudes d’utilité publique et les distances d’éloignement avant d’implanter le bâtiment.','');
  if(geoConcerne(t,'amiante|plomb|demolition'))
    add(V,'Diagnostics avant démolition',
      'En cas de démolition préalable, les repérages amiante et plomb sont dus avant travaux.','');

  return {lu,obligations:O,vigilances:V};
}

/* ---------- bordereaux de prix ----------
   La grille tarifaire d'un artisan : un code d'article, un libellé, une unité et
   un prix unitaire. Le quantitatif d'un lot y puise, et le montant du marché est
   la somme des quantités × prix. C'est le modèle des marchés déjà rédigés. */
const UNITES=['U','M','ML','M2','M²','M3','M³','KG','H','ENS','FT','F','J','T'];
const artUnite=u=>{const x=String(u||'').toUpperCase().replace('²','2').replace('³','3');
  return x==='M2'?'M²':x==='M3'?'M³':x};
const ligneQt=l=>+(l&&l.qt)||0;
const lignePU=l=>+(l&&l.pu)||0;
const lignePT=l=>Math.round(ligneQt(l)*lignePU(l)*100)/100;
/* le total du lot s'arrondit une seule fois, à la fin : c'est la règle des marchés
   déjà signés, où la colonne PT est arrondie pour l'affichage mais pas pour la somme. */
const quantitatifHT=lignes=>Math.round((lignes||[]).reduce((s,l)=>s+ligneQt(l)*lignePU(l),0)*100)/100;
/* une quantité s'écrit au millième, comme sur les marchés : 121,340 M² */
const nb3=n=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3});
/* remise négociée sur le lot : vide ou 0 = pas de remise */
const remisePct=x=>{const v=x&&x.remisePct;return (v===undefined||v===null||v==='')?0:(+v||0)};
const quantitatifNet=(lignes,r)=>Math.round(quantitatifHT(lignes)*(1-(r||0)/100)*100)/100;
/* les bordereaux d'un artisan : plusieurs entreprises peuvent partager une grille */
const bordArtisans=b=>b?(Array.isArray(b.artisanIds)?b.artisanIds:(b.artisanId?[b.artisanId]:[])):[];
const bordPourArtisan=(b,id)=>!!id&&bordArtisans(b).indexOf(id)>=0;

/* Lecture d'un bordereau depuis un marché déjà rédigé sous Word : on y retrouve
   « DÉSIGNATION DES TRAVAUX » puis un tableau ARTICLE / LIBELLE / QT / U / PU / PT.
   Un même document peut porter plusieurs lots — on les rend tous. */
function analyseBordereau(txt){
  const L=String(txt||'').split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  const NB=/^-?[\d  ]+(?:[.,]\d+)?$/;
  /* un code d'article ne porte jamais d'espace ; il suit soit la nomenclature à
     tiret bas (B_1FF_5SEMEL, I_11HB*_5S18, A_CHTR_50km), soit une numérotation
     hiérarchique (1.2.3). Sans cette exigence, un libellé d'un seul mot passerait. */
  const estCode=s=>/^[A-Za-z][\w\-\.\*\/]*_[\w\-\.\*\/]*$/.test(s)||/^\d+(?:\.\d+)+$/.test(s);
  const estUnite=u=>UNITES.indexOf(String(u||'').toUpperCase().replace('²','2').replace('³','3').replace('M2','M2'))>=0
                  ||['M²','M³'].indexOf(u)>=0;
  const lots=[]; let courant=null, i=0;
  while(i<L.length){
    if(/^D[EÉ]SIGNATION DES TRAVAUX$/i.test(L[i])&&i+1<L.length){
      courant={nom:L[i+1],articles:[]}; lots.push(courant); i+=2; continue;
    }
    /* code, libellé, quantité, unité, prix unitaire, (prix total) */
    if(courant&&i+4<L.length&&estCode(L[i])&&NB.test(L[i+2])&&estUnite(L[i+3])&&NB.test(L[i+4])){
      courant.articles.push({code:L[i],libelle:L[i+1],unite:artUnite(L[i+3]),
        pu:nombreFr(L[i+4]),qt:nombreFr(L[i+2])});
      i+=(i+5<L.length&&NB.test(L[i+5]))?6:5; continue;
    }
    i++;
  }
  return lots.filter(l=>l.articles.length);
}

/* ---------- contrôle avant émission d'un marché ----------
   Un contrat part une fois. Ce qui manque, ou ce qui est faux, doit se voir
   avant, pas après signature. Les points bloquants empêchent l'émission ;
   les avertissements la laissent passer mais restent affichés. */
function controlerMarche(m,artisan,ch){
  const P=[];
  const bloque=t=>P.push({bloquant:true,texte:t});
  const alerte=t=>P.push({bloquant:false,texte:t});
  if(!m||!String(m.lot||'').trim())bloque('Le corps d’état du lot n’est pas renseigné.');
  if(!artisan)bloque('Aucune entreprise n’est attribuée à ce lot.');
  if(!(+((m||{}).montantHT)>0))bloque('Le montant du marché est nul : chiffrez le lot ou saisissez son montant.');
  if(!ch||!String(ch.client||'').trim())bloque('Le nom du client n’est pas renseigné sur la fiche du chantier.');
  if(!ch||!String(ch.adresse||'').trim())bloque('L’adresse des travaux n’est pas renseignée sur la fiche du chantier.');
  if(artisan){
    /* la décennale : sans attestation valable à la signature, le marché ne part pas */
    const fin=artisan.decennaleFin;
    if(!fin)bloque('L’entreprise n’a pas de date de validité de décennale : le marché ne peut pas être émis.');
    else{
      const ref=new Date((m&&m.dateSignature)||today());
      const j=Math.round((new Date(fin)-ref)/86400000);
      if(j<0)bloque('La décennale de l’entreprise a expiré le '+fd(fin)+' : régularisez avant de signer.');
      else if(j<60)alerte('La décennale de l’entreprise expire le '+fd(fin)+' — dans '+j+' jour'+(j>1?'s':'')+'.');
    }
    if(!String(artisan.assureur||'').trim())alerte('La compagnie d’assurance de l’entreprise n’est pas renseignée.');
    if(!String(artisan.numPolice||'').trim())alerte('Le numéro de police décennale de l’entreprise n’est pas renseigné.');
    if(!String(artisan.siret||'').trim())alerte('Le SIRET de l’entreprise n’est pas renseigné.');
    if(!String(artisan.adresse||'').trim())alerte('L’adresse du siège de l’entreprise n’est pas renseignée.');
    if(!artisan.lienAttestation)alerte('L’attestation de décennale n’est pas déposée : elle doit être annexée au marché.');
  }
  if(ch&&!String(ch.adresseClient||'').trim())
    alerte('L’adresse du domicile du client n’est pas renseignée : le marché portera son nom sans son adresse.');
  if(ch&&String(ch.adresseClient||'').trim()&&String(ch.adresseClient).trim()===String(ch.adresse||'').trim())
    alerte('Le domicile du client et l’adresse des travaux sont identiques — vérifiez que c’est bien voulu.');
  if(m&&!m.dateSignature)alerte('La date de signature n’est pas renseignée : le marché portera la date du jour.');
  return P;
}
const marcheBloque=P=>(P||[]).some(x=>x.bloquant);

/* ---------- composition d'un marché de travaux ----------
   Le document est composé ici, pas décalqué : c'est la seule façon de tenir la
   police, les filets, les couleurs de la maison et d'ajouter les clauses. Le
   .docx produit est un fichier Word complet, fabriqué de toutes pièces. */
const exml=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* un montant tel qu'il s'écrit dans un contrat : 49 604,56 € */
const eurNombre=n=>(Math.round((+n||0)*100)/100).toFixed(2).replace('.',',');
const eurDoc=n=>eurNombre(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €';

/* Cambria : une serif livrée avec Word sur tous les appareils, dessinée pour
   être lue à l'écran comme à l'impression — ce qu'on demande à un contrat. */
const DOC_POLICE='Cambria';
const DOC_TERRA='C5563A', DOC_BRUN='6B4A2F', DOC_ENCRE='262626', DOC_GRIS='7A7A7A', DOC_SABLE='F5F1EA';

const rP=(o)=>{o=o||{};
  const f=o.f||DOC_POLICE;
  return '<w:rPr><w:rFonts w:ascii="'+f+'" w:hAnsi="'+f+'" w:cs="'+f+'"/>'
    +(o.b?'<w:b/>':'')+(o.i?'<w:i/>':'')+(o.caps?'<w:caps/>':'')
    +(o.sp?'<w:spacing w:val="'+o.sp+'"/>':'')
    +'<w:color w:val="'+(o.c||DOC_ENCRE)+'"/>'
    +'<w:sz w:val="'+(o.sz||20)+'"/><w:szCs w:val="'+(o.sz||20)+'"/></w:rPr>';
};
const run=(t,o)=>'<w:r>'+rP(o)+'<w:t xml:space="preserve">'+exml(t)+'</w:t></w:r>';
const par=(t,o)=>{o=o||{};
  const filet=c=>'<w:bottom w:val="single" w:sz="'+(o.filetSz||8)+'" w:space="2" w:color="'+c+'"/>';
  return '<w:p><w:pPr>'
    +(o.jc?'<w:jc w:val="'+o.jc+'"/>':'')
    +'<w:spacing w:before="'+(o.av||0)+'" w:after="'+(o.ap===undefined?60:o.ap)+'" w:line="'+(o.ln||264)+'" w:lineRule="auto"/>'
    +(o.ind?'<w:ind w:left="'+o.ind+'"/>':'')
    +(o.filet?'<w:pBdr>'+filet(o.filet)+'</w:pBdr>':'')
    +'</w:pPr>'
    +(typeof t==='string'?run(t,o):(t||[]).join(''))
    +'</w:p>';
};
const vide=(h)=>'<w:p><w:pPr><w:spacing w:before="0" w:after="'+(h||80)+'" w:line="240" w:lineRule="auto"/></w:pPr></w:p>';
const sautPage='<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr><w:r><w:br w:type="page"/></w:r></w:p>';

const bord=(c,sz)=>'w:val="single" w:sz="'+(sz||8)+'" w:space="0" w:color="'+c+'"';
const tcB=(o)=>{o=o||{};const n='w:val="nil"';
  return '<w:tcBorders>'
    +'<w:top '+(o.h===false?n:bord(o.c||DOC_BRUN,o.t))+'/>'
    +'<w:left '+(o.g===false?n:bord(o.c||DOC_BRUN,o.sz))+'/>'
    +'<w:bottom '+(o.b===false?n:bord(o.c||DOC_BRUN,o.bs))+'/>'
    +'<w:right '+(o.d===false?n:bord(o.c||DOC_BRUN,o.sz))+'/></w:tcBorders>';
};
const tc=(l,contenu,o)=>{o=o||{};
  return '<w:tc><w:tcPr><w:tcW w:w="'+l+'" w:type="dxa"/>'
    +(o.fusion?'<w:gridSpan w:val="'+o.fusion+'"/>':'')
    +(o.bords||'')
    +(o.fond?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.fond+'"/>':'')
    +'<w:tcMar><w:top w:w="60" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/>'
    +'<w:left w:w="'+(o.mg===undefined?90:o.mg)+'" w:type="dxa"/><w:right w:w="'+(o.mg===undefined?90:o.mg)+'" w:type="dxa"/></w:tcMar>'
    +'<w:vAlign w:val="'+(o.v||'center')+'"/></w:tcPr>'
    +(contenu||par('',{ap:0}))+'</w:tc>';
};
const tr=(cells)=>'<w:tr><w:trPr><w:cantSplit/></w:trPr>'+cells.join('')+'</w:tr>';
/* aucun filet par défaut : chaque cellule pose les siens, on ne subit pas
   un quadrillage dont on ne veut pas. */
const tbl=(grille,rows,o)=>{o=o||{};
  return '<w:tbl><w:tblPr><w:tblW w:w="'+(o.largeur||'5000')+'" w:type="'+(o.type||'pct')+'"/>'
    +'<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/>'
    +'<w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>'
    +'<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar>'
    +'<w:tblLook w:val="0000"/></w:tblPr>'
    +'<w:tblGrid>'+grille.map(w=>'<w:gridCol w:w="'+w+'"/>').join('')+'</w:tblGrid>'
    +rows.join('')+'</w:tbl>';
};

/* le logo de la maison, aux dimensions de son fichier */
const logoXml=(px)=>{
  const larg=1500000, haut=Math.round(larg*(px&&px.h?px.h:505)/(px&&px.w?px.w:767));
  return '<w:r><w:rPr><w:noProof/></w:rPr><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">'
    +'<wp:extent cx="'+larg+'" cy="'+haut+'"/><wp:effectExtent l="0" t="0" r="0" b="0"/>'
    +'<wp:docPr id="1" name="Logo"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>'
    +'<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
    +'<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'
    +'<pic:nvPicPr><pic:cNvPr id="1" name="Logo"/><pic:cNvPicPr/></pic:nvPicPr>'
    +'<pic:blipFill><a:blip r:embed="rId5"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
    +'<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+larg+'" cy="'+haut+'"/></a:xfrm>'
    +'<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>'
    +'</a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
};

/* ---------- l'en-tête : logo à gauche, identité du marché à droite ---------- */
function enteteMarche(d,px){

    tc(4200,par([logoXml(px)],{ap:0}),{bords:tcB({h:false,g:false,b:false,d:false}),v:'top',mg:0}),

/* ---------- convention de rétrocession ----------
   La forme la plus solide n'est pas la commission occulte : c'est un contrat
   d'apporteur d'affaires et de prestation, avec une contrepartie réelle, une
   facture soumise à TVA, et surtout l'information du maître de l'ouvrage sur
   son principe. C'est cette information qui écarte le conflit d'intérêts du
   maître d'œuvre et la qualification de corruption privée. */
function retroClauses(d){
  const T=[
    ['Article 1 — Objet',[
      'La présente convention a pour objet de définir les conditions dans lesquelles '+CP.nom+' apporte à l’entreprise des affaires et lui fournit des prestations d’assistance, ainsi que la rémunération due en contrepartie.',

    ]],
    ['Article 3 — Rémunération',[
      'La rémunération est fixée en pourcentage du montant hors taxes de chaque marché concerné, aux taux figurant au tableau des affaires ci-avant, lequel fait partie intégrante de la présente convention.',
      'Elle s’entend hors taxes et sera majorée de la taxe sur la valeur ajoutée au taux en vigueur, la prestation étant située en France entre assujettis.',
      'Elle n’est due qu’à raison des marchés effectivement conclus et exécutés. En cas de résiliation d’un marché, elle est réduite à proportion des travaux effectivement réalisés.',
    ]],
    ['Article 4 — Facturation et paiement',[
      CP.nom+' adresse à l’entreprise une facture portant les mentions prévues à l’article 289 du code général des impôts, référençant le marché concerné.',
      'Le règlement intervient dans un délai de trente jours à compter de la date d’émission de la facture. Tout retard fait courir de plein droit les pénalités et l’indemnité forfaitaire de recouvrement de 40 € prévues à l’article L. 441-10 du code de commerce.',

    ['Article 5 — Indépendance et probité',[

    ]],

    ]],
    ['Article 7 — Durée',[
      'La convention prend effet à sa signature et demeure en vigueur jusqu’au complet règlement des rémunérations dues au titre des affaires qui y sont visées.',

    ]],

      'Les parties tiennent confidentielles les conditions et l’existence mêmes des présentes à l’égard des tiers, sous réserve des obligations légales, comptables et fiscales de chacune.',
    ]],
    ['Article 9 — Litiges',[
      'Les parties s’efforceront de régler amiablement tout différend. À défaut, le litige sera porté devant le tribunal compétent du ressort du siège de '+CP.nom+'.',
    ]],

/* ---------- fabrication du .docx ----------
   Un Word minimal mais complet : types de contenu, relations, styles, le
   document et le logo. Rien d'autre n'est nécessaire pour qu'il s'ouvre. */
const DOCX_TYPES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
 +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
 +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
 +'<Default Extension="xml" ContentType="application/xml"/>'
 +'<Default Extension="png" ContentType="image/png"/>'
 +'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
 +'<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
 +'<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'
 +'</Types>';
const DOCX_RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
 +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
 +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
 +'<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'
 +'</Relationships>';
const DOCX_DOCRELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
 +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
 +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
 +'<Relationship Id="rId5" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/>'
 +'</Relationships>';
const DOCX_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
 +'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
 +'<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="'+DOC_POLICE+'" w:hAnsi="'+DOC_POLICE+'" w:cs="'+DOC_POLICE+'"/>'
 +'<w:color w:val="'+DOC_ENCRE+'"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault>'
 +'<w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'
 +'<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'
 +'</w:styles>';
const docxCore=titre=>'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
 +'<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"'
 +' xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/"'
 +' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
 +'<dc:title>'+exml(titre)+'</dc:title><dc:creator>'+CP.nom+'</dc:creator>'
 +'<cp:lastModifiedBy>'+CP.nom+'</cp:lastModifiedBy>'
 +'<dcterms:created xsi:type="dcterms:W3CDTF">'+new Date().toISOString().slice(0,19)+'Z</dcterms:created>'
 +'</cp:coreProperties>';

/* le logo de l'application, tel qu'il est servi à côté de la page */
let logoCache=null;
async function logoDocx(){
  if(logoCache)return logoCache;
  const r=await fetch('assets/logo.png');
  if(!r.ok)throw new Error('nologo');
  const b=new Uint8Array(await r.arrayBuffer());
  /* dimensions lues dans l'entête PNG, pour ne pas déformer l'image */
  const v=new DataView(b.buffer,b.byteOffset,b.byteLength);
  logoCache={data:b,w:v.getUint32(16),h:v.getUint32(20)};
  return logoCache;
}

async function fabriquerDocx(documentXml,titre,logo){
  const enc=new TextEncoder();
  const entrees=[
    {nom:'[Content_Types].xml',data:enc.encode(DOCX_TYPES)},
    {nom:'_rels/.rels',data:enc.encode(DOCX_RELS)},
    {nom:'docProps/core.xml',data:enc.encode(docxCore(titre))},
    {nom:'word/_rels/document.xml.rels',data:enc.encode(DOCX_DOCRELS)},
    {nom:'word/styles.xml',data:enc.encode(DOCX_STYLES)},
    {nom:'word/document.xml',data:enc.encode(documentXml)},
  ];
  if(logo)entrees.push({nom:'word/media/logo.png',data:logo.data});
  return zipEcrire(entrees);
}

/* ---------- documents PDF & photos originales : envoyés vers le Google Drive de l'utilisateur ---------- */
/* Connexion par redirection de page (pas de pop-up) : plus fiable sur iOS, y compris en app installée. */
let driveFolderId=null;
const driveSubfolders=new Map();
/* Google compare l'adresse de retour au caractère près avec celle déclarée dans
   la console : « /Private/ » et « /Private/index.html » sont deux adresses
   différentes. On normalise pour n'en produire qu'une seule. */
const GOOGLE_REDIRECT_URI=location.origin+location.pathname.replace(/index\.html$/,'');

/* le jeton se garde entre les rechargements : après le retour de Google, l'app
   se recharge, et un jeton rangé pour la seule session serait déjà perdu. */
const jetonLu=k=>{try{return localStorage.getItem(k)||sessionStorage.getItem(k)}catch(e){return null}};
const jetonEcris=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}try{sessionStorage.setItem(k,v)}catch(e){}};
const jetonEfface=k=>{try{localStorage.removeItem(k)}catch(e){}try{sessionStorage.removeItem(k)}catch(e){}};

/* ce que Google a répondu la dernière fois : sans cela, un échec est muet et
   personne ne peut savoir pourquoi la connexion n'a pas abouti. */
let driveRetour=null;
function consumeDriveTokenFromUrl(){
  const h=String(location.hash||'').replace(/^#/,'');
  const q=String(location.search||'').replace(/^\?/,'');
  const params=new URLSearchParams(h||q);
  const token=params.get('access_token');
  const err=params.get('error');
  if(!token&&!err)return;
  if(token){
    const expiresIn=+(params.get('expires_in')||3600);
    jetonEcris('driveToken',token);
    jetonEcris('driveTokenExpiry',String(Date.now()+(expiresIn-60)*1000));
    driveRetour={ok:true};
  }else{
    driveRetour={ok:false,code:err,detail:params.get('error_description')||''};
  }
  try{history.replaceState(null,'',location.pathname+(h?location.search:''))}catch(e){}
}
consumeDriveTokenFromUrl();

const driveConnected=()=>!!jetonLu('driveToken')&&Date.now()<+(jetonLu('driveTokenExpiry')||0);

/* Traduction des refus de Google en langage utilisable. */
const DRIVE_MOTIFS={
  redirect_uri_mismatch:"l’adresse de retour n’est pas déclarée côté Google. Ajoutez l’adresse indiquée ci-dessous dans la console Google Cloud, en « URI de redirection autorisés ».",
  access_denied:"l’accès a été refusé. Soit vous avez fermé la fenêtre, soit ce compte Google n’est pas autorisé : si l’application Google est en mode « Test », seuls les comptes déclarés comme testeurs peuvent se connecter.",
  admin_policy_enforced:"l’administrateur de ce compte Google Workspace bloque les applications tierces. Il faut soit autoriser l’application, soit utiliser un compte Google personnel.",
  org_internal:"cette application n’est ouverte qu’aux comptes de son organisation.",
  invalid_client:"l’identifiant de l’application est refusé par Google.",
  disallowed_useragent:"Google refuse le navigateur utilisé. Ouvrez le site dans Safari ou Chrome plutôt que depuis un lien intégré à une autre application.",
};

function startDriveAuth(){
  const params=new URLSearchParams({
    client_id:GOOGLE_CLIENT_ID,
    redirect_uri:GOOGLE_REDIRECT_URI,
    response_type:'token',
    scope:'https://www.googleapis.com/auth/drive.file',
    include_granted_scopes:'true',
    prompt:'consent',
  });
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
}

function disconnectDrive(){
  jetonEfface('driveToken');
  jetonEfface('driveTokenExpiry');
}

async function getDriveToken(){
  if(driveConnected())return jetonLu('driveToken');
  throw{error:'auth_required'};
}

/* Sur iPhone, une application ouverte depuis l'écran d'accueil est un contexte
   séparé de Safari : la page de Google s'ouvre dans Safari et le jeton n'en
   revient jamais. Il faut le savoir pour ne pas chercher ailleurs. */
const driveDepuisEcranAccueil=()=>{
  try{
    return !!(window.navigator&&window.navigator.standalone)
      ||!!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  }catch(e){return false}
};

/* Le dossier racine où tout est rangé. Les noms précédents sont conservés pour
   pouvoir retrouver les chantiers déjà déposés et les y ranger : renommer le
   dossier dans Drive ne doit pas couper l'application de son historique. */
const DRIVE_RACINE='CRM CP';
const DRIVE_RACINES_ANCIENNES=['CP Constructions Chantier','CP Constructions'];

async function driveChercherDossier(token,nom){
  const q=encodeURIComponent("name='"+String(nom).replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  return (j.files&&j.files.length)?j.files[0].id:'';
}

async function driveFolder(token){
  if(driveFolderId)return driveFolderId;
  let id=await driveChercherDossier(token,DRIVE_RACINE);
  if(!id){
    const c=await fetch('https://www.googleapis.com/drive/v3/files',{
      method:'POST',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({name:DRIVE_RACINE,mimeType:'application/vnd.google-apps.folder'}),
    });
    id=(await c.json()).id;
  }
  driveFolderId=id;
  return driveFolderId;
}

/* Vide les caches de dossiers : après un déplacement, les identifiants retenus
   en mémoire ne valent plus rien. */
function driveOublierDossiers(){
  driveFolderId=null;
  driveProspectsRacineId=null;
  [driveSubfolders,driveFacturesFolders,driveMarchesFolders,driveControlesFolders,
   driveHonoFolders,driveRetroFolders,driveSignFolders,driveSousDossiers,
   driveProspectFolders].forEach(m=>m.clear());
}

/* Range dans CRM CP tous les dossiers de chantier restés sous un ancien nom de
   racine. Un dossier Drive se déplace sans être copié : on ajoute le nouveau
   parent et on retire l'ancien, le contenu et les liens déjà enregistrés dans
   l'application restent valables. */
async function driveRangerAnciens(token){
  const cible=await driveFolder(token);
  const bilan={racine:DRIVE_RACINE,deplaces:[],anciens:[],erreurs:[]};
  for(const nom of DRIVE_RACINES_ANCIENNES){
    const vieux=await driveChercherDossier(token,nom);
    if(!vieux||vieux===cible)continue;
    bilan.anciens.push(nom);
    const q=encodeURIComponent("'"+vieux+"' in parents and trashed=false");
    const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,mimeType)&pageSize=1000',
      {headers:{Authorization:'Bearer '+token}});
    const j=await r.json();
    for(const f of (j.files||[])){
      try{
        const u=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id
          +'?addParents='+cible+'&removeParents='+vieux+'&fields=id',
          {method:'PATCH',headers:{Authorization:'Bearer '+token}});
        if(!u.ok)throw new Error('HTTP '+u.status);
        bilan.deplaces.push(f.name);
      }catch(e){bilan.erreurs.push(f.name+' — '+((e&&e.message)||String(e)))}
    }
  }
  driveOublierDossiers();
  return bilan;
}

async function driveFindOrCreateSubfolder(token,parentId,name){
  const safeName=name.replace(/'/g,"\\'");
  const q=encodeURIComponent(`name='${safeName}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parentId}' in parents`);
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(j.files&&j.files.length)return j.files[0].id;
  const c=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]}),
  });
  return(await c.json()).id;
}

  driveSubfolders.set(chantierId,id);

const DOSSIERS_CHANTIER=['Marchés','Factures','Honoraires','Rétrocessions','Matériaux','Visite technique','MAP','Contrôles','Photos','Pièces','Signatures'];

/* Pièces écrites : un dossier de maîtrise d'œuvre ne circule pas qu'en PDF —
   notices et marchés arrivent souvent en Word, les relevés en photo. iOS filtre
   par type MIME comme par extension, on donne les deux. */
const PIECES_ACCEPT='application/pdf,.pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*';

/* Crée le dossier du chantier et tous ses sous-dossiers d'un coup, sans attendre
   qu'un premier fichier soit déposé. Les dossiers déjà présents sont réutilisés :
   la fonction peut être relancée sans rien dupliquer. */
async function creerArborescence(token,chantierId,chantierNom){
  const parentId=await driveChantierFolder(token,chantierId,chantierNom);
  const crees=[];
  for(const nom of DOSSIERS_CHANTIER){
    const cle=chantierId+'/'+nom;
    if(driveSousDossiers.has(cle)){crees.push(nom);continue}
    const id=await driveFindOrCreateSubfolder(token,parentId,nom);
    driveSousDossiers.set(cle,id);
    crees.push(nom);
  }
  return {parentId,crees};
}

async function uploadToDrive(file,folderId){
  const token=await getDriveToken();
  const parent=folderId||await driveFolder(token);
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify({name:file.name,parents:[parent]})],{type:'application/json'}));
  form.append('file',file);
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{
    method:'POST',headers:{Authorization:'Bearer '+token},body:form,
  });
  if(!r.ok)throw new Error('upload Drive échoué');
  return r.json();
}

function compress(file,max=900,q=.6){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*r); cv.height=Math.round(im.height*r);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

async function pdfText(file){
  if(typeof pdfjsLib==='undefined')throw new Error('Lecteur PDF non chargé — vérifiez votre connexion.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let txt='';
  for(let i=1;i<=Math.min(doc.numPages,8);i++){
    const page=await doc.getPage(i);
    const c=await page.getTextContent();
    txt+=' '+c.items.map(x=>x.str).join(' ');
  }
  return txt.replace(/\s+/g,' ').trim();
}

/* ---------- lecture des fichiers Word (.docx) ---------- */
/* Un .docx est un ZIP : on y prend word/document.xml et on le décompresse avec
   DecompressionStream, présent dans Safari depuis iOS 16.4 — aucune bibliothèque
   supplémentaire à charger. L'ancien .doc, binaire, ne se lit pas ainsi. */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')throw new Error('nodeflate');
  const flux=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(flux).arrayBuffer());
}
async function zipEntree(buf,cherche){
  const d=new DataView(buf), u=new Uint8Array(buf), dec=new TextDecoder('utf-8');
  /* le répertoire central se trouve par la fin : son marqueur est le dernier du fichier */
  let eocd=-1;
  for(let i=u.length-22;i>=0&&i>u.length-22-65558;i--)if(d.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('nozip');
  const n=d.getUint16(eocd+10,true);
  let p=d.getUint32(eocd+16,true);
  for(let k=0;k<n;k++){
    if(p+46>u.length||d.getUint32(p,true)!==0x02014b50)break;
    const methode=d.getUint16(p+10,true), tailleComp=d.getUint32(p+20,true);
    const lNom=d.getUint16(p+28,true), lExtra=d.getUint16(p+30,true), lCom=d.getUint16(p+32,true);
    const offset=d.getUint32(p+42,true);
    if(dec.decode(u.subarray(p+46,p+46+lNom))===cherche){
      if(d.getUint32(offset,true)!==0x04034b50)throw new Error('nozip');
      const debut=offset+30+d.getUint16(offset+26,true)+d.getUint16(offset+28,true);
      const data=u.subarray(debut,debut+tailleComp);
      return methode===0?data:await inflateRaw(data);
    }
    p+=46+lNom+lExtra+lCom;
  }
  throw new Error('nodoc');
}
const XML_ENT={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"};
const dexml=s=>String(s).replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z]+);/g,(m,e)=>{
  if(e[0]==='#')return String.fromCodePoint(e[1]==='x'||e[1]==='X'?parseInt(e.slice(2),16):parseInt(e.slice(1),10));
  return XML_ENT[e]!==undefined?XML_ENT[e]:m;
});
/* on écarte le texte supprimé en révision et les codes de champ : ils ne font pas
   partie du document tel qu'il se lit à l'écran. */
function texteDocumentXml(xml){
  const net=String(xml)
    .replace(/<w:del\b[\s\S]*?<\/w:del>/g,'')
    .replace(/<w:instrText[\s\S]*?<\/w:instrText>/g,'')
    .replace(/<w:(?:tab|br|cr)\b[^>]*\/?>/g,' ')
    .replace(/<\/w:(?:p|tc|tr)>/g,' ')
    .replace(/<[^>]+>/g,'');
  return dexml(net).replace(/\s+/g,' ').trim();
}
async function wordText(file){
  const bytes=await zipEntree(await file.arrayBuffer(),'word/document.xml');
  return texteDocumentXml(new TextDecoder('utf-8').decode(bytes));
}
/* un tableau se lit ligne par ligne : la version à plat perdrait les colonnes */
function lignesDocumentXml(xml){
  const net=String(xml)
    .replace(/<w:del\b[\s\S]*?<\/w:del>/g,'')
    .replace(/<w:instrText[\s\S]*?<\/w:instrText>/g,'')
    .replace(/<w:(?:tab|br|cr)\b[^>]*\/?>/g,' ')
    .replace(/<\/w:(?:p|tc)>/g,'\n')
    .replace(/<[^>]+>/g,'');
  return dexml(net).split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
}
/* ---------- écriture d'un .docx ----------
   On ne fabrique pas un document : on reprend le vôtre et on n'y remplace que
   word/document.xml. Toutes les autres entrées du ZIP sont recopiées telles
   quelles, avec leur compression d'origine — en-tête, logo, polices, styles et
   pieds de page restent exactement ce qu'ils étaient. */
const CRC32=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}
  return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
})();

/* toutes les entrées du ZIP, données encore compressées telles qu'elles sont */
function zipEntrees(buf){
  const d=new DataView(buf), u=new Uint8Array(buf), dec=new TextDecoder('utf-8');
  let eocd=-1;
  for(let i=u.length-22;i>=0&&i>u.length-22-65558;i--)if(d.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('nozip');
  const n=d.getUint16(eocd+10,true);
  let p=d.getUint32(eocd+16,true);
  const out=[];
  for(let k=0;k<n;k++){
    if(p+46>u.length||d.getUint32(p,true)!==0x02014b50)throw new Error('nozip');
    const drapeaux=d.getUint16(p+8,true), methode=d.getUint16(p+10,true);
    const modif=d.getUint32(p+12,true), crc=d.getUint32(p+16,true);
    const tailleComp=d.getUint32(p+20,true), tailleBrute=d.getUint32(p+24,true);
    const lNom=d.getUint16(p+28,true), lExtra=d.getUint16(p+30,true), lCom=d.getUint16(p+32,true);
    const offset=d.getUint32(p+42,true);
    const nom=dec.decode(u.subarray(p+46,p+46+lNom));
    if(d.getUint32(offset,true)!==0x04034b50)throw new Error('nozip');
    const debut=offset+30+d.getUint16(offset+26,true)+d.getUint16(offset+28,true);
    out.push({nom,drapeaux,methode,modif,crc,tailleComp,tailleBrute,data:u.subarray(debut,debut+tailleComp)});
    p+=46+lNom+lExtra+lCom;
  }
  return out;
}

/* réécrit le ZIP en remplaçant les entrées nommées ; le reste est recopié octet
   pour octet, sans être décompressé ni recompressé. */
function zipReecrire(buf,remplacements){
  const enc=new TextEncoder();
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const morceaux=[], central=[];
  let offset=0, nb=0;
  for(const e of zipEntrees(buf)){
    const neuf=remplacements[e.nom];
    /* une entrée remplacée est écrite sans compression : rien à charger pour cela,
       et Word, Pages et LibreOffice lisent le STORE sans broncher. */
    const methode=neuf?0:e.methode;
    const data=neuf||e.data;
    const crc=neuf?CRC32(neuf):e.crc;
    const brute=neuf?neuf.length:e.tailleBrute;
    const drapeaux=e.drapeaux&~8; /* pas de descripteur après les données */
    const n=enc.encode(e.nom);
    const lfh=[...u32(0x04034b50),...u16(20),...u16(drapeaux),...u16(methode),...u32(e.modif),
      ...u32(crc),...u32(data.length),...u32(brute),...u16(n.length),...u16(0)];
    morceaux.push(new Uint8Array(lfh),n,data);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(drapeaux),...u16(methode),...u32(e.modif),
      ...u32(crc),...u32(data.length),...u32(brute),...u16(n.length),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(0),...u32(offset),...Array.from(n)]);
    offset+=lfh.length+n.length+data.length;
    nb++;
  }
  const cd=[].concat(...central), debutCD=offset;
  const eocd=[...u32(0x06054b50),...u16(0),...u16(0),...u16(nb),...u16(nb),
    ...u32(cd.length),...u32(debutCD),...u16(0)];
  morceaux.push(new Uint8Array(cd),new Uint8Array(eocd));
  const total=morceaux.reduce((s,m)=>s+m.length,0), out=new Uint8Array(total);
  let q=0;for(const m of morceaux){out.set(m,q);q+=m.length}
  return out;
}

/* fabrique un ZIP de toutes pièces, entrées non compressées */
function zipEcrire(entrees){
  const enc=new TextEncoder();
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const morceaux=[], central=[];
  let offset=0;
  for(const {nom,data} of entrees){
    const n=enc.encode(nom), crc=CRC32(data);
    const lfh=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(n.length),...u16(0)];
    morceaux.push(new Uint8Array(lfh),n,data);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(n.length),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(0),...u32(offset),...Array.from(n)]);
    offset+=lfh.length+n.length+data.length;
  }
  const cd=[].concat(...central), debutCD=offset;
  const eocd=[...u32(0x06054b50),...u16(0),...u16(0),...u16(entrees.length),...u16(entrees.length),
    ...u32(cd.length),...u32(debutCD),...u16(0)];
  morceaux.push(new Uint8Array(cd),new Uint8Array(eocd));
  const total=morceaux.reduce((s,m)=>s+m.length,0), out=new Uint8Array(total);
  let q=0;for(const m of morceaux){out.set(m,q);q+=m.length}
  return out;
}
