        const pourHono=liens.filter(l=>l.type==='honoraires');
        etat={...etat,marches:poser(etat.marches,'marche'),commandes:poser(etat.commandes,'commande'),
          chantiers:etat.chantiers.map(x=>x.id!==ch.id||!pourHono.length?x:{...x,
            honoFactures:(x.honoFactures||[]).map(f=>{
              const l=pourHono.find(y=>y.fid===f.id);
              return l?{...f,lien:l.lien}:f;
            })})};
        save(etat);
      }
    }catch(e){/* Drive non connecté : les factures restent enregistrées */}
    setEnvoi('');
    close();
  };
  return <div className="card" style={{borderLeft:'3px solid '+TERRA}}>
    <div className="h2" style={{marginBottom:8}}>LIRE DES FACTURES</div>
    {!cibles.length
      ?<div className="xs mut" style={{lineHeight:1.6}}>Créez d'abord les lots ou les commandes de matériaux — une facture se range sur l'un ou l'autre. Utilisez « Lire des contrats », « + Lot », ou l'onglet MATÉRIAUX.</div>
      :<div>
        <div className="xs mut" style={{lineHeight:1.6,marginBottom:10}}>
          Choisissez les factures en PDF : le montant, la date, le numéro et le taux de TVA sont lus,
          et chaque facture est rattachée d'après l'entreprise ou le fournisseur qui l'émet — marché de travaux
          comme achat de matériaux. PDF ou Word (.docx).
          <b> Rien n'est enregistré avant votre validation.</b>
        </div>
        <label className="btn gh s" style={{display:'inline-block',whiteSpace:'nowrap'}}>{busy||'Choisir des factures (PDF ou Word)'}
          <input type="file" accept={DOC_ACCEPT} multiple style={{display:'none'}} disabled={!!busy}
            onChange={e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)lire(fs)}}/></label>
      </div>}
    {!!scans.length&&<div className="xs" style={{marginTop:10,background:'#FBF3DF',color:'#6A4E06',borderLeft:'3px solid '+AMBER,padding:8,lineHeight:1.5}}>
      {scans.length} facture{scans.length>1?'s':''} n'ont rien donné :
      {scans.map(s=><div key={s.id} style={{marginTop:3}}>· <b>{s.nomFichier}</b> — {s.motif}</div>)}
      <div style={{marginTop:4}}>Saisissez-les à la main sur le lot concerné.</div>
    </div>}
    {!!sansLot.length&&<div className="xs" style={{marginTop:10,color:AMBER,lineHeight:1.5}}>
      {sansLot.length} facture{sansLot.length>1?'s':''} sans destination reconnue : choisissez la ligne ci-dessous, sinon elle{sansLot.length>1?'s ne seront':' ne sera'} pas enregistrée{sansLot.length>1?'s':''}.
    </div>}
    {rows.filter(r=>!r.scan).map(r=>{
      const reste=resteApres(r);
      return <div key={r.id} className="card" style={{marginTop:10,borderLeft:'3px solid '+(r.alertes.length||!r.marcheId?AMBER:GREEN)}}>
        <div className="sp" style={{gap:8,alignItems:'flex-start'}}>
          <span className="xs mut" style={{wordBreak:'break-all'}}>{r.nomFichier}</span>
          <label className="xs" style={{whiteSpace:'nowrap'}}>
            <input type="checkbox" checked={r.retenu} onChange={e=>upd(r.id,{retenu:e.target.checked})}/> retenir
          </label>
        </div>
        <Fld label="LOT OU ACHAT CONCERNÉ">
          <select className="in" value={r.marcheId} onChange={e=>upd(r.id,{marcheId:e.target.value})}>
            <option value="">— à choisir —</option>
            {['Marchés de travaux','Achats de matériaux','Honoraires'].map(g=>{
              const dedans=cibles.filter(c=>c.groupe===g);
              return dedans.length?<optgroup key={g} label={g}>
                {dedans.map(c=><option key={c.cle} value={c.cle}>{c.titre}{c.sous?' — '+c.sous:''}</option>)}
              </optgroup>:null;
            })}
          </select>
        </Fld>
        <div className="g3">
          <Fld label="MONTANT HT (€)"><input className="in" type="number" step="0.01" value={r.montant} onChange={e=>upd(r.id,{montant:e.target.value})}/></Fld>
          <Fld label="DATE"><input className="in" type="date" value={r.date} onChange={e=>upd(r.id,{date:e.target.value})}/></Fld>
          <Fld label="N° DE FACTURE"><input className="in" value={r.numero} onChange={e=>upd(r.id,{numero:e.target.value})}/></Fld>
        </div>
        {r.tva!==null&&r.tva!==undefined&&<div className="xs mut" style={{marginTop:-4}}>TVA {r.tva} % sur la facture.</div>}
        {r.alertes.map((a,i)=><div key={i} className="xs" style={{color:AMBER,marginTop:6,lineHeight:1.5}}>{a}</div>)}
        {doublon(r)&&<div className="xs" style={{color:TERRA,marginTop:6,lineHeight:1.5}}>Une facture du même montant et de la même date figure déjà sur ce lot — doublon probable.</div>}
        {reste!==null&&reste<-0.01&&<div className="xs" style={{color:TERRA,marginTop:6,lineHeight:1.5}}>
          Cette ligne serait facturée {eur(-reste)} au-delà de son montant{(cible(r.marcheId)||{}).type==='commande'?' de commande':' de marché'}.</div>}
        {reste!==null&&reste>=-0.01&&r.marcheId&&<div className="xs mut" style={{marginTop:6}}>Resterait à facturer sur cette ligne : {eur(reste)} HT.</div>}
      </div>;
    })}
    {!!rows.filter(r=>!r.scan).length&&<div className="row" style={{gap:8,marginTop:12,flexWrap:'wrap'}}>
      <button className="btn" disabled={!retenus.length||!!envoi} onClick={ajouter}>
        {envoi||(retenus.length?'Enregistrer '+retenus.length+' facture'+(retenus.length>1?'s':''):'Enregistrer les factures')}</button>
      <button className="btn gh" onClick={close}>Annuler</button>
    </div>}
    {!!retenus.length&&<div className="xs mut" style={{marginTop:8,lineHeight:1.5}}>
      Total retenu : <b>{eur(retenus.reduce((s,r)=>s+(+r.montant||0),0))} HT</b>. Les factures seront aussi déposées dans Drive › {ch.nom} › Factures.</div>}
  </div>;
}

function ImportMarches({data,ch,save,close}){
  const[txt,setTxt]=useState('');
  const[msg,setMsg]=useState('');
  const go=()=>{
    const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
    let artisans=[...data.artisans], marches=[...data.marches], n=0;
    for(const line of lines){
      const parts=line.split('|').map(p=>p.trim());
      if(parts.length<3)continue;
      const[lot,artisanNom,montantStr,dateStr,tvaStr]=parts;
      let art=artisanNom?artisans.find(a=>a.nom.toLowerCase()===artisanNom.toLowerCase()):null;
      if(artisanNom&&!art){
        art={id:uid(),nom:artisanNom,corps:lot,tel:'',email:'',adresse:'',siret:'',activites:'',assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''};
        artisans=[...artisans,art];
      }
      let dateSignature='';
      if(dateStr){
        const[j,mo,a]=dateStr.split('/');
        if(j&&mo&&a)dateSignature=a+'-'+mo.padStart(2,'0')+'-'+j.padStart(2,'0');
      }
      const tva=(tvaStr!==undefined&&tvaStr!=='')?+String(tvaStr).replace(',','.').replace('%','').trim():'';
      marches=[...marches,{id:uid(),chantierId:ch.id,lot,artisanId:art?art.id:'',montantHT:+String(montantStr).replace(',','.')||0,tva:isNaN(tva)?'':tva,facture:0,factures:[],statut:'signe',dateSignature,notes:''}];
      n++;
    }
    save({...data,artisans,marches});
    setMsg(n+' marché(s) importé(s).');
    setTxt('');
  };
  return <div className="card">
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Un marché par ligne, séparé par des <code>|</code> :<br/><code>Corps d'état | Artisan | Montant HT | JJ/MM/AAAA | TVA %</code><br/>Les deux derniers champs sont facultatifs ; sans TVA, le lot suit le taux du chantier ({tvaRate(ch)} %).</p>
    <textarea className="in" rows="6" value={txt} onChange={e=>setTxt(e.target.value)} placeholder={"Terrassement | SARL AMÉDÉE | 1664,36 | 25/05/2026\nBandes placo | EI SADDETIN KARA | 3033,87 | 25/05/2026 | 0"}/>
    <div className="row" style={{gap:8,marginTop:10}}>
      <button className="btn" onClick={go}>Importer</button>
      <button className="btn gh" onClick={close}>Fermer</button>
    </div>
    {msg&&<div className="xs" style={{marginTop:8,color:TERRA}}>{msg}</div>}
  </div>;
}

/* ---------------- PHOTOS ---------------- */
function Photos({data,ch,save}){
  const list=data.photos.filter(p=>p.chantierId===ch.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const [busy,setBusy]=useState(false);
  const [driveIssue,setDriveIssue]=useState(false);
  const [zoom,setZoom]=useState(null);
  const [edit,setEdit]=useState(null);
  const [driveDetail,setDriveDetail]=useState('');

  const add=async e=>{
    const files=[...e.target.files]; e.target.value='';
    if(!files.length)return;
    setBusy(true);
    setDriveIssue(false);
    const nouveaux=[];
    let driveFailed=false, lastDetail='';
    for(const file of files){
      try{
        const d=await compress(file);
        const id=uid();
        await Photo.put(id,d);
        let lien='';
        try{
          const token=await getDriveToken();
          const folderId=await driveSousDossier(token,ch.id,ch.nom,'Photos');
          lien=(await uploadToDrive(file,folderId)).webViewLink;
        }catch(x){driveFailed=true;lastDetail=x&&x.error==='auth_required'?'auth_required':((x&&(x.error||x.message))||String(x))}
        nouveaux.push({id,chantierId:ch.id,date:today(),legende:'',lot:'',lien});
      }catch(x){/* photo ignorée */}
    }
    if(nouveaux.length)save({...data,photos:[...data.photos,...nouveaux]});
    setDriveIssue(driveFailed);
    setDriveDetail(lastDetail);
    setBusy(false);
  };
  const del=async id=>{await Photo.del(id).catch(()=>{});save({...data,photos:data.photos.filter(p=>p.id!==id)})};
  const upd=p=>save({...data,photos:data.photos.map(x=>x.id===p.id?p:x)});

  /* rattrapage : les photos ajoutées alors que Drive n'était pas connecté n'ont
     jamais quitté l'application. On ne dispose plus de l'original — il n'existait
     qu'en mémoire au moment de l'ajout — mais la version réduite, elle, est
     conservée : mieux vaut la déposer que de laisser le dossier Drive vide. */
  const manquantes=list.filter(p=>!p.lien);
  const [rattrapage,setRattrapage]=useState(null);
  const envoyerManquantes=async()=>{
    setRattrapage({fait:0,total:manquantes.length});
    let photos=data.photos, fait=0, echec='';
    try{
      const token=await getDriveToken();
      const folderId=await driveSousDossier(token,ch.id,ch.nom,'Photos');
      for(const p of manquantes){
        try{
          const url=await Photo.get(p.id);
          if(!url)continue;
          const blob=await (await fetch(url)).blob();
          const nom=(p.date||today())+(p.legende?' — '+p.legende.replace(/[\\/:*?"<>|]/g,' '):'')+' — '+p.id+'.jpg';
          const{webViewLink}=await uploadToDrive(new File([blob],nom,{type:'image/jpeg'}),folderId);
          photos=photos.map(x=>x.id===p.id?{...x,lien:webViewLink}:x);
          fait++;
          setRattrapage({fait,total:manquantes.length});
        }catch(x){echec=(x&&(x.error||x.message))||String(x)}
      }
    }catch(x){echec=x&&x.error==='auth_required'?'auth_required':((x&&(x.error||x.message))||String(x))}
    if(fait)save({...data,photos});
    setRattrapage({fait,total:manquantes.length,fini:true,echec});
  };

  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{list.length} photo{list.length>1?'s':''}</span>
      <div className="row" style={{gap:14,alignItems:'center'}}>
        <BoutonDossierDrive ch={ch} sous="Photos"/>
        <label className="btn acc s">{busy?'Traitement…':'+ Photos'}
          <input type="file" accept="image/*" multiple onChange={add} style={{display:'none'}}/></label>
      </div>
    </div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Une version réduite s'affiche dans l'app ; l'original en pleine qualité est envoyé automatiquement sur votre Google Drive (dossier « {DRIVE_RACINE} › {ch.nom} › Photos »).
      <br/>Pour donner accès à un collaborateur : ouvrez le dossier avec le lien ci-dessus, puis utilisez « Partager » dans Google Drive. L'application ne peut pas partager à votre place.</p>
    {driveIssue&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {driveDetail==='auth_required'
        ?"Photo(s) enregistrée(s) dans l'app, mais Google Drive n'est pas connecté (bouton ci-dessus)."
        :"Photo(s) enregistrée(s) dans l'app, mais l'envoi de l'original vers Google Drive a échoué — détail technique : "+(driveDetail||'inconnu')+"."}
    </div>}
    {!!manquantes.length&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12,lineHeight:1.5}}>
      <b>{manquantes.length} photo{manquantes.length>1?'s':''} sur {list.length} ne {manquantes.length>1?'sont':'est'} pas sur le Drive.</b> La connexion Google est perdue à chaque fermeture de l’application : si elle n’a pas été rétablie avant l’ajout, l’envoi n’a pas eu lieu. {manquantes.length>1?'Elles sont':'Elle est'} bien conservée{manquantes.length>1?'s':''} dans l’application.
      <div style={{marginTop:8}}>
        <button className="btn acc s" disabled={!!rattrapage&&!rattrapage.fini} onClick={envoyerManquantes}>
          {rattrapage&&!rattrapage.fini?'Envoi '+rattrapage.fait+'/'+rattrapage.total+'…':'Envoyer sur le Drive'}</button>
      </div>
      <div style={{marginTop:6}}>Seule la version réduite peut être envoyée : l’original n’existait qu’au moment de l’ajout.</div>
    </div>}
    {rattrapage&&rattrapage.fini&&<div className="xs" style={{background:rattrapage.echec?'#F6E2DC':'#E3EDE4',color:rattrapage.echec?'#8A2E14':'#2F5D3A',borderLeft:'3px solid '+(rattrapage.echec?TERRA:GREEN),padding:8,marginBottom:12,lineHeight:1.5}}>
      {rattrapage.fait} photo{rattrapage.fait>1?'s':''} envoyée{rattrapage.fait>1?'s':''} sur le Drive.
      {rattrapage.echec==='auth_required'?" Connectez Google Drive (bouton ci-dessus) puis relancez l'envoi."
        :rattrapage.echec?' Interrompu — détail technique : '+rattrapage.echec+'.':''}
    </div>}
    {!list.length&&<Empty>Aucune photo. Prenez le chantier en photo à chaque visite.</Empty>}
    <div className="grid-ph">
      {list.map(p=><Vignette key={p.id} p={p} onZoom={()=>setZoom(p)} onEdit={()=>setEdit(p)}/>)}
    </div>
    {edit&&<div className="card" style={{marginTop:12}}>
      <Fld label="DATE"><input className="in" type="date" value={edit.date} onChange={e=>setEdit({...edit,date:e.target.value})}/></Fld>
      <Fld label="LÉGENDE"><input className="in" placeholder="Coulage dalle — angle nord" value={edit.legende} onChange={e=>setEdit({...edit,legende:e.target.value})}/></Fld>
      <Fld label="LOT CONCERNÉ"><select className="in" value={edit.lot} onChange={e=>setEdit({...edit,lot:e.target.value})}><option value="">— aucun —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      <Fld label="LIEN VERS L'ORIGINAL">
        <input className="in" placeholder="Lien Drive…" value={edit.lien} onChange={e=>setEdit({...edit,lien:e.target.value})}/>
        {edit.lien&&<a href={edit.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA,display:'inline-block',marginTop:6}}>Ouvrir sur Drive</a>}
      </Fld>
      <Acts onSave={()=>{upd(edit);setEdit(null)}} onCancel={()=>setEdit(null)} onDel={()=>{del(edit.id);setEdit(null)}}/>
    </div>}
    {zoom&&<Plein p={zoom} close={()=>setZoom(null)}/>}
  </div>;
}

function Vignette({p,onZoom,onEdit}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{let a=true;Photo.get(p.id).then(v=>{if(a)setSrc(v)}).catch(()=>{});return()=>{a=false}},[p.id]);
  return <div style={{border:'1px solid '+RULE,background:'#fff'}}>
    <div onClick={onZoom}>{src?<img className="ph" src={src} alt=""/>:<div className="ph"/>}</div>
    <div onClick={onEdit} style={{padding:'6px 7px'}}>
      <div className="xs mut">{fd(p.date)}</div>
      <div className="xs" style={{lineHeight:1.3}}>{p.legende||<span className="mut">Ajouter une légende</span>}</div>
      {p.lot&&<div className="xs" style={{color:NAVY,marginTop:2}}>{p.lot}</div>}
    </div>
  </div>;
}

function Plein({p,close}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{Photo.get(p.id).then(setSrc).catch(()=>{})},[p.id]);
  return <div className="modal" onClick={close}>
    <button className="xs" style={{color:'#fff',background:'none',border:'none',alignSelf:'flex-end',padding:8}}>Fermer</button>
    {src&&<img src={src} style={{maxWidth:'100%',maxHeight:'75vh',objectFit:'contain',margin:'auto'}} alt=""/>}

/* ---------------- COMMANDES MATÉRIAUX ---------------- */
function Commandes({data,ch,save,ouvrir,onOuvert}){
  const [f,setF]=useState(null);
  /* une commande de matériaux se facture comme un marché : le fournisseur envoie
     sa facture, elle se range sur la commande et entre dans le suivi de facturation. */
  const [luFact,setLuFact]=useState(null);
  const addFacture=()=>setF({...f,factures:[...(f.factures||[]),{id:uid(),montant:'',date:'',lien:'',numero:''}]});
  const updFacture=(fid,patch)=>setF(p=>({...p,factures:(p.factures||[]).map(x=>x.id===fid?{...x,...patch}:x)}));
  const delFacture=fid=>setF({...f,factures:(f.factures||[]).filter(x=>x.id!==fid)});
  const importFacture=async(fid,file)=>{
    let lu=null;
    if(!/^image\//.test(file.type||'')){
      try{
        const {txt,motif}=await lireDocument(file);
        if(txt){
          const a=analyseFacture(txt);
          const cible=(f.factures||[]).find(x=>x.id===fid)||{};
          const patch={};
          const ht=a.montantHT!==null?a.montantHT:(a.montantTTC!==null&&a.tva!==null?a.montantTTC/(1+a.tva/100):null);
          if(ht!==null&&(cible.montant===''||cible.montant===undefined||cible.montant===null))patch.montant=Math.round(ht*100)/100;
          if(a.date&&!cible.date)patch.date=a.date;
          if(a.numero&&!cible.numero)patch.numero=a.numero;
          if(Object.keys(patch).length){updFacture(fid,patch);lu={patch,a};}else lu={patch:null,a};
        }else lu={motif};
      }catch(e){}
    }
    setLuFact(lu);
    try{
      const token=await getDriveToken();
      const folderId=await driveFacturesFolder(token,ch.id,ch.nom);
      const{webViewLink}=await uploadToDrive(file,folderId);
      updFacture(fid,{lien:webViewLink});
    }catch(e){
      alert(e&&e.error==='auth_required'?"Connectez d'abord Google Drive (bouton ci-dessous).":"Import de la facture impossible.");
    }
  };
  const list=data.commandes.filter(c=>c.chantierId===ch.id).sort((a,b)=>(a.livrPrevue||'9999').localeCompare(b.livrPrevue||'9999'));
  const ok=()=>{
    if(!f.designation.trim())return;
    const factures=f.factures||[];
    const r={...f,montant:+f.montant||0,tva:f.tva===''||f.tva===undefined||f.tva===null?'':+f.tva,
      factures,facture:facturesTotal(factures)};
    save({...data,commandes:f.id?data.commandes.map(c=>c.id===f.id?r:c):[...data.commandes,{...r,id:uid(),chantierId:ch.id}]});
    setF(null);
  };
  const tot=materiauxHT(list), totTTC=materiauxTTC(list,ch);
  useEffect(()=>{
    if(!ouvrir)return;
    const c=data.commandes.find(x=>x.id===ouvrir);
    if(c)setF(c.factures?c:{...c,factures:[]});
    if(onOuvert)onOuvert();
  },[ouvrir]);
  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{list.length} commande{list.length>1?'s':''} — {eur(tot)} HT · {eur(totTTC)} TTC</span>
      <button className="btn acc s" onClick={()=>setF({designation:'',fournisseur:'',lot:'',montant:'',tva:'',dateCommande:'',livrPrevue:'',livrReelle:'',statut:'a_commander',notes:'',factures:[]})}>+ Commande</button>
    </div>
    {f&&<div className="card">
      <Fld label="DÉSIGNATION"><input className="in" placeholder="Menuiseries alu — 8 ouvrants" value={f.designation} onChange={e=>setF({...f,designation:e.target.value})}/></Fld>
      <div className="g2">
        <Fld label="FOURNISSEUR"><input className="in" list="fourn-cmd" value={f.fournisseur} onChange={e=>setF({...f,fournisseur:e.target.value})}/>
          <datalist id="fourn-cmd">{(data.fournisseurs||[]).map(x=><option key={x.id} value={x.nom}/>)}</datalist></Fld>
        <Fld label="MONTANT HT (€)"><input className="in" type="number" step="0.01" value={f.montant} disabled={!!f.quantitatif}
          onChange={e=>setF({...f,montant:e.target.value})} style={f.quantitatif?{background:'#F2EFE9'}:null}/></Fld>
      </div>
      <Fld label="TVA DE CETTE COMMANDE (%)">
        <input className="in" type="number" step="0.1" placeholder={'Chantier : '+tvaRate(ch)+' %'}
          value={f.tva===undefined||f.tva===null?'':f.tva} onChange={e=>setF({...f,tva:e.target.value})}/>
        <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>
          {f.quantitatif
            ?<span>Le montant est celui du quantitatif ci-dessous : il se recalcule à chaque quantité saisie. </span>
            :<span>Laissez vide pour appliquer le taux du chantier ({tvaRate(ch)} %). Saisissez <b>10</b> en rénovation, <b>0</b> en autoliquidation. </span>}
          {f.montant>0&&<span>— soit <b>{eur(cmdTTC({montant:+f.montant,tva:f.tva},ch))}</b> TTC.</span>}

      <Fld label="LOT CONCERNÉ"><select className="in" value={f.lot} onChange={e=>setF({...f,lot:e.target.value})}><option value="">— aucun —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>

      </Fld>
      <Fld label={"FACTURES DU FOURNISSEUR — total "+eur(facturesTotal(f.factures))+" HT"}>
        {(f.factures||[]).map(x=><div key={x.id} className="row" style={{gap:6,marginBottom:6,alignItems:'center',flexWrap:'wrap'}}>
          <input className="in" type="number" step="0.01" placeholder="Montant HT €" value={x.montant} onChange={e=>updFacture(x.id,{montant:e.target.value})} style={{flex:'1 1 90px'}}/>
          <input className="in" type="date" value={x.date} onChange={e=>updFacture(x.id,{date:e.target.value})} style={{flex:'1 1 120px'}}/>
          {x.lien
            ?<span className="row" style={{gap:6,alignItems:'center',whiteSpace:'nowrap'}}><Transmis/>
              <a href={x.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Voir</a></span>
            :<label className="xs" style={{color:NAVY,whiteSpace:'nowrap'}}>Importer<input type="file" accept={DOC_ACCEPT+',image/*'} style={{display:'none'}} onChange={e=>{const file=e.target.files[0];e.target.value='';if(file)importFacture(x.id,file)}}/></label>}
          <button className="btn dg s" onClick={()=>delFacture(x.id)}>✕</button>
        </div>)}

        {luFact&&luFact.patch&&<div className="xs" style={{marginTop:6,color:GREEN,lineHeight:1.5}}>
          Lu sur la facture :{luFact.patch.montant!==undefined&&<span> montant <b>{eur(luFact.patch.montant)} HT</b></span>}
          {luFact.patch.date!==undefined&&<span> · date <b>{fd(luFact.patch.date)}</b></span>}. À vérifier.</div>}
        {f.montant>0&&<div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
          Commande {eur(f.montant)} HT — reste à facturer <b>{eur((+f.montant||0)-facturesTotal(f.factures))}</b> HT.</div>}
      </Fld>

/* ---------------- TÂCHES ----------------
   Ce qui reste à faire sur ce chantier, en vrac — pas un jalon daté du
   programme, juste un pense-bête : relancer un artisan, vérifier un point,
   passer un coup de fil. Cochée, une tâche se raye plutôt que de disparaître. */
/* les degrés d'urgence d'une tâche : optionnel, une tâche « normale » n'en
   porte aucun (chaîne vide) */
const URGENCES=['Urgente','Très urgente'];
const urgenceCouleur=u=>u==='Très urgente'?TERRA:u==='Urgente'?AMBER:null;
function Taches({ch,up}){
  const T=ch.taches||[];
  const [f,setF]=useState(null);
  const neuf=()=>({id:uid(),texte:'',echeance:'',urgence:'',fait:false,creeLe:today()});
  const ok=()=>{
    if(!f.texte.trim())return;
    const r={...f,texte:f.texte.trim()};
    up({taches:T.some(x=>x.id===r.id)?T.map(x=>x.id===r.id?r:x):[...T,r]});
    setF(null);
  };
  const tog=(id,e)=>{e.stopPropagation();up({taches:T.map(x=>x.id===id?{...x,fait:!x.fait}:x)})};
  const suppr=id=>{up({taches:T.filter(x=>x.id!==id)});setF(null)};
  const restantes=T.filter(x=>!x.fait).length;
  const t=today();
  const rang=x=>{
    if(x.echeance&&!x.fait&&x.echeance<t)return 0;
    if(x.urgence==='Très urgente')return 1;
    if(x.urgence==='Urgente')return 2;
    return 3;
  };
  const L=T.slice().sort((a,b)=>{
    if(!!a.fait!==!!b.fait)return a.fait?1:-1;
    if(a.fait)return (a.echeance||'9999-99-99').localeCompare(b.echeance||'9999-99-99');
    const d=rang(a)-rang(b);
    return d||(a.echeance||'9999-99-99').localeCompare(b.echeance||'9999-99-99');
  });
  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{restantes} tâche{restantes>1?'s':''} à faire sur {T.length}</span>
      <button className="btn acc s" onClick={()=>setF(neuf())}>+ Tâche</button>
    </div>
    {f&&<div className="card" style={{marginBottom:12}}>
      <Fld label="INTITULÉ">
        <input className="in" value={f.texte} onChange={e=>setF({...f,texte:e.target.value})}
          onKeyDown={e=>{if(e.key==='Enter')ok()}}
          placeholder="Relancer le plombier pour le devis…"/>
      </Fld>
      <div className="g2">
        <Fld label="ÉCHÉANCE (OPTIONNELLE)"><input className="in" type="date" value={f.echeance||''} onChange={e=>setF({...f,echeance:e.target.value})}/></Fld>
        <Fld label="DEGRÉ D’URGENCE">
          <select className="in" value={f.urgence||''} onChange={e=>setF({...f,urgence:e.target.value})}>
            <option value="">Normale</option>
            {URGENCES.map(u=><option key={u} value={u}>{u}</option>)}
          </select>
        </Fld>
      </div>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={T.some(x=>x.id===f.id)?()=>suppr(f.id):null}/>
    </div>}
    {!T.length&&!f&&<Empty>Aucune tâche. « + Tâche » note ici ce qu'il reste à faire sur ce chantier.</Empty>}
    {L.map(x=>{
      const retard=x.echeance&&!x.fait&&x.echeance<t;
      const coul=urgenceCouleur(x.urgence);
      return <div key={x.id} className="card row" style={{gap:10,alignItems:'flex-start',padding:10,cursor:'pointer',
          borderLeft:(!x.fait&&(retard||coul))?'3px solid '+(retard?TERRA:coul):undefined}}
        onClick={()=>setF({...neuf(),...x})}>
        <button className="chk" onClick={e=>tog(x.id,e)} style={{background:x.fait?GREEN:'#fff',borderColor:x.fait?GREEN:RULE,flex:'0 0 auto'}}>{x.fait?'✓':''}</button>
        <div style={{flex:1,minWidth:0}}>
          <div className="sm" style={{color:x.fait?MUTED:INK,textDecoration:x.fait?'line-through':'none'}}>{x.texte}</div>
          {(x.echeance||(x.urgence&&!x.fait))&&<div className="xs" style={{color:retard?TERRA:MUTED,marginTop:2}}>
            {x.echeance&&(retard?'retard — échéance ':'échéance ')+fd(x.echeance)}
            {x.echeance&&x.urgence&&!x.fait?' · ':''}
            {x.urgence&&!x.fait?<span style={{color:coul}}>{x.urgence}</span>:null}
          </div>}
        </div>
        <button onClick={e=>{e.stopPropagation();suppr(x.id)}} className="xs" style={{color:MUTED,background:'none',border:'none',padding:0}}>✕</button>
      </div>;
    })}
  </div>;
}

/* ---------------- PLANNING ---------------- */
/* la date de fin prévue d'une intervention, à partir de son premier jour et
   de sa durée en jours (le jour de début compte comme jour 1) */
const finPrevue=(prevue,duree)=>{
  if(!prevue||!duree)return '';
  const[y,m,d]=prevue.split('-').map(Number);
  return isoDate(new Date(y,m-1,d+(+duree-1)));
};
/* enchaîne les dates prévues d'une liste de jalons à partir d'une date de
   départ : chaque étape commence le lendemain de la fin de la précédente.
   Une étape déjà réalisée (date réelle) n'est pas déplacée, mais sert quand
   même de point d'ancrage pour la suite. */
const cascaderJalons=(jalons,debut)=>{
  let curseur=debut;
  return jalons.map(j=>{
    const prevue=j.reelle?j.prevue:(curseur||j.prevue);
    if(curseur){
      const fin=j.reelle||finPrevue(prevue,j.duree||1)||prevue;
      if(fin){const[y,m,d]=fin.split('-').map(Number);curseur=isoDate(new Date(y,m-1,d+1))}
    }
    return j.reelle?j:{...j,prevue};
  });
};
/* la frise chronologique : une barre par jalon daté, groupée par phase */
function PlanningGantt({js}){
  const items=js.filter(j=>j.prevue||j.reelle);
  if(!items.length)return <Empty>Aucune date renseignée — renseignez une date de démarrage puis « Trame
    standard », ou saisissez une date sur chaque étape, pour voir le planning ici.</Empty>;
  const debut=x=>x.reelle||x.prevue;
  const fin=x=>x.reelle||finPrevue(x.prevue,x.duree||1)||x.prevue;
  const min=items.map(debut).reduce((a,b)=>a<b?a:b);
  const max=items.map(fin).reduce((a,b)=>a>b?a:b);
  const jourMin=new Date(min);
  const total=Math.max(1,Math.round((new Date(max)-jourMin)/86400000)+1);
  const pos=d=>Math.max(0,Math.round((new Date(d)-jourMin)/86400000));
  const t=today();
  let phaseCourante='';
  return <div>
    <div className="xs mut" style={{marginBottom:10,lineHeight:1.5}}>Du {fd(min)} au {fd(max)}.</div>
    <div style={{overflowX:'auto'}}>
      <div style={{minWidth:480}}>
        {js.map(j=>{
          if(!j.prevue&&!j.reelle)return null;
          const entete=j.phase&&j.phase!==phaseCourante;
          if(entete)phaseCourante=j.phase;
          const d0=debut(j), d1=fin(j);
          const g=pos(d0), largeur=Math.max(1,pos(d1)-g+1);
          const done=!!j.reelle, late=j.prevue&&!j.reelle&&j.prevue<t;
          return <React.Fragment key={j.id}>
            {entete&&<div className="xs b" style={{color:NAVY,marginTop:12,marginBottom:5}}>{j.phase.toUpperCase()}</div>}
            <div className="row" style={{alignItems:'center',gap:8,marginBottom:5}}>
              <span className="xs" style={{width:160,flex:'0 0 auto',color:done?MUTED:INK,textDecoration:done?'line-through':'none',
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={j.label}>{j.label}</span>
              <div style={{flex:1,position:'relative',height:14,background:'#EFECE4',borderRadius:3}}>
                <div style={{position:'absolute',left:(g/total*100)+'%',width:(largeur/total*100)+'%',minWidth:4,height:'100%',
                  borderRadius:3,background:done?GREEN:late?TERRA:NAVY}}/>
              </div>
            </div>
          </React.Fragment>;
        })}
      </div>
    </div>
  </div>;
}
function Planning({data,ch,up}){
  const js=ch.jalons||[];
  const [f,setF]=useState(null);
  const [vue,setVue]=useState('liste');
  const livr=data.commandes.filter(c=>c.chantierId===ch.id&&(c.livrPrevue||c.livrReelle))

    .sort((a,b)=>((a.reelle||a.prevue)||'9999').localeCompare((b.reelle||b.prevue)||'9999'));
  const ok=()=>{
    if(!f.label)return;
    const n=f.id?js.map(j=>j.id===f.id?f:j):[...js,{...f,id:uid()}];

  const trame=()=>{
    const base=JALONS.map(l=>({id:uid(),label:l.label,phase:l.phase,corps:l.corps||'',duree:l.duree||'',prevue:'',reelle:''}));
    up({jalons:ch.planningDebut?cascaderJalons(base,ch.planningDebut):base});

  return <div>

      <input className="in" type="date" value={ch.planningDebut||''} onChange={e=>up({planningDebut:e.target.value})}/>
      <div className="xs mut" style={{marginTop:4,marginBottom:12,lineHeight:1.5}}>
        Sert à calculer automatiquement la date de chaque étape, à la suite les unes des autres.</div>
    </Fld>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{js.length} jalon{js.length>1?'s':''} · {livr.length} livraison{livr.length>1?'s':''}</span>
      <div className="row" style={{gap:8,flexWrap:'wrap'}}>
        {!js.length&&<button className="btn gh s" onClick={trame}>Trame standard</button>}
        {!!js.length&&<button className="btn gh s" disabled={!ch.planningDebut} onClick={recalculer}>Recalculer les dates</button>}
        <button className="btn acc s" onClick={()=>setF({label:'',prevue:'',reelle:'',corps:'',duree:''})}>+ Jalon</button>
      </div>
    </div>
    {!!js.length&&<div className="row" style={{gap:6,marginBottom:12}}>
      <button className={'btn s '+(vue==='liste'?'':'gh')} onClick={()=>setVue('liste')}>Liste</button>
      <button className={'btn s '+(vue==='gantt'?'':'gh')} onClick={()=>setVue('gantt')}>Planning</button>
    </div>}
    {f&&<div className="card">
      <Fld label="ÉTAPE"><input className="in" list="jl" value={f.label} onChange={e=>setF({...f,label:e.target.value})}/>
        <datalist id="jl">{JALONS.map(j=><option key={j.label} value={j.label}/>)}</datalist></Fld>
      <div className="g2">
        <Fld label="DATE PRÉVUE"><input className="in" type="date" value={f.prevue} onChange={e=>setF({...f,prevue:e.target.value})}/></Fld>
        <Fld label="DATE RÉELLE"><input className="in" type="date" value={f.reelle} onChange={e=>setF({...f,reelle:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="CORPS DE MÉTIER (OPTIONNEL)"><input className="in" list="corps-planning" value={f.corps||''} onChange={e=>setF({...f,corps:e.target.value})}/>
          <datalist id="corps-planning">{CORPS.map(c=><option key={c} value={c}/>)}</datalist></Fld>
        <Fld label="DURÉE D’INTERVENTION (JOURS)">
          <input className="in" type="number" min="1" step="1" value={f.duree||''} onChange={e=>setF({...f,duree:e.target.value===''?'':+e.target.value})}/>
        </Fld>
      </div>
      {f.prevue&&f.duree>0&&<div className="xs mut" style={{marginTop:-6,marginBottom:12,lineHeight:1.5}}>
        Soit du {fd(f.prevue)} au {fd(finPrevue(f.prevue,f.duree))}.</div>}
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={f.id?()=>{up({jalons:js.filter(j=>j.id!==f.id)});setF(null)}:null}/>
    </div>}
    {!items.length&&!f&&<Empty>Aucune étape. « Trame standard » crée un planning détaillé de maison neuve, phase par phase.</Empty>}
    {vue==='gantt'&&!!items.length&&<PlanningGantt js={js}/>}
    {vue==='liste'&&items.map(i=>{
      const done=!!i.reelle, late=i.prevue&&!i.reelle&&i.prevue<today();
      const liv=i.type==='livr';
      const fin=!liv&&!done?finPrevue(i.prevue,i.duree):'';
      return <div key={i.type+i.id} className="card" style={{borderLeft:'3px solid '+(done?GREEN:late?TERRA:RULE),padding:10,opacity:liv?.85:1,cursor:liv?'default':'pointer'}}
        onClick={()=>{if(!liv)setF({corps:'',duree:'',...js.find(j=>j.id===i.id)})}}>
        <div className="sp">
          <span className="sm" style={{color:done?MUTED:INK,textDecoration:done?'line-through':'none'}}>
            {liv&&<span className="xs" style={{color:NAVY,marginRight:6}}>▸</span>}{i.label}</span>
          <span className="xs" style={{color:late?TERRA:MUTED,textAlign:'right',minWidth:74}}>
            {done?fd(i.reelle):late?'retard '+fd(i.prevue):fd(i.prevue)}</span>
        </div>
        {!liv&&(i.phase||i.corps||fin)&&<div className="xs mut" style={{marginTop:3}}>
          {i.phase}{i.phase&&i.corps?' · ':''}{i.corps}{(i.phase||i.corps)&&fin?' · ':''}{fin?'jusqu’au '+fd(fin)+' ('+i.duree+' j)':''}
        </div>}
      </div>;
    })}
  </div>;
}

/* ---------------- PLAN ÉLECTRIQUE ----------------
   Le plan d'architecte arrive en PDF : on le rend une fois en image (pdf.js
   est déjà chargé pour la lecture des attestations), et on pose les symboles
   par-dessus en SVG. Le SVG plutôt qu'un canvas : les symboles restent nets
   à tous les zooms, chacun reste un élément cliquable, et la légende se
   dessine avec exactement les mêmes formes que le plan. */

/* le dessin d'un symbole, centré sur (0,0), rayon ~9 */
function ElecGlyph({t,c}){
  const s=elecSymbole(t); if(!s)return null;
  const coul=c||s.c, r=9;
  const rond=<circle cx="0" cy="0" r={r} fill="#fff" stroke={coul} strokeWidth="1.6"/>;
  const mot=v=><text x="0" y="3.2" textAnchor="middle" fontSize={v.length>2?6:8} fontWeight="700" fill={coul}>{v}</text>;
  const rondMot=v=><g>{rond}{mot(v)}</g>;
  /* l'interrupteur : le point de commande et sa manette, comme au plan */
  const manette=(n)=><g>
    <circle cx="0" cy="0" r="3.6" fill={coul}/>
    {[...Array(n)].map((_,i)=><line key={i} x1="2.4" y1="-2.4" x2={8.5-i*3.2} y2={-8.5-i*0.4}
      stroke={coul} strokeWidth="1.6" strokeLinecap="round"/>)}
  </g>;
  switch(t){
    /* la prise : les deux broches et la terre */
    case 'pc': case 'pch': return <g>{rond}
      <circle cx="-3.2" cy="1.6" r="1.5" fill={coul}/><circle cx="3.2" cy="1.6" r="1.5" fill={coul}/>
      <circle cx="0" cy="-3.4" r="1.5" fill={coul}/></g>;
    case 'sa': return manette(1);
    case 'savoy': return <g>{manette(1)}<circle cx="8.5" cy="-8.5" r="2.2" fill="#fff" stroke={coul} strokeWidth="1.4"/></g>;
    case 'vv': return manette(2);
    /* le point de centre : le disque en quartiers alternés du plan d'implantation */
    case 'pointc': return <g>{rond}
      <path d={'M0,0 L0,-'+r+' A'+r+','+r+' 0 0 1 '+r+',0 Z'} fill={coul}/>
      <path d={'M0,0 L0,'+r+' A'+r+','+r+' 0 0 1 -'+r+',0 Z'} fill={coul}/></g>;
    /* l'applique : le demi-disque plaqué contre son mur */
    case 'applique': case 'appext': return <g>
      <path d={'M-'+r+',0 A'+r+','+r+' 0 0 1 '+r+',0 Z'} fill="#fff" stroke={coul} strokeWidth="1.6"/>
      <line x1={-r-1.5} y1="0" x2={r+1.5} y2="0" stroke={coul} strokeWidth="2"/>
      {t==='appext'?<line x1="0" y1="-3" x2="0" y2="-7.5" stroke={coul} strokeWidth="1.4"/>:null}</g>;
    /* les circuits spécialisés : la pastille chiffrée du plan d'implantation */
    case 'pc20': case 'pc32': return <g>{rond}
      <text x="0" y="3.4" textAnchor="middle" fontSize="8.5" fontWeight="700" fill={coul}>{t==='pc20'?'20':'32'}</text></g>;
    /* le sèche-serviettes : le corps de chauffe et ses barres */
    case 'secheserv': return <g>
      <rect x="-7" y="-9" width="14" height="18" rx="2" fill="#fff" stroke={coul} strokeWidth="1.6"/>
      {[-4.5,-1,2.5,6].map(y=><line key={y} x1="-4.5" y1={y} x2="4.5" y2={y} stroke={coul} strokeWidth="1.3"/>)}</g>;
    /* l'antenne râteau, telle qu'elle se pose en tête de plan */
    case 'antenne': return <g>
      <line x1="0" y1="9" x2="0" y2="-9" stroke={coul} strokeWidth="1.6"/>
      {[-9,-5.5,-2].map((y,i)=><line key={y} x1={-5+i*1.2} y1={y} x2={5-i*1.2} y2={y} stroke={coul} strokeWidth="1.4"/>)}</g>;
    case 'tv': return <g>{rond}
      <line x1="-5" y1="-5" x2="5" y2="5" stroke={coul} strokeWidth="1.6"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke={coul} strokeWidth="1.6"/></g>;
    case 'rj45': return <g>
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill={coul}/>
      <rect x="-4" y="-4.5" width="8" height="6" rx="1" fill="#fff"/></g>;
    /* le tableau : le bandeau plein, repère le plus visible du plan */
    case 'tab': return <rect x="-11" y="-5" width="22" height="10" rx="1.5" fill={coul}/>;
    case 'fumee': return <g>{rond}<circle cx="0" cy="0" r="3.4" fill={coul}/></g>;
    case 'vr': return <g>
      <rect x="-11" y="-6.5" width="22" height="13" rx="2" fill="#fff" stroke={coul} strokeWidth="1.6"/>
      <text x="0" y="3.4" textAnchor="middle" fontSize="8" fontWeight="700" fill={coul}>VR</text></g>;
    case 'son': return <g>{rond}
      <path d="M-4,2.5 A4,5 0 0 1 4,2.5 Z" fill={coul}/><line x1="0" y1="-2.5" x2="0" y2="-5.5" stroke={coul} strokeWidth="1.4"/></g>;
    case 'lesan': case 'legen': return <g>
      <rect x="-10" y="-6" width="20" height="12" rx="2" fill="#fff" stroke={coul} strokeWidth="1.6"/>
      <text x="0" y="3" textAnchor="middle" fontSize="6.5" fontWeight="700" fill={coul}>{t==='lesan'?'LE S':'LE G'}</text></g>;
    case 'splitue': return <g>{rondMot('UE')}</g>;
    case 'split': return <g>{rondMot('CE')}</g>;
    case 'sech': return <g>{rondMot('SE')}</g>;
    default: return rondMot(s.l.replace(/[^A-Za-z0-9&]/g,'').slice(0,3));
  }
}

/* ce qui est posé sur le plan, résumé comme le cartouche de légende d'un plan
   d'implantation : un symbole, son intitulé, sa hauteur de pose, sa quantité */
const elecLegende=symboles=>{
  const n={};
  (symboles||[]).forEach(s=>{n[s.type]=(n[s.type]||0)+1});
  return ELEC_SYMBOLES.filter(s=>n[s.id]).map(s=>({...s,n:n[s.id]}));
};

/* le PDF rendu en image : la page 1, assez large pour rester lisible au zoom */
async function planEnImage(file,largeur){
  if(/^image\//.test(file.type)){
    const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    return {url,ratio:img.height/img.width};
  }
  if(typeof pdfjsLib==='undefined')throw new Error('Lecteur PDF non chargé — vérifiez votre connexion.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const page=await doc.getPage(1);
  const base=page.getViewport({scale:1});
  const vp=page.getViewport({scale:(largeur||2000)/base.width});
  const cv=document.createElement('canvas');
  cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
  const ctx=cv.getContext('2d');
  /* le PDF est transparent : sans fond blanc, le plan sort sur du noir en JPEG */
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return {url:cv.toDataURL('image/jpeg',0.92),ratio:cv.height/cv.width};
}

/* le câble : un arc entre deux symboles, bombé perpendiculairement à leur axe.
   C'est ainsi que les plans d'implantation relient une commande à ce qu'elle
   pilote — un trait droit se confondrait avec les murs et les cotes. Les deux
   points arrivent déjà à l'échelle du plan. */
const cheminCable=(a,b,courbure)=>{
  if(!a||!b)return '';
  const k=courbure===undefined||courbure===null?0.18:courbure;
  const dx=b.x-a.x,dy=b.y-a.y;
  const cx=(a.x+b.x)/2-dy*k, cy=(a.y+b.y)/2+dx*k;
  return 'M'+a.x+','+a.y+' Q'+cx+','+cy+' '+b.x+','+b.y;
};
/* de quoi distinguer les circuits entre eux : la couleur du tracé et, au
   besoin, le pointillé — pour un passage en plafond, une gaine en attente… */
const ELEC_CABLE_COULEURS=[['','Bleu'],[ELEC_ROUGE,'Rouge'],[ELEC_VERT,'Vert'],[AMBER,'Orange'],[INK,'Noir']];
const couleurCable=c=>(c&&c.couleur)||ELEC_BLEU;
const traitCable=c=>c&&c.pointille?'7 5':null;

/* un câble ne vaut que si ses deux extrémités existent encore */
const cablesValides=(cables,symboles)=>{
  const ok=new Set((symboles||[]).map(s=>s.id));
  return (cables||[]).filter(c=>ok.has(c.de)&&ok.has(c.vers)&&c.de!==c.vers);
};

/* ---------- l'export en PDF ----------
   Le plan fini part chez l'électricien : un PDF d'une page contenant l'image
   du plan. Les octets du JPEG y sont reposés tels quels (filtre DCTDecode),
   sans réencodage ni bibliothèque supplémentaire — la même approche que le
   .docx et le PNG du QR, écrits à la main ailleurs dans l'application. */
function pdfUnePage(jpeg,largeurPx,hauteurPx,titre){
  const enc=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&0xff;return u};
  const bouts=[]; let n=0;
  const pousser=u=>{bouts.push(u);n+=u.length};
  /* A3 à l'italienne pour la largeur, la hauteur suit les proportions du plan */
  const L=1190.55, H=Math.round(L*(hauteurPx/largeurPx)*100)/100;
  const offsets=[];
  const obj=(i,corps,flux)=>{
    offsets[i]=n;
    pousser(enc(i+' 0 obj\n'+corps+'\n'));
    if(flux){pousser(enc('stream\n'));pousser(flux);pousser(enc('\nendstream\n'))}
    pousser(enc('endobj\n'));
  };
  const contenu=enc('q '+L+' 0 0 '+H+' 0 0 cm /Im0 Do Q');
  pousser(enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+L+' '+H+']'
    +' /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  obj(4,'<< /Type /XObject /Subtype /Image /Width '+largeurPx+' /Height '+hauteurPx
    +' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>',jpeg);
  obj(5,'<< /Length '+contenu.length+' >>',contenu);
  obj(6,'<< /Title ('+String(titre||'Plan électrique').replace(/[\\()]/g,'')+') /Producer (CP Constructions) >>');
  const debutXref=n;
  let xref='xref\n0 7\n0000000000 65535 f \n';
  for(let i=1;i<=6;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  pousser(enc(xref));
  pousser(enc('trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n'+debutXref+'\n%%EOF\n'));
  const out=new Uint8Array(n); let p=0;
  bouts.forEach(b=>{out.set(b,p);p+=b.length});
  return out;
}

/* le plan tel qu'il part chez l'électricien : le fond, les câbles, les
   symboles, et le cartouche de légende en pied — la mise en page des plans
   d'implantation qu'on reçoit des bureaux d'études. */
function PlanExport({fond,ratio,symboles,cables,titre,hauteurs,echelle}){
  const ech=typeof echelle==='number'&&echelle>0?echelle:ELEC_ECHELLE_DEFAUT;
  const L=1000,H=Math.round(L*(ratio||0.707));
  const pt=s=>({x:s.x*L,y:s.y*H});
  const par={}; (symboles||[]).forEach(s=>{par[s.id]=s});
  const leg=elecLegende(symboles);
  const col=5,hLigne=26,larg=L/col;
  const hCart=leg.length?Math.ceil(leg.length/col)*hLigne+40:0;
  return <svg xmlns="http://www.w3.org/2000/svg" width={L} height={H+hCart} viewBox={'0 0 '+L+' '+(H+hCart)}>
    <rect x="0" y="0" width={L} height={H+hCart} fill="#ffffff"/>
    <image href={fond} x="0" y="0" width={L} height={H} preserveAspectRatio="none"/>
    {cablesValides(cables,symboles).map(c=>
      <path key={c.id} d={cheminCable(pt(par[c.de]),pt(par[c.vers]),c.courbure)}
        fill="none" stroke={couleurCable(c)} strokeWidth="1.5" strokeDasharray={traitCable(c)}/>)}
    {(symboles||[]).map(s=>{const p=pt(s);
      return <g key={s.id}>
        {/* le symbole tourne et se met à l'échelle… */}
        <g transform={poseSymbole(p.x,p.y,s.rot,ech)}><ElecGlyph t={s.type}/></g>
        {/* …mais pas sa hauteur, qui doit rester lisible à l'endroit */}
        {!!etiquetteHauteur(s,hauteurs)&&
          <text x={p.x+11*ech} y={p.y-8*ech} fontSize={8*ech+2.5} fontWeight="700" fill={INK}>
            {etiquetteHauteur(s,hauteurs)}</text>}
      </g>})}
    {hCart>0&&<g transform={'translate(0,'+H+')'}>
      <line x1="0" y1="8" x2={L} y2="8" stroke={RULE} strokeWidth="1"/>
      <text x="6" y="27" fontSize="11" fontWeight="700" fill={NAVY}>{titre}</text>
      {leg.map((s,i)=><g key={s.id} transform={'translate('+((i%col)*larg)+','+(36+Math.floor(i/col)*hLigne)+')'}>
        <g transform="translate(18,10)"><ElecGlyph t={s.id}/></g>
        <text x="33" y="14" fontSize="9" fill={INK}>{s.l}</text>
        <text x={larg-8} y="14" fontSize="9" textAnchor="end" fill={MUTED}>{'H : '+s.h+' · ×'+s.n}</text>
      </g>)}
    </g>}
  </svg>;
}

const ELEC_HAUTEURS=[0,30,50,105,110,170,250];
/* Les symboles sont dessinés à une taille de référence, puis ramenés à
   l'échelle du plan : sur un fond très détaillé ils écrasaient le trait de
   l'architecte. Cette échelle vaut pour tout le plan et se règle une fois. */
const ELEC_ECHELLE_DEFAUT=0.65;
/* La hauteur ne s'écrit sur le plan que lorsqu'elle sort de l'ordinaire :
   une prise posée à 110 au lieu des 30 habituels doit sauter aux yeux, tandis
   qu'un point de centre au plafond, lui, est à sa hauteur normale et n'a rien
   à signaler. Le bouton « Hauteurs » les fait toutes apparaître au besoin. */
const etiquetteHauteur=(s,toutes)=>{
  if(!s||s.h===''||s.h===undefined||s.h===null)return '';
  const d=elecSymbole(s.type);
  if(!toutes&&d&&+s.h===+d.h)return '';
  return 'H : '+s.h;
};
const echelleSymboles=plan=>{
  const e=plan&&plan.echelle;
  return typeof e==='number'&&e>0?e:ELEC_ECHELLE_DEFAUT;
};
/* translate + rotate + scale : l'ordre compte, la rotation doit tourner le
   symbole autour de son point de pose, pas autour de l'origine du plan */
const poseSymbole=(x,y,rot,ech)=>'translate('+x+','+y+') rotate('+(rot||0)+') scale('+ech+')';

function PlanElectrique({ch,up,onFermer}){
  const d=ch.docs||{};
  const plan=(d.plan_elec&&d.plan_elec.plan)||{fond:'',ratio:0.707,symboles:[],cables:[]};
  const S=plan.symboles||[];
  const C=cablesValides(plan.cables,S);
  const [fondUrl,setFondUrl]=useState(null);
  const [outil,setOutil]=useState('');
  const [sel,setSel]=useState(null);
  const [selC,setSelC]=useState(null);
  const [depart,setDepart]=useState(null);
  const [hauteurs,setHauteurs]=useState(false);
  const [zoom,setZoom]=useState(1);
  const [busy,setBusy]=useState('');      /* import du plan de fond */
  const [busyPdf,setBusyPdf]=useState('');  /* export du plan fini */
  const [groupe,setGroupe]=useState(ELEC_GROUPES[0]);
  const svgRef=useRef(null);
  const drag=useRef(null);
  const gestSymbole=useRef(false);   /* le geste en cours a-t-il commencé sur un symbole ? */

  useEffect(()=>{let a=true;
    if(!plan.fond){setFondUrl(null);return}
    Photo.get(plan.fond).then(v=>{if(a)setFondUrl(v)}).catch(()=>{});
    return()=>{a=false};
  },[plan.fond]);

  const maj=p=>{const c=d.plan_elec||{};
    up({docs:{...d,plan_elec:{...c,plan:{...plan,...p},fait:true,date:c.fait?c.date:today()}}})};

  const importer=async file=>{
    setBusy('Lecture du plan…');
    try{
      const{url,ratio}=await planEnImage(file);
      setBusy('Enregistrement…');
      /* toujours une clé neuve, jamais un écrasement : le stockage n'autorise
         que l'ajout, pas la mise à jour d'un objet déjà là — réécrire la même
         clé faisait échouer tout remplacement de plan. L'ancien fond n'est
         retiré qu'une fois le nouveau en place, et son échec est sans
         conséquence : il ne resterait qu'un fichier inutilisé. */
      const ancien=plan.fond;
      const id=uid();
      await Photo.put(id,url);
      setFondUrl(url);
      maj({fond:id,ratio});
      if(ancien&&ancien!==id)Photo.del(ancien).catch(()=>{});
    }catch(e){alert("Ce plan n'a pas pu être lu — détail technique : "+((e&&(e.error||e.message))||String(e)))}
    setBusy('');
  };

  /* le point cliqué, ramené en coordonnées du plan (0 à 1) : la mesure se prend
     sur le SVG lui-même, donc le zoom et le défilement sont déjà pris en compte */
  const pos=e=>{
    const el=svgRef.current; if(!el)return null;
    const r=el.getBoundingClientRect();
    if(!r.width||!r.height)return null;
    return {x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),
            y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))};
  };
  const poser=e=>{
    /* Un geste commencé sur un symbole capture le pointeur sur la zone : le
       clic de relâchement est alors délivré ici, et non au symbole. Sans ce
       garde-fou il défaisait aussitôt la sélection, et les réglages du
       symbole disparaissaient dès qu'on lâchait le bouton. */
    /* (le drapeau est remis à zéro par le pointerdown du fond, si bien qu'un
       déplacement resté sans clic n'avale pas le clic suivant) */
    if(gestSymbole.current){gestSymbole.current=false;return}
    if(!outil||outil==='cable'){setSel(null);setSelC(null);return}
    const p=pos(e); if(!p)return;
    const s=elecSymbole(outil);
    maj({symboles:[...S,{id:uid(),type:outil,x:p.x,y:p.y,h:s.h,note:''}]});
  };
  const majSymbole=(id,p)=>maj({symboles:S.map(s=>s.id===id?{...s,...p}:s)});
  /* retirer un symbole emporte les câbles qui y aboutissaient : un câble
     accroché dans le vide n'aurait plus de sens */
  const supprimer=id=>{
    maj({symboles:S.filter(s=>s.id!==id),cables:C.filter(c=>c.de!==id&&c.vers!==id)});
    setSel(null);
  };
  const majCable=(id,p)=>maj({cables:C.map(c=>c.id===id?{...c,...p}:c)});
  const supprimerCable=id=>{maj({cables:C.filter(c=>c.id!==id)});setSelC(null)};
  /* en mode câblage, le premier symbole cliqué est l'origine, le second
     l'aboutissement — comme on relie un interrupteur à ce qu'il commande */
  const cliquerSymbole=id=>{
    if(outil==='cable'){
      if(!depart)return setDepart(id);
      if(depart===id)return setDepart(null);
      if(!C.some(c=>(c.de===depart&&c.vers===id)||(c.de===id&&c.vers===depart)))
        maj({cables:[...C,{id:uid(),de:depart,vers:id,courbure:0.18}]});
      setDepart(null);
      return;
    }
    if(!outil){setSel(id);setSelC(null)}
  };
  const changerOutil=t=>{setOutil(t);setSel(null);setSelC(null);setDepart(null)};

  /* ---------- l'export en PDF ----------
     La planche est rendue par React dans l'arbre de l'écran, puis reprise par
     un effet : celui-ci ne s'exécute qu'une fois le rendu réellement posé
     dans la page. La version précédente montait un arbre à part et attendait
     80 ms au jugé — quand le rendu prenait plus longtemps, il n'y avait
     rien à convertir et l'export échouait. */
  const [aExporter,setAExporter]=useState(null);
  const exportRef=useRef(null);

  const telecharger=(octets,nom)=>{
    const url=URL.createObjectURL(new Blob([octets],{type:'application/pdf'}));
    const a=document.createElement('a');
    a.href=url; a.download=nom; a.style.display='none';
    /* le lien doit être dans la page : Firefox ignore un clic sur un lien détaché */
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  };

  const exporter=async()=>{
    if(!plan.fond){alert('Importez d’abord le plan de fond.');return}
    setBusyPdf('Préparation du PDF…');
    try{
      /* on redemande une adresse fraîche : celle obtenue à l'ouverture de
         l'écran expire au bout d'une heure, et l'export sortirait un fond vide */
      const url=await Photo.get(plan.fond);
      if(!url)throw new Error('le plan de fond est introuvable');
      const rep=await fetch(url);
      if(!rep.ok)throw new Error('le plan de fond n’a pas pu être relu (code '+rep.status+')');
      const blob=await rep.blob();
      const fondData=await new Promise((res,rej)=>{
        const fr=new FileReader();
        fr.onload=()=>res(fr.result);
        fr.onerror=()=>rej(new Error('le plan de fond n’a pas pu être lu'));
        fr.readAsDataURL(blob);
      });
      setAExporter({fond:fondData});
    }catch(e){
      alert('L’export du plan a échoué — détail technique : '+((e&&(e.error||e.message))||String(e)));
      setBusyPdf('');
    }
  };

  useEffect(()=>{
    if(!aExporter)return;
    let vivant=true;
    (async()=>{
      try{
        const svgEl=exportRef.current&&exportRef.current.querySelector('svg');
        if(!svgEl)throw new Error('la planche n’a pas pu être composée');
        const svgTxt=new XMLSerializer().serializeToString(svgEl);
        const img=await new Promise((res,rej)=>{
          const i=new Image();
          i.onload=()=>res(i);
          i.onerror=()=>rej(new Error('le plan n’a pas pu être dessiné'));
          i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgTxt);
        });
        /* Safari sur iPhone plafonne la surface d'un canvas : au-delà, il ne
           refuse pas franchement mais rend une image vide. On tente donc une
           taille confortable, puis on se rabat sur une plus modeste plutôt
           que de sortir un PDF blanc sans rien dire. */
        let dessin=null;
        for(const large of [2400,1600,1000]){
          const cv=document.createElement('canvas');
          cv.width=large; cv.height=Math.round(large*(img.height||1)/(img.width||1));
          const ctx=cv.getContext('2d');
          if(!ctx)continue;
          ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
          ctx.drawImage(img,0,0,cv.width,cv.height);
          let d='';
          try{d=cv.toDataURL('image/jpeg',0.9)}catch(x){d=''}
          if(d&&d.length>5000){dessin={d,w:cv.width,h:cv.height};break}
        }
        if(!dessin)throw new Error('cet appareil n’a pas pu convertir un plan de cette taille');
        const jpeg=new Uint8Array(await (await (await fetch(dessin.d)).blob()).arrayBuffer());
        telecharger(pdfUnePage(jpeg,dessin.w,dessin.h,'Plan électrique — '+ch.nom),
          'Plan-electrique-'+(ch.nom||'chantier').replace(/[^\wÀ-ÿ]+/g,'-')+'-'+today()+'.pdf');
      }catch(e){
        alert('L’export du plan a échoué — détail technique : '+((e&&(e.error||e.message))||String(e)));
      }
      if(vivant){setAExporter(null);setBusyPdf('')}
    })();
    return ()=>{vivant=false};
  },[aExporter]);

  const H=1000*(plan.ratio||0.707);
  const ech=echelleSymboles(plan);
  const choisi=S.find(s=>s.id===sel);
  const choisiC=C.find(c=>c.id===selC);
  const parId={}; S.forEach(s=>{parId[s.id]=s});
  const pt=s=>({x:s.x*1000,y:s.y*H});
  const legende=elecLegende(S);

  return <div>
    <div className="sp" style={{marginBottom:10,alignItems:'center'}}>
      <span className="h2" style={{fontSize:13}}>PLAN ÉLECTRIQUE — {ch.nom}</span>
      <button className="btn gh s" onClick={onFermer}>Fermer</button>
    </div>

    {!plan.fond&&<div className="card" style={{textAlign:'center',padding:20}}>
      <div className="sm" style={{marginBottom:6}}>Importez d’abord le plan d’implantation.</div>
      <div className="xs mut" style={{marginBottom:12,lineHeight:1.5}}>
        Un PDF (la première page est reprise) ou une image. Le plan est enregistré une fois pour
        toutes : vous posez ensuite les symboles par-dessus.</div>
      <label className="btn acc s" style={{display:'inline-block'}}>
        {busy||'Importer le plan'}
        <input type="file" accept="application/pdf,.pdf,image/*" style={{display:'none'}} disabled={!!busy}
          onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importer(f)}}/>
      </label>
    </div>}

    {!!plan.fond&&<React.Fragment>
      <div className="row" style={{gap:6,marginBottom:8,flexWrap:'wrap',alignItems:'center'}}>
        <button className={'btn s '+(outil?'gh':'')} onClick={()=>changerOutil('')}>Sélection</button>
        <button className={'btn s '+(outil==='cable'?'':'gh')} onClick={()=>changerOutil(outil==='cable'?'':'cable')}>Câbler</button>
        <button className={'btn s '+(hauteurs?'':'gh')} onClick={()=>setHauteurs(h=>!h)}>Hauteurs</button>
        <span style={{flex:1}}/>
        <button className="btn gh s" onClick={()=>setZoom(z=>Math.max(1,+(z-.5).toFixed(1)))} aria-label="Dézoomer">−</button>
        <span className="xs mut" style={{minWidth:38,textAlign:'center'}}>{Math.round(zoom*100)}%</span>
        <button className="btn gh s" onClick={()=>setZoom(z=>Math.min(6,+(z+.5).toFixed(1)))} aria-label="Zoomer">+</button>
      </div>
      <div className="xs mut" style={{marginBottom:8,lineHeight:1.5}}>
        {outil==='cable'
          ?(depart?'Cliquez maintenant le symbole commandé pour terminer le câble.'
                  :'Cliquez la commande (interrupteur, va-et-vient…), puis ce qu’elle pilote.')
          :outil?'Cliquez sur le plan pour poser « '+elecSymbole(outil).l+' ».'
                :'Cliquez un symbole pour le déplacer ou le régler, un câble pour le modifier.'}
      </div>

      <div className="row" style={{gap:6,marginBottom:6,flexWrap:'wrap'}}>
        {ELEC_GROUPES.map(g=><button key={g} className={'btn s '+(groupe===g?'':'gh')} onClick={()=>setGroupe(g)}>{g}</button>)}
      </div>
      <div className="row" style={{gap:6,marginBottom:10,alignItems:'center',flexWrap:'wrap'}}>
        <span className="xs mut">Taille des symboles</span>
        <button className="btn gh s" onClick={()=>maj({echelle:Math.max(0.3,+(ech-0.1).toFixed(2))})} aria-label="Réduire les symboles">−</button>
        <span className="xs mut" style={{minWidth:42,textAlign:'center'}}>{Math.round(ech*100)}%</span>
        <button className="btn gh s" onClick={()=>maj({echelle:Math.min(2,+(ech+0.1).toFixed(2))})} aria-label="Agrandir les symboles">+</button>
      </div>
      <div className="row" style={{gap:6,marginBottom:10,flexWrap:'wrap'}}>
        {ELEC_SYMBOLES.filter(s=>s.g===groupe).map(s=>
          <button key={s.id} onClick={()=>changerOutil(s.id)} title={s.l+' — H : '+s.h}
            style={{display:'flex',alignItems:'center',gap:6,padding:'4px 8px',borderRadius:6,cursor:'pointer',
              border:'1px solid '+(outil===s.id?s.c:RULE),background:outil===s.id?s.c+'14':'#fff'}}>
            <svg width="22" height="22" viewBox="-12 -12 24 24" style={{flex:'0 0 auto'}}><ElecGlyph t={s.id}/></svg>
            <span className="xs" style={{color:outil===s.id?s.c:INK,whiteSpace:'nowrap'}}>{s.l}</span>
          </button>)}
      </div>

      <div style={{border:'1px solid '+RULE,borderRadius:8,overflow:'auto',background:'#fff',maxHeight:'62vh'}}>
        <div style={{width:(zoom*100)+'%',minWidth:'100%',position:'relative'}}>
          {fondUrl?<img src={fondUrl} alt="" style={{width:'100%',display:'block'}}/>
            :<div className="xs mut" style={{padding:40,textAlign:'center'}}>Chargement du plan…</div>}
          <svg ref={svgRef} viewBox={'0 0 1000 '+H} preserveAspectRatio="none"
            style={{position:'absolute',left:0,top:0,width:'100%',height:'100%',cursor:outil?'crosshair':'default',touchAction:'pan-x pan-y'}}
            onClick={poser}
            onPointerDown={()=>{gestSymbole.current=false}}
            onPointerMove={e=>{if(!drag.current)return;const p=pos(e);if(p)majSymbole(drag.current,p)}}
            onPointerUp={e=>{drag.current=null;
              if(svgRef.current&&svgRef.current.releasePointerCapture&&e&&e.pointerId!==undefined)
                try{svgRef.current.releasePointerCapture(e.pointerId)}catch(x){}}}>
            {/* les câbles passent sous les symboles, pour ne pas les masquer */}
            {C.map(c=>{const chemin=cheminCable(pt(parId[c.de]),pt(parId[c.vers]),c.courbure);
              return <g key={c.id} onClick={e=>{e.stopPropagation();if(!outil){setSelC(c.id);setSel(null)}}}>
                <path d={chemin} fill="none" stroke="transparent" strokeWidth="14" style={{cursor:outil?'inherit':'pointer'}}/>
                <path d={chemin} fill="none" stroke={selC===c.id?TERRA:couleurCable(c)}
                  strokeWidth={selC===c.id?2.6:1.6} strokeLinecap="round" strokeDasharray={traitCable(c)}/>
              </g>})}
            {S.map(s=>{const d0=elecSymbole(s.type); if(!d0)return null;
              const px=s.x*1000, py=s.y*H;
              /* touchAction 'none' sur le symbole seul : sans cela, au doigt,
                 le navigateur fait défiler le plan au lieu de le déplacer —
                 le reste de la zone reste librement défilable */
              return <g key={s.id} style={{cursor:outil==='cable'?'pointer':'move',touchAction:'none'}}
                onClick={e=>{e.stopPropagation();cliquerSymbole(s.id)}}
                onPointerDown={e=>{if(outil)return;e.stopPropagation();
                  drag.current=s.id;gestSymbole.current=true;setSel(s.id);setSelC(null);
                  if(svgRef.current&&svgRef.current.setPointerCapture)svgRef.current.setPointerCapture(e.pointerId)}}>
                {(sel===s.id||depart===s.id)&&<circle cx={px} cy={py} r={15*ech} fill="none"
                  stroke={depart===s.id?ELEC_BLEU:TERRA} strokeWidth="1.8" strokeDasharray="3 2"/>}
                {/* une cible de saisie confortable, même quand le symbole est petit */}
                <circle cx={px} cy={py} r={Math.max(11,14*ech)} fill="transparent"/>
                <g transform={poseSymbole(px,py,s.rot,ech)}><ElecGlyph t={s.type}/></g>
                {!!etiquetteHauteur(s,hauteurs)&&
                  <text x={px+11*ech} y={py-8*ech} fontSize={8*ech+2.5} fontWeight="700" fill={INK}>
                    {etiquetteHauteur(s,hauteurs)}</text>}
              </g>})}
          </svg>
        </div>
      </div>

      {choisi&&<div className="card" style={{marginTop:10,borderLeft:'3px solid '+TERRA}}>
        <div className="sp" style={{marginBottom:8}}>
          <span className="b sm" style={{color:NAVY}}>{elecSymbole(choisi.type).l}</span>
          <button className="btn dg s" onClick={()=>supprimer(choisi.id)}>Supprimer</button>
        </div>
        <div className="g2">
          <Fld label="HAUTEUR DE POSE (CM)">
            <input className="in" type="number" value={choisi.h===''?'':choisi.h}
              onChange={e=>majSymbole(choisi.id,{h:e.target.value===''?'':+e.target.value})}/>
          </Fld>
          <Fld label="REPÈRE (OPTIONNEL)">
            <input className="in" value={choisi.note||''} placeholder="Chambre 1, plan de travail…"
              onChange={e=>majSymbole(choisi.id,{note:e.target.value})}/>
          </Fld>
        </div>
        {/* les hauteurs courantes en un clic : c'est le réglage qu'on reprend
            le plus souvent d'un symbole à l'autre (30 au sol, 110 en allumage) */}
        <div className="row" style={{gap:6,flexWrap:'wrap',marginTop:-6}}>
          {ELEC_HAUTEURS.map(v=><button key={v} className={'btn s '+(choisi.h===v?'':'gh')}
            onClick={()=>majSymbole(choisi.id,{h:v})}>{v}</button>)}
        </div>
        {/* l'orientation : un interrupteur ou une applique se pose contre un
            mur, et doit regarder du bon côté */}
        <Fld label="ORIENTATION">
          <div className="row" style={{gap:6,flexWrap:'wrap',alignItems:'center'}}>
            <button className="btn gh s" aria-label="Tourner à gauche"
              onClick={()=>majSymbole(choisi.id,{rot:((choisi.rot||0)-15+360)%360})}>↺</button>
            <span className="xs mut" style={{minWidth:42,textAlign:'center'}}>{choisi.rot||0}°</span>
            <button className="btn gh s" aria-label="Tourner à droite"
              onClick={()=>majSymbole(choisi.id,{rot:((choisi.rot||0)+15)%360})}>↻</button>
            {[0,90,180,270].map(a=><button key={a} className={'btn s '+((choisi.rot||0)===a?'':'gh')}
              onClick={()=>majSymbole(choisi.id,{rot:a})}>{a}°</button>)}
          </div>
        </Fld>
      </div>}

      {choisiC&&<div className="card" style={{marginTop:10,borderLeft:'3px solid '+ELEC_BLEU}}>
        <div className="sp" style={{marginBottom:8}}>
          <span className="b sm" style={{color:NAVY}}>
            Câble — {elecSymbole((parId[choisiC.de]||{}).type)?elecSymbole(parId[choisiC.de].type).l:'?'}
            {' → '}
            {elecSymbole((parId[choisiC.vers]||{}).type)?elecSymbole(parId[choisiC.vers].type).l:'?'}</span>
          <button className="btn dg s" onClick={()=>supprimerCable(choisiC.id)}>Supprimer</button>
        </div>
        <Fld label="COURBURE">
          <input className="in" type="range" min="-60" max="60" step="2"
            value={Math.round((choisiC.courbure===undefined?0.18:choisiC.courbure)*100)}
            onChange={e=>majCable(choisiC.id,{courbure:+e.target.value/100})}/>
        </Fld>
        <div className="xs mut" style={{marginTop:-6,marginBottom:12,lineHeight:1.5}}>
          Bombez le tracé pour qu’il contourne les murs et ne se confonde pas avec un autre câble.</div>
        <Fld label="COULEUR DU TRACÉ">
          <div className="row" style={{gap:6,flexWrap:'wrap'}}>
            {ELEC_CABLE_COULEURS.map(([v,l])=>{const actif=(choisiC.couleur||'')===v;
              return <button key={l} onClick={()=>majCable(choisiC.id,{couleur:v})} title={l}
                style={{display:'flex',alignItems:'center',gap:6,padding:'4px 9px',borderRadius:6,cursor:'pointer',
                  border:'1px solid '+(actif?(v||ELEC_BLEU):RULE),background:actif?(v||ELEC_BLEU)+'14':'#fff'}}>
                <span style={{width:14,height:3,borderRadius:2,background:v||ELEC_BLEU,flex:'0 0 auto'}}/>
                <span className="xs" style={{color:actif?(v||ELEC_BLEU):INK}}>{l}</span>
              </button>})}
          </div>
        </Fld>
        <div className="row" style={{gap:6,marginTop:-4}}>
          <button className={'btn s '+(choisiC.pointille?'gh':'')} onClick={()=>majCable(choisiC.id,{pointille:false})}>Trait plein</button>
          <button className={'btn s '+(choisiC.pointille?'':'gh')} onClick={()=>majCable(choisiC.id,{pointille:true})}>Pointillé</button>
        </div>
      </div>}

      <div style={{marginTop:14}}>
        <div className="sp" style={{marginBottom:6}}>
          <span className="h2" style={{fontSize:13}}>LÉGENDE</span>
          <span className="xs mut">{S.length} symbole{S.length>1?'s':''} posé{S.length>1?'s':''}
            {C.length?' · '+C.length+' câble'+(C.length>1?'s':''):''}</span>
        </div>
        {!legende.length&&<Empty>Aucun symbole posé. Choisissez-en un ci-dessus, puis cliquez sur le plan.</Empty>}
        {!!legende.length&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:'4px 10px'}}>
          {legende.map(s=><div key={s.id} className="row" style={{gap:6,alignItems:'center'}}>
            <svg width="20" height="20" viewBox="-12 -12 24 24" style={{flex:'0 0 auto'}}><ElecGlyph t={s.id}/></svg>
            <span className="xs" style={{flex:1,minWidth:0}}>{s.l}</span>
            <span className="xs mut" style={{whiteSpace:'nowrap'}}>H : {s.h} · ×{s.n}</span>
          </div>)}
        </div>}
      </div>

      <div className="row" style={{gap:8,marginTop:14,flexWrap:'wrap'}}>
        <button className="btn acc s" disabled={!!busy||!!busyPdf} onClick={exporter}>
          {busyPdf||'Enregistrer le plan en PDF'}</button>
        <label className="btn gh s" style={{display:'inline-block'}}>
          {busy||'Remplacer le plan de fond'}
          <input type="file" accept="application/pdf,.pdf,image/*" style={{display:'none'}} disabled={!!busy||!!busyPdf}
            onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importer(f)}}/>
        </label>
        {!!(S.length||C.length)&&<button className="btn dg s"
          onClick={()=>{if(confirm('Retirer les '+S.length+' symboles et les '+C.length+' câbles posés ? Le plan de fond est conservé.')){
            maj({symboles:[],cables:[]});setSel(null);setSelC(null);setDepart(null)}}}>
          Tout effacer</button>}
      </div>
      <div className="xs mut" style={{marginTop:6,lineHeight:1.5}}>
        Le PDF reprend le plan, les câbles, les symboles et la légende — prêt à envoyer à l’électricien.</div>
      {/* la planche à convertir : hors écran, mais bien rendue par React */}
      {aExporter&&<div ref={exportRef} aria-hidden="true"
        style={{position:'fixed',left:-10000,top:0,width:1000,pointerEvents:'none'}}>
        <PlanExport fond={aExporter.fond} ratio={plan.ratio} symboles={S} cables={C}
          titre={'PLAN ÉLECTRIQUE — '+(ch.nom||'').toUpperCase()} hauteurs={hauteurs} echelle={ech}/>
      </div>}
    </React.Fragment>}
  </div>;
}

/* ---------------- PIÈCES ---------------- */
function Docs({data,ch,up,save}){
  const d=ch.docs||{};
  const [busy,setBusy]=useState(null);
  const [signe,setSigne]=useState(null);
  const [planElec,setPlanElec]=useState(false);
  const [partage,setPartage]=useState(null);
  /* ouvrir le plan à qui n'a pas de compte Google : sans quoi le QR du marché
     bute sur une demande de connexion, et l'artisan reste devant la porte */
  const ouvrirATous=async id=>{
    const c=d[id]||{};
    const f=fichiersDe(c)[0];
    const fid=driveIdDepuisLien(f&&f.lien);
    if(!fid){alert("Aucun fichier Drive sur cette pièce : importez le plan d’exécution ici, puis réessayez.");return}
    if(!confirm("Rendre « "+(f.nom||'ce plan')+" » lisible par toute personne disposant du lien, sans compte Google ?\n\n"
      +"Le QR code du marché mènera alors directement au PDF. Toute personne qui possède le lien — ou le marché imprimé — pourra l’ouvrir."))return;
    setPartage(id);
    try{
      await drivePartagePublic(fid);
      up({docs:{...d,[id]:{...c,lienPublic:lienPdfDirect(fid)}}});
    }catch(e){alert("Le partage n’a pas pu être effectué — détail technique : "+((e&&(e.error||e.message))||String(e)))}
    setPartage(null);
  };
  const tog=id=>{const c=d[id]||{};up({docs:{...d,[id]:{...c,fait:!c.fait,date:!c.fait?today():''}}})};
  const lien=(id,v)=>up({docs:{...d,[id]:{...(d[id]||{}),lien:v}}});
  const importPieces=async(id,files)=>{
    setBusy(id);
    let ajoutes=[], erreur='';
    try{
      const token=await getDriveToken();
      const folderId=await driveSousDossier(token,ch.id,ch.nom,'Pièces');
      for(const file of files){
        try{
          const{webViewLink}=await uploadToDrive(file,folderId);
          ajoutes.push({id:uid(),nom:file.name,lien:webViewLink});
        }catch(x){erreur=(x&&(x.error||x.message))||String(x)}
      }
    }catch(e){erreur=e&&e.error==='auth_required'?'auth_required':((e&&(e.error||e.message))||String(e))}
    if(ajoutes.length){
      const c=d[id]||{};
      up({docs:{...d,[id]:{...c,fichiers:[...fichiersDe(c),...ajoutes],fait:true,date:c.fait?c.date:today()}}});
    }
    if(erreur==='auth_required')alert("Connectez d'abord Google Drive (bouton ci-dessus), puis réessayez l'import.");
    else if(erreur)alert((ajoutes.length?ajoutes.length+" fichier(s) importé(s), mais l'envoi s'est interrompu — ":"Import Google Drive impossible — ")+"détail technique : "+erreur);
    setBusy(null);
  };
  const retirerFichier=(id,fid)=>{
    const c=d[id]||{};
    up({docs:{...d,[id]:{...c,fichiers:fichiersDe(c).filter(f=>f.id!==fid),lien:''}}});
  };
  const enregistrerSignature=async(doc,{nom,qualite,image})=>{
    const sid=uid(), date=new Date().toISOString();
    await Photo.put(sid,image);
    const empreinte=await empreinteSignature([ch.nom,doc.l,nom,qualite,date]);
    try{
      const blob=await (await fetch(image)).blob();
      const fichier=new File([blob],'signature-'+doc.id+'-'+date.slice(0,10)+'.jpg',{type:'image/jpeg'});
      const token=await getDriveToken();
      const folderId=await driveSignaturesFolder(token,ch.id,ch.nom);
      await uploadToDrive(fichier,folderId);
    }catch(e){/* la signature reste enregistrée dans l'app même sans Drive */}
    const c=d[doc.id]||{};
    up({docs:{...d,[doc.id]:{...c,signatures:[...(c.signatures||[]),{id:sid,nom,qualite,date,empreinte}]}}});
    setSigne(null);
  };
  const retirerSignature=async(docId,sid)=>{
    if(!confirm('Retirer définitivement cette signature ?'))return;
    await Photo.del(sid).catch(()=>{});
    const c=d[docId]||{};
    up({docs:{...d,[docId]:{...c,signatures:(c.signatures||[]).filter(s=>s.id!==sid)}}});
  };
  const n=DOCS.filter(x=>d[x.id]&&d[x.id].fait).length;
  if(planElec)return <PlanElectrique ch={ch} up={up} onFermer={()=>setPlanElec(false)}/>;
  return <div>
    <DriveStatus/>
    <div className="sp xs" style={{marginTop:0,marginBottom:10}}>
      <span className="mut">{n} pièce{n>1?'s':''} sur {DOCS.length} — rangées dans Drive › {ch.nom} › Pièces</span>
      <BoutonDossierDrive ch={ch} sous="Pièces"/>
    </div>
    {DOCS_GROUPES.map(g=>{
      const nG=g.items.filter(x=>d[x.id]&&d[x.id].fait).length;
      return <div key={g.titre} style={{marginBottom:16}}>
        <div className="sp" style={{marginBottom:6}}>
          <span className="h2" style={{fontSize:13}}>{g.titre.toUpperCase()}</span>
          <span className="xs mut">{nG}/{g.items.length}</span>
        </div>
        {g.items.map(x=>{const r=d[x.id]||{}, sgs=r.signatures||[];return <div key={x.id} className="card" style={{padding:10,marginBottom:6}}>
          <div className="row" style={{gap:10,alignItems:'flex-start'}}>
            <button className="chk" onClick={()=>tog(x.id)} style={{background:r.fait?GREEN:'#fff',borderColor:r.fait?GREEN:RULE}}>{r.fait?'✓':''}</button>
            <div style={{flex:1}}>
              <div className="sm">{x.l}</div>
              {r.fait&&<div className="xs mut">Reçu le {fd(r.date)}</div>}
              {fichiersDe(r).map(f=><div key={f.id} className="row xs" style={{gap:8,marginTop:4,alignItems:'center'}}>
                <Transmis/>
                <a href={f.lien} target="_blank" rel="noreferrer" style={{color:TERRA,flex:1,wordBreak:'break-word'}}>{f.nom}</a>
                <button style={{color:MUTED,background:'none',border:'none',padding:0}} onClick={()=>{if(confirm('Retirer « '+f.nom+' » de cette pièce ? Le fichier reste sur le Drive.'))retirerFichier(x.id,f.id)}}>✕</button>
              </div>)}
              {!fichiersDe(r).length&&<input className="in" style={{border:'none',borderBottom:'1px solid '+RULE,padding:'4px 0',marginTop:4,fontSize:13}} placeholder="Lien Drive…" value={r.lien||''} onChange={e=>lien(x.id,e.target.value)}/>}
              <div className="row" style={{gap:14,marginTop:6,alignItems:'center',flexWrap:'wrap'}}>
                <label className="xs" style={{color:NAVY}}>{busy===x.id?'Import…':(fichiersDe(r).length?'Ajouter des fichiers':'Importer des fichiers')}
                  <input type="file" accept={PIECES_ACCEPT} multiple style={{display:'none'}} disabled={busy===x.id}
                    onChange={e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)importPieces(x.id,fs)}}/>
                </label>
                <button className="xs" style={{color:NAVY,background:'none',border:'none',padding:0}} onClick={()=>setSigne(x)}>Faire signer</button>
                {x.id==='plan_elec'&&<button className="xs b" style={{color:TERRA,background:'none',border:'none',padding:0}}
                  onClick={()=>setPlanElec(true)}>
                  {(r.plan&&r.plan.fond)?'Ouvrir le plan ('+((r.plan.symboles||[]).length)+' symboles)':'Dessiner le plan'}</button>}
                {x.id==='plans_exe'&&!!fichiersDe(r).length&&(r.lienPublic
                  ?<span className="xs" style={{color:GREEN}}>✓ Lisible sans compte Google — le QR du marché y mène</span>
                  :<button className="xs b" style={{color:TERRA,background:'none',border:'none',padding:0}}
                     disabled={partage===x.id} onClick={()=>ouvrirATous(x.id)}>
                     {partage===x.id?'Partage…':'Rendre lisible sans compte Google'}</button>)}
              </div>
              {x.id==='plans_exe'&&!!fichiersDe(r).length&&!r.lienPublic&&
                <div className="xs mut" style={{marginTop:4,lineHeight:1.5}}>
                  Tant que le plan n’est pas ouvert à tous, le marché ne porte pas son QR code : un lien Drive
                  ordinaire renverrait l’artisan vers une demande de connexion.</div>}
              {sgs.map(s=><div key={s.id} className="row" style={{gap:10,marginTop:8,paddingTop:8,borderTop:'1px solid '+RULE,alignItems:'center'}}>
                <VignetteSign id={s.id}/>
                <div style={{flex:1}}>
                  <div className="xs b">{s.nom} <span className="mut">— {s.qualite}</span></div>
                  <div className="xs mut">Signé le {dateHeure(s.date)}</div>
                  {s.empreinte&&<div className="xs mut" style={{fontSize:10}}>Empreinte {s.empreinte}</div>}
                </div>
                <button className="btn dg s" onClick={()=>retirerSignature(x.id,s.id)}>✕</button>
              </div>)}
            </div>
          </div></div>})}
      </div>;
    })}
    {signe&&<SignaturePad titre={signe.l+' — '+ch.nom} onAnnuler={()=>setSigne(null)} onSigner={v=>enregistrerSignature(signe,v)}/>}
  </div>;
}
