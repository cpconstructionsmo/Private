/* ---------- vignettes : stockage cloud partagé (Supabase Storage) ---------- */
const Photo={
  async put(id,dataUrl){
    const blob=await (await fetch(dataUrl)).blob();
    const{error}=await sb.storage.from('photos').upload(id+'.jpg',blob,{contentType:'image/jpeg',upsert:true});
    if(error)throw error;
  },
  async get(id){
    const{data,error}=await sb.storage.from('photos').createSignedUrl(id+'.jpg',3600);
    return error?null:data.signedUrl;
  },
  async del(id){await sb.storage.from('photos').remove([id+'.jpg']);},
};

/* ---------- documents PDF & photos originales : envoyés vers le Google Drive de l'utilisateur ---------- */
/* Connexion par redirection de page (pas de pop-up) : plus fiable sur iOS, y compris en app installée. */
let driveFolderId=null;
const driveSubfolders=new Map();
const GOOGLE_REDIRECT_URI=location.origin+location.pathname;

function consumeDriveTokenFromUrl(){
  if(location.hash.indexOf('access_token=')===-1)return;
  const params=new URLSearchParams(location.hash.slice(1));
  const token=params.get('access_token');
  const expiresIn=+(params.get('expires_in')||3600);
  if(token){
    sessionStorage.setItem('driveToken',token);
    sessionStorage.setItem('driveTokenExpiry',String(Date.now()+(expiresIn-60)*1000));
  }
  history.replaceState(null,'',location.pathname+location.search);
}
consumeDriveTokenFromUrl();

const driveConnected=()=>!!sessionStorage.getItem('driveToken')&&Date.now()<+(sessionStorage.getItem('driveTokenExpiry')||0);

function startDriveAuth(){
  const params=new URLSearchParams({
    client_id:GOOGLE_CLIENT_ID,
    redirect_uri:GOOGLE_REDIRECT_URI,
    response_type:'token',
    scope:'https://www.googleapis.com/auth/drive.file',
    include_granted_scopes:'true',
    prompt:'consent',
  });
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
}

function disconnectDrive(){
  sessionStorage.removeItem('driveToken');
  sessionStorage.removeItem('driveTokenExpiry');
}

async function getDriveToken(){
  if(driveConnected())return sessionStorage.getItem('driveToken');
  throw{error:'auth_required'};
}

async function driveFolder(token){
  if(driveFolderId)return driveFolderId;
  const q=encodeURIComponent("name='CP Constructions' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(j.files&&j.files.length){driveFolderId=j.files[0].id;return driveFolderId}
  const c=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name:'CP Constructions',mimeType:'application/vnd.google-apps.folder'}),
  });
  driveFolderId=(await c.json()).id;
  return driveFolderId;
}

async function driveFindOrCreateSubfolder(token,parentId,name){
  const safeName=name.replace(/'/g,"\\'");
  const q=encodeURIComponent(`name='${safeName}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parentId}' in parents`);
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(j.files&&j.files.length)return j.files[0].id;
  const c=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]}),
  });
  return(await c.json()).id;
}

async function driveChantierFolder(token,chantierId,chantierNom){
  if(driveSubfolders.has(chantierId))return driveSubfolders.get(chantierId);
  const rootId=await driveFolder(token);
  const id=await driveFindOrCreateSubfolder(token,rootId,chantierNom);
  driveSubfolders.set(chantierId,id);
  return id;
}

const driveFacturesFolders=new Map();
async function driveFacturesFolder(token,chantierId,chantierNom){
  if(driveFacturesFolders.has(chantierId))return driveFacturesFolders.get(chantierId);
  const parentId=await driveChantierFolder(token,chantierId,chantierNom);
  const id=await driveFindOrCreateSubfolder(token,parentId,'Factures');

async function uploadToDrive(file,folderId){
  const token=await getDriveToken();
  const parent=folderId||await driveFolder(token);
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify({name:file.name,parents:[parent]})],{type:'application/json'}));
  form.append('file',file);
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{
    method:'POST',headers:{Authorization:'Bearer '+token},body:form,
  });
  if(!r.ok)throw new Error('upload Drive échoué');
  return r.json();
}

function compress(file,max=900,q=.6){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*r); cv.height=Math.round(im.height*r);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function load(){try{const r=localStorage.getItem(KEY);return r?{...EMPTY,...JSON.parse(r)}:EMPTY}catch(e){return EMPTY}}

function Root(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined)return <div className="sm mut" style={{padding:40,textAlign:'center'}}>Chargement…</div>;
  if(!session)return <Login/>;
  return <App session={session}/>;
}

function Login(){
  const [email,setEmail]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
  const go=async e=>{
    e.preventDefault();
    setBusy(true);setErr('');
    const{error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error)setErr('Identifiants incorrects.');
    setBusy(false);
  };
  return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
    <form onSubmit={go} style={{width:'100%',maxWidth:340}}>
      <div className="b" style={{color:NAVY,fontSize:18,marginBottom:2}}>CP CONSTRUCTIONS</div>
      <div className="xs mut" style={{marginBottom:20}}>Suivi de chantiers</div>

      <Fld label="MOT DE PASSE"><input className="in" type="password" autoComplete="current-password" value={pw} onChange={e=>setPw(e.target.value)}/></Fld>
      {err&&<div className="xs" style={{color:TERRA,marginBottom:12}}>{err}</div>}
      <button className="btn acc" style={{width:'100%'}} disabled={busy}>{busy?'Connexion…':'Se connecter'}</button>

}

function App({session}){
  const [data,setData]=useState(load);
  const [view,setView]=useState('chantiers');
  const [open,setOpen]=useState(null);
  const [err,setErr]=useState(null);

  useEffect(()=>{
    let alive=true;
    sb.from('app_data').select('data').eq('id','main').single().then(({data:row})=>{
      if(alive&&row&&row.data)setData({...EMPTY,...row.data});
    });
    const channel=sb.channel('app_data_changes')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_data',filter:'id=eq.main'},payload=>{
        if(payload.new&&payload.new.data)setData({...EMPTY,...payload.new.data});
      })
      .subscribe();
    return ()=>{alive=false;sb.removeChannel(channel)};
  },[]);

  const save=async next=>{
    setData(next);
    try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){/* cache local best-effort */}
    const{error}=await sb.from('app_data').upsert({id:'main',data:next,updated_at:new Date().toISOString()});
    setErr(error?"Synchronisation impossible — vérifiez votre connexion. Vos modifications restent enregistrées sur cet appareil.":null);
  };
  const ch=open?data.chantiers.find(c=>c.id===open):null;
  return <div>
    <header style={{background:NAVY,padding:'10px 16px',paddingTop:'calc(10px + env(safe-area-inset-top))'}}>
      <img src="assets/logo.png" alt="CP Constructions — Maîtrise d'œuvre" style={{height:38,display:'block'}}/>
    </header>
    {err&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:'8px 16px'}}>{err}</div>}
    <main style={{padding:16}}>
      {ch?<Fiche data={data} ch={ch} save={save} back={()=>setOpen(null)}/>
      :view==='chantiers'?<Chantiers data={data} save={save} open={setOpen}/>
      :view==='artisans'?<Artisans data={data} save={save}/>
      :view==='cmd'?<CommandesGlob data={data} open={setOpen}/>
      :view==='bilan'?<Bilan data={data} open={setOpen}/>
      :<Donnees data={data} save={save} session={session}/>}
    </main>
    {!ch&&<nav className="bot">
      {[['chantiers','CHANTIERS'],['artisans','ARTISANS'],['cmd','COMMANDES'],['bilan','FINANCES'],['donnees','DONNÉES']].map(([id,l])=>
        <button key={id} className={view===id?'on':''} onClick={()=>setView(id)}>{l}</button>)}
    </nav>}
  </div>;
}

          <th style={{padding:'6px 4px',textAlign:'right'}}>Reste à facturer</th>
          <th style={{padding:'6px 4px',textAlign:'right'}}>Factures</th>
        </tr></thead>
        <tbody>
          {ms.map(m=>{

              <td style={{padding:'8px 4px'}}>

              <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap',color:reste<0?TERRA:INK}}>{reste<=0?'soldé':eur(reste)}</td>
              <td style={{padding:'8px 4px',textAlign:'right',whiteSpace:'nowrap'}}>{(m.factures||[]).length||'—'}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>}
  </div>;
}

function ImportMarches({data,ch,save,close}){
  const[txt,setTxt]=useState('');
  const[msg,setMsg]=useState('');
  const go=()=>{
    const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
    let artisans=[...data.artisans], marches=[...data.marches], n=0;
    for(const line of lines){
      const parts=line.split('|').map(p=>p.trim());
      if(parts.length<3)continue;
      const[lot,artisanNom,montantStr,dateStr]=parts;
      let art=artisanNom?artisans.find(a=>a.nom.toLowerCase()===artisanNom.toLowerCase()):null;
      if(artisanNom&&!art){
        art={id:uid(),nom:artisanNom,corps:lot,tel:'',email:'',assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''};
        artisans=[...artisans,art];
      }
      let dateSignature='';
      if(dateStr){
        const[j,mo,a]=dateStr.split('/');
        if(j&&mo&&a)dateSignature=a+'-'+mo.padStart(2,'0')+'-'+j.padStart(2,'0');
      }
      marches=[...marches,{id:uid(),chantierId:ch.id,lot,artisanId:art?art.id:'',montantHT:+String(montantStr).replace(',','.')||0,facture:0,factures:[],statut:'signe',dateSignature,notes:''}];
      n++;
    }
    save({...data,artisans,marches});
    setMsg(n+' marché(s) importé(s).');
    setTxt('');
  };
  return <div className="card">
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Un marché par ligne, séparé par des <code>|</code> :<br/><code>Corps d'état | Artisan | Montant HT | JJ/MM/AAAA</code></p>
    <textarea className="in" rows="6" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Terrassement | SARL AMÉDÉE | 1664,36 | 25/05/2026"/>
    <div className="row" style={{gap:8,marginTop:10}}>
      <button className="btn" onClick={go}>Importer</button>
      <button className="btn gh" onClick={close}>Fermer</button>
    </div>
    {msg&&<div className="xs" style={{marginTop:8,color:TERRA}}>{msg}</div>}
  </div>;
}

/* ---------------- PHOTOS ---------------- */
function Photos({data,ch,save}){
  const list=data.photos.filter(p=>p.chantierId===ch.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const [busy,setBusy]=useState(false);
  const [driveIssue,setDriveIssue]=useState(false);
  const [zoom,setZoom]=useState(null);
  const [edit,setEdit]=useState(null);
  const [driveDetail,setDriveDetail]=useState('');

  const add=async e=>{
    const files=[...e.target.files]; e.target.value='';
    if(!files.length)return;
    setBusy(true);
    setDriveIssue(false);
    const nouveaux=[];
    let driveFailed=false, lastDetail='';
    for(const file of files){
      try{
        const d=await compress(file);
        const id=uid();
        await Photo.put(id,d);
        let lien='';
        try{
          const token=await getDriveToken();
          const folderId=await driveChantierFolder(token,ch.id,ch.nom);
          lien=(await uploadToDrive(file,folderId)).webViewLink;
        }catch(x){driveFailed=true;lastDetail=x&&x.error==='auth_required'?'auth_required':((x&&(x.error||x.message))||String(x))}
        nouveaux.push({id,chantierId:ch.id,date:today(),legende:'',lot:'',lien});
      }catch(x){/* photo ignorée */}
    }
    if(nouveaux.length)save({...data,photos:[...data.photos,...nouveaux]});
    setDriveIssue(driveFailed);
    setDriveDetail(lastDetail);
    setBusy(false);
  };
  const del=async id=>{await Photo.del(id).catch(()=>{});save({...data,photos:data.photos.filter(p=>p.id!==id)})};
  const upd=p=>save({...data,photos:data.photos.map(x=>x.id===p.id?p:x)});

  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{list.length} photo{list.length>1?'s':''}</span>
      <label className="btn acc s">{busy?'Traitement…':'+ Photos'}
        <input type="file" accept="image/*" multiple onChange={add} style={{display:'none'}}/></label>
    </div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Une version réduite s'affiche dans l'app ; l'original en pleine qualité est envoyé automatiquement sur votre Google Drive (dossier « CP Constructions › {ch.nom} »).</p>
    {driveIssue&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {driveDetail==='auth_required'
        ?"Photo(s) enregistrée(s) dans l'app, mais Google Drive n'est pas connecté (bouton ci-dessus)."
        :"Photo(s) enregistrée(s) dans l'app, mais l'envoi de l'original vers Google Drive a échoué — détail technique : "+(driveDetail||'inconnu')+"."}
    </div>}
    {!list.length&&<Empty>Aucune photo. Prenez le chantier en photo à chaque visite.</Empty>}
    <div className="grid-ph">
      {list.map(p=><Vignette key={p.id} p={p} onZoom={()=>setZoom(p)} onEdit={()=>setEdit(p)}/>)}
    </div>
    {edit&&<div className="card" style={{marginTop:12}}>
      <Fld label="DATE"><input className="in" type="date" value={edit.date} onChange={e=>setEdit({...edit,date:e.target.value})}/></Fld>
      <Fld label="LÉGENDE"><input className="in" placeholder="Coulage dalle — angle nord" value={edit.legende} onChange={e=>setEdit({...edit,legende:e.target.value})}/></Fld>
      <Fld label="LOT CONCERNÉ"><select className="in" value={edit.lot} onChange={e=>setEdit({...edit,lot:e.target.value})}><option value="">— aucun —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      <Fld label="LIEN VERS L'ORIGINAL">
        <input className="in" placeholder="Lien Drive…" value={edit.lien} onChange={e=>setEdit({...edit,lien:e.target.value})}/>
        {edit.lien&&<a href={edit.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA,display:'inline-block',marginTop:6}}>Ouvrir sur Drive</a>}
      </Fld>
      <Acts onSave={()=>{upd(edit);setEdit(null)}} onCancel={()=>setEdit(null)} onDel={()=>{del(edit.id);setEdit(null)}}/>
    </div>}
    {zoom&&<Plein p={zoom} close={()=>setZoom(null)}/>}
  </div>;
}

function Vignette({p,onZoom,onEdit}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{let a=true;Photo.get(p.id).then(v=>{if(a)setSrc(v)}).catch(()=>{});return()=>{a=false}},[p.id]);
  return <div style={{border:'1px solid '+RULE,background:'#fff'}}>
    <div onClick={onZoom}>{src?<img className="ph" src={src} alt=""/>:<div className="ph"/>}</div>
    <div onClick={onEdit} style={{padding:'6px 7px'}}>
      <div className="xs mut">{fd(p.date)}</div>
      <div className="xs" style={{lineHeight:1.3}}>{p.legende||<span className="mut">Ajouter une légende</span>}</div>
      {p.lot&&<div className="xs" style={{color:NAVY,marginTop:2}}>{p.lot}</div>}
    </div>
  </div>;
}

function Plein({p,close}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{Photo.get(p.id).then(setSrc).catch(()=>{})},[p.id]);
  return <div className="modal" onClick={close}>
    <button className="xs" style={{color:'#fff',background:'none',border:'none',alignSelf:'flex-end',padding:8}}>Fermer</button>
    {src&&<img src={src} style={{maxWidth:'100%',maxHeight:'75vh',objectFit:'contain',margin:'auto'}} alt=""/>}
    <div className="xs" style={{color:'#D8D3CB',textAlign:'center',paddingTop:12}}>{fd(p.date)} — {p.legende||'sans légende'}</div>
  </div>;
}

        <Fld label="MONTANT HT (€)"><input className="in" type="number" value={f.montant} onChange={e=>setF({...f,montant:e.target.value})}/></Fld>

      <div className="g2">

        <Fld label="LIVRAISON PRÉVUE"><input className="in" type="date" value={f.livrPrevue} onChange={e=>setF({...f,livrPrevue:e.target.value})}/></Fld>

    </div>}
    {!list.length&&!f&&<Empty>Aucune commande. Suivez ici les matériaux à approvisionner.</Empty>}
    {list.map(c=><LigneCmd key={c.id} c={c} onClick={()=>setF(c)}/>)}

function LigneCmd({c,onClick,chantierNom}){
  const s=CMD_ST.find(x=>x.id===c.statut)||CMD_ST[0];
  const retard=c.livrPrevue&&!c.livrReelle&&c.livrPrevue<today()&&c.statut!=='livre';
  return <button className="card" style={{borderLeft:'3px solid '+(retard?TERRA:s.c)}} onClick={onClick}>
    <div className="sp"><span className="b sm">{c.designation}</span><span className="xs b" style={{color:retard?TERRA:s.c}}>{retard?'EN RETARD':s.label}</span></div>
    <div className="xs mut" style={{marginTop:3}}>{chantierNom?chantierNom+' · ':''}{c.fournisseur||'fournisseur non précisé'}{c.lot?' · '+c.lot:''}</div>
    <div className="sp xs" style={{marginTop:8}}>
      <span>{eur(c.montant)} HT</span>
      <span className="mut">{c.livrReelle?'livré le '+fd(c.livrReelle):c.livrPrevue?'prévu le '+fd(c.livrPrevue):'sans date'}</span>
    </div>

}

function CommandesGlob({data,open}){
  const [filtre,setFiltre]=useState('actives');
  const nom=id=>{const c=data.chantiers.find(x=>x.id===id);return c?c.nom:'—'};
  let L=[...data.commandes];
  if(filtre==='actives')L=L.filter(c=>c.statut!=='livre');
  if(filtre==='retard')L=L.filter(c=>c.livrPrevue&&!c.livrReelle&&c.livrPrevue<today()&&c.statut!=='livre');
  L.sort((a,b)=>(a.livrPrevue||'9999').localeCompare(b.livrPrevue||'9999'));
  const nR=data.commandes.filter(c=>c.livrPrevue&&!c.livrReelle&&c.livrPrevue<today()&&c.statut!=='livre').length;
  return <div>
    <H2>COMMANDES MATÉRIAUX</H2>

      {nR} livraison{nR>1?'s':''} en retard sur la date annoncée.</div>}
    <div className="row" style={{gap:8,marginBottom:12}}>
      {[['actives','En cours'],['retard','En retard'],['toutes','Toutes']].map(([id,l])=>
        <button key={id} className={'btn s '+(filtre===id?'':'gh')} onClick={()=>setFiltre(id)}>{l}</button>)}
    </div>
    {!L.length&&<Empty>Rien à afficher dans cette vue.</Empty>}
    {L.map(c=><LigneCmd key={c.id} c={c} chantierNom={nom(c.chantierId)} onClick={()=>open(c.chantierId)}/>)}
  </div>;
}

/* ---------------- PLANNING ---------------- */
function Planning({data,ch,up}){
  const js=ch.jalons||[];
  const [f,setF]=useState(null);
  const livr=data.commandes.filter(c=>c.chantierId===ch.id&&(c.livrPrevue||c.livrReelle))
    .map(c=>({type:'livr',id:c.id,label:'Livraison — '+c.designation,prevue:c.livrPrevue,reelle:c.livrReelle}));
  const items=[...js.map(j=>({...j,type:'jalon'})),...livr]
    .sort((a,b)=>((a.reelle||a.prevue)||'9999').localeCompare((b.reelle||b.prevue)||'9999'));
  const ok=()=>{
    if(!f.label)return;
    const n=f.id?js.map(j=>j.id===f.id?f:j):[...js,{...f,id:uid()}];
    up({jalons:n});setF(null);
  };
  return <div>
    <div className="sp" style={{marginBottom:12}}>
      <span className="xs mut">{js.length} jalon{js.length>1?'s':''} · {livr.length} livraison{livr.length>1?'s':''}</span>
      <div className="row" style={{gap:8}}>
        {!js.length&&<button className="btn gh s" onClick={()=>up({jalons:JALONS.map(l=>({id:uid(),label:l,prevue:'',reelle:''}))})}>Trame standard</button>}
        <button className="btn acc s" onClick={()=>setF({label:'',prevue:'',reelle:''})}>+ Jalon</button>
      </div>
    </div>
    {f&&<div className="card">
      <Fld label="ÉTAPE"><input className="in" list="jl" value={f.label} onChange={e=>setF({...f,label:e.target.value})}/>
        <datalist id="jl">{JALONS.map(j=><option key={j} value={j}/>)}</datalist></Fld>
      <div className="g2">
        <Fld label="DATE PRÉVUE"><input className="in" type="date" value={f.prevue} onChange={e=>setF({...f,prevue:e.target.value})}/></Fld>
        <Fld label="DATE RÉELLE"><input className="in" type="date" value={f.reelle} onChange={e=>setF({...f,reelle:e.target.value})}/></Fld>
      </div>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={f.id?()=>{up({jalons:js.filter(j=>j.id!==f.id)});setF(null)}:null}/>
    </div>}
    {!items.length&&!f&&<Empty>Aucune étape. « Trame standard » crée les 12 jalons d'une maison neuve.</Empty>}
    {items.map(i=>{
      const done=!!i.reelle, late=i.prevue&&!i.reelle&&i.prevue<today();
      const liv=i.type==='livr';
      return <div key={i.type+i.id} className="card sp" style={{borderLeft:'3px solid '+(done?GREEN:late?TERRA:RULE),padding:10,opacity:liv?.85:1}}
        onClick={()=>{if(!liv)setF(js.find(j=>j.id===i.id))}}>
        <span className="sm" style={{color:done?MUTED:INK,textDecoration:done?'line-through':'none'}}>
          {liv&&<span className="xs" style={{color:NAVY,marginRight:6}}>▸</span>}{i.label}</span>
        <span className="xs" style={{color:late?TERRA:MUTED,textAlign:'right',minWidth:74}}>
          {done?fd(i.reelle):late?'retard '+fd(i.prevue):fd(i.prevue)}</span>
      </div>;
    })}
  </div>;
}

/* ---------------- PIÈCES ---------------- */
function Docs({ch,up}){
  const d=ch.docs||{};
  const [busy,setBusy]=useState(null);
  const tog=id=>{const c=d[id]||{};up({docs:{...d,[id]:{...c,fait:!c.fait,date:!c.fait?today():''}}})};
  const lien=(id,v)=>up({docs:{...d,[id]:{...(d[id]||{}),lien:v}}});
  const importPdf=async(id,file)=>{
    setBusy(id);
    try{
      const{webViewLink}=await uploadToDrive(file);
      const c=d[id]||{};
      up({docs:{...d,[id]:{...c,lien:webViewLink,fait:true,date:c.fait?c.date:today()}}});
    }catch(e){
      if(e&&e.error==='auth_required')alert("Connectez d'abord Google Drive (bouton ci-dessus), puis réessayez l'import.");
      else alert("Import Google Drive impossible — détail technique : "+((e&&(e.error||e.message))||String(e)));
    }
    setBusy(null);
  };
  const n=DOCS.filter(x=>d[x.id]&&d[x.id].fait).length;
  return <div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0}}>{n} pièce{n>1?'s':''} sur {DOCS.length}. Importez le PDF (envoyé sur votre Google Drive, dossier « CP Constructions ») ou collez un lien existant.</p>
    {DOCS.map(x=>{const r=d[x.id]||{};return <div key={x.id} className="card" style={{padding:10}}>
      <div className="row" style={{gap:10,alignItems:'flex-start'}}>
        <button className="chk" onClick={()=>tog(x.id)} style={{background:r.fait?GREEN:'#fff',borderColor:r.fait?GREEN:RULE}}>{r.fait?'✓':''}</button>
        <div style={{flex:1}}>
          <div className="sm">{x.l}</div>
          {r.fait&&<div className="xs mut">Reçu le {fd(r.date)}</div>}
          <input className="in" style={{border:'none',borderBottom:'1px solid '+RULE,padding:'4px 0',marginTop:4,fontSize:13}} placeholder="Lien Drive…" value={r.lien||''} onChange={e=>lien(x.id,e.target.value)}/>
          <div className="row" style={{gap:14,marginTop:6,alignItems:'center'}}>
            {r.lien&&<a href={r.lien} target="_blank" rel="noreferrer" className="xs" style={{color:TERRA}}>Ouvrir</a>}
            <label className="xs" style={{color:NAVY}}>{busy===x.id?'Import…':'Importer un PDF'}
              <input type="file" accept="application/pdf" style={{display:'none'}} disabled={busy===x.id} onChange={e=>{const f=e.target.files[0];e.target.value='';if(f)importPdf(x.id,f)}}/>
            </label>
          </div>
        </div>
      </div></div>})}
  </div>;
}

/* ---------------- CONTRÔLE CHANTIER ---------------- */
function ThumbCtrl({id,onZoom,onDel}){
  const [src,setSrc]=useState(null);
  useEffect(()=>{let a=true;Photo.get(id).then(v=>{if(a)setSrc(v)}).catch(()=>{});return()=>{a=false}},[id]);
  return <div style={{position:'relative',width:66,height:52,border:'1px solid '+RULE,background:'#EFECE6',flex:'0 0 auto'}}>
    {src&&<img src={src} onClick={onZoom} alt="" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>}
    <button onClick={onDel} title="Retirer la photo" style={{position:'absolute',top:-1,right:-1,width:18,height:18,lineHeight:'16px',padding:0,fontSize:11,border:'none',background:TERRA,color:'#fff'}}>✕</button>
  </div>;
}

function Controles({data,ch,save}){
  const c=ch.controles||{};
  const [ouvert,setOuvert]=useState({});
  const [busy,setBusy]=useState(null);
  const [filtre,setFiltre]=useState('tous');
  const [zoom,setZoom]=useState(null);

  const upCtrl=next=>save({...data,chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
  const setPt=(key,patch)=>{
    const cur=c[key]||{};
    upCtrl({...c,[key]:{...cur,...patch,date:patch.date!==undefined?patch.date:(cur.date||today())}});
  };
  const addPhotos=async(key,corpsL,ptL,files)=>{
    setBusy(key);
    const nouveaux=[];
    for(const file of files){
      try{
        const d=await compress(file);
        const pid=uid();
        await Photo.put(pid,d);
        let lien='';
        try{
          const token=await getDriveToken();
          const folderId=await driveControlesFolder(token,ch.id,ch.nom);
          lien=(await uploadToDrive(file,folderId)).webViewLink;
        }catch(x){/* miniature conservée même sans Drive */}
        nouveaux.push({id:pid,chantierId:ch.id,date:today(),legende:'Contrôle — '+corpsL+' : '+ptL,lot:'',lien});
      }catch(x){/* photo ignorée */}
    }
    if(nouveaux.length){
      const cur=c[key]||{};
      const next={...c,[key]:{...cur,photos:[...(cur.photos||[]),...nouveaux.map(p=>p.id)],date:cur.date||today()}};
      save({...data,photos:[...data.photos,...nouveaux],chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
    }
    setBusy(null);
  };
  const delPhoto=async(key,pid)=>{
    await Photo.del(pid).catch(()=>{});
    const cur=c[key]||{};
    const next={...c,[key]:{...cur,photos:(cur.photos||[]).filter(x=>x!==pid)}};
    save({...data,photos:data.photos.filter(p=>p.id!==pid),chantiers:data.chantiers.map(x=>x.id===ch.id?{...x,controles:next}:x)});
  };

  const keep=(g,k)=>{
    const r=c[g.id+'.'+k]||{};
    if(filtre==='todo')return !r.statut;
    if(filtre==='ko')return r.statut==='non_conforme';
    return true;
  };
  const tot=CONTROLES.reduce((s,g)=>s+g.pts.length,0);
  const nOk=Object.values(c).filter(r=>r.statut==='conforme').length;
  const nKo=Object.values(c).filter(r=>r.statut==='non_conforme').length;
  const nNe=Object.values(c).filter(r=>r.statut==='neant').length;

  return <div>
    <div className="g3 xs" style={{marginBottom:12}}>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">Conformes</div><div className="b" style={{color:GREEN,fontSize:16}}>{nOk}</div></div>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">Non conformes</div><div className="b" style={{color:TERRA,fontSize:16}}>{nKo}</div></div>
      <div className="card" style={{margin:0,padding:8}}><div className="mut">À contrôler</div><div className="b" style={{fontSize:16}}>{tot-nOk-nKo-nNe}</div></div>
    </div>
    {nKo>0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {nKo} point{nKo>1?'s':''} non conforme{nKo>1?'s':''} à lever avant réception.</div>}
    <div className="row" style={{gap:8,marginBottom:12,flexWrap:'wrap'}}>
      {[['tous','Tous'],['todo','À contrôler'],['ko','Non conformes']].map(([id,l])=>
        <button key={id} className={'btn s '+(filtre===id?'':'gh')} onClick={()=>setFiltre(id)}>{l}</button>)}
    </div>
    <DriveStatus/>
    <p className="xs mut" style={{marginTop:0,lineHeight:1.5}}>Les photos de contrôle sont aussi ajoutées à l'onglet PHOTOS et envoyées sur votre Google Drive (dossier « CP Constructions › {ch.nom} › Contrôles »).</p>
    {CONTROLES.map(g=>{
      const pts=g.pts.filter(([k])=>keep(g,k));
      if(!pts.length)return null;
      const rs=g.pts.map(([k])=>c[g.id+'.'+k]||{});
      const gOk=rs.filter(r=>r.statut==='conforme').length, gKo=rs.filter(r=>r.statut==='non_conforme').length;
      const gDone=rs.filter(r=>r.statut).length;
      const isOpen=filtre!=='tous'||ouvert[g.id];
      return <div key={g.id} style={{marginBottom:8}}>
        <button className="card sp" style={{borderLeft:'3px solid '+(gKo?TERRA:gDone===g.pts.length?GREEN:RULE),padding:10,marginBottom:0}}
          onClick={()=>setOuvert({...ouvert,[g.id]:!ouvert[g.id]})}>
          <span className="b sm" style={{color:NAVY}}>{g.l}</span>
          <span className="xs mut">{gDone}/{g.pts.length}{gKo?' · '+gKo+' NC':''} {isOpen?'▾':'▸'}</span>
        </button>
        {isOpen&&pts.map(([k,label])=>{
          const key=g.id+'.'+k, r=c[key]||{};
          const st=CTRL_ST.find(s=>s.id===r.statut);
          return <div key={k} className="card" style={{borderLeft:'3px solid '+(st?st.c:RULE),padding:10,marginBottom:0,borderTop:'none'}}>
            <div className="sm" style={{lineHeight:1.35}}>{label}</div>
            <div className="row" style={{gap:6,marginTop:8,flexWrap:'wrap'}}>
              {CTRL_ST.map(s=><button key={s.id} className="btn s" onClick={()=>setPt(key,{statut:r.statut===s.id?'':s.id})}
                style={{background:r.statut===s.id?s.c:'transparent',borderColor:r.statut===s.id?s.c:RULE,color:r.statut===s.id?'#fff':MUTED}}>{s.label}</button>)}
            </div>
            {r.statut&&<div style={{marginTop:10}}>
              <div className="g2">
                <div><span className="lbl">DATE DU CONTRÔLE</span>
                  <input className="in" type="date" value={r.date||today()} onChange={e=>setPt(key,{date:e.target.value})}/></div>
                <div><span className="lbl">JUSTIFICATIF</span>
                  <input className="in" placeholder="Observation, référence…" value={r.note||''} onChange={e=>setPt(key,{note:e.target.value})}/></div>
              </div>
              <div className="row" style={{gap:6,marginTop:8,flexWrap:'wrap',alignItems:'center'}}>
                {(r.photos||[]).map(pid=><ThumbCtrl key={pid} id={pid} onZoom={()=>setZoom({id:pid,date:r.date,legende:label})} onDel={()=>delPhoto(key,pid)}/>)}
                <label className="btn gh s" style={{whiteSpace:'nowrap'}}>{busy===key?'Envoi…':'+ Photo'}
                  <input type="file" accept="image/*" multiple style={{display:'none'}} disabled={busy===key}
                    onChange={e=>{const files=[...e.target.files];e.target.value='';if(files.length)addPhotos(key,g.l,label,files)}}/></label>
              </div>
            </div>}
          </div>;
        })}
      </div>;
    })}
    {zoom&&<Plein p={zoom} close={()=>setZoom(null)}/>}
  </div>;
}

/* ---------------- ARTISANS ---------------- */
function Artisans({data,save}){
  const [f,setF]=useState(null);
  const ok=()=>{if(!f.nom.trim())return;save({...data,artisans:f.id?data.artisans.map(a=>a.id===f.id?f:a):[...data.artisans,{...f,id:uid()}]});setF(null)};
  const st=a=>{
    if(!a.decennaleFin)return{t:'Décennale non renseignée',c:TERRA};
    const j=Math.round((new Date(a.decennaleFin)-new Date())/86400000);
    if(j<0)return{t:'Décennale expirée le '+fd(a.decennaleFin),c:TERRA};
    if(j<60)return{t:'Décennale expire dans '+j+' j',c:AMBER};
    return{t:'Décennale valide jusqu\u2019au '+fd(a.decennaleFin),c:GREEN};
  };
  const al=data.artisans.filter(a=>!a.decennaleFin||new Date(a.decennaleFin)<new Date());
  return <div>
    <H2 action={<button className="btn acc s" onClick={()=>setF({nom:'',corps:'',tel:'',email:'',assureur:'',numPolice:'',decennaleFin:'',lienAttestation:''})}>+ Artisan</button>}>ARTISANS ({data.artisans.length})</H2>
    {al.length>0&&<div className="xs" style={{background:'#F6E2DC',color:'#8A2E14',borderLeft:'3px solid '+TERRA,padding:8,marginBottom:12}}>
      {al.length} artisan{al.length>1?'s':''} sans décennale valide. Ne pas signer de marché avant régularisation.</div>}
    {f&&<div className="card">
      <Fld label="RAISON SOCIALE"><input className="in" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})}/></Fld>
      <Fld label="CORPS D'ÉTAT"><select className="in" value={f.corps} onChange={e=>setF({...f,corps:e.target.value})}><option value="">— choisir —</option>{CORPS.map(c=><option key={c} value={c}>{c}</option>)}</select></Fld>
      <div className="g2">
        <Fld label="TÉLÉPHONE"><input className="in" type="tel" value={f.tel} onChange={e=>setF({...f,tel:e.target.value})}/></Fld>
        <Fld label="EMAIL"><input className="in" type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></Fld>
      </div>
      <div className="g2">
        <Fld label="ASSUREUR"><input className="in" value={f.assureur} onChange={e=>setF({...f,assureur:e.target.value})}/></Fld>
        <Fld label="N° DE POLICE"><input className="in" value={f.numPolice} onChange={e=>setF({...f,numPolice:e.target.value})}/></Fld>
      </div>
      <Fld label="DÉCENNALE VALIDE JUSQU'AU"><input className="in" type="date" value={f.decennaleFin} onChange={e=>setF({...f,decennaleFin:e.target.value})}/></Fld>
      <Fld label="LIEN VERS L'ATTESTATION"><input className="in" placeholder="Lien Drive…" value={f.lienAttestation} onChange={e=>setF({...f,lienAttestation:e.target.value})}/></Fld>
      <Acts onSave={ok} onCancel={()=>setF(null)} onDel={f.id?()=>{save({...data,artisans:data.artisans.filter(a=>a.id!==f.id)});setF(null)}:null}/>
    </div>}
    {!data.artisans.length&&!f&&<Empty>Aucun artisan. Constituez votre carnet d'adresses.</Empty>}
    {data.artisans.map(a=>{
      const s=st(a),n=data.marches.filter(m=>m.artisanId===a.id).length;
      return <div key={a.id} className="card" style={{borderLeft:'3px solid '+s.c}}>
        <div onClick={()=>setF(a)}>
          <div className="sp"><span className="b sm" style={{color:NAVY}}>{a.nom}</span><span className="xs mut">{a.corps}</span></div>
          <div className="xs" style={{color:s.c,marginTop:3}}>{s.t}</div>
          <div className="xs mut" style={{marginTop:2}}>{n} lot{n>1?'s':''} attribué{n>1?'s':''}</div>
        </div>
        <div className="row xs" style={{gap:14,marginTop:8}}>
          {a.tel&&<a href={'tel:'+a.tel} style={{color:TERRA}}>Appeler</a>}
          {a.tel&&<a href={'https://wa.me/'+wa(a.tel)} style={{color:TERRA}}>WhatsApp</a>}
          {a.email&&<a href={'mailto:'+a.email} style={{color:TERRA}}>Email</a>}
          {a.lienAttestation&&<a href={a.lienAttestation} target="_blank" rel="noreferrer" style={{color:TERRA}}>Attestation</a>}
        </div>
      </div>;
    })}
  </div>;
}

/* ---------------- BILAN ---------------- */
function Bilan({data,open}){
  const L=data.chantiers.map(c=>{
    const ms=data.marches.filter(m=>m.chantierId===c.id);
    const eng=ms.reduce((s,m)=>s+(m.montantHT||0),0);
    const fac=ms.reduce((s,m)=>s+(m.facture||0),0);
    const mat=data.commandes.filter(x=>x.chantierId===c.id).reduce((s,x)=>s+(x.montant||0),0);
    return {...c,eng,fac,mat,hono:honoAmount(c),ecart:(c.budget||0)-eng};
  });
  const T=k=>L.reduce((s,l)=>s+(l[k]||0),0);
  const tb=T('budget'),te=T('eng'),tf=T('fac'),th=T('hono'),tm=T('mat');
  const csv=()=>{
    const rows=[['Chantier','Client','Phase','Budget travaux HT','Engagé HT','Facturé artisans','Matériaux commandés','Écart budget','Honoraires MOE'],
      ...L.map(l=>[l.nom,l.client,PHASE[l.statut]||'',l.budget||0,l.eng,l.fac,l.mat,l.ecart,Math.round(l.hono)]),
      ['TOTAL','','',tb,te,tf,tm,tb-te,Math.round(th)]];
    const a=document.createElement('a');
    a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.map(r=>r.map(v=>'"'+v+'"').join(';')).join('\n'));
    a.download='CP-suivi-financier-'+today()+'.csv';a.click();
  };
  return <div>
    <H2 action={<button className="btn gh s" onClick={csv}>Export CSV</button>}>SUIVI FINANCIER</H2>
    <div className="g2">
      <Stat l="Budget travaux annoncé" v={eur(tb)}/>
      <Stat l="Engagé auprès des artisans" v={eur(te)} c={te>tb?TERRA:INK}/>
      <Stat l="Déjà facturé par les artisans" v={eur(tf)}/>
      <Stat l="Matériaux commandés" v={eur(tm)}/>
    </div>
    <div className="card" style={{marginTop:8}}>
      <div className="xs mut">Honoraires de maîtrise d'œuvre</div>
      <div className="b" style={{fontSize:20,marginTop:2,color:NAVY}}>{eur(th)}</div>
      <div className="xs mut" style={{marginTop:8}}>Reste à facturer par les artisans : <b>{eur(te-tf)}</b></div>
      <div className="xs mut" style={{marginTop:8,lineHeight:1.5}}>Calcul à partir du pourcentage saisi sur chaque chantier. À vérifier avec votre comptable avant tout usage fiscal.</div>
    </div>
    {!L.length&&<Empty>Aucun chantier à suivre.</Empty>}
    {L.map(l=><button key={l.id} className="card" style={{borderLeft:'3px solid '+(l.ecart<0?TERRA:NAVY)}} onClick={()=>open(l.id)}>
      <div className="sp"><span className="b sm" style={{color:NAVY}}>{l.nom}</span>
        <span className="xs" style={{color:l.ecart<0?TERRA:GREEN}}>{l.ecart<0?'+'+eur(-l.ecart):eur(l.ecart)}</span></div>
      <div className="g3 xs" style={{marginTop:8}}>
        <div><div className="mut">Budget</div><div>{eur(l.budget)}</div></div>
        <div><div className="mut">Engagé</div><div>{eur(l.eng)}</div></div>
        <div><div className="mut">Honoraires</div><div>{eur(l.hono)}</div></div>
      </div>
    </button>)}
  </div>;
}
const Stat=({l,v,c})=><div className="card" style={{margin:0}}><div className="xs mut" style={{lineHeight:1.3}}>{l}</div><div className="b" style={{fontSize:16,marginTop:4,color:c||INK}}>{v}</div></div>;

/* ---------------- DONNÉES ---------------- */
function Donnees({data,save,session}){
  const [msg,setMsg]=useState('');
  const exp=()=>{
    const a=document.createElement('a');
    a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data));
    a.download='CP-sauvegarde-'+today()+'.json';a.click();
    setMsg('Sauvegarde exportée. Les vignettes photo ne sont pas incluses.');
  };
  const imp=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.chantiers)throw 0;
      save({...EMPTY,...d});setMsg('Sauvegarde restaurée.')}catch(x){setMsg('Fichier illisible — restauration annulée.')}};
    r.readAsText(f);
  };
  return <div>
    <H2>DONNÉES</H2>
    <div className="card">
      <div className="sm b">Synchronisation</div>
      <p className="xs mut" style={{lineHeight:1.5}}>Les données sont enregistrées en ligne et se synchronisent automatiquement entre tous vos appareils connectés. Exportez quand même régulièrement en secours.</p>
      <div className="row" style={{gap:8,marginTop:10}}>
        <button className="btn" onClick={exp}>Exporter</button>
        <label className="btn gh">Restaurer<input type="file" accept=".json" onChange={imp} style={{display:'none'}}/></label>
      </div>
      {msg&&<div className="xs" style={{marginTop:8,color:TERRA}}>{msg}</div>}
    </div>
    <div className="card">
      <div className="sm b">Contenu</div>
      <div className="xs mut" style={{marginTop:6,lineHeight:1.6}}>
        {data.chantiers.length} chantier(s) · {data.marches.length} lot(s) · {data.artisans.length} artisan(s) · {data.commandes.length} commande(s) · {data.photos.length} photo(s)
      </div>
    </div>
    <div className="card">
      <div className="sm b">Compte</div>
      <div className="xs mut" style={{marginTop:6}}>{session&&session.user&&session.user.email}</div>
      <button className="btn gh s" style={{marginTop:10}} onClick={()=>sb.auth.signOut()}>Se déconnecter</button>
    </div>
    <div className="card">
      <div className="sm b">Limites connues</div>
      <ul className="xs mut" style={{margin:'6px 0 0',paddingLeft:16,lineHeight:1.6}}>
        <li>La synchronisation nécessite une connexion internet ; hors ligne, les modifications restent sur l'appareil jusqu'au retour du réseau.</li>
        <li>Photos réduites avant envoi pour rester rapide sur mobile ; gardez les originaux sur le Drive.</li>
        <li>L'export ne contient pas les photos elles-mêmes, seulement les légendes et dates.</li>
        <li>Les PDF importés sont envoyés sur votre Google Drive (dossier « CP Constructions ») ; la première fois, Google demande votre autorisation.</li>
      </ul>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
