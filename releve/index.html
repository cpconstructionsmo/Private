<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2C4A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Relevé CP">

<link rel="apple-touch-icon" href="icone-180.png">

<title>Relevé de visite — CP Constructions</title>
<style>
  /* mêmes couleurs que le suivi de chantiers ; gros boutons au pouce, en bas */
  :root{--navy:#2C4A5E;--terra:#C5563A;--ink:#1A2B36;--rule:#D4CFC5;--muted:#5E6B74;--green:#2F6B4A;--amber:#8A6110;
    --fond:#F5F2EC;--carte:#fff;--sable:#F5F1EA;--barre:76px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--fond);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding-top:env(safe-area-inset-top)}
  button,input,select,textarea{font:inherit;color:inherit}
  header.haut{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--terra);padding:10px 16px;display:flex;gap:10px;align-items:center}
  header.haut .titre{flex:1;min-width:0;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.haut img{height:30px;width:auto}
  .lienRetour{border:0;background:none;color:var(--navy);font-weight:600;padding:8px 4px;cursor:pointer}
  .etat{font-size:13px;font-weight:600;padding:4px 10px;border-radius:14px;white-space:nowrap;background:#E7EEF2;color:var(--navy)}
  .etat.ok{background:#E2F0E7;color:var(--green)}.etat.attente,.etat.horsligne{background:#FBF0DA;color:var(--amber)}
  .etat.erreur{background:#F8E1DA;color:var(--terra)}
  main{max-width:720px;margin:0 auto;padding:14px 16px calc(var(--barre) + 28px + env(safe-area-inset-bottom))}
  .carte{background:var(--carte);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:12px}
  h1{font-size:22px;margin:4px 0 10px;color:var(--navy)}
  h2{font-size:17px;margin:0 0 8px;color:var(--navy)}
  .mut{color:var(--muted);font-size:15px}
  .petit{font-size:14px}
  label.champ{display:block;margin:12px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
  input.in,textarea.in,select.in{display:block;width:100%;margin-top:4px;padding:13px 12px;border:1.5px solid var(--rule);border-radius:10px;background:#fff;font-size:17px}
  input.in:focus,textarea.in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(44,74,94,.15)}
  input.in.faux{border-color:var(--terra)}
  .aide{font-size:13px;color:var(--terra);margin-top:4px;min-height:0}
  .puces{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .puce{border:1.5px solid var(--rule);background:#fff;border-radius:22px;padding:10px 16px;cursor:pointer;font-size:16px;min-height:46px}
  .puce.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .grille .puce{border-radius:12px;text-align:center;min-height:58px}
  .gros{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:14px;border:0;
    background:var(--terra);color:#fff;font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(197,86,58,.3)}
  .gros.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none}
  .gros:disabled{opacity:.45;cursor:default;box-shadow:none}
  .rang{display:flex;gap:8px;align-items:center}
  .barreBas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--rule);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .barreBas .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
  .barreBas .gros{min-height:56px}
  .barreBas .gros.sec{flex:0 0 32%}
  .progres{display:flex;gap:4px;margin:2px 0 6px}
  .progres button{flex:1;border:0;background:none;padding:8px 0;cursor:pointer}
  .progres i{display:block;height:6px;border-radius:3px;background:#E3DED4}
  .progres .fait i{background:var(--green)}.progres .ici i{background:var(--terra)}
  .etapeNom{font-size:14px;color:var(--muted);font-weight:600}
  .visite{display:flex;gap:12px;align-items:center;cursor:pointer}
  .vignette{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#E9E4DA;flex:0 0 72px;display:flex;align-items:center;justify-content:center;font-size:28px}
  .visite .corps{flex:1;min-width:0}
  .visite b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pastille{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:#FBF0DA;color:var(--amber);margin-left:6px}
  .pastille.ok{background:#E2F0E7;color:var(--green)}
  .garde{width:100%;max-height:52vh;object-fit:cover;border-radius:12px;display:block;background:#E9E4DA}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .photos figure{margin:0;position:relative}
  .photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#E9E4DA}
  .photos .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
  /* un champ avec son micro (dictée) : le bouton se pose en haut à droite du champ */
  .champMicro{position:relative}
  .champMicro .micro{position:absolute;right:6px;bottom:auto;top:38px;width:44px;height:44px;border-radius:22px;border:1.5px solid var(--rule);background:#fff;font-size:20px;cursor:pointer;z-index:1}
  .champMicro > textarea.in,.champMicro label textarea.in,.champMicro label input.in{padding-right:56px}
  .champMicro > textarea.in + .micro{top:8px}
  .champMicro .micro.ecoute{background:var(--terra);border-color:var(--terra);color:#fff;animation:ecoute 1.2s ease-in-out infinite}
  @keyframes ecoute{0%,100%{box-shadow:0 0 0 0 rgba(197,86,58,.45)}50%{box-shadow:0 0 0 8px rgba(197,86,58,0)}}
  .aide.info{color:var(--muted)}
  .case{display:flex;gap:10px;align-items:center;margin:12px 0 0;font-size:16px;cursor:pointer}
  .case input{width:24px;height:24px;accent-color:var(--navy);flex:0 0 24px}
  /* une photo de pièce et sa légende, côte à côte */
  .photoLegende{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
  .photoLegende figure{margin:0;position:relative;flex:0 0 108px}
  .photoLegende img{width:108px;height:108px;object-fit:cover;border-radius:8px;display:block;background:#E9E4DA}
  .photoLegende .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
  .photoLegende .champMicro{flex:1;min-width:0}
  .photoLegende textarea.in{margin-top:0;font-size:16px}
  /* « Imaginer » : le panneau sous la photo, et l'image rénovée */
  .puce.imaginer{margin-top:6px;min-height:40px;padding:6px 14px;border-color:#B8860B;color:#7A5A00;background:#FFF8E6}
  .panneauImaginer{background:#FFFBF0;border-color:#E9D9A8;margin-top:10px}
  .imagine{display:flex;gap:10px;align-items:flex-start;margin:8px 0 0 30px}
  .imagine figure{margin:0;position:relative;flex:0 0 160px}
  .imagine img{width:160px;height:120px;object-fit:cover;border-radius:8px;display:block;background:#E9E4DA;border:2px solid #E9D9A8}
  .imagine .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
  .badgeImagine{position:absolute;left:6px;bottom:6px;background:rgba(122,90,0,.85);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
  /* le budget de premier rendez-vous : tuiles, réglage − / +, jauge */
  .tuiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
  .tuile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:8px;border:1.5px solid var(--rule);border-radius:14px;background:#fff;font-size:14px;line-height:1.2;text-align:center;cursor:pointer;position:relative;transition:transform .12s}
  .tuile:active{transform:scale(.96)}
  .tuile .ico{font-size:26px}
  .tuile.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .tuile.propose:not(.on)::after{content:'proposé';position:absolute;top:5px;right:6px;font-size:10px;font-weight:700;color:var(--terra)}
  .totalBudget{position:sticky;top:52px;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .jauge{position:relative;height:12px;border-radius:6px;background:#EEE9DF;margin:12px 0 18px}
  .jauge .bande{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--terra));transition:left .4s,width .4s}
  .jauge .repere{position:absolute;top:-4px;width:3px;height:20px;background:var(--navy);border-radius:2px;transform:translateX(-1px)}
  .jauge .repere span{position:absolute;top:21px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--navy);white-space:nowrap}
  .ouvrage .plage{font-size:19px;font-weight:700;color:var(--navy);margin:4px 0 8px}
  .reglage{display:flex;align-items:center;gap:10px}
  .reglage .pm{width:56px;height:56px;border-radius:28px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:28px;line-height:1;cursor:pointer;flex:0 0 56px}
  .reglage .pm:active{background:var(--navy);color:#fff}
  .reglage .valeur{flex:1;display:flex;align-items:baseline;justify-content:center;font-size:22px;font-weight:700;color:var(--navy)}
  .reglage .valeur input{width:5.5em;text-align:right;font-size:26px;font-weight:700;color:var(--navy);border:0;border-bottom:2px dashed var(--rule);background:transparent;padding:4px 0}
  .niveaux{margin-top:10px}
  .niveaux .puce{flex:1;text-align:center;padding:10px 6px}
  .approfondir{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
  .approfondir summary{font-weight:700;color:var(--navy);cursor:pointer;padding:10px 0}
  @media (min-width:900px){.tuiles{grid-template-columns:repeat(4,1fr)}}
  /* le dossier client : des feuilles A4 à l'écran, une feuille par page à l'impression */
  .mainDossier{max-width:900px}
  .outilsDossier .case{margin-top:8px}
  .dossier{display:flex;flex-direction:column;gap:16px;margin-top:12px}
  .feuille{background:#fff;border:1px solid var(--rule);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:28px 26px 40px;position:relative;min-height:60vh;color:#1d2a33}
  .feuille footer{position:absolute;left:26px;right:26px;bottom:12px;font-size:10px;color:#8a949b;border-top:1px solid #eee;padding-top:4px}
  .feuille h1{font-size:26px;margin:18px 0 6px}
  .feuille h2{font-size:18px;color:var(--navy);border-bottom:2px solid var(--terra);padding-bottom:4px;margin:18px 0 10px}
  .feuille h3{font-size:15px;color:var(--navy);margin:14px 0 6px}
  .feuille .texte{white-space:pre-line;font-size:14px;line-height:1.5;margin:0}
  .feuille .dl{display:flex;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px dotted #e3e3e3}
  .feuille .dl span{flex:0 0 38%;color:#6b7680}
  .logoDossier{height:44px;width:auto}
  .garde{text-align:center}
  .gardeClient{font-size:20px;font-weight:700;margin-top:10px}
  .gardeAdresse{color:#6b7680;margin-top:4px}
  .gardeDossier{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:6px;margin:18px 0}
  .gardeDate{color:#6b7680;font-size:14px}
  .planDossier{display:block;width:100%;height:auto;border:1px solid #eee;border-radius:4px;margin:4px 0 12px;break-inside:avoid}
  .duo{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
  .duo.avecImagine{grid-template-columns:1fr 1fr}
  .duo figure{margin:0}
  .duo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;background:#eee}
  .duo:not(.avecImagine) img{max-width:340px}
  .duo figcaption{font-size:12px;color:#4b5760;margin-top:3px}
  .pieceDossier{break-inside:avoid}
  .tableDossier{width:100%;border-collapse:collapse;font-size:13px}
  .tableDossier th{text-align:left;background:#f3efe7;padding:6px;font-weight:600}
  .tableDossier td{padding:6px;border-bottom:1px solid #eee}
  .tableDossier tfoot td{font-weight:700;border-top:2px solid var(--navy)}
  .tableDossier .nombre{text-align:right;white-space:nowrap}
  .mention{font-size:11px;color:#6b7680;margin-top:12px;line-height:1.4}
  .suite{font-size:15px;line-height:1.8}
  @media print{
    @page{size:A4;margin:14mm 12mm}
    html,body,#app{background:#fff!important}
    .sansImpression,.barreBas{display:none!important}
    main.mainDossier{padding:0;max-width:none;margin:0}
    .dossier{gap:0;margin:0}
    /* la couverture seule sur sa page ; ensuite les parties s'enchaînent, sans couper une pièce ni un tableau */
    .feuille{border:0;box-shadow:none;border-radius:0;padding:0;min-height:auto;break-after:auto}
    .feuille.garde{break-after:page}
    .feuille footer{display:none}
    .feuille h2{break-after:avoid}
    .pieceDossier,.duo,.tableDossier,.feuille.fin{break-inside:avoid}
  }
  [hidden]{display:none!important}
  .natures .puce{flex:1 1 30%;min-height:56px;font-size:15px;font-weight:600}
  .infosTerrain .ligneTerrain{margin-top:8px;line-height:1.5}.listeTerrain{margin:6px 0 0;padding-left:18px;font-size:14px}
  .puces.risques{margin-top:8px}.puce.risque{font-size:12px;cursor:default}.puce.risque.avere{border-color:var(--amber);background:#FBF0DA}
  .pointsAttention{margin-top:12px;padding:10px;border-radius:10px;background:#F6F2EA}.pointsAttention .point{margin-top:6px;font-size:14px;line-height:1.45;padding-left:8px;border-left:3px solid #9AA4B2}
  .pointsAttention .point.bloquant{border-left-color:#B42318}.pointsAttention .point.important{border-left-color:var(--amber)}
  .reglementZone{margin-top:8px}.reglesZone{margin-top:8px;padding:10px;border-radius:10px;background:#EEF3FA}.reglesZone dl{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:4px 10px;margin:6px 0 0;font-size:14px}.reglesZone dt{font-weight:600}.reglesZone dd{margin:0}
  .photosTerrain{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.photosTerrain figure{position:relative;margin:0}.photosTerrain img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
  .visite{position:relative}.visite .corps{padding-right:40px}.actionVisite{position:absolute;top:8px;right:8px;padding:4px 10px;font-size:13px}.pastille.annulee{background:#F3E1DE;color:#9A3412}
  .visionneuse{position:fixed;inset:0;z-index:1000;background:rgba(15,20,28,.94);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
  .visionneuse img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-select:none;cursor:zoom-in}
  .barreVisionneuse{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:8px}
  .barreVisionneuse button{min-width:44px;min-height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.92);font-size:20px;font-weight:700}
  img[data-zoom]{cursor:zoom-in}
  .duoPlans{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
  @media (min-width:700px){.duoPlans{grid-template-columns:1fr 1fr}}
  .duoPlans figure{margin:0}.vignettePlan{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line,#ddd);background:#fff}
  .cadreAnnot{padding:4px;overflow:hidden}.cadreZoomAnnot{overflow:hidden;touch-action:none;border-radius:6px}.cadreZoomAnnot canvas{transform-origin:center center}
  .panneauTexte{margin-bottom:10px}.zoomAnnot{margin-top:6px;align-items:center}.toileAnnot{display:block;width:100%;height:auto;touch-action:none;background:#fff;border-radius:6px;cursor:crosshair}
  .barreAnnot{flex-wrap:wrap}.pastilleCouleur{color:var(--c);font-size:22px;line-height:1;padding:4px 12px}.pastilleCouleur.on{outline:3px solid var(--c);background:#fff!important;color:var(--c)!important}
  .planOrigine summary{cursor:pointer;font-weight:600}
  .imagePlanOrigine{display:block;width:100%;height:auto;margin-top:8px;border-radius:8px}
  .descriptionIA{margin-top:6px;padding:8px 10px;border-radius:8px;background:#EEF3FA;border:1px solid #D5E0EE}
  .descriptionIA ul{margin:4px 0 0;padding-left:18px}
  .enAttenteImaginer{margin-top:6px;padding:6px 10px;border-radius:8px;background:#FBF0DA;color:var(--amber)}
  .cadreZoomDessin{overflow:hidden;touch-action:none;border-radius:8px}.cadreZoomDessin svg{transform-origin:center center}.zoomDessin{margin-top:6px;align-items:center}
  .etagesDessin{margin-bottom:6px}.ouvDessin{margin-top:8px;padding:8px;border-radius:8px;background:#F6F2EA}.symbolesPalette .puce{font-size:13px}
  .apercuDessin{display:block;width:100%;height:auto;max-height:46vh;background:#fff;border-radius:8px;touch-action:manipulation}
  .pieceDessin.sel{border-color:var(--terra);box-shadow:0 0 0 2px rgba(197,86,58,.15)}
  .reglageDessin .reglage{margin-top:4px}
  .reglage .valeur span{margin-left:4px}
  .resumeDepart{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;cursor:pointer;border:1.5px dashed var(--terra);background:#FFF8F4;font:inherit;color:var(--ink)}
  .resumeDepart b{color:var(--terra)}
  .resumeDepart.rempli{border-style:solid}
  .resumeTexte{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .assistantBouton{min-height:38px;padding:6px 12px;border-color:var(--terra);color:var(--terra);font-weight:600}
  .proposition{align-items:flex-start;border-bottom:1px solid var(--rule);padding:8px 0;margin:0}
  .proposition input{margin-top:3px}
  .curseur{width:100%;margin:14px 0 4px;accent-color:var(--terra);height:34px}
  .montant{font-size:26px;font-weight:700;color:var(--navy)}
  .manque{background:#FBF0DA;color:var(--amber);border-radius:10px;padding:10px 12px;font-size:15px}
  .recap dt{font-size:13px;color:var(--muted);font-weight:600;margin-top:10px}.recap dd{margin:2px 0 0}
  .message{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
  .message.err{background:#F8E1DA;color:#8B2E18}.message.ok{background:#E2F0E7;color:var(--green)}.message.att{background:#FBF0DA;color:var(--amber)}
  .vide{text-align:center;padding:30px 10px;color:var(--muted)}
  .anime{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.96);opacity:.4}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
  .valide{animation:valide .5s ease-out}
  @keyframes valide{0%{box-shadow:0 0 0 0 rgba(47,107,74,.5)}100%{box-shadow:0 0 0 18px rgba(47,107,74,0)}}
  @media (prefers-reduced-motion:reduce){.anime,.valide{animation:none}}
  /* le plan : le moteur de relevé en plein écran, sous la barre de la visite */
  .ecranPlan{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top))}
  .ecranPlan .message{margin:8px 16px 0}
  .cadrePlan{flex:1;width:100%;border:0;background:#fff;display:block}
  /* sur PC : même page, plus large, champs côte à côte */
  @media (min-width:900px){
    main{max-width:960px}
    .deuxCol{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
    .grille{grid-template-columns:repeat(4,1fr)}
    .photos{grid-template-columns:repeat(6,1fr)}
    .barreBas .in{max-width:960px}
  }
</style>
</head>
<body>
<div id="app"><main><div class="carte mut">Chargement…</div></main></div>
